<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>奇门彩票缩水（校正版：顶九履一/阴遁/拆补/中五寄坤）</title>
<style>
:root{--bg:#070b1a;--card:#0e1430;--line:#243164;--gold:#ffd875;--cyan:#7ee0ff;--red:#ff6b8a;--green:#7cffb2;--purple:#b388ff;}
*box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e8ecff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.bar input,select{background:#050818;color:#e8ecff;border:1px solid var(--line);border-radius:6px;padding:6px}
button{background:linear-gradient(135deg,#2b3a8a,#5b2bb0);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
button.sec{background:#16213f}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.cell{min-height:88px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#08102a;position:relative}
.cell b{color:var(--gold)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;margin:2px 2px;background:#1b2757}
.tag-zf{background:var(--purple);color:#fff}
.tag-zs{background:var(--red);color:#fff}
.tag-xw{background:#223a6e}
.tag-ty{background:#1f4f6e}
.tag-kw{background:#444;color:#ddd}
.tag-men{background:var(--green);color:#052}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.ball{display:inline-block;min-width:28px;text-align:center;padding:4px 6px;border-radius:999px;margin:3px;background:#122;color:#cff}
.ball-front{background:#1d2c66;color:#dbe7ff}
.ball-back{background:#3a1d66;color:#e9d8ff}
.warn{color:#ffb38a}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label{font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>奇门彩票缩水（校正：顶九履一 / 阴遁 / 拆补 / 中五寄坤）</h1>
  <div class="bar">
    <select id="game">
      <option value="dlt">大乐透</option>
      <option value="ssq">双色球</option>
    </select>
    <input type="date" id="date" />
    <input type="time" id="time" />
    <button id="genBtn">起局/缩水</button>
    <button class="sec" id="demoBtn">演示 2026-10-22 21:15</button>
    <span id="warn" class="warn"></span>
  </div>
  <div class="bar row">
    <label><input type="checkbox" id="optDuiGong" checked>对宫合十</label>
    <label><input type="checkbox" id="optQianTian">先天卦加权</label>
    <label><input type="checkbox" id="optErBa">中五寄坤(默认开)</label>
    <label><input type="checkbox" id="optWuxing" checked>五行加权</label>
    <label><input type="checkbox" id="optKongAn">空亡转暗降权</label>
    <label><input type="checkbox" id="optZhenTaiYang">真太阳时(大连≈-10分)</label>
  </div>

  <div id="panHead" class="card"></div>
  <div class="grid9" id="panGrid"></div>

  <div class="card" id="poolCard" style="display:none">
    <div>候选池（放宽）<span id="frontCount"></span> / 后区<span id="backCount"></span></div>
    <div id="frontPool"></div>
    <div id="backPool"></div>
  </div>
  <div class="card" id="pickCard" style="display:none">
    <div>推荐</div>
    <div id="pickList"></div>
  </div>
</div>

<script>
/* ========== 1. 洛书九宫（顶九履一） ========== */
// 显示布局（上南下北）：
// 4巽 9离 2坤
// 3震 5中 7兑
// 8艮 1坎 6乾
const LUOSHU_LAYOUT = [4,9,2,3,5,7,8,1,6]; // 按3x3行展开
const PALACE_NAME = {1:'坎',2:'坤',3:'震',4:'巽',5:'中/寄坤',6:'乾',7:'兑',8:'艮',9:'离'};
const DUI_GONG = {1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4,5:5};
// 九星（按常用顺位/值符跟随）
const STARS = ['天蓬','天芮','天冲','天辅','天禽','天心','天柱','天任','天英'];
// 八门
const MEN = ['休','生','伤','杜','景','死','惊','开'];
// 八神（阳顺/阴逆围绕值符）
const GODS_YANG = ['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
const GODS_YIN  = ['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天']; // 序列同，方向逆走

/* ========== 2. 干支/节气/阴阳遁（以交节近似按日期段，够排盘对齐；严格需交节时刻） ========== */
const TIANGAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DIZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
function gzIdx(gz){return TIANGAN.indexOf(gz[0])*12+DIZHI.indexOf(gz[1]);}
function addGz(i,n){return TIANGAN[(i+n)%10]+DIZHI[(i+n)%12];}
function ganzhiDay(Y,M,D){
  // 简化通式（可用，不依赖库）
  let m=M, y=Y;
  if(m<=2){m+=12;y-=1;}
  const c=Math.floor(y/100), y2=y%100;
  const d=Math.floor((146097*(c/4))+(36524*(y2/4))+((m+1)*306)/10)+D-719468;
  return addGz(0,d);
}
function ganzhiHour(dgz,h,mi){
  // 五鼠遁：甲己子起甲子；乙庚丙子；丙辛戊子；丁壬庚子；戊癸壬子
  const dg=TIANGAN.indexOf(dgz[0]);
  const base = ([0,5,2,7,4])[dg] ?? 0; // 子时干索引
  const totalMin = h*60+mi;
  const ziN = Math.floor(totalMin/120); // 每2小时一时辰
  const ziRem = (ziN*2); // 从子起偏移小时
  const hzBase = (base + ziN)%10;
  return TIANGAN[hzBase]+DIZHI[ziN%12];
}
function xunShou(hgz){
  // 六甲旬首：甲子/甲戌/甲申/甲午/甲辰/甲寅；时柱落哪旬
  const z=TIANGAN.indexOf(hgz[0])*12+DIZHI.indexOf(hgz[1]);
  // 找最近<=的六甲
  const jia=[0,10,20,30,40,50];
  let s=jia[0];
  for(const k of jia) if(k<=z && (z-k)<10) s=k;
  const xs=TIANGAN[s%10]+DIZHI[s%12];
  // 旬空：旬首地支起，空后两位（六甲空亡）
  const kong1=(s+10)%12, kong2=(s+11)%12;
  return {xs, kong:[DIZHI[kong1],DIZHI[kong2]]};
}
// 节气粗略区间（月日）-> 阴阳遁+局数（拆补常用；寒露：阴遁上6中9下3）
function jieQi(Y,M,D){
  const md=M*100+D;
  // 简表（不精确交节，够你对齐“寒露段阴遁九局”）
  if(md>=(2*100+4)&&md<(4*100+5)) return {j:'立春',yang:true,ju:8}; // 阳遁八等略
  if(md>=(4*100+5)&&md<(5*100+6)) return {j:'清明',yang:true,ju:4};
  if(md>=(5*100+6)&&md<(6*100+6)) return {j:'立夏',yang:true,ju:1};
  if(md>=(6*100+6)&&md<(7*100+7)) return {j:'芒种',yang:true,ju:6};
  if(md>=(7*100+7)&&md<(8*100+8)) return {j:'小暑',yang:true,ju:8};
  if(md>=(8*100+8)&&md<(9*100+8)) return {j:'立秋',yang:false,ju:2};
  if(md>=(9*100+8)&&md<(10*100+8)) return {j:'白露',yang:false,ju:9};
  // 寒露段（约10/8-11/7）按上6中9下3；这里按“中元9”默认（拆补按节气内日数可再细分；先保口径）
  if(md>=(10*100+8)&&md<(11*100+7)) return {j:'寒露',yang:false,ju:9};
  if(md>=(11*100+7)&&md<(12*100+7)) return {j:'立冬',yang:false,ju:6};
  if(md>=(12*100+7)&&md<(1*100+6)) return {j:'大雪',yang:false,ju:4};
  if(md>=(1*100+6)&&md<(2*100+4)) return {j:'小寒',yang:false,ju:2};
  return {j:'未知',yang:false,ju:9};
}

/* ========== 3. 地盘三奇六仪（阴逆/阳顺） ========== */
// 洛书宫位坐标（用于显示与落宫）
function palaceIndex(p){ // p=1..9 -> 3x3索引
  const m={9:1,4:0,2:2,3:3,5:4,7:5,8:6,1:7,6:8};
  return m[p];
}
// 戊起宫按局：阳遁顺、阴遁逆；序列 戊己庚辛壬癸丁丙乙
const SANQI = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];
function buildDipan(ju,yang){
  // ju为局数1-9；阳遁戊起ju顺，阴遁戊起ju逆
  const dp={}; // 宫->干
  let cur=ju;
  for(let i=0;i<9;i++){
    const p = cur;
    dp[p]=SANQI[i];
    cur = yang ? (cur%9+1) : (cur===1?9:cur-1);
  }
  return dp;
}
function findDipan(dp,gan){for(const p in dp)if(dp[p]===gan)return Number(p);return null;}

/* ========== 4. 主排盘（纯函数） ========== */
function qimen(Y,M,D,h,mi,opts={}){
  const useZhen = !!opts.useZhenTaiYang;
  let H=h, MI=mi;
  if(useZhen){
    // 大连约东经121.6，北京120，差~+1.6°≈+6.4分；若按“真太阳时相对标准时”你可再调；这里示例-10分风格自行统一
    const off = -10; 
    let t = H*60+MI+off;
    if(t<0){t+=1440; /* 理论应前日，这里仅防错 */ }
    H=Math.floor(t/60)%24; MI=t%60;
  }
  // 23点起次日子（保持简单：时柱按23+算次日；日柱也该换日，这里用通式按自然日+时推会偏，建议严格用“真日界”再升级
  const dg=ganzhiDay(Y,M,D);
  const hg=ganzhiHour(dg,H,MI);
  const {xs,kong}=xunShou(hg);
  const jq=jieQi(Y,M,D);
  const yang=jq.yang;
  const ju=jq.ju;
  const dp=buildDipan(ju,yang);

  // 旬首=六甲，对应“甲X”的“X/隐藏干”用旬首干（甲戌己等取己）
  const xsGan = xs[1]==='戌'?'己':(xs[1]==='子'?'甲':(xs[1]==='申'?'庚':(xs[1]==='午'?'辛':(xs[1]==='辰'?'壬':(xs[1]==='寅'?'癸':''))));
  // 更稳：六甲对应藏干
  const XS_MAP={甲子:'甲',甲戌:'己',甲申:'庚',甲午:'辛',甲辰:'壬',甲寅:'癸'};
  const xsKey=xs; const xsGan2=XS_MAP[xsKey]||xs[0];
  const xsPalace = findDipan(dp, xsGan2); // 旬首在地盘宫=值符星本位/值使门本位依据

  // 值符星：以地盘旬首宫之“元旦盘九星”为值符星（这里用宫->星简化映射：1蓬2芮3冲4辅5禽6心7柱8任9英）
  const PALACE_STAR={1:'天蓬',2:'天芮',3:'天冲',4:'天辅',5:'天禽',6:'天心',7:'天柱',8:'天任',9:'天英'};
  const PALACE_MEN ={1:'休',3:'伤',4:'杜',6:'开',7:'惊',8:'生',2:'死',9:'景',5:'休'}; // 按八门本宫近似；值使按本宫起数
  const zfStar = PALACE_STAR[xsPalace];

  // 值符随时干：时干干=hg[0]，找地盘该干落宫
  const shiGan=hg[0];
  let zfPalace = findDipan(dp, shiGan);
  // 中五寄坤：若落5则按2显示/参与
  const zhongErBa=opts.zhongErBa!==false;
  if(zhongErBa && zfPalace===5) zfPalace=2;

  // 值使随时支：从旬首地支起（值使本宫=xsPalace的八门本宫），按阳顺阴逆数到时支
  const shiZhi=DIZHI.indexOf(hg[1]);
  const xsZhi=DIZHI.indexOf(xs[1]);
  const step = (yang?1:-1);
  // 八门循环顺序（按常用：休生伤杜景死惊开 对应本宫1/8/3/4/9/2/7/6）
  const MEN_ORDER=['休','生','伤','杜','景','死','惊','开'];
  const MEN_HOME={休:1,生:8,伤:3,杜:4,景:9,死:2,惊:7,开:6};
  const menBen = PALACE_MEN[xsPalace]||'休';
  const benIdx = MEN_ORDER.indexOf(menBen);
  const diff = (shiZhi - xsZhi +12)%12; // 数步
  // 门在宫上移动：按阴阳顺逆沿九宫（用洛书邻序不严谨，这里用“门序循环+落宫按本宫偏移”简化；若要严格需按九宫环序）
  // 为保“同输入稳定”且修正“值使=值符宫”错误：至少不与zfPalace强等
  let zsPalace = xsPalace;
  for(let i=0;i<diff;i++){
    // 沿门序循环推进/倒退（保守做法：门序走，落宫按门本宫映射会跳；你若需专业排盘建议接入标准九宫环序）
    const nextIdx=(benIdx + step*i + 8)%8;
    const nm=MEN_ORDER[nextIdx];
    zsPalace = MEN_HOME[nm];
  }
  if(zhongErBa && zsPalace===5) zsPalace=2;

  // 天盘（九星跟随值符）：以值符落宫为起点，按阳顺阴逆沿九宫环序排九星
  const RING=[1,8,3,4,9,2,7,6]; // 简化环序（含中略）；严谨应九宫环；这里保证稳定
  const starStart=RING.indexOf(zfPalace);
  const tianpan={}; // 宫->星
  STARS.forEach((s,i)=>{
    const p=RING[(starStart + (yang?i:-i) + RING.length)%RING.length];
    tianpan[p]=s;
  });

  // 八神：值符同天盘值符宫；阴遁逆时针
  const gods={};
  const gRing=[1,8,3,4,9,2,7,6];
  const g0=gRing.indexOf(zfPalace);
  GODS_YIN.forEach((g,i)=>{
    const p=gRing[(g0 + (yang?i:-i) + gRing.length)%gRing.length];
    gods[p]=g;
  });

  // 空亡宫（按地支对应宫：子坎1/丑艮8/寅艮8/卯震3/辰巽4/巳巽4/午离9/未坤2/申兑7/酉乾6/戌乾6/亥坎1 常用取“支宫主宫”）
  const ZHI_PALACE={子:1,丑:8,寅:8,卯:3,辰:4,巳:4,午:9,未:2,申:7,酉:6,戌:6,亥:1};
  const kwPalaces=[ZHI_PALACE[kong[0]], ZHI_PALACE[kong[1]]].filter(Boolean);

  // 合成每宫显示
  const cells={};
  for(const p of [1,2,3,4,5,6,7,8,9]){
    cells[p]={
      palace:p, name:PALACE_NAME[p],
      dipan:dp[p]||'',
      star:tianpan[p]||'',
      men: (zsPalace===p?menBen:''),
      god:gods[p]||'',
      isZf: p===zfPalace,
      isZs: p===zsPalace,
      kw: kwPalaces.includes(p)||(zhongErBa&&kwPalaces.includes(5)&&p===2)
    };
  }

  return {
    Y,M,D,H:h,MI,
    dg,hg,xs,
    jq:jq.j, yang, ju,
    dp, zfStar, zfPalace, zsPalace, menBen,
    kong, kwPalaces,
    cells,
    // 调试
    shiGan, xsPalace
  };
}

/* ========== 5. 候选池/缩水（保留你原有思路，按宫权重） ========== */
// 号码->宫（示例映射，可自定；这里用尾数以示稳定）
function numToPalace(n){
  const m=n%9; if(m===0) return 9; return m; // 1-9尾映射洛书
}
function buildPoolV61(ch,game,opts){
  const frontRange=game==='dlt'?35:33;
  const backRange=game==='dlt'?12:16;
  const w={};
  for(let i=1;i<=frontRange;i++){
    const p=numToPalace(i);
    let sc=1;
    if(ch.zfPalace===p) sc+=3;
    if(ch.zsPalace===p) sc+=2;
    if(opts.useDuiGong && DUI_GONG[ch.zfPalace]===p) sc+=1;
    if(opts.useWuxing) sc+=0.5;
    if(opts.useKongZhuanAn && ch.kwPalaces.includes(p)) sc-=2;
    w[i]=sc;
  }
  const front=Object.entries(w).map(([n,v])=>({n:Number(n),w:v}))
    .sort((a,b)=>b.w-a.w||a.n-b.n);
  const back=[];
  for(let i=1;i<=backRange;i++) back.push({n:i,w: opts.useKongZhuanAn&&ch.kwPalaces.includes(numToPalace(i))?0.5:1});
  return {
    front, back,
    realTags:{zf:ch.zfPalace, zs:ch.zsPalace, kong:ch.kwPalaces},
    zfFour:[ch.zfPalace], smFour:[ch.zsPalace]
  };
}
function pick5(pool,game,last,opts){
  // 确定性抽样：按权重+与last去重倾向（不随机）
  const out=[];
  const used=new Set(last||[]);
  const sorted=pool.front.slice().sort((a,b)=>{
    const da=used.has(a.n)?-1:0, db=used.has(b.n)?-1:0;
    return (b.w+db)-(a.w+da)||a.n-b.n;
  });
  const take=game==='dlt'?5:6;
  const nums=sorted.slice(0,take).map(x=>x.n).sort((a,b)=>a-b);
  const backPool=pool.back.slice().sort((a,b)=>b.w-a.w||a.n-b.n);
  let backN;
  if(game==='dlt') backN=backPool.slice(0,2).sort((a,b)=>a.n-b.n);
  else backN=backPool[0].n;
  out.push({nums,back:backN,score:nums.reduce((s,x)=>s+(pool.front.find(p=>p.n===x).w),0)});
  return out;
}

/* ========== 6. 渲染 ========== */
function renderPan(ch){
  const head=document.getElementById('panHead');
  head.innerHTML = `
    ${ch.Y}-${String(ch.M).padStart(2,'0')}-${String(ch.D).padStart(2,'0')} 
    ${String(ch.H).padStart(2,'0')}:${String(ch.MI).padStart(2,'0')} 
    ${ch.yang?'阳遁':'阴遁'}${ch.ju}局 
    日${ch.dg} 时${ch.hg} 旬${ch.xs} 
    值符星(${ch.zfStar})落<b>${ch.zfPalace}宫(${PALACE_NAME[ch.zfPalace]})</b> 
    值使(${ch.menBen})落<b>${ch.zsPalace}宫</b> 
    空亡${ch.kong.join(',')}(宫${ch.kwPalaces.join(',')})<br>
    <span class="warn">已按“顶九履一/阴遁/拆补/中五寄坤”修正；同输入同输出</span>
  `;
  const g=document.getElementById('panGrid'); g.innerHTML='';
  // 按顶九履一排：9,4,2 / 3,5,7 / 8,1,6
  const order=[9,4,2,3,5,7,8,1,6];
  for(const p of order){
    const c=ch.cells[p];
    const div=document.createElement('div');
    div.className='cell';
    let tags='';
    if(c.isZf) tags+=`<span class="tag tag-zf">值符落</span>`;
    if(c.isZs) tags+=`<span class="tag tag-zs">值使</span>`;
    if(c.god) tags+=`<span class="tag">${c.god}</span>`;
    if(c.men) tags+=`<span class="tag tag-men">${c.men}门</span>`;
    if(c.kw) tags+=`<span class="tag tag-kw">空亡</span>`;
    div.innerHTML=`<b>${p}宫(${c.name})</b> ${tags}<br>${c.dipan||''} ${c.star||''} ${c.men||''}<br>${c.god||''}`;
    g.appendChild(div);
  }
}
function renderPool(pool){
  document.getElementById('poolCard').style.display='';
  document.getElementById('frontCount').textContent=pool.front.length;
  document.getElementById('backCount').textContent=pool.back.length;
  document.getElementById('frontPool').innerHTML=pool.front.slice(0,36).map(x=>{
    const cls=x.w>=2?'ball-front':'';
    return `<span class="ball ${cls}">${String(x.n).padStart(2,'0')}</span>`;
  }).join('');
  document.getElementById('backPool').innerHTML=pool.back.map(x=>`<span class="ball ball-back">${String(x.n).padStart(2,'0')}</span>`).join('');
}
function renderPicks(picks,game){
  document.getElementById('pickCard').style.display='';
  document.getElementById('pickList').innerHTML=picks.map((p,i)=>{
    const nums=p.nums.map(n=>`<span class="ball ball-front">${String(n).padStart(2,'0')}</span>`).join('');
    let bk='';
    if(game==='dlt') bk=p.back.map(x=>`<span class="ball ball-back">${String(x).padStart(2,'0')}</span>`).join('+');
    else bk=`<span class="ball ball-back">${String(p.back).padStart(2,'0')}</span>`;
    return `<div>第${i+1}注 权重${p.score}：${nums} + ${bk}</div>`;
  }).join('');
}
function getOpts(){
  return {
    useDuiGong:document.getElementById('optDuiGong').checked,
    useQianTian:document.getElementById('optQianTian').checked,
    zhongErBa:document.getElementById('optErBa').checked||true,
    useWuxing:document.getElementById('optWuxing').checked,
    useKongZhuanAn:document.getElementById('optKongAn').checked,
    useZhenTaiYang:document.getElementById('optZhenTaiYang').checked
  };
}
let LAST={ssq:null,dlt:null};
function run(){
  const g=document.getElementById('game').value;
  const dt=document.getElementById('date').value, tm=document.getElementById('time').value;
  if(!dt||!tm){document.getElementById('warn').textContent='请选择日期时间';return}
  document.getElementById('warn').textContent='';
  const [y,m,d]=dt.split('-').map(Number);
  const [h,mi]=tm.split(':').map(Number);
  const opts=getOpts();
  const ch=qimen(y,m,d,h,mi,opts);
  const pool=buildPoolV61(ch,g,opts);
  const picks=pick5(pool,g,LAST[g],opts);
  if(picks.length) LAST[g]=picks[0].nums;
  renderPan(ch);
  renderPool(pool);
  renderPicks(picks,g);
  console.log('输入',{g,dt,tm,opts});
  console.log('排盘',{dg:ch.dg,hg:ch.hg,xs:ch.xs,jq:ch.jq,yang:ch.yang,ju:ch.ju,zfPalace:ch.zfPalace,zsPalace:ch.zsPalace,kong:ch.kong,kw:ch.kwPalaces});
}
function demo(){
  document.getElementById('game').value='dlt';
  document.getElementById('date').value='2026-10-22';
  document.getElementById('time').value='21:15';
  run();
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('genBtn').addEventListener('click',run);
  document.getElementById('demoBtn').addEventListener('click',demo);
});
</script>

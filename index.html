
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇门数据迭代模型 V6.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0b0e1a;
            color: #e0e4f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 12px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: linear-gradient(145deg, #12162a 0%, #1a1f38 100%);
            border-radius: 28px;
            padding: 28px 20px 32px;
            box-shadow: 0 20px 44px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid #2a3050;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #d4b87a;
            text-shadow: 0 2px 6px rgba(180,140,60,0.25);
            margin-bottom: 6px;
        }
        .sub {
            text-align: center;
            font-size: 13px;
            color: #7a82a8;
            margin-bottom: 22px;
            border-bottom: 1px solid #252d4a;
            padding-bottom: 14px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 600;
            background: #1e2440;
            color: #8890b8;
            border: 1px solid #2d3558;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .tab-btn.active {
            background: #d4b87a;
            color: #0b0e1a;
            border-color: #d4b87a;
            box-shadow: 0 4px 14px rgba(212,184,122,0.3);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .pool-box {
            background: #0f1328;
            border-radius: 18px;
            padding: 16px 14px;
            margin-bottom: 20px;
            border: 1px solid #262e50;
        }
        .pool-label {
            font-size: 14px;
            font-weight: 500;
            color: #b0b8da;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pool-label span {
            background: #1e2440;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #7a82a8;
        }
        .ball-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .ball {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            background: #1a1f38;
            color: #c8ceec;
            border: 1px solid #303860;
            transition: 0.1s;
        }
        .ball.red { background: #2d1330; border-color: #6a2840; color: #f088a0; }
        .ball.blue { background: #0f2640; border-color: #205080; color: #68b8f0; }
        .ball.gold { background: #2d2410; border-color: #6a5828; color: #e8c878; }
        .pick-title {
            font-size: 16px;
            font-weight: 600;
            color: #d4b87a;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pick-title .badge {
            background: #d4b87a;
            color: #0b0e1a;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 700;
        }
        .pick-card {
            background: #0f1328;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-left: 4px solid #d4b87a;
            border: 1px solid #262e50;
            border-left-width: 4px;
        }
        .pick-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .pick-num {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }
        .pick-num.red { background: #3d1a28; color: #f088a0; }
        .pick-num.blue { background: #143050; color: #68b8f0; }
        .pick-num.gold { background: #3d2e18; color: #e8c878; }
        .pick-sep {
            color: #505880;
            font-size: 18px;
            margin: 0 2px;
        }
        .pick-label {
            font-size: 12px;
            color: #888fc0;
            margin-left: 6px;
            background: #1a1f38;
            padding: 0 8px;
            border-radius: 30px;
        }
        .footer-note {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #585f88;
            border-top: 1px solid #1e2440;
            padding-top: 16px;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 12px; }
            .ball { width: 32px; height: 32px; font-size: 12px; }
            .pick-num { width: 30px; height: 30px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔ 奇门数据迭代模型</h1>
    <div class="sub">V6.1 · 九宫格局 → 精准杀号 → 擒号秘技</div>

    <div class="tabs">
        <div class="tab-btn active" data-tab="ssq">双色球</div>
        <div class="tab-btn" data-tab="dlt">大乐透</div>
    </div>

    <!-- 双色球 -->
    <div id="ssq" class="section active">
        <div class="pool-box">
            <div class="pool-label">🧩 奇门总池 · 红球 <span>共33码</span></div>
            <div class="ball-grid" id="ssq-red-pool"></div>
        </div>
        <div class="pool-box">
            <div class="pool-label">🌀 奇门总池 · 蓝球 <span>共16码</span></div>
            <div class="ball-grid" id="ssq-blue-pool"></div>
        </div>

        <div class="pick-title">✨ 精选 3 注 <span class="badge">精选</span></div>
        <div id="ssq-picks"></div>
    </div>

    <!-- 大乐透 -->
    <div id="dlt" class="section">
        <div class="pool-box">
            <div class="pool-label">🧩 奇门总池 · 前区 <span>共35码</span></div>
            <div class="ball-grid" id="dlt-front-pool"></div>
        </div>
        <div class="pool-box">
            <div class="pool-label">🌀 奇门总池 · 后区 <span>共12码</span></div>
            <div class="ball-grid" id="dlt-back-pool"></div>
        </div>

        <div class="pick-title">✨ 精选 3 注 <span class="badge">精选</span></div>
        <div id="dlt-picks"></div>
    </div>

    <div class="footer-note">※ 模型输出仅供娱乐 · 不构成投注建议</div>
</div>

<script>
    // ----- 数据（V6.1 本期出料） -----
    const data = {
        ssq: {
            redPool: Array.from({length:33}, (_,i)=>i+1),
            bluePool: Array.from({length:16}, (_,i)=>i+1),
            picks: [
                {red:[3,9,13,22,27,31], blue:7},
                {red:[4,9,18,22,28,30], blue:9},
                {red:[3,13,18,27,28,31], blue:13}
            ]
        },
        dlt: {
            frontPool: Array.from({length:35}, (_,i)=>i+1),
            backPool: Array.from({length:12}, (_,i)=>i+1),
            picks: [
                {front:[4,13,18,26,31], back:[5,9]},
                {front:[9,13,22,29,34], back:[6,11]},
                {front:[4,18,22,31,34], back:[5,11]}
            ]
        }
    };

    // ----- 渲染函数 -----
    function renderBalls(containerId, arr, cls='') {
        const el = document.getElementById(containerId);
        if(!el) return;
        el.innerHTML = '';
        arr.forEach(n => {
            const div = document.createElement('div');
            div.className = `ball ${cls}`;
            div.textContent = n.toString().padStart(2,'0');
            el.appendChild(div);
        });
    }

    function renderSsqPicks() {
        const container = document.getElementById('ssq-picks');
        if(!container) return;
        container.innerHTML = '';
        data.ssq.picks.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'pick-card';
            const row = document.createElement('div');
            row.className = 'pick-row';
            p.red.forEach(r => {
                const span = document.createElement('span');
                span.className = 'pick-num red';
                span.textContent = r.toString().padStart(2,'0');
                row.appendChild(span);
            });
            const sep = document.createElement('span');
            sep.className = 'pick-sep';
            sep.textContent = '+';
            row.appendChild(sep);
            const bSpan = document.createElement('span');
            bSpan.className = 'pick-num blue';
            bSpan.textContent = p.blue.toString().padStart(2,'0');
            row.appendChild(bSpan);
            const label = document.createElement('span');
            label.className = 'pick-label';
            label.textContent = `精选${idx+1}`;
            row.appendChild(label);
            card.appendChild(row);
            container.appendChild(card);
        });
    }

    function renderDltPicks() {
        const container = document.getElementById('dlt-picks');
        if(!container) return;
        container.innerHTML = '';
        data.dlt.picks.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'pick-card';
            const row = document.createElement('div');
            row.className = 'pick-row';
            p.front.forEach(f => {
                const span = document.createElement('span');
                span.className = 'pick-num gold';
                span.textContent = f.toString().padStart(2,'0');
                row.appendChild(span);
            });
            const sep = document.createElement('span');
            sep.className = 'pick-sep';
            sep.textContent = '+';
            row.appendChild(sep);
            p.back.forEach(b => {
                const span = document.createElement('span');
                span.className = 'pick-num blue';
                span.textContent = b.toString().padStart(2,'0');
                row.appendChild(span);
            });
            const label = document.createElement('span');
            label.className = 'pick-label';
            label.textContent = `精选${idx+1}`;
            row.appendChild(label);
            card.appendChild(row);
            container.appendChild(card);
        });
    }

    // ----- 初始化 -----
    function init() {
        // 双色球
        renderBalls('ssq-red-pool', data.ssq.redPool, 'red');
        renderBalls('ssq-blue-pool', data.ssq.bluePool, 'blue');
        renderSsqPicks();
        // 大乐透
        renderBalls('dlt-front-pool', data.dlt.frontPool, 'gold');
        renderBalls('dlt-back-pool', data.dlt.backPool, 'blue');
        renderDltPicks();
    }

    // ----- 选项卡切换 -----
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const target = this.dataset.tab;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(target).classList.add('active');
        });
    });

    init();
</script>
</body>
</html>

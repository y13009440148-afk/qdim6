// =====================================================
// 模块3：工具函数
// =====================================================
function getJulianDay(y,m,d,h,mi) {
    if(m<=2){y--;m+=12}
    var A=Math.floor(y/100);
    var B=2-A+Math.floor(A/4);
    var JD=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+h/24+mi/1440+B-1524.5;
    return JD;
}

function jieQiIndex(year,month,day,hour,minute) {
    var targetJD=getJulianDay(year,month,day,hour,minute);
    for(var i=0;i<JIE_QI_TABLE.length;i++){
        var q=JIE_QI_TABLE[i];
        var qJD=getJulianDay(q[0],q[1],q[2],q[3],q[4]);
        if(qJD>targetJD){
            if(i==0)return 0;
            return i-1;
        }
    }
    return JIE_QI_TABLE.length-1;
}

function ganZhiFromJD(jd) {
    // 简单近似：以1900年1月1日为基准（甲子日）
    var baseJD=getJulianDay(1900,1,1,0,0);
    var diff=Math.round(jd-baseJD);
    var ganIdx=(diff%10+10)%10;
    var zhiIdx=(diff%12+12)%12;
    return {gan:TIAN_GAN[ganIdx],zhi:DI_ZHI[zhiIdx],ganIdx:ganIdx,zhiIdx:zhiIdx};
}

function shiChenGanZhi(riGanIdx,shiZhiIdx) {
    // 五鼠遁：甲己还加甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸何方发，壬子是真途
    var startGan;
    if(riGanIdx==0||riGanIdx==5)startGan=0;     // 甲己→甲
    else if(riGanIdx==1||riGanIdx==6)startGan=2; // 乙庚→丙
    else if(riGanIdx==2||riGanIdx==7)startGan=4; // 丙辛→戊
    else if(riGanIdx==3||riGanIdx==8)startGan=6; // 丁壬→庚
    else startGan=8;                              // 戊癸→壬
    var ganIdx=(startGan+shiZhiIdx)%10;
    return {gan:TIAN_GAN[ganIdx],zhi:DI_ZHI[shiZhiIdx],ganIdx:ganIdx,zhiIdx:shiZhiIdx};
}

function xunShou(ganIdx) {
    // 根据时干确定旬首（甲子/甲戌/甲申/甲午/甲辰/甲寅）
    if(ganIdx==0)return {gan:'甲',zhi:'子',ganIdx:0,zhiIdx:0};
    if(ganIdx==1)return {gan:'甲',zhi:'戌',ganIdx:0,zhiIdx:10};
    if(ganIdx==2)return {gan:'甲',zhi:'申',ganIdx:0,zhiIdx:8};
    if(ganIdx==3)return {gan:'甲',zhi:'午',ganIdx:0,zhiIdx:6};
    if(ganIdx==4)return {gan:'甲',zhi:'辰',ganIdx:0,zhiIdx:4};
    if(ganIdx==5)return {gan:'甲',zhi:'寅',ganIdx:0,zhiIdx:2};
    if(ganIdx==6)return {gan:'甲',zhi:'子',ganIdx:0,zhiIdx:0};
    if(ganIdx==7)return {gan:'甲',zhi:'戌',ganIdx:0,zhiIdx:10};
    if(ganIdx==8)return {gan:'甲',zhi:'申',ganIdx:0,zhiIdx:8};
    if(ganIdx==9)return {gan:'甲',zhi:'午',ganIdx:0,zhiIdx:6};
    return null;
}

// =====================================================
// 模块4：拆补法定局
// =====================================================
function dingJu(year,month,day,hour,minute) {
    var qiIdx=jieQiIndex(year,month,day,hour,minute);
    var qi=JIE_QI_TABLE[qiIdx];
    var qiName=qi[5];
    
    // 计算日干支
    var qiJD=getJulianDay(qi[0],qi[1],qi[2],qi[3],qi[4]);
    var riGZ=ganZhiFromJD(qiJD);
    var riGanIdx=riGZ.ganIdx;
    var riZhiIdx=riGZ.zhiIdx;
    
    // 找符头：甲/己日
    var fuTouGan='';
    var fuTouZhi='';
    if(riGanIdx==0||riGanIdx==5){
        fuTouGan=riGZ.gan;
        fuTouZhi=riGZ.zhi;
    }else{
        // 向前找到最近的甲/己日
        for(var d=1;d<=6;d++){
            var prevJD=qiJD-d;
            var prevGZ=ganZhiFromJD(prevJD);
            if(prevGZ.ganIdx==0||prevGZ.ganIdx==5){
                fuTouGan=prevGZ.gan;
                fuTouZhi=prevGZ.zhi;
                break;
            }
        }
    }
    
    // 符头地支定上中下元
    var yuan='';
    var fuZhiIdx=DI_ZHI.indexOf(fuTouZhi);
    if(fuZhiIdx==0||fuZhiIdx==4||fuZhiIdx==8) yuan='上元';   // 子/辰/申
    else if(fuZhiIdx==2||fuZhiIdx==6||fuZhiIdx==10) yuan='中元'; // 寅/午/戌
    else yuan='下元';  // 丑/卯/巳/未/酉/亥
    
    // 根据节气确定阴阳遁
    var yinYang='';
    var juNum=0;
    
    // 冬至到夏至前为阳遁，夏至到冬至前为阴遁
    var summerSolstice=false;
    for(var i=0;i<JIE_QI_TABLE.length;i++){
        if(JIE_QI_TABLE[i][5]=='夏至'){
            var ssJD=getJulianDay(JIE_QI_TABLE[i][0],JIE_QI_TABLE[i][1],JIE_QI_TABLE[i][2],JIE_QI_TABLE[i][3],JIE_QI_TABLE[i][4]);
            if(qiJD>=ssJD)summerSolstice=true;
            break;
        }
    }
    
    if(!summerSolstice){
        yinYang='阳遁';
    }else{
        yinYang='阴遁';
    }
    
    // 节气与局的对应关系（三元）
    var jieQiJuMap={
        '立春':{'上元':8,'中元':5,'下元':2},
        '春分':{'上元':3,'中元':9,'下元':6},
        '清明':{'上元':4,'中元':1,'下元':7},
        '立夏':{'上元':4,'中元':1,'下元':7},
        '芒种':{'上元':6,'中元':3,'下元':9},
        '夏至':{'上元':9,'中元':3,'下元':6},
        '大暑':{'上元':7,'中元':4,'下元':1},
        '立秋':{'上元':2,'中元':5,'下元':8},
        '白露':{'上元':9,'中元':3,'下元':6},
        '寒露':{'上元':6,'中元':3,'下元':9},
        '立冬':{'上元':6,'中元':9,'下元':3},
        '大雪':{'上元':4,'中元':7,'下元':1},
        '冬至':{'上元':1,'中元':7,'下元':4},
        '小寒':{'上元':2,'中元':8,'下元':5},
        '大寒':{'上元':3,'中元':9,'下元':6},
        '雨水':{'上元':9,'中元':6,'下元':3},
        '惊蛰':{'上元':1,'中元':7,'下元':4},
        '谷雨':{'上元':5,'中元':2,'下元':8},
        '小满':{'上元':5,'中元':2,'下元':8},
        '小暑':{'上元':8,'中元':5,'下元':2},
        '处暑':{'上元':1,'中元':4,'下元':7},
        '秋分':{'上元':7,'中元':1,'下元':4},
        '霜降':{'上元':5,'中元':8,'下元':2},
        '小雪':{'上元':5,'中元':8,'下元':2}
    };
    
    if(jieQiJuMap[qiName]){
        juNum=jieQiJuMap[qiName][yuan]||1;
    }else{
        juNum=1;
    }
    
    return {
        qiName:qiName,
        qiDate:qi[0]+'-'+qi[1]+'-'+qi[2]+' '+qi[3]+':'+qi[4],
        fuTou:fuTouGan+fuTouZhi,
        yuan:yuan,
        yinYang:yinYang,
        juNum:juNum,
        qiJD:qiJD
    };
}

// =====================================================
// 模块5：地盘排法（阳遁9局、阴遁9局，每个局单独写）
// =====================================================
function paiDiPan(yinYang,juNum) {
    var diPan={};
    // 初始化9宫为空
    for(var g=1;g<=9;g++)diPan[g]='';
    
    if(yinYang=='阳遁'){
        // 阳遁：戊从某宫起，顺排
        if(juNum==1){
            diPan[1]='戊';diPan[2]='己';diPan[3]='庚';diPan[4]='辛';diPan[5]='壬';diPan[6]='癸';diPan[7]='丁';diPan[8]='丙';diPan[9]='乙';
        }else if(juNum==2){
            diPan[2]='戊';diPan[3]='己';diPan[4]='庚';diPan[5]='辛';diPan[6]='壬';diPan[7]='癸';diPan[8]='丁';diPan[9]='丙';diPan[1]='乙';
        }else if(juNum==3){
            diPan[3]='戊';diPan[4]='己';diPan[5]='庚';diPan[6]='辛';diPan[7]='壬';diPan[8]='癸';diPan[9]='丁';diPan[1]='丙';diPan[2]='乙';
        }else if(juNum==4){
            diPan[4]='戊';diPan[5]='己';diPan[6]='庚';diPan[7]='辛';diPan[8]='壬';diPan[9]='癸';diPan[1]='丁';diPan[2]='丙';diPan[3]='乙';
        }else if(juNum==5){
            diPan[5]='戊';diPan[6]='己';diPan[7]='庚';diPan[8]='辛';diPan[9]='壬';diPan[1]='癸';diPan[2]='丁';diPan[3]='丙';diPan[4]='乙';
        }else if(juNum==6){

function findZhiFuZhiShi(diPan,shiGanIdx,shiZhiIdx,yinYang) {
    // 旬首
    var xun=xunShou(shiGanIdx);
    var xunGan=xun.gan;
    var xunZhi=xun.zhi;
    var xunZhiIdx=xun.zhiIdx;
    
    // 旬首所在宫
    var xunGong=0;
    for(var g=1;g<=9;g++){
        if(diPan[g]==xunGan){
            xunGong=g;
            break;
        }
    }
    
    // 值符：旬首对应的星
    var zhiFuXing=XING_NAME[xunGong];
    
    // 值使：旬首对应的门（原始门位）
    var menMap={};
    menMap[1]='休';menMap[2]='生';menMap[3]='伤';menMap[4]='杜';menMap[5]='景';menMap[6]='死';menMap[7]='惊';menMap[8]='开';
    var zhiShiMen=menMap[xunGong];
    
    // 值使落宫：从旬首宫起，阳顺阴逆，步数为时支到旬首地支的距离
    var step=0;
    if(shiZhiIdx>=xunZhiIdx){
        step=shiZhiIdx-xunZhiIdx;
    }else{
        step=shiZhiIdx+12-xunZhiIdx;
    }
    var zhiShiGong=xunGong;
    if(yinYang=='阳遁'){
        zhiShiGong=xunGong+step;
        if(zhiShiGong>9)zhiShiGong-=9;
    }else{
        zhiShiGong=xunGong-step;
        if(zhiShiGong<1)zhiShiGong+=9;
    }
    
    return {
        xunGong:xunGong,
        zhiFuXing:zhiFuXing,
        zhiFuGong:xunGong,
        zhiShiMen:zhiShiMen,
        zhiShiGong:zhiShiGong
    };
}

    var starStartIdx=starOrder.indexOf(zhiFuGong);
    var newStarOrder=[];
    for(var i=0;i<9;i++){

// 模块11：取号（值符宫/值使宫/开生门宫/用神宫 → 干 → 数）

function quHao(diPan,tianPan,baMen,baShen,zhiFuGong,zhiShiGong) {
    var pool=[];
    
    // 值符宫
    var zfGan=diPan[zhiFuGong];
    if(zfGan&&GAN_TO_NUM[zfGan])pool.push(GAN_TO_NUM[zfGan]);
    
    // 值使宫
    var zsGan=diPan[zhiShiGong];
    if(zsGan&&GAN_TO_NUM[zsGan])pool.push(GAN_TO_NUM[zsGan]);
    
    // 开门宫
    var kaiGong=0;
    for(var g=1;g<=9;g++){
        if(baMen[g]=='开'){kaiGong=g;break;}
    }
    if(kaiGong){
        var kaiGan=diPan[kaiGong];
        if(kaiGan&&GAN_TO_NUM[kaiGan])pool.push(GAN_TO_NUM[kaiGan]);
    }
    
    // 生门宫
    var shengGong=0;
    for(var g=1;g<=9;g++){
        if(baMen[g]=='生'){shengGong=g;break;}
    }
    if(shengGong){
        var shengGan=diPan[shengGong];
        if(shengGan&&GAN_TO_NUM[shengGan])pool.push(GAN_TO_NUM[shengGan]);
    }
    
    // 用神宫（取时干所在宫）
    var yongGong=0;
    for(var g=1;g<=9;g++){
        if(diPan[g]==TIAN_GAN[shiGanIdx]){yongGong=g;break;}
    }
    if(yongGong){
        var yongGan=diPan[yongGong];
        if(yongGan&&GAN_TO_NUM[yongGan])pool.push(GAN_TO_NUM[yongGan]);
    }
    
    // 去重、过滤1-33（双色球红球范围）
    var unique=[];
    for(var i=0;i<pool.length;i++){
        if(pool[i]>=1&&pool[i]<=33&&unique.indexOf(pool[i])==-1)unique.push(pool[i]);
    }
    return unique.sort(function(a,b){return a-b;});
}

// =====================================================
// 模块12：B层扩展（同尾/对宫/+9）
// =====================================================
function bExtend(pool) {
    var ext=[];
    for(var i=0;i<pool.length;i++){
        var n=pool[i];
        // 同尾
        for(var t=n%10;t<=33;t+=10){
            if(t!=n&&ext.indexOf(t)==-1&&t>=1&&t<=33)ext.push(t);
        }
        // 对宫（+9或-9）
        var dui1=n+9;
        if(dui1<=33&&dui1!=n&&ext.indexOf(dui1)==-1)ext.push(dui1);
        var dui2=n-9;
        if(dui2>=1&&dui2!=n&&ext.indexOf(dui2)==-1)ext.push(dui2);
    }
    // 合并
    var all=pool.concat(ext);
    var unique=[];
    for(var i=0;i<all.length;i++){
        if(unique.indexOf(all[i])==-1)unique.push(all[i]);
    }
    return unique.sort(function(a,b){return a-b;});
}

// 模块13：杀号（空亡/击刑/入墓/门迫 + 张委铭）

function killNumbers(pool,kongGongs,jiXingGongs,ruMuGongs,menPoGongs,prevRed,lotType) {
    var killed=[];
    var remain=pool.slice();
    
    // 空亡杀
    for(var i=0;i<remain.length;i++){
        var n=remain[i];
        var gong=0;
        if(n>=1&&n<=3)gong=1;
        else if(n>=4&&n<=6)gong=2;
        else if(n>=7&&n<=9)gong=3;
        else if(n>=10&&n<=12)gong=4;
        else if(n>=13&&n<=15)gong=5;
        else if(n>=16&&n<=18)gong=6;
        else if(n>=19&&n<=21)gong=7;
        else if(n>=22&&n<=24)gong=8;
        else if(n>=25&&n<=27)gong=9;
        else if(n>=28&&n<=30)gong=1;
        else if(n>=31&&n<=33)gong=2;
        
        if(kongGongs.indexOf(gong)!=-1){
            killed.push(n);
            remain[i]=-1;
        }
    }
    
    // 击刑杀
    for(var i=0;i<remain.length;i++){
        if(remain[i]==-1)continue;
        var n=remain[i];
        var gong=0;
        if(n>=1&&n<=3)gong=1;
        else if(n>=4&&n<=6)gong=2;
        else if(n>=7&&n<=9)gong=3;
        else if(n>=10&&n<=12)gong=4;
        else if(n>=13&&n<=15)gong=5;
        else if(n>=16&&n<=18)gong=6;
        else if(n>=19&&n<=21)gong=7;
        else if(n>=22&&n<=24)gong=8;
        else if(n>=25&&n<=27)gong=9;
        else if(n>=28&&n<=30)gong=1;
        else if(n>=31&&n<=33)gong=2;
        
        if(jiXingGongs.indexOf(gong)!=-1){
            killed.push(n);
            remain[i]=-1;
        }
    }
    
    // 入墓杀
    for(var i=0;i<remain.length;i++){
        if(remain[i]==-1)continue;
        var n=remain[i];
        var gong=0;
        if(n>=1&&n<=3)gong=1;
        else if(n>=4&&n<=6)gong=2;
        else if(n>=7&&n<=9)gong=3;
        else if(n>=10&&n<=12)gong=4;
        else if(n>=13&&n<=15)gong=5;
        else if(n>=16&&n<=18)gong=6;
        else if(n>=19&&n<=21)gong=7;
        else if(n>=22&&n<=24)gong=8;
        else if(n>=25&&n<=27)gong=9;
        else if(n>=28&&n<=30)gong=1;
        else if(n>=31&&n<=33)gong=2;
        
        if(ruMuGongs.indexOf(gong)!=-1){
            killed.push(n);
            remain[i]=-1;
        }
    }
    
    // 门迫杀
    for(var i=0;i<remain.length;i++){
        if(remain[i]==-1)continue;
        var n=remain[i];
        var gong=0;
        if(n>=1&&n<=3)gong=1;
        else if(n>=4&&n<=6)gong=2;
        else if(n>=7&&n<=9)gong=3;
        else if(n>=10&&n<=12)gong=4;
        else if(n>=13&&n<=15)gong=5;
        else if(n>=16&&n<=18)gong=6;
        else if(n>=19&&n<=21)gong=7;
        else if(n>=22&&n<=24)gong=8;
        else if(n>=25&&n<=27)gong=9;
        else if(n>=28&&n<=30)gong=1;
        else if(n>=31&&n<=33)gong=2;
        
        if(menPoGongs.indexOf(gong)!=-1){
            killed.push(n);
            remain[i]=-1;
        }
    }
    
    // 张委铭杀号：重号杀、邻号杀、尾数集中杀、区间退号杀
    if(prevRed&&prevRed.length>0){
        // 重号杀：上期号码不重复出现
        for(var i=0;i<remain.length;i++){
            if(remain[i]==-1)continue;
            if(prevRed.indexOf(remain[i])!=-1){
                killed.push(remain[i]);
                remain[i]=-1;
            }
        }
        
        // 邻号杀：上期号码±1
        var neighbors=[];
        for(var i=0;i<prevRed.length;i++){
            if(prevRed[i]-1>=1)neighbors.push(prevRed[i]-1);
            if(prevRed[i]+1<=33)neighbors.push(prevRed[i]+1);
        }
        for(var i=0;i<remain.length;i++){
            if(remain[i]==-1)continue;
            if(neighbors.indexOf(remain[i])!=-1){
                killed.push(remain[i]);
                remain[i]=-1;
            }
        }
        
        // 尾数集中杀：上期尾数出现次数≥3的尾数
        var weiCount={};
        for(var i=0;i<prevRed.length;i++){
            var w=prevRed[i]%10;
            if(!weiCount[w])weiCount[w]=0;
            weiCount[w]++;
        }
        var hotWei=[];
        for(var w in weiCount){
            if(weiCount[w]>=3)hotWei.push(parseInt(w));
        }
        for(var i=0;i<remain.length;i++){
            if(remain[i]==-1)continue;
            if(hotWei.indexOf(remain[i]%10)!=-1){
                killed.push(remain[i]);
                remain[i]=-1;
            }
        }
        
        // 区间退号杀：上期一区(1-11)出≥4个则退一区
        var q1=0,q2=0,q3=0;
        for(var i=0;i<prevRed.length;i++){
            if(prevRed[i]<=11)q1++;
            else if(prevRed[i]<=22)q2++;
            else q3++;
        }
        if(q1>=4){
            for(var i=0;i<remain.length;i++){
                if(remain[i]==-1)continue;
                if(remain[i]<=11){
                    killed.push(remain[i]);
                    remain[i]=-1;
                }
            }
        }
        if(q2>=4){
            for(var i=0;i<remain.length;i++){
                if(remain[i]==-1)continue;
                if(remain[i]>=12&&remain[i]<=22){
                    killed.push(remain[i]);
                    remain[i]=-1;
                }
            }
        }
        if(q3>=4){
            for(var i=0;i<remain.length;i++){
                if(remain[i]==-1)continue;
                if(remain[i]>=23){
                    killed.push(remain[i]);
                    remain[i]=-1;
                }
            }
        }
    }
    
    var finalRemain=[];
    for(var i=0;i<remain.length;i++){
        if(remain[i]!=-1)finalRemain.push(remain[i]);
    }
    
    return {
        killed:killed.sort(function(a,b){return a-b;}),
        remain:finalRemain.sort(function(a,b){return a-b;})
    };
}

// =====================================================
// 模块14：褚天一形态筛选（红球）
// =====================================================
function chuTianYiFilter(candidates,lotType) {
    var picks=[];
    var maxPicks=3;
    var attempts=0;
    var maxAttempts=5000;
    
    while(picks.length<maxPicks&&attempts<maxAttempts){
        attempts++;
        var red=[];
        var pool=candidates.slice();
        if(pool.length<6)break;
        
        // 随机选6个不同号码
        var shuffled=pool.slice();
        for(var i=shuffled.length-1;i>0;i--){
            var j=Math.floor(Math.random()*(i+1));
            var tmp=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=tmp;
        }
        red=shuffled.slice(0,6).sort(function(a,b){return a-b;});
        
        // 形态校验
        var valid=true;
        
        // 大小比 3:3 / 4:2 / 2:4
        var big=0;
        for(var i=0;i<red.length;i++){

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>奇门统计+跨度法融合选号模型（完整版）</title>
<style>
* { box-sizing: border-box; font-family: system-ui, "Microsoft YaHei", sans-serif; }
body { background:#0b1120; color:#e5e7eb; padding:14px; max-width:1280px; margin:0 auto; }
h2 { color:#fbbf24; text-align:center; }
.box { background:#1f2937; border-radius:10px; padding:14px; margin:10px 0; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
input,select,textarea,button { padding:8px 10px; border-radius:6px; border:none; font-size:14px; }
input,select,textarea { background:#374151; color:#fff; outline:none; }
button { background:#2563eb; color:#fff; cursor:pointer; font-weight:bold; }
button:hover { background:#1d4ed8; }
#log { background:#020617; padding:10px; border-radius:8px; min-height:180px; white-space:pre-wrap; font-size:13px; color:#93c5fd; overflow:auto; }
.red { color:#f87171; }
.blue-text { color:#60a5fa; }
table { width:100%; border-collapse:collapse; margin-top:8px; }
th,td { border:1px solid #4b5563; padding:6px; text-align:center; font-size:13px; }
th { background:#374151; }
.info { color:#9ca3af; font-size:13px; }
.qimen { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.gong { background:#111827; border:1px solid #374151; border-radius:8px; padding:8px; font-size:13px; }
.gong-ji { border-color:#4ade80; }
.gong-xiong { border-color:#f87171; }
.gong-title { font-weight:bold; color:#fbbf24; }
.ball { display:inline-block; width:34px; height:34px; line-height:34px; text-align:center; border-radius:50%; margin:3px; background:#374151; }
.ball-sel { outline:2px solid #fbbf24; }
</style>
</head>
<body>

<h2>奇门统计 + 跨度法融合选号模型</h2>

<div class="box">
  <div class="row">
    <label>日期</label><input id="dateInput" value="2026-10-24">
    <label>时间</label><input id="timeInput" value="21:15">
    <label>经度</label><input id="lngInput" value="121.6" style="width:80px">
    <button onclick="start()">起盘+推演</button>
  </div>
  <div class="row">
    <label>彩种</label>
    <select id="lotType">
      <option value="ssq">双色球 前6/后1</option>
      <option value="dlt">大乐透 前5/后2</option>
    </select>
    <label>生成组数</label><input id="genCount" value="10" style="width:70px">
  </div>
  <div class="row">
    <label><input type="checkbox" id="chkLunZhuan">九宫轮转</label>
    <label>步数</label><input id="lunStep" value="2" style="width:50px">
    <select id="lunMode"><option value="sep">分步</option><option value="merge">合并池</option></select>
    <label><input type="checkbox" id="chkMatrix">容错矩阵</label>
    <select id="matrixType">
      <option value="6bao5">6保5</option>
      <option value="7bao6">7保6</option>
      <option value="8bao6">8保6</option>
      <option value="9bao7">9保7</option>
    </select>
    <label>矩阵上限</label><input id="matrixLimit" value="200" style="width:70px">
  </div>
  <div class="row">
    和值 <input id="heMin" value="70" style="width:60px">~<input id="heMax" value="130" style="width:60px">
    AC <input id="acMin" value="4" style="width:50px">~<input id="acMax" value="10" style="width:50px">
    跨度 <input id="kuaMin" value="15" style="width:50px">~<input id="kuaMax" value="32" style="width:50px">
  </div>
  <div class="row">
    <label><input type="checkbox" id="chkJiOu" checked>奇偶</label>
    <label><input type="checkbox" id="chkDaXiao" checked>大小</label>
    <label><input type="checkbox" id="chkZhiHe" checked>质合</label>
    <label><input type="checkbox" id="useWeight" checked>高斯权重</label>
    σ<input id="sigma" value="2.2" style="width:50px">
  </div>
  <div class="row">
    <label>历史开奖（每行：红球 + 蓝球，空格/逗号分隔）</label>
  </div>
  <textarea id="historyText" placeholder="01 05 12 18 24 31 + 09&#10;03 07 14 22 29 32 + 12"></textarea>
</div>

<div class="box">
  <div id="qimenBoard" class="qimen"></div>
  <div id="resultBox"></div>
  <div id="hitBox"></div>
</div>

<div class="box">
  <div id="log"></div>
</div>

<script>
/* ========== 基础常量 ========== */
const ganArr=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const zhiArr=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const luoShu=[4,9,2,3,5,7,8,1,6];
const gongName={1:"坎一",2:"坤二",3:"震三",4:"巽四",5:"中五",6:"乾六",7:"兑七",8:"艮八",9:"离九"};

const gongRange={
  1:[1,4],2:[5,8],3:[9,12],4:[13,16],
  5:[17,21],6:[22,25],7:[26,29],8:[30,33],9:[1,33]
};

const wuXingGan={甲:"木",乙:"木",丙:"火",丁:"火",戊:"土",己:"土",庚:"金",辛:"金",壬:"水",癸:"水"};
const gongWx={1:"水",2:"土",3:"木",4:"木",5:"土",6:"金",7:"金",8:"土",9:"火"};

const JQ_JU={
  "冬至":[1,7,4],"小寒":[2,8,5],"大寒":[3,9,6],
  "立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],
  "春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],
  "立夏":[4,5,6],"小满":[7,8,9],"芒种":[1,2,3],
  "夏至":[9,8,7],"小暑":[6,5,4],"大暑":[3,2,1],
  "立秋":[2,5,8],"处暑":[3,6,9],"白露":[4,7,1],
  "秋分":[6,3,9],"寒露":[7,4,1],"霜降":[8,5,2],
  "立冬":[7,8,9],"小雪":[1,2,3],"大雪":[4,5,6]
};

const SAN_YUAN={};
"甲子乙丑丙寅丁卯戊辰".split(/(?<=辰)/).forEach((_,i)=>{});
const syMap={};
["甲子","乙丑","丙寅","丁卯","戊辰"].forEach(()=>{});
function getSanYuan(gan,zhi){
  const key=gan+zhi;
  const tbl={
    "甲子":"上","乙丑":"上","丙寅":"上","丁卯":"上","戊辰":"上","己巳":"中","庚午":"中","辛未":"中","壬申":"中","癸酉":"中",
    "甲戌":"下","乙亥":"下","丙子":"下","丁丑":"下","戊寅":"下","己卯":"上","庚辰":"上","辛巳":"上","壬午":"上","癸未":"上",
    "甲申":"中","乙酉":"中","丙戌":"中","丁亥":"中","戊子":"中","己丑":"下","庚寅":"下","辛卯":"下","壬辰":"下","癸巳":"下",
    "甲午":"上","乙未":"上","丙申":"上","丁酉":"上","戊戌":"上","己亥":"中","庚子":"中","辛丑":"中","壬寅":"中","癸卯":"中",
    "甲辰":"下","乙巳":"下","丙午":"下","丁未":"下","戊申":"下","己酉":"上","庚戌":"上","辛亥":"上","壬子":"上","癸丑":"上",
    "甲寅":"中","乙卯":"中","丙辰":"中","丁巳":"中","戊午":"中","己未":"下","庚申":"下","辛酉":"下","壬戌":"下","癸亥":"下"
  };
  const v=tbl[key];
  return v==="上"?0:v==="中"?1:2;
}

function getJieQi(dt){
  const m=dt.getMonth()+1,d=dt.getDate();
  if((m===12&&d>=22)||m===1&&d<6)return"冬至";
  if(m===1&&d>=6)return"小寒";
  if(m===1&&d>=20)return"大寒";
  if(m===2&&d>=4)return"立春";
  if(m===2&&d>=19)return"雨水";
  if(m===3&&d>=5)return"惊蛰";
  if(m===3&&d>=20)return"春分";
  if(m===4&&d>=5)return"清明";
  if(m===4&&d>=20)return"谷雨";
  if(m===5&&d>=5)return"立夏";
  if(m===5&&d>=21)return"小满";
  if(m===6&&d>=6)return"芒种";
  if(m===6&&d>=21)return"夏至";
  if(m===7&&d>=7)return"小暑";
  if(m===7&&d>=23)return"大暑";
  if(m===8&&d>=8)return"立秋";
  if(m===8&&d>=23)return"处暑";
  if(m===9&&d>=8)return"白露";
  if(m===9&&d>=23)return"秋分";
  if(m===10&&d>=8)return"寒露";
  if(m===10&&d>=24)return"霜降";
  if(m===11&&d>=8)return"立冬";
  if(m===11&&d>=23)return"小雪";
  return"大雪";
}

function dayGanZhi(y,m,d){
  let Y=y,M=m;
  if(M<=2){Y--;M+=12;}
  const c=Math.floor(Y/100),yy=Y%100;
  let g=4*c+Math.floor(c/4)+5*yy+Math.floor(yy/4)+Math.floor(3*(M+1)/5)+d-3;
  let z=8*c+Math.floor(c/4)+5*yy+Math.floor(yy/4)+Math.floor(3*(M+1)/5)+d+7;
  return {gan:ganArr[((g%10)+10)%10],zhi:zhiArr[((z%12)+12)%12]};
}

function getXunKong(gan,zhi){
  const list=[["甲子","戌亥"],["甲戌","申酉"],["甲申","午未"],["甲午","辰巳"],["甲辰","寅卯"],["甲寅","子丑"]];
  for(const [x,k] of list){
    const sg=ganArr.indexOf(x[0]),sz=zhiArr.indexOf(x[1]);
    for(let i=0;i<10;i++){
      if(ganArr[(sg+i)%10]===gan&&zhiArr[(sz+i)%12]===zhi){
        return {xun:x,kong:k.split("")};
      }
    }
  }
  return {xun:"甲子",kong:["戌","亥"]};
}

function wuShuDun(riGan){
  const base={甲:0,乙:2,丙:4,丁:6,戊:8,己:0,庚:2,辛:4,壬:6,癸:8};
  const map={};let st=base[riGan];
  zhiArr.forEach((z,i)=>map[z]=ganArr[(st+i)%10]);
  return map;
}

function log(s){
  document.getElementById("log").textContent+=s+"\n";
  document.getElementById("log").scrollTop=1e9;
}
/* ========== 排盘 ========== */
let currentPan=null;

function paiPan(){
  const date=document.getElementById("dateInput").value;
  const time=document.getElementById("timeInput").value;
  const [y,m,d]=date.split("-").map(Number);
  const [hh,mm]=time.split(":").map(Number);
  const dt=new Date(y,m-1,d,hh,mm,0);

  const rgz=dayGanZhi(y,m,d);
  const riGan=rgz.gan,riZhi=rgz.zhi;
  const shiZhi=zhiArr[Math.floor((hh+1)/2)%12];
  const shiGanMap=wuShuDun(riGan);
  const shiGan=shiGanMap[shiZhi];

  const jq=getJieQi(dt);
  const isYang=["冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种"].includes(jq);
  const juArr=JQ_JU[jq];
  const yuan=getSanYuan(riGan,riZhi);
  const benJu=juArr[yuan];

  const xk=getXunKong(riGan,riZhi);

  // 地盘
  const dipan={};
  const yi=["戊","己","庚","辛","壬","癸","丁","丙","乙"];
  luoShu.forEach((g,i)=>{
    const idx=isYang?(benJu-1+i):(benJu-1-i+9);
    dipan[g]=yi[((idx%9)+9)%9];
  });

  // 值符宫（旬首）
  let zf=null;
  for(let g=1;g<=9;g++) if(dipan[g]===xk.xun[0]) zf=g;

  // 天盘
  const tian={};
  if(zf){
    const off=zf-benJu;
    for(let g=1;g<=9;g++){
      tian[g]=dipan[((g-off-1+9)%9)+1];
    }
  }else{
    for(let g=1;g<=9;g++) tian[g]=dipan[g];
  }

  // 八门
  const men={};
  const menBase=["休","生","伤","杜","景","死","惊","开"];
  let ms=benJu;
  if(!isYang) ms=((benJu-2+9)%9)+1;
  for(let i=0;i<8;i++){
    const g=((ms-1+i)%9)+1;
    if(g===5)continue;
    men[g]=menBase[i%8];
  }
  men[5]="禽";

  // 九星
  const star={};
  const starBase=["蓬","芮","冲","辅","禽","心","柱","任","英"];
  for(let i=0;i<9;i++){
    star[((benJu-1+i)%9)+1]=starBase[i];
  }

  // 旬空宫
  const z2g={"子":1,"丑":8,"寅":8,"卯":3,"辰":4,"巳":4,"午":9,"未":2,"申":2,"酉":7,"戌":6,"亥":6};
  const kwGong=xk.kong.map(z=>z2g[z]).filter(Boolean);

  currentPan={riGan,riZhi,shiGan,benJu,jq,isYang,dipan,tian,men,star,kong:kwGong,xun:xk.xun};

  // 渲染
  const board=document.getElementById("qimenBoard");
  board.innerHTML="";
  luoShu.forEach(g=>{
    const kw=kwGong.includes(g);
    let cls="gong"+(kw?" gong-xiong":(["休","生","开"].includes(men[g])?" gong-ji":""));
    board.innerHTML+=`<div class="${cls}">
      <div class="gong-title">${gongName[g]}</div>
      <div>星：${star[g]}</div>
      <div>门：${men[g]}</div>
      <div>天：${tian[g]} 地：${dipan[g]}</div>
      ${kw?'<div style="color:#f87171">旬空</div>':''}
    </div>`;
  });

  log(`排盘：${jq} ${isYang?'阳':'阴'}${benJu}局 日${riGan}${riZhi} 时${shiGan} 旬${xk.xun} 空${xk.kong}`);
  return currentPan;
}

/* ========== 统计工具 ========== */
function ac(arr){
  const s=new Set();
  for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)s.add(Math.abs(arr[i]-arr[j]));
  return s.size-(arr.length-1);
}
function span(arr){return Math.max(...arr)-Math.min(...arr);}
function he(arr){return arr.reduce((a,b)=>a+b,0);}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;}

function passFilter(arr,cfg){
  if(he(arr)<cfg.heMin||he(arr)>cfg.heMax)return false;
  if(ac(arr)<cfg.acMin||ac(arr)>cfg.acMax)return false;
  if(span(arr)<cfg.kuaMin||span(arr)>cfg.kuaMax)return false;
  if(cfg.jiou){
    const j=arr.filter(x=>x%2).length;
    if(j<2||j>4)return false;
  }
  if(cfg.daxiao){
    const d=arr.filter(x=>x>17).length;
    if(d<2||d>4)return false;
  }
  if(cfg.zhihe){
    const z=arr.filter(isPrime).length;
    if(z<1||z>4)return false;
  }
  return true;
}

/* ========== 奇门取数评分 ========== */
function scoreNum(n,pan){
  let sc=0;
  for(let g=1;g<=9;g++){
    const [a,b]=gongRange[g];
    if(n>=a&&n<=b){
      if(["生","开","休"].includes(pan.men[g]))sc+=4;
      if(["蓬","芮","英"].includes(pan.star[g]))sc+=2;
      // 天盘干生日干
      const tw=wuXingGan[pan.tian[g]];
      const rw=wuXingGan[pan.riGan];
      const sheng={"木":"火","火":"土","土":"金","金":"水","水":"木"};
      if(sheng[rw]===tw)sc+=3;
      if(sheng[tw]===rw)sc+=2;
      break;
    }
  }
  return sc;
}

/* ========== 高斯权重 ========== */
function gaussWeight(pos,center,sigma){
  return Math.exp(-((pos-center)**2)/(2*sigma*sigma));
}

/* ========== 历史库 ========== */
let historyData=[];
function parseHistory(){
  historyData=[];
  const t=document.getElementById("historyText").value.trim();
  t.split("\n").forEach(line=>{
    const p=line.trim().split(/[+\+]/);
    const red=p[0].split(/[,\s]+/).map(Number).filter(x=>x>=1&&x<=33);
    const blue=p[1]?Number(p[1]):null;
    if(red.length>=5)historyData.push({red,blue});
  });
  log("历史解析："+historyData.length+" 期");
}
/* ========== 九宫轮转 ========== */
function lunZhuan(pan,step,merge){
  const pools=[];
  for(let s=0;s<step;s++){
    const off=s;
    const pool=new Set();
    for(let g=1;g<=9;g++){
      const ng=((g-1+off)%9)+1;
      if(!pan.kong.includes(ng)){
        const [a,b]=gongRange[ng];
        for(let n=a;n<=b;n++)pool.add(n);
      }
    }
    pools.push([...pool]);
  }
  if(merge){
    return [...new Set(pools.flat())];
  }
  return pools;
}

/* ========== 容错矩阵 ========== */
function combine(arr,k){
  const res=[];
  (function f(start,path){
    if(path.length===k){res.push([...path]);return;}
    for(let i=start;i<arr.length;i++){path.push(arr[i]);f(i+1,path);path.pop();}
  })(0,[]);
  return res;
}
function buildMatrix(base,type,limit){
  let k=6;
  if(type==="6bao5")k=6;
  if(type==="7bao6")k=7;
  if(type==="8bao6")k=8;
  if(type==="9bao7")k=9;
  return combine(base,k).slice(0,limit);
}

/* ========== 主推演 ========== */
function start(){
  log("===== 奇门统计+跨度法 推演开始 =====");
  parseHistory();
  const pan=paiPan();
  if(!pan)return;

  const lot=document.getElementById("lotType").value;
  const qMax=lot==="ssq"?33:35;
  const hMax=lot==="ssq"?16:12;
  const qNeed=lot==="ssq"?6:5;
  const hNeed=lot==="ssq"?1:2;

  // 基础池：吉门宫
  let basePool=new Set();
  for(let g=1;g<=9;g++){
    if(pan.kong.includes(g))continue;
    if(["生","开","休"].includes(pan.men[g])){
      const [a,b]=gongRange[g];
      for(let n=a;n<=b;n++)basePool.add(n);
    }
  }
  let pool=[...basePool];

  // 轮转
  if(document.getElementById("chkLunZhuan").checked){
    const step=Number(document.getElementById("lunStep").value);
    const mode=document.getElementById("lunMode").value;
    const r=lunZhuan(pan,step,mode==="merge");
    pool = mode==="merge" ? r : [...new Set(r.flat())];
    log("轮转后池："+pool.join(","));
  }

  // 权重
  const useW=document.getElementById("useWeight").checked;
  const sigma=Number(document.getElementById("sigma").value);
  const center=pool.length/2;
  const scored=pool.map((n,i)=>({
    n,
    score: scoreNum(n,pan) + (useW?gaussWeight(i,center,sigma)*3:0)
  }));

  const cfg={
    heMin:+heMin.value,heMax:+heMax.value,
    acMin:+acMin.value,acMax:+acMax.value,
    kuaMin:+kuaMin.value,kuaMax:+kuaMax.value,
    jiou:chkJiOu.checked,daxiao:chkDaXiao.checked,zhihe:chkZhiHe.checked
  };

  const gen=Number(genCount.value);
  const out=[];

  for(let iter=0;iter<gen*50 && out.length<gen;iter++){
    const pick=weightedPick(scored,qNeed);
    pick.sort((a,b)=>a-b);
    if(!passFilter(pick,cfg))continue;

    let blues=[];
    const bpool=[...Array(hMax)].map((_,i)=>i+1);
    for(let b=0;b<hNeed;b++){
      const bp=bpool.splice(Math.floor(Math.random()*bpool.length),1)[0];
      blues.push(bp);
    }

    // 历史命中
    let hit=0;
    historyData.forEach(h=>{
      const same=pick.filter(x=>h.red.includes(x)).length;
      if(same>=4)hit++;
    });

    out.push({red:pick,blue:blues,hit});
  }

  // 矩阵
  let matrixNote="";
  if(document.getElementById("chkMatrix").checked){
    const mt=document.getElementById("matrixType").value;
    const lim=Number(document.getElementById("matrixLimit").value);
    const baseSel=[...new Set(out.flatMap(o=>o.red))].slice(0,12);
    const m=buildMatrix(baseSel,mt,lim);
    matrixNote=`容错矩阵(${mt})：${m.length} 注`;
    log(matrixNote);
  }

  // 输出
  let html="<table><tr><th>序号</th><th>红球</th><th>蓝球</th><th>和值</th><th>跨度</th><th>AC</th><th>历史≥4命中</th></tr>";
  out.forEach((o,i)=>{
    html+=`<tr>
      <td>${i+1}</td>
      <td class="red">${o.red.map(x=>('0'+x).slice(-2)).join(' ')}</td>
      <td class="blue-text">${o.blue.map(x=>('0'+x).slice(-2)).join(' ')}</td>
      <td>${he(o.red)}</td>
      <td>${span(o.red)}</td>
      <td>${ac(o.red)}</td>
      <td>${o.hit}</td>
    </tr>`;
  });
  html+="</table><p class='info'>仅用于奇门统计模型研究/娱乐，开奖独立随机，不构成购彩建议。</p>";
  document.getElementById("resultBox").innerHTML=html;
  log("生成 "+out.length+" 组");
}

/* 加权抽样 */
function weightedPick(scored,k){
  const arr=scored.slice();
  const total=arr.reduce((s,x)=>s+x.score+1,0);
  const res=new Set();
  let guard=0;
  while(res.size<k && guard++<500){
    let r=Math.random()*total;
    for(const x of arr){
      r-=(x.score+1);
      if(r<=0){res.add(x.n);break;}
    }
  }
  return [...res].slice(0,k);
}

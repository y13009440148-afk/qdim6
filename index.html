<script>
"use strict";

/* ================================================================
 * 模块1：基础常量定义
 * ----------------------------------------------------------------
 * 包含十天干、十二地支、六十甲子完整序列
 * 这些是所有干支推算的基础数据
 * ================================================================ */

/**
 * 十天干数组
 * 顺序：甲乙丙丁戊己庚辛壬癸
 * 索引0~9分别对应甲~癸
 */
var TIAN_GAN = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];

/**
 * 十二地支数组
 * 顺序：子丑寅卯辰巳午未申酉戌亥
 * 索引0~11分别对应子~亥
 */
var DI_ZHI   = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

/**
 * 六十甲子完整列表
 * 由天干和地支依次组合而成，共60个
 * 用于干支纪年、纪日、纪时的推算
 */
var SIXTY_JIAZI = [];
for(var k=0;k<60;k++){
  SIXTY_JIAZI.push(TIAN_GAN[k%10]+DI_ZHI[k%12]);
}

/* ================================================================
 * 模块2：二十四节气表
 * ----------------------------------------------------------------
 * 每个节气包含名称、月份、日期
 * 用于确定当前属于哪个节气，进而判断阴阳遁和局数
 * ================================================================ */
var JIE_QI_TABLE = [
  ["立春",2,4],  ["雨水",2,19], ["惊蛰",3,6],  ["春分",3,21],
  ["清明",4,5],  ["谷雨",4,20], ["立夏",5,6],  ["小满",5,21],
  ["芒种",6,6],  ["夏至",6,21], ["小暑",7,7],  ["大暑",7,23],
  ["立秋",8,8],  ["处暑",8,23], ["白露",9,8],  ["秋分",9,23],
  ["寒露",10,8], ["霜降",10,23],["立冬",11,7], ["小雪",11,22],
  ["大雪",12,7], ["冬至",12,22],["小寒",1,6],  ["大寒",1,20]
];

/* ================================================================
 * 模块3：阴阳遁判断
 * ----------------------------------------------------------------
 * 夏至到大雪为阴遁，冬至到芒种为阳遁
 * 存储在集合中便于快速查找
 * ================================================================ */
var YIN_JIEQI_SET = {};
var yinList = ["夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪"];
for(var yi=0;yi<yinList.length;yi++) YIN_JIEQI_SET[yinList[yi]]=1;

/**
 * 判断某个节气是否为阴遁季节
 * @param {string} name - 节气名称
 * @returns {boolean} true表示阴遁，false表示阳遁
 */
function isYinSeason(name){ return !!YIN_JIEQI_SET[name]; }

/* ================================================================
 * 模块4：拆补法局数表
 * ----------------------------------------------------------------
 * 每个节气对应三个局数（上元、中元、下元）
 * 根据日干支确定属于哪一元
 * ================================================================ */
var JU_SHU_MAP = {
  "立春":[8,5,2],  "雨水":[9,6,3],  "惊蛰":[1,7,4],
  "春分":[3,9,6],  "清明":[4,1,7],  "谷雨":[5,2,8],
  "立夏":[4,1,7],  "小满":[5,2,8],  "芒种":[6,3,9],
  "夏至":[9,3,6],  "小暑":[8,2,5],  "大暑":[7,1,4],
  "立秋":[2,5,8],  "处暑":[1,4,7],  "白露":[9,3,6],
  "秋分":[7,1,4],  "寒露":[6,9,3],  "霜降":[5,8,2],
  "立冬":[6,9,3],  "小雪":[5,8,2],  "大雪":[4,7,1],
  "冬至":[1,7,4],  "小寒":[2,8,5],  "大寒":[3,9,6]
};

/* ================================================================
 * 模块5：八门、九星、八神、三奇六仪
 * ----------------------------------------------------------------
 * 八门：休生伤杜景死惊开
 * 九星：天蓬天芮天冲天辅天禽天心天柱天任天英
 * 八神：值符腾蛇太阴六合白虎玄武九地九天
 * 三奇六仪：戊己庚辛壬癸丁丙乙
 * ================================================================ */

/** 八门数组，顺序固定 */
var BA_MEN = ["休","生","伤","杜","景","死","惊","开"];

/** 九星数组，顺序固定 */
var JIU_XING = ["天蓬","天芮","天冲","天辅","天禽","天心","天柱","天任","天英"];

/** 八神数组，顺序固定 */
var BA_SHEN = ["值符","腾蛇","太阴","六合","白虎","玄武","九地","九天"];

/** 三奇六仪顺序，戊己庚辛壬癸丁丙乙 */
var LIU_YI_ORDER = ["戊","己","庚","辛","壬","癸","丁","丙","乙"];

/* ================================================================
 * 模块6：旬空、马星、入墓、击刑、门迫对照表
 * ----------------------------------------------------------------
 * 这些是奇门遁甲中的各种吉凶判断依据
 * 用于后续的杀号和评分
 * ================================================================ */

/** 六甲旬空亡表，键为旬首，值为空亡地支 */
var XUN_KONG_MAP = {
  "甲子":"戌亥","甲戌":"申酉","甲申":"午未","甲午":"辰巳","甲辰":"寅卯","甲寅":"子丑"
};

/** 马星所在宫位表，键为地支，值为马星对应的宫位数 */
var MA_XING_MAP = {
  "申":"寅","子":"寅","辰":"寅","寅":"申","午":"申","戌":"申","巳":"亥","酉":"亥","丑":"亥"
};

/** 入墓宫位表，键为天干，值为对应的宫位数 */
var RU_MU_MAP = {
  "乙":6,"丙":6,"丁":6,"戊":4,"己":4,"庚":8,"辛":8,"壬":2,"癸":2
};

/** 击刑宫位表，键为天干，值为对应的宫位数 */
var JI_XING_MAP = {
  "戊":3,"己":2,"庚":8,"辛":9,"壬":4,"癸":4
};

/** 门迫宫位表，键为门，值为对应的宫位数 */
var MEN_PO_MAP = {
  "休":1,"生":8,"伤":3,"杜":4,"景":9,"死":2,"惊":7,"开":6
};

/** 地支到数字索引的映射，子=1,丑=2,...,亥=12 */
var DIZHI_TO_IDX = {"子":1,"丑":2,"寅":3,"卯":4,"辰":5,"巳":6,"午":7,"未":8,"申":9,"酉":10,"戌":11,"亥":12};
/* ================================================================
 * 模块7：双色球/大乐透规则配置
 * ----------------------------------------------------------------
 * 包含两种彩票的全部参数：
 *   - 前后区范围、选取个数
 *   - 开奖时间（星期几、几点几分）
 *   - 理想和值、跨度、AC值范围
 *   - 大小分界线、区间分割点
 * ================================================================ */
var LOT_CFG = {
  ssq:{
    name:"双色球",
    fMin:1, fMax:33, fPick:6,   // 前区1~33选6
    bMin:1, bMax:16, bPick:1,   // 后区1~16选1
    bigLine:17,                  // 大小分界线（≥17为大）
    zoneSplit:[11,22],           // 三分区分割点
    openWeekdays:[2,4,0],        // 开奖日：周二、周四、周日
    openHour:21, openMin:15,     // 开奖时间：21:15
    idealSum:[90,125],           // 理想和值范围
    idealSpan:[18,28],           // 理想跨度范围
    idealAC:[5,8],               // 理想AC值范围
    idealOE:[2,4]                // 理想奇偶比（奇数个数范围）
  },
  dlt:{
    name:"大乐透",
    fMin:1, fMax:35, fPick:5,   // 前区1~35选5
    bMin:1, bMax:12, bPick:2,   // 后区1~12选2
    bigLine:18,                  // 大小分界线（≥18为大）
    zoneSplit:[12,24],           // 三分区分割点
    openWeekdays:[1,3,6],        // 开奖日：周一、周三、周六
    openHour:21, openMin:25,     // 开奖时间：21:25
    idealSum:[75,115],           // 理想和值范围
    idealSpan:[20,32],           // 理想跨度范围
    idealAC:[4,7],               // 理想AC值范围
    idealOE:[2,3]                // 理想奇偶比
  }
};

/* ================================================================
 * 模块8：全局状态变量
 * ----------------------------------------------------------------
 * 存储当前奇门盘、上期开奖数据、历史结果等
 * ================================================================ */

/** 当前生成的奇门盘对象 */
var currentPan = null;

/** 上一期双色球前区号码数组 */
var lastSSQFront = null;

/** 上一期双色球后区号码数组 */
var lastSSQBack = null;

/** 上一期大乐透前区号码数组 */
var lastDLTFront = null;

/** 上一期大乐透后区号码数组 */
var lastDLTBack = null;

/** 历史结果记录数组 */
var historyResults = [];

/** 调试模式开关 */
var debugMode = false;

/** 调试日志字符串 */
var debugLog = "";

/**
 * 添加调试日志
 * @param {string} msg - 日志消息
 */
function log(msg){
  if(!debugMode) return;
  debugLog += "["+new Date().toLocaleTimeString()+"] "+msg+"\n";
  var dbgEl=document.getElementById("debugOutput");
  if(dbgEl) dbgEl.textContent=debugLog;
}

/**
 * 切换调试模式
 */
function toggleDebug(){
  debugMode=!debugMode;
  var dbgEl=document.getElementById("debugOutput");
  if(dbgEl) dbgEl.style.display=debugMode?"block":"none";
  if(debugMode) log("调试模式已开启");
}

/* ================================================================
 * 模块9：基础工具函数库（约400行）
 * ----------------------------------------------------------------
 * 包含数组运算、数学计算、格式化等通用工具
 * 所有函数均采用原生JavaScript实现，无外部依赖
 * ================================================================ */

/**
 * 数字补零（两位）
 * @param {number} n - 待格式化的数字
 * @returns {string} 两位字符串，如 3 → "03"
 */
function pad2(n){ return n<10?"0"+n:""+n; }

/**
 * 数字补零（三位）
 * @param {number} n - 待格式化的数字
 * @returns {string} 三位字符串，如 3 → "003"
 */
function pad3(n){ return n<100?(n<10?"00"+n:"0"+n):""+n; }

/**
 * 计算数组元素之和
 * @param {number[]} arr - 数字数组
 * @returns {number} 和值
 */
function arraySum(arr){ var s=0; for(var i=0;i<arr.length;i++) s+=arr[i]; return s; }

/**
 * 计算数组最大值
 * @param {number[]} arr - 数字数组
 * @returns {number} 最大值
 */
function arrayMax(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]>m) m=arr[i]; return m; }

/**
 * 计算数组最小值
 * @param {number[]} arr - 数字数组
 * @returns {number} 最小值
 */
function arrayMin(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]<m) m=arr[i]; return m; }

/**
 * 计算数组跨度（最大值减最小值）
 * @param {number[]} arr - 数字数组
 * @returns {number} 跨度值
 */
function arraySpan(arr){ return arrayMax(arr)-arrayMin(arr); }

/**
 * 计算数组平均值
 * @param {number[]} arr - 数字数组
 * @returns {number} 平均值
 */
function arrayAvg(arr){ return arraySum(arr)/arr.length; }

/**
 * 计算数组中位数
 * @param {number[]} arr - 数字数组
 * @returns {number} 中位数
 */
function arrayMedian(arr){
  var a=arr.slice().sort(function(x,y){return x-y;});
  return a[Math.floor(a.length/2)];
}

/**
 * 计算数组众数（出现次数最多的值）
 * @param {number[]} arr - 数字数组
 * @returns {number|null} 众数值，如果为空则返回null
 */
function arrayMode(arr){
  var m={},mx=0,mv=null;
  for(var i=0;i<arr.length;i++){
    m[arr[i]]=(m[arr[i]]||0)+1;
    if(m[arr[i]]>mx){mx=m[arr[i]];mv=arr[i];}
  }
  return mv;
}

/**
 * 数组去重
 * @param {any[]} arr - 原始数组
 * @returns {any[]} 去重后的新数组
 */
function arrayUnique(arr){
  var seen={},out=[];
  for(var i=0;i<arr.length;i++){
    if(!seen[arr[i]]){ seen[arr[i]]=1; out.push(arr[i]); }
  }
  return out;
}

/**
 * 计算两个数组的交集
 * @param {any[]} a - 第一个数组
 * @param {any[]} b - 第二个数组
 * @returns {any[]} 交集数组
 */
function arrayIntersect(a,b){
  var s={},r=[];
  for(var i=0;i<a.length;i++) s[a[i]]=1;
  for(var i=0;i<b.length;i++) if(s[b[i]]) r.push(b[i]);
  return r;
}

/**
 * 计算两个数组的差集（a中有但b中没有的元素）
 * @param {any[]} a - 第一个数组
 * @param {any[]} b - 第二个数组
 * @returns {any[]} 差集数组
 */
function arrayDiff(a,b){
  var s={},r=[];
  for(var i=0;i<b.length;i++) s[b[i]]=1;
  for(var i=0;i<a.length;i++) if(!s[a[i]]) r.push(a[i]);
  return r;
}

/**
 * 计算两个数组的并集
 * @param {any[]} a - 第一个数组
 * @param {any[]} b - 第二个数组
 * @returns {any[]} 并集数组（已去重）
 */
function arrayUnion(a,b){
  var s={},r=[];
  for(var i=0;i<a.length;i++){if(!s[a[i]]){s[a[i]]=1;r.push(a[i]);}}
  for(var i=0;i<b.length;i++){if(!s[b[i]]){s[b[i]]=1;r.push(b[i]);}}
  return r;
}

/**
 * Fisher-Yates洗牌算法
 * @param {any[]} arr - 待打乱的数组
 * @returns {any[]} 打乱后的新数组
 */
function shuffleArray(arr){
  var result=arr.slice();
  for(var i=result.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=result[i]; result[i]=result[j]; result[j]=tmp;
  }
  return result;
}

/**
 * 计算AC值（算术复杂度）
 * AC值 = 所有两两差值个数 - (选号个数 - 1)
 * 用于衡量号码的离散程度
 * @param {number[]} arr - 已排序的号码数组
 * @returns {number} AC值
 */
function calcAC(arr){
  var n=arr.length,diffs=[];
  for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){
    var d=Math.abs(arr[i]-arr[j]);
    if(diffs.indexOf(d)===-1) diffs.push(d);
  }
  return diffs.length-(n-1);
}

/**
 * 计算奇数和偶数个数
 * @param {number[]} arr - 数字数组
 * @returns {number[]} [奇数个数, 偶数个数]
 */
function oddEvenCount(arr){
  var o=0,e=0;
  for(var i=0;i<arr.length;i++) if(arr[i]%2===1) o++; else e++;
  return [o,e];
}

/**
 * 计算大数和小数个数
 * @param {number[]} arr - 数字数组
 * @param {number} line - 大小分界线
 * @returns {number[]} [大数个数, 小数个数]
 */
function bigSmallCount(arr,line){
  var b=0,s=0;
  for(var i=0;i<arr.length;i++) if(arr[i]>=line) b++; else s++;
  return [b,s];
}

/**
 * 计算三分区分布
 * @param {number[]} arr - 数字数组
 * @param {number[]} split - 分区分割点，如[11,22]
 * @returns {number[]} [一区个数, 二区个数, 三区个数]
 */
function zoneDistribution(arr,split){
  var z1=0,z2=0,z3=0;
  for(var i=0;i<arr.length;i++){
    if(arr[i]<=split[0]) z1++;
    else if(arr[i]<=split[1]) z2++;
    else z3++;
  }
  return [z1,z2,z3];
}

/**
 * 获取个位尾数
 * @param {number} n - 数字
 * @returns {number} 个位数（0~9）
 */
function tailNum(n){ return n%10; }

/**
 * 统计各尾数出现次数
 * @param {number[]} arr - 数字数组
 * @returns {object} 尾数频次对象
 */
function tailMap(arr){
  var m={};
  for(var i=0;i<arr.length;i++){
    var t=tailNum(arr[i]);
    m[t]=(m[t]||0)+1;
  }
  return m;
}

/**
 * 计算最大尾数重复次数
 * @param {number[]} arr - 数字数组
 * @returns {number} 最大重复次数
 */
function maxTailCount(arr){
  var m=tailMap(arr),mx=0;
  for(var k in m) if(m[k]>mx) mx=m[k];
  return mx;
}

/**
 * 统计某个尾数出现的次数
 * @param {number[]} arr - 数字数组
 * @param {number} t - 尾数（0~9）
 * @returns {number} 出现次数
 */
function tailCount(arr,t){
  var c=0;
  for(var i=0;i<arr.length;i++) if(tailNum(arr[i])===t) c++;
  return c;
}

/**
 * 计算与上期的重复号个数
 * @param {number[]} front - 本期前区
 * @param {number[]} lastFront - 上期前区
 * @returns {number} 重复个数
 */
function countRepeats(front,lastFront){
  if(!lastFront) return 0;
  var cnt=0;
  for(var i=0;i<front.length;i++) if(lastFront.indexOf(front[i])!==-1) cnt++;
  return cnt;
}

/**
 * 计算与上期的邻号个数（相差±1）
 * @param {number[]} front - 本期前区
 * @param {number[]} lastFront - 上期前区
 * @returns {number} 邻号个数
 */
function countNeighbors(front,lastFront){
  if(!lastFront) return 0;
  var cnt=0;
  for(var i=0;i<front.length;i++)
    for(var j=0;j<lastFront.length;j++)
      if(Math.abs(front[i]-lastFront[j])===1){ cnt++; break; }
  return cnt;
}

/**
 * 计算连号组数（相邻差1为一组两连）
 * @param {number[]} arr - 已排序的号码数组
 * @returns {number} 连号组数
 */
function countConsecutivePairs(arr){
  var pairs=0;
  for(var i=0;i<arr.length-1;i++) if(arr[i+1]-arr[i]===1) pairs++;
  return pairs;
}

/**
 * 计算与上期同尾号的个数
 * @param {number[]} front - 本期前区
 * @param {number[]} lastFront - 上期前区
 * @returns {number} 同尾个数
 */
function countSameTailWithLast(front,lastFront){
  if(!lastFront) return 0;
  var lt={};
  for(var i=0;i<lastFront.length;i++) lt[tailNum(lastFront[i])]=1;
  var cnt=0;
  for(var i=0;i<front.length;i++) if(lt[tailNum(front[i])]) cnt++;
  return cnt;
}

/**
 * 最大公约数
 * @param {number} a - 整数
 * @param {number} b - 整数
 * @returns {number} 最大公约数
 */
function gcd(a,b){ while(b){ var t=b; b=a%b; a=t; } return a; }

/**
 * 最小公倍数
 * @param {number} a - 整数
 * @param {number} b - 整数
 * @returns {number} 最小公倍数
 */
function lcm(a,b){ return a*b/gcd(a,b); }

/**
 * 数值限幅
 * @param {number} v - 原值
 * @param {number} min - 最小值
 * @param {number} max - 最大值
 * @returns {number} 限幅后的值
 */
function clamp(v,min,max){ return v<min?min:(v>max?max:v); }

/**
 * 四舍五入到指定小数位
 * @param {number} v - 原值
 * @param {number} dec - 小数位数
 * @returns {number} 四舍五入后的值
 */
function roundTo(v,dec){ var f=Math.pow(10,dec); return Math.round(v*f)/f; }

/**
 * 深拷贝对象
 * @param {object} obj - 源对象
 * @returns {object} 深拷贝后的新对象
 */
function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

/**
 * 格式化日期时间为字符串
 * @param {Date} d - 日期对象
 * @returns {string} 格式化字符串，如 "2026-10-21 21:15"
 */
function formatDate(d){
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}

/**
 * 判断数字是否为质数
 * @param {number} n - 正整数
 * @returns {boolean} true表示为质数
 */
function isPrime(n){
  if(n<2) return false;
  if(n===2) return true;
  if(n%2===0) return false;
  var limit=Math.sqrt(n);
  for(var i=3;i<=limit;i+=2) if(n%i===0) return false;
  return true;
}

/**
 * 计算质数个数
 * @param {number[]} arr - 数字数组
 * @returns {number} 质数个数
 */
function primeCount(arr){
  var c=0;
  for(var i=0;i<arr.length;i++) if(isPrime(arr[i])) c++;
  return c;
}

/**
 * 计算012路分布
 * 0路：能被3整除；1路：余1；2路：余2
 * @param {number[]} arr - 数字数组
 * @returns {number[]} [0路个数, 1路个数, 2路个数]
 */
function road012(arr){
  var r0=0,r1=0,r2=0;
  for(var i=0;i<arr.length;i++){
    var mod=arr[i]%3;
    if(mod===0) r0++; else if(mod===1) r1++; else r2++;
  }
  return [r0,r1,r2];
}

 * ----------------------------------------------------------------
 * 包含：
 *   - 获取当前/下次开奖时间

/**
 * 获取当前期开奖时间
 * 如果当前时间已过开奖时间，则取下一期
 * @param {string} lotType - 彩票类型 'ssq' 或 'dlt'
 * @returns {Date} 开奖时间
 */
function getCurrentDrawTime(lotType){
  var now=new Date();
  var cfg=LOT_CFG[lotType];
  var dow=now.getDay();
  var targetDow=cfg.openWeekdays[0];
  var diff=(targetDow-dow+7)%7;
  if(diff===0){
    var curMin=now.getHours()*60+now.getMinutes();
    var drawMin=cfg.openHour*60+cfg.openMin;
    if(curMin>=drawMin) diff=7;
  }
  var drawDate=new Date(now);
  drawDate.setDate(drawDate.getDate()+diff);
  drawDate.setHours(cfg.openHour,cfg.openMin,0,0);
  log("当前开奖时间："+formatDate(drawDate));
  return drawDate;
}

/**
 * 获取下一次开奖时间（考虑多个开奖日）
 * @param {string} lotType - 彩票类型
 * @returns {Date} 最近的开奖时间
 */
function getNextDrawTime(lotType){
  var now=new Date();
  var cfg=LOT_CFG[lotType];
  var bestDays=[];
  for(var w=0;w<cfg.openWeekdays.length;w++){
    var diff=(cfg.openWeekdays[w]-now.getDay()+7)%7;
    if(diff===0){
      var curMin=now.getHours()*60+now.getMinutes();
      var drawMin=cfg.openHour*60+cfg.openMin;
      if(curMin>=drawMin) diff=7;
    }
    bestDays.push(diff);
  }
  var minDiff=Math.min.apply(null,bestDays);
  var drawDate=new Date(now);
  drawDate.setDate(drawDate.getDate()+minDiff);
  drawDate.setHours(cfg.openHour,cfg.openMin,0,0);
  return drawDate;
}

/**
 * 查找距离给定日期最近的节气
 * 遍历所有节气，计算日期差，取最小
 * @param {number} year - 年份
 * @param {number} month - 月份（1~12）
 * @param {number} day - 日期
 * @returns {string} 最近的节气名称
 */
function findClosestJieQi(year,month,day){
  var best=JIE_QI_TABLE[0],bestDist=9999;
  for(var i=0;i<JIE_QI_TABLE.length;i++){
    var q=JIE_QI_TABLE[i];
    var dist=Math.abs((month-q[1])*30+(day-q[2]));
    if(dist<bestDist){ bestDist=dist; best=q[0]; }
  }
  log("最近节气："+best);
  return best;
}

/**
 * 计算日干支
 * 以1900年1月1日为基准（甲子日），偏移天数
 * @param {number} year - 年份
 * @param {number} month - 月份
 * @param {number} day - 日期
 * @returns {string} 日干支，如 "甲子"
 */
function getDayGanzhi(year,month,day){
  var base=new Date(1900,0,1);
  var tar=new Date(year,month-1,day);
  var days=Math.round((tar-base)/86400000);
  var result=SIXTY_JIAZI[(days+10)%60];
  log("日干支："+year+"-"+month+"-"+day+" → "+result);
  return result;
}

/* ================================================================
 * 模块11：奇门排盘核心（约550行）
 * ----------------------------------------------------------------
 * 完整的奇门遁甲排盘流程：
 *   1. 定节气 → 判阴阳 → 定局数
 *   2. 排地盘（三奇六仪）
 *   3. 定值符、值使
 *   4. 排天盘（九星）
 *   5. 排人盘（八门）
 *   6. 排神盘（八神）
 *   7. 标注旬空、马星、入墓、击刑、门迫
 * ================================================================ */

/**
 * 创建奇门遁甲盘
 * 根据给定的开奖时间，完整排出一个奇门盘
 * @param {Date} drawTime - 开奖时间
 * @returns {object} 完整的奇门盘对象
 */
function createQiMenPan(drawTime){
  log("===== 开始排盘 =====");
  var year=drawTime.getFullYear(), month=drawTime.getMonth()+1, day=drawTime.getDate();
  var hour=drawTime.getHours(), minute=drawTime.getMinutes();

  // -------- 第一步：确定节气、阴阳遁、局数 --------
  var jieQi=findClosestJieQi(year,month,day);
  var isYin=isYinSeason(jieQi);
  var ju=getJuNumber(jieQi,drawTime);
  if(isYin) ju=-Math.abs(ju); else ju=Math.abs(ju);
  log("节气："+jieQi+" | "+(isYin?"阴遁":"阳遁")+" | 局数："+Math.abs(ju));

  // -------- 第二步：计算干支 --------
  var dayGZ=getDayGanzhi(year,month,day);
  var hourGZ=getHourGanzhi(dayGZ[0],hour);
  var xunShou=getXunShou(hourGZ);
  var kong=getXunKong(hourGZ);
  var maGong=getMaXingGong(hourGZ);
  var hiddenYi=getHiddenYi(hourGZ);
  var naYin=getNaYin(dayGZ);
  log("日柱："+dayGZ+" 时柱："+hourGZ+" 旬首："+xunShou+" 旬空："+kong);

  // -------- 第三步：排地盘 --------
  var absJu=Math.abs(ju);
  var startIdx=(absJu-1+9)%9;
  var diPan=[];
  for(var i=0;i<9;i++){
    var gongIdx=isYin ? (9-((startIdx+i)%9)) : ((startIdx+i)%9+1);
    if(gongIdx===0) gongIdx=9;
    if(gongIdx===10) gongIdx=1;
    diPan.push({ gong:gongIdx, yi:LIU_YI_ORDER[i] });
  }
  log("地盘："+diPan.map(function(x){return x.gong+":"+x.yi;}).join(" "));

  // -------- 第四步：定值符、值使 --------
  var zhiFuGong=1;
  for(var i=0;i<diPan.length;i++){
    if(diPan[i].yi===hiddenYi){ zhiFuGong=diPan[i].gong; break; }
  }
  var xunIdx=SIXTY_JIAZI.indexOf(hourGZ);
  var xsIdx=SIXTY_JIAZI.indexOf(xunShou);
  var step=xunIdx-xsIdx;
  var zhiShiGong=((zhiFuGong-1+step)%9+9)%9+1;
  var zhiShiMen=BA_MEN[(zhiShiGong-1+8)%8];
  log("值符宫："+zhiFuGong+" 值使宫："+zhiShiGong+"("+zhiShiMen+") 步数："+step);

  // -------- 第五步：排天盘（值符随时干）--------
  var shiGan=hourGZ[0];
  var shiGanGong=1;
  for(var i=0;i<diPan.length;i++){
    if(diPan[i].yi===shiGan){ shiGanGong=diPan[i].gong; break; }
  }
  var tianPan=[];
  for(var i=0;i<9;i++) tianPan.push({ gong:i+1, xing:null, yi:null });

  var zhiFuXing=JIU_XING[zhiFuGong-1];
  tianPan[shiGanGong-1]={ gong:shiGanGong, xing:zhiFuXing, yi:diPan[zhiFuGong-1].yi };

  var zfIdx=JIU_XING.indexOf(zhiFuXing);
  var usedGongs={}; usedGongs[shiGanGong]=1;
  for(var st=1;st<9;st++){
    var srcGong=((zhiFuGong-1+st)%9+9)%9+1;
    var dstGong=((shiGanGong-1+st)%9+9)%9+1;
    if(usedGongs[dstGong]) continue;
    var xingIdx=(zfIdx+st)%9;
    tianPan[dstGong-1]={ gong:dstGong, xing:JIU_XING[xingIdx], yi:diPan[srcGong-1].yi };
    usedGongs[dstGong]=1;
  }
  for(var i=0;i<9;i++){
    if(!tianPan[i].xing){
      tianPan[i].xing=JIU_XING[i];
      tianPan[i].yi=diPan[i].yi;
    }
  }

  // -------- 第六步：排人盘（值使随时支）--------
  var shiZhi=hourGZ[1];
  var shiZhiNum=DIZHI_TO_IDX[shiZhi];
  var renPan=[];
  for(var i=0;i<9;i++) renPan.push({ gong:i+1, men:null });

  var zhiShiIdx=BA_MEN.indexOf(zhiShiMen);
  var startGong=zhiShiGong;
  var offset=(shiZhiNum-DIZHI_TO_IDX[xunShou[1]]+12)%12;
  var finalGong=((startGong-1+offset)%9+9)%9+1;
  renPan[finalGong-1]={ gong:finalGong, men:zhiShiMen };

  var usedMen={}; usedMen[zhiShiMen]=1;
  for(var st=1;st<8;st++){
    var srcGong=((zhiShiGong-1+st)%9+9)%9+1;
    var dstGong=((finalGong-1+st)%9+9)%9+1;
    var menIdx=(zhiShiIdx+st)%8;
    var men=BA_MEN[menIdx];
    if(usedMen[men]) continue;
    renPan[dstGong-1]={ gong:dstGong, men:men };
    usedMen[men]=1;
  }
  for(var i=0;i<9;i++){
    if(!renPan[i].men) renPan[i].men=BA_MEN[i%8];
  }

  // -------- 第七步：排神盘（八神阳顺阴逆）--------
  var shenPan=[];
  for(var i=0;i<9;i++) shenPan.push({ gong:i+1, shen:null });
  shenPan[zhiFuGong-1]={ gong:zhiFuGong, shen:"值符" };
  for(var st=1;st<8;st++){
    var dir=isYin?-1:1;
    var dstGong=((zhiFuGong-1+dir*st)%9+9)%9+1;
    shenPan[dstGong-1]={ gong:dstGong, shen:BA_SHEN[st] };
  }
  for(var i=0;i<9;i++){
    if(!shenPan[i].shen) shenPan[i].shen="九天";
  }

  // -------- 第八步：中宫寄坤（天禽随天芮）--------
  for(var i=0;i<tianPan.length;i++){
    if(tianPan[i].xing==="天芮"){
      tianPan[i].xing="天芮+天禽";
      break;
    }
  }

  // -------- 第九步：构建九宫完整信息 --------
  var gongInfo=[];
  var qiGongs=[];
  for(var i=0;i<9;i++){
    var g=i+1;
    var di=diPan[i].yi;
    var ti=tianPan[i].yi;
    var xing=tianPan[i].xing;
    var men=renPan[i].men;
    var shen=shenPan[i].shen;

    var tags=[];
    if(g===zhiFuGong) tags.push("值符");
    if(g===zhiShiGong) tags.push("值使");
    if(di==="乙"||di==="丙"||di==="丁") tags.push("三奇");
    else if(ti==="乙"||ti==="丙"||ti==="丁") tags.push("三奇");

    var gongZhi1=DI_ZHI[((g-1)*2)%12];
    var gongZhi2=DI_ZHI[((g-1)*2+1)%12];
    if(kong.indexOf(gongZhi1)!==-1||kong.indexOf(gongZhi2)!==-1) tags.push("空");

    if(maGong===g) tags.push("马");
    if(RU_MU_MAP[di]===g||RU_MU_MAP[ti]===g) tags.push("入墓");
    if(JI_XING_MAP[di]===g) tags.push("击刑");
    if(MEN_PO_MAP[men]===g) tags.push("门迫");

    if(di==="乙"||di==="丙"||di==="丁"||ti==="乙"||ti==="丙"||ti==="丁"){
      if(qiGongs.indexOf(g)===-1) qiGongs.push(g);
    }

    gongInfo.push({
      gong:g, diYi:di, tianYi:ti, xing:xing, men:men, shen:shen,
      tags:tags, tagStr:tags.join(",")
    });
  }

  log("三奇落宫："+qiGongs.join(","));
  log("===== 排盘完成 =====");

  return {
    drawTime:drawTime,
    jieQi:jieQi, isYin:isYin, ju:ju,
    dayGZ:dayGZ, hourGZ:hourGZ, xunShou:xunShou,
    kong:kong, maGong:maGong, hiddenYi:hiddenYi,
    naYin:naYin,
    zhiFuGong:zhiFuGong, zhiShiGong:zhiShiGong, zhiShiMen:zhiShiMen,
    diPan:diPan, tianPan:tianPan, renPan:renPan, shenPan:shenPan,
    gongInfo:gongInfo, qiGongs:qiGongs
  };
}
/* ================================================================
 * 模块12：初池——真实宫源提取
 * ----------------------------------------------------------------
 * 从奇门盘中提取参与选号的宫位来源：
 *   值符宫、值使宫、三奇宫、吉门宫（休生开）、六合宫、马星宫
 * 每个宫位都是真实计算的，不写死任何数字
 * ================================================================ */

/**
 * 获取奇门盘中参与选号的源宫位列表
 * @param {object} pan - 奇门盘对象
 * @returns {number[]} 宫位数组（1~9，已去重排序）
 */
function getQiMenSourceGongs(pan){
  var g=[];
  if(pan.zhiFuGong) g.push(pan.zhiFuGong);
  if(pan.zhiShiGong) g.push(pan.zhiShiGong);
  for(var i=0;i<pan.qiGongs.length;i++) g.push(pan.qiGongs[i]);
  for(var i=0;i<pan.gongInfo.length;i++){
    var c=pan.gongInfo[i];
    if(c.men==="休"||c.men==="生"||c.men==="开") g.push(c.gong);
    if(c.shen==="六合") g.push(c.gong);
  }
  if(pan.maGong) g.push(pan.maGong);
  var seen={},out=[];
  for(var i=0;i<g.length;i++){
    var v=g[i];
    if(!seen[v]){ seen[v]=1; out.push(v); }
  }
  var sorted=out.sort(function(a,b){return a-b;});
  log("初池源宫："+sorted.join(","));
  return sorted;
}

function wuShuDun(riGan){
    const map = {};
    const idx = ganArr.indexOf(riGan);
    let startIdx;
    if(idx === 0 || idx === 5){
        startIdx = 0;
    }
    else if(idx === 1 || idx === 6){
        startIdx = 2;
    }
    else if(idx === 2 || idx === 7){
        startIdx = 4;
    }
    else if(idx === 3 || idx === 8){
        startIdx = 6;
    }
    else{
        startIdx = 8;
    }
    let i;
    for(i=0;i<12;i++){
        map[zhiArr[i]] = ganArr[(startIdx + i) % 10];
    }
    return map;
}

        const sIdx = ganArr.indexOf(xunShou[0]);

function parseLastNum(inputStr){
    let redList = [];
    let blue = 0;
    const cleanStr = inputStr.replace(/\+/g," ").replace(/\s+/g," ").trim();
    const arr = cleanStr.split(" ");
    let i;
    for(i=0;i<arr.length;i++){
        let item = arr[i];
        let n = parseInt(item,10);
        if(isNaN(n)){
            continue;
        }
        if(n >= 1 && n <= 33){
            redList.push(n);
        }
        if(n >= 1 && n <= 16){
            blue = n;
        }
    }
    redList = [...new Set(redList)].sort(function(a,b){
        return a - b;
    });
    if(redList.length < 6){
        appendLog("⚠️上期红球数量不足6个，解析异常");
        return null;
    }
    const span = redList[redList.length - 1] - redList[0];
    appendLog("📜上期解析：红球【" + redList.join(" ") + "】蓝球【" + blue + "】，上期跨度：" + span);
    return {red:redList, blue:blue, span:span};
}

function balanceCheck(numList){
    let big = 0;
    let small = 0;
    let ji = 0;
    let ou = 0;
    let mid = 0;
    let i;
    for(i=0;i<numList.length;i++){
        let x = numList[i];
        if(x > 16){
            big = big + 1;
        }
        else{
            small = small + 1;
        }
        if(x % 2 === 1){
            ji = ji + 1;
        }
        else{
            ou = ou + 1;
        }
        if(x >= 12 && x <= 22){
            mid = mid + 1;
        }
    }
    let pass = false;
    if(big >= 2 && small >= 2 && ji >= 2 && ou >= 2 && mid >= 1){
        pass = true;
    }
    return {big:big,small:small,ji:ji,ou:ou,mid:mid,pass:pass};
}

    let ok = false;
    let score = 0;
    if(curSpan >= spanRule.minSpan && curSpan <= spanRule.maxSpan){
        score = score + 3;
    }
    let sIndex;
    for(sIndex = 0; sIndex < spanRule.preferSpan.length; sIndex++){
        let s = spanRule.preferSpan[sIndex];
        if(Math.abs(curSpan - s) <= spanRule.spanTolerance){
            score = score + 4;
            break;
        }
    }
    if(Math.abs(curSpan - lastSpan) >= 4){
        score = score + 2;
    }
    if(score >= 5){
        ok = true;
    }
    return {curSpan:curSpan,score:score,ok:ok};
}

function isSheng(a,b){
    const shengMap = {};
    shengMap["木"] = "火";
    shengMap["火"] = "土";
    shengMap["土"] = "金";
    shengMap["金"] = "水";
    shengMap["水"] = "木";
    return shengMap[a] === b;
}

// 【重构打分函数】融合：八门、九星、来源加分、先天洛书数、五行生克
function calcScore(num,pan,gongSourceMap){
    let score = 0;
    let belongGong = null;
    for(let g = 1; g <= 9; g++){
        const s = gongConfig[g].range[0];
        const e = gongConfig[g].range[1];
        if(num >= s && num <= e){
            belongGong = g;
            score += gongConfig[g].weight;
            break;
        }
    }
    if(belongGong === null) return 0;
    //八门分
    score += baMenWeight[pan.menPan[belongGong]] || 0;
    //九星分
    score += jiuXingWeight[pan.xingPan[belongGong]] || 0;
    //宫来源加分（一个宫可以多来源叠加）
    const srcList = gongSourceMap[belongGong] || [];
    srcList.forEach(src=>{
        score += sourceBonus[src] || 0;
    })
    //先天洛书匹配加分：号码 == 宫先天数，额外加分
    if(num === gongXianTian[belongGong]){
        score += 5;
    }
    //五行生克
    const numWx = numWuxing[num];
    const riWx = wuXingGan[pan.riGan];
    if(isSheng(riWx,numWx)){
        score += 3;
    }
    if(isSheng(numWx,riWx)){
        score += 2;
    }
    return score;
}

let panCache = null;
let gongSourceCache = null;

function weightedSample(pool,count,lastSpan){
    let tryCount = 0;
    const maxTry = 1800;
    let result = null;
    while(tryCount < maxTry){
        tryCount = tryCount + 1;
        const tmp = [...pool];
        const pick = [];
        while(pick.length < 6 && tmp.length > 0){
            let totalWeight = 0;
            const weightArr = [];
            let wi;
            for(wi = 0; wi < tmp.length; wi++){
                let n = tmp[wi];
                let w = calcScore(n,panCache,gongSourceCache);
                totalWeight = totalWeight + w;
                weightArr.push({n:n,w:w});
            }
            if(totalWeight <= 0) break;
            let r = Math.random() * totalWeight;
            let i;
            for(i = 0; i < weightArr.length; i++){
                r = r - weightArr[i].w;
                if(r <= 0){
                    pick.push(weightArr[i].n);
                    let pos = tmp.indexOf(weightArr[i].n);
                    tmp.splice(pos,1);
                    break;
                }
            }
        }
        if(pick.length !== 6){
            continue;
        }
        pick.sort(function(a,b){
            return a - b;
        });
        const bal = balanceCheck(pick);
        const sp = spanCheck(pick,lastSpan);
        if(bal.pass && sp.ok){
            result = {red:pick, bal:bal, spanInfo:sp};
            break;
        }
    }
    return result;
}

// ==========【排盘】==========
function paiPan(dateStr,timeStr,lng){
    try{
        dateStr = dateStr.replace(/\//g,"-").trim();
        timeStr = timeStr.trim();
        const dateParts = dateStr.split("-");
        const timeParts = timeStr.split(":");
        if(dateParts.length !== 3 || timeParts.length !== 2){
            appendLog("❌日期或者时间格式错误！必须是 2026-10-24 、21:15");
            return null;
        }
        const y = Number(dateParts[0]);
        const m = Number(dateParts[1]) - 1;
        const d = Number(dateParts[2]);
        const h = Number(timeParts[0]);
        const mi = Number(timeParts[1]);
        const dt = new Date(y,m,d,h,mi,0);
        if(isNaN(dt.getTime())){
            appendLog("❌日期时间解析失败！数字越界或者格式不对！");
            return null;
        }
        const riGan = ganArr[(y + d) % 10];
        const riZhi = zhiArr[(y + d) % 12];
        const shiChenIdx = Math.floor((h + 1) / 2) % 12;
        const shiZhi = zhiArr[shiChenIdx];
        const jieQiResult = getJieQiAndYinYang(dt);
        const jqName = jieQiResult.jqName;
        const isYang = jieQiResult.isYang;
        const ju = JQ_JU[jqName];
        if(!ju){
            appendLog("❌没有找到节气对应的局数");
            return null;
        }
        const yuanIdx = getSanYuan(riGan + riZhi);
        const benJu = ju[yuanIdx];
        const yangDun = isYang;
        const xunKongObj = getXunKong(riGan, riZhi);
        const shiGanMap = wuShuDun(riGan);
        const shiGan = shiGanMap[shiZhi];

        const dipan = {};
        const luShu = [4,9,2,3,5,7,8,1,6];
        const gongList = [4,9,2,3,5,7,8,1,6];
        let gl;
        for(gl = 0; gl < gongList.length; gl++){
            let g = gongList[gl];
            dipan[g] = "";
        }
        let yiIdx = 0;
        const yiList = ["戊","己","庚","辛","壬","癸","丁","丙","乙"];
        if(yangDun){
            let i;
            for(i = 0; i < 9; i++){
                const g = luShu[(benJu - 1 + i) % 9];
                dipan[g] = yiList[yiIdx];
                yiIdx = yiIdx + 1;
            }
        }else{
            let i;
            for(i = 0; i < 9; i++){
                const g = luShu[(benJu - 1 - i + 9) % 9];
                dipan[g] = yiList[yiIdx];
                yiIdx = yiIdx + 1;
            }
        }

        let zhiFuGong = null;
        let gFind;
        for(gFind = 1; gFind <= 9; gFind++){
            if(dipan[gFind] === shiGan){
                zhiFuGong = gFind;
                break;
            }
        }
        const tianPan = {};
        let gCopy;
        for(gCopy = 1; gCopy <=9; gCopy++){
            tianPan[gCopy] = dipan[gCopy];
        }
        if(zhiFuGong){
            const offset = zhiFuGong - benJu;
            let gLoop;
            for(gLoop = 1; gLoop <= 9; gLoop++){
                const srcG = ((gLoop - offset - 1 + 9) % 9) + 1;
                tianPan[gLoop] = dipan[srcG];
            }
        }

        const baMenBase = ["休","生","伤","杜","景","死","惊","开"];
        const zhiShiMenIdx = baMenBase.indexOf("休");
        const menPan = {};
        let mg;
        for(mg = 1; mg <= 9; mg++){
            menPan[mg] = "";
        }
        let menStartGong = benJu;
        if(!yangDun){
            menStartGong = ((benJu - 2 + 9) % 9) + 1;
        }
        let i;
        for(i = 0; i < 8; i++){
            const g = ((menStartGong - 1 + i) % 9) + 1;
            if(g === 5){
                continue;
            }
            menPan[g] = baMenBase[(zhiShiMenIdx + i) % 8];
        }
        menPan[5] = "禽";

        const jiuXingBase = ["蓬","芮","冲","辅","禽","心","柱","任","英"];
        const xingPan = {};
        let xg;
        for(xg = 1; xg <= 9; xg++){
            xingPan[xg] = "";
        }
        let xi;
        for(xi = 0; xi < 9; xi++){
            const g = ((benJu - 1 + xi) % 9) + 1;
            xingPan[g] = jiuXingBase[xi];
        }

        const kongWangZhi = [];
        kongWangZhi.push(xunKongObj.kong[0]);
        kongWangZhi.push(xunKongObj.kong[1]);
        const kongWangGong = [];
        let kzIndex;
        for(kzIndex = 0; kzIndex < kongWangZhi.length; kzIndex++){
            let z = kongWangZhi[kzIndex];
            if(zhiToGong[z]){
                kongWangGong.push(zhiToGong[z]);
            }
        }
        //日支宫
        const riZhiGong = zhiToGong[riZhi];
        //日支对冲宫
        const riZhiChongZhi = liuChong[riZhi];
        const riZhiChongGong = zhiToGong[riZhiChongZhi];

        const outPan = {};
        outPan.riGan = riGan;
        outPan.riZhi = riZhi;
        outPan.shiZhi = shiZhi;
        outPan.shiGan = shiGan;
        outPan.yang = yangDun;
        outPan.ju = benJu;
        outPan.jqName = jqName;
        outPan.dipan = dipan;
        outPan.tianPan = tianPan;
        outPan.menPan = menPan;
        outPan.xingPan = xingPan;
        outPan.xunKong = xunKongObj;
        outPan.kongWang = kongWangGong;
        outPan.zhiFuGong = zhiFuGong;
        outPan.riZhiGong = riZhiGong;
        outPan.riZhiChongGong = riZhiChongGong;

        appendLog("✅排盘：" + jqName + "｜" + (yangDun?"阳遁":"阴遁") + benJu + "局｜日干" + riGan + " 日支" + riZhi + " 时干" + shiGan + " 时支" + shiZhi + "｜旬空" + xunKongObj.kong);
        appendLog("📌值符宫:"+zhiFuGong+"｜日支宫:"+riZhiGong+"｜日支冲宫:"+riZhiChongGong+"｜空亡宫:"+kongWangGong.join(","));
        appendLog("📋八门：" + JSON.stringify(outPan.menPan) + " 九星：" + JSON.stringify(outPan.xingPan));
        return outPan;
    }catch(e){
        appendLog("❌paiPan排盘函数异常：" + e.message);
        console.error(e);
        return null;
    }
}

function runCalc(){
    appendLog("===== 启动 QDIM神兵奇门【拓展多宫版｜吉凶值符冲空亡全纳入】 =====");
    const lastStr = document.getElementById("lastNum").value.trim();
    const dateVal = document.getElementById("dateIn").value.trim();
    const shiChenVal = document.getElementById("shiChen").value;
    const genCount = parseInt(document.getElementById("genCount").value,10);
    if(!lastStr){
        appendLog("⚠️请输入上期开奖号码");
        return;
    }
    const lastInfo = parseLastNum(lastStr);
    if(!lastInfo){
        return;
    }
    const timeFake = "12:00";
    const pan = paiPan(dateVal, timeFake, 121.6);
    if(!pan){
        return;
    }
    panCache = pan;

    // ========== 核心：多源宫收集 + 标记来源 ==========
    const gongSourceMap = {};
    for(let g=1;g<=9;g++) gongSourceMap[g]=[];
    //1、吉门宫
    for(let g=1;g<=9;g++){
        const m = pan.menPan[g];
        if(m === "生" || m === "开" || m === "休"){
            gongSourceMap[g].push("jiMen");
        }
    }
    //2、值符宫
    if(pan.zhiFuGong) gongSourceMap[pan.zhiFuGong].push("zhiFu");
    //3、日支宫
    if(pan.riZhiGong) gongSourceMap[pan.riZhiGong].push("riZhi");
    //4、日支对冲飞冲宫
    if(pan.riZhiChongGong) gongSourceMap[pan.riZhiChongGong].push("chong");
    //5、空亡宫（不再杀掉，作为低权重来源）
    pan.kongWang.forEach(g=>{
        gongSourceMap[g].push("kongWang");
    })
    //收集所有有来源标记的宫
    const activeGong = [];
    for(let g=1;g<=9;g++){
        if(gongSourceMap[g].length>0){
            activeGong.push(g);
        }
    }
    if(activeGong.length === 0){
        activeGong.push(pan.ju);
        gongSourceMap[pan.ju].push("juDefault");
    }
    gongSourceCache = gongSourceMap;
    appendLog("🎯纳入候选宫【宫号:来源标签】");
    activeGong.forEach(g=>{
        appendLog("    宫"+g+"："+gongSourceMap[g].join(","));
    })

    let redPool = [];
    let agIndex;
    for(agIndex = 0; agIndex < activeGong.length; agIndex++){
        let g = activeGong[agIndex];
        const s = gongConfig[g].range[0];
        const e = gongConfig[g].range[1];
        let n;
        for(n = s; n <= e; n++){
            redPool.push(n);
        }
    }
    redPool = [...new Set(redPool)].sort(function(a,b){
        return a - b;
    });
    appendLog("🔴拓展总候选池：" + redPool.join(" "));
    //新版：不再做空亡过滤删除！全部保留
    const validPool = redPool;
    appendLog("✅有效候选池（空亡凶门保留，权重压低）：" + validPool.join(" "));
    if(validPool.length < 8){
        appendLog("❌候选池号码过少，调整推演时辰再试");
        return;
    }
    const bluePool = [];
    let b;
    for(b = 1; b <= 16; b++){
        bluePool.push(b);
    }
    const outputList = [];
    let loopI;
    for(loopI = 0; loopI < genCount; loopI++){
        const one = weightedSample(validPool,6,lastInfo.span);
        if(!one){
            appendLog("⚠️第" + (loopI+1) + "注多次尝试未满足均衡+跨度条件，跳过");
            continue;
        }
        const bluePick = bluePool[Math.floor(Math.random() * bluePool.length)];
        outputList.push({
            red:one.red,
            blue:bluePick,
            bal:one.bal,
            span:one.spanInfo.curSpan
        });
        appendLog("🎲第" + (loopI+1) + "注生成：红球" + one.red.join(" ") + " 蓝球" + bluePick + " | 跨度" + one.spanInfo.curSpan + " 大小" + one.bal.big + ":" + one.bal.small + " 奇偶" + one.bal.ji + ":" + one.bal.ou);
    }
    if(outputList.length === 0){
        appendLog("❌本轮没有符合全部条件的号码组合，请更换时辰或者放宽跨度规则");
        return;
    }
    let html = "<table><tr><th>序号</th><th>红球</th><th>蓝球</th><th>跨度</th><th>大小｜奇偶｜中段</th></tr>";
    let outIndex;
    for(outIndex = 0; outIndex < outputList.length; outIndex++){
        const item = outputList[outIndex];
        const redStr = item.red.map(function(x){
            return x.toString().padStart(2,"0");
        }).join(" ");
        const blueStr = item.blue.toString().padStart(2,"0");
        html = html + "<tr>";
        html = html + "<td>" + (outIndex + 1) + "</td>";
        html = html + "<td class=\"red\">" + redStr + "</td>";
        html = html + "<td class=\"blue-text\">" + blueStr + "</td>";
        html = html + "<td>" + item.span + "</td>";
        html = html + "<td>" + item.bal.big + ":" + item.bal.small + "｜" + item.bal.ji + ":" + item.bal.ou + "｜" + item.bal.mid + "</td>";
        html = html + "</tr>";
    }
    html = html + "</table>";
    html = html + "<p class=\"info-text\">说明：本程序仅用于QDIM神兵奇门模型学术研究娱乐，开奖为独立随机事件，不构成购彩参考。</p>";
    document.getElementById("resultBox").innerHTML = html;
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QDIM-6 奇门数据迭代模型 V6.1（自动获取开奖版）</title>
<!-- 用 CDN 引入 lunisolar，修掉 "lunisolar is not defined" -->
<script src="https://cdn.jsdelivr.net/npm/lunisolar@0.3.4/dist/lunisolar.js"></script>
<style>
  body{background:#0b1020;color:#e6e6ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px;max-width:760px;margin:0 auto}
  h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:12px 0 6px}
  .sub{color:#9aa3c7;font-size:13px}
  .tabs{display:flex;gap:10px;margin:10px 0}
  .tab{padding:10px 16px;border-radius:999px;background:#1b2547;color:#cfd6ff;border:1px solid #2c3870;cursor:pointer}
  .tab.active{background:#ffc107;color:#111;font-weight:700;border-color:#ffc107}
  .card{background:#111a36;border:1px solid #233060;border-radius:14px;padding:12px;margin:10px 0}
  button{padding:10px 14px;border-radius:10px;border:none;background:#ffc107;color:#111;font-weight:700;margin:6px 4px;cursor:pointer}
  button.alt{background:#2a3570;color:#dbe3ff}
  .ball{display:inline-block;min-width:28px;padding:4px 6px;margin:3px;border-radius:999px;text-align:center;background:#2b1f3d;color:#ff8fb3;border:1px solid #4b2f4a}
  .ball.blue{background:#1b2b4d;color:#7cc4ff;border-color:#2f4a7a}
  .ball.gold{background:#3a2c10;color:#ffd76a;border-color:#5b4620}
  .ball.kill{background:#3a1111;color:#ff6a6a;border-color:#6a1f1f;text-decoration:line-through opacity:.7}
  .sep{color:#8b94b8;margin:0 6px}
  .pick-card{background:#0d1430;border:1px solid #2c3870;border-radius:10px;padding:8px;margin:6px 0}
  .pick-label{color:#ffc107;margin-left:8px}
  .err{color:#ff6a6a;white-space:pre-wrap}
  .ok{color:#7cffb3}

</style>

<body>

<h1>QDIM-6 奇门数据迭代模型 V6.1</h1>
<div class="sub">真实节气·干支·真太阳时（大连121.6°E）·时家奇门（拆补法/定局可复现）｜自动获取最新开奖（替代本地/data/*.json）</div>

<div class="tabs">
  <div class="tab active" data-lot="ssq">双色球（二四日 21:15）</div>
  <div class="tab" data-lot="dlt">大乐透（一三六 21:25）</div>
</div>

<div class="card">
  <div id="timeInfo" class="sub">点“自动识别下期”或“起局推算”</div>
  <button id="btnTime">自动识别下期开奖时间</button>
  <button id="btnRun">⚡ 起局推算 V6.1</button>
  <button id="btnPrev" class="alt">📜 自动获取最新开奖（替代上期文件）</button>
  <div id="status" class="sub">等待起局...</div>
  <div id="errBox" class="err"></div>
</div>

<div class="card">
  <h2>第0层·奇门落宫初池（非全33/非全35）</h2>
  <div id="initPool" class="row"></div>
  <h2>B关系层扩展（同宫+9/同尾/对宫冲）</h2>
  <div id="extPool" class="row"></div>
  <h2>杀号（空亡/击刑/门迫/入墓 + 张委铭运算）</h2>
  <div id="killList" class="row"></div>
  <h2>剩余池 / 后区</h2>
  <div id="remainPool" class="row"></div>
  <h2>精选（双色球红6蓝1 / 大乐透前5后2，确定化）</h2>
  <div id="picksOut"></div>
</div>

<script>
/* ========== 状态 ========== */
let lotNow = 'ssq'; // ssq / dlt
let prevData = null; // 自动获取后存入 {issue,date,front,back}

/* ========== 工具：大连真太阳时 ========== */
function trueSolar(d, lon=121.6, baseLon=120){
  return new Date(d.getTime() + (lon - baseLon) * 4 * 60000);
}

/* ========== 下期开奖时间 ========== */
function nextDrawTime(lot, now=new Date()){
  const r = lot==='ssq' ? {wd:[2,4,0], h:21, m:15, name:'双色球'}
                         : {wd:[1,3,6], h:21, m:25, name:'大乐透'};
  const x = new Date(now); x.setSeconds(0,0);
  for(let i=0;i<14;i++){
    const w=x.getDay();
    if(r.wd.includes(w)){
      x.setHours(r.h,r.m,0,0);
      if(x<=now){ x.setDate(x.getDate()+1); continue; }
      return x;
    }
    x.setDate(x.getDate()+1);
  }
  return null;
}

/* ========== 历法/节气/干支（用 lunisolar CDN） ========== */
function getLunInfo(d){
  if(typeof lunisolar === 'undefined') throw new Error('lunisolar 未加载，请确认网络/CDN');
  const ls = lunisolar(d);
  // 不同版本字段可能略有差异，做兼容
  const yearGZ = ls.lunar?.yearGanZhi || ls.lunar?.getYearGanZhi?.() || (ls.yearGanZhi||'');
  const monthGZ = ls.lunar?.monthGanZhi || ls.lunar?.getMonthGanZhi?.() || '';
  const dayGZ = ls.lunar?.dayGanZhi || ls.lunar?.getDayGanZhi?.() || '';
  const jie = ls.solarTerm || ls.getSolarTerm?.() || '';
  return {yearGZ, monthGZ, dayGZ, jie, ls};
}
function hourGZ(d, dayGZStr){
  const h = d.getHours() + d.getMinutes()/60;
  let zi=0;
  if(h>=23||h<1)zi=0; else if(h>=1&&h<3)zi=1; else if(h>=3&&h<5)zi=2; else if(h>=5&&h<7)zi=3;
  else if(h>=7&&h<9)zi=4; else if(h>=9&&h<11)zi=5; else if(h>=11&&h<13)zi=6; else if(h>=13&&h<15)zi=7;
  else if(h>=15&&h<17)zi=8; else if(h>=17&&h<19)zi=9; else if(h>=19&&h<21)zi=10; else zi=11;
  const DZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const dayZ = (dayGZStr||'甲子').slice(-1);
  const dayIdx = DZ.indexOf(dayZ);
  const hz = DZ[((dayIdx+zi)%12+12)%12];
  // 时干：日干起子时为日干，顺推
  const dayG = (dayGZStr||'甲子').slice(0,1);
  const gIdx = TG.indexOf(dayG);
  const hg = TG[((gIdx*2 + zi)%10+10)%10];
  return hg+hz;
}

/* ========== 时家奇门（可复现定局/拆补近似：按节+时支定局，落宫取号） ========== 
   注：完整“拆补法”需专业奇门引擎；这里用“节气定阴阳遁+时支映射局数+九宫三奇六仪”做确定化排盘核心，
   保证同时间同结果、不回退全量33；用于研究模型框架。
*/
const PALACE_NUM = { // 洛书九宫对应数字展开（取号用）
  1:[1,10,19,28], 2:[2,11,20,29], 3:[3,12,21,30],
  4:[4,13,22,31], 5:[5,14,23,32], 6:[6,15,24,33],
  7:[7,16,25],    8:[8,17,26],    9:[9,18,27]
};
const OPP = {1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4,5:5};
const EMPTY_GONG = (jie)=>{ // 按节简单取空亡（以子午卯酉等规律近似，确定化）
  // 用“节内旬空”近似：以日干支旬空，这里用节+日取稳定映射
  const map={'立春':[6,7],'雨水':[5,6],'惊蛰':[4,5],'春分':[3,4],'清明':[2,3],'谷雨':[1,2],
             '立夏':[9,1],'小满':[8,9],'芒种':[7,8],'夏至':[6,7],'小暑':[5,6],'大暑':[4,5],
             '立秋':[3,4],'处暑':[2,3],'白露':[1,2],'秋分':[9,1],'寒露':[8,9],'霜降':[7,8],
             '立冬':[6,7],'小雪':[5,6],'大雪':[4,5],'冬至':[3,4],'小寒':[2,3],'大寒':[1,2]};
  return map[jie]||[3,4];
};

function buildBoard(tsDate, lot){
  const {jie, dayGZ} = getLunInfo(tsDate);
  const hgz = hourGZ(tsDate, dayGZ);
  const yangJie=['冬至','小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种'];
  const isYang = yangJie.includes(jie);
  const DZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const zi = DZ.indexOf(hgz.slice(-1));
  let ju = ((zi-1+12)%12)%9 + 1; if(!isYang) ju = ((9-ju)%9)+1;
  // 用神：开奖时刻以“日干/时干”取宫（确定化）
  const TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const gIdx = TG.indexOf((dayGZ||'甲子').slice(0,1));
  const shenGong = ((gIdx + zi)%9)+1;
  const zhiFu = ((ju + gIdx)%9)+1;
  const zhiShi = ((ju + zi)%9)+1;
  const kwong = EMPTY_GONG(jie);
  return {jie, dayGZ, hgz, isYang, ju, shenGong, zhiFu, zhiShi, kwong, tsDate};
}

function initFromBoard(board, lot){
  const set=new Set();
  [board.shenGong, board.zhiFu, board.zhiShi].forEach(g=>{
    (PALACE_NUM[g]||[]).forEach(n=>set.add(n));
  });
  // 限制彩种范围
  const max = lot==='ssq'?33:35;
  return [...set].filter(n=>n>=1&&n<=max).sort((a,b)=>a-b);
}
function extFromBoard(board, init, lot){
  const out=new Set(init);
  // 同宫+9（在范围内）、对宫冲
  init.forEach(n=>{
    for(let g=1;g<=9;g++){
      if((PALACE_NUM[g]||[]).includes(n)){
        (PALACE_NUM[g]||[]).forEach(x=>out.add(x));
        (PALACE_NUM[OPP[g]]||[]).forEach(x=>out.add(x));
      }
    }
    // 同尾
    for(let k=0;k<4;k++){ const t=n+k*10; if(t<= (lot==='ssq'?33:35)) out.add(t); }
  });
  const max = lot==='ssq'?33:35;
  return [...out].filter(n=>n>=1&&n<=max).sort((a,b)=>a-b);
}

/* ========== 张委铭杀号（确定化：空亡+尾数集中+区间退号）+ 后区/蓝球 ========== */
function killStep(pool, board, lot, prev){
  const killSet=new Set();
  board.kwong.forEach(g=>(PALACE_NUM[g]||[]).forEach(n=>killSet.add(n)));
  // 尾数集中退号（确定化）
  const tail={}; pool.forEach(n=>{ const t=n%10; tail[t]=(tail[t]||[]).concat(n); });
  Object.values(tail).forEach(arr=>{ if(arr.length>=3) arr.slice(0,1).forEach(n=>killSet.add(n)); });
  // 区间退号（前/中/后）
  const sec = [[1,11],[12,22],[23,33]]; if(lot==='dlt') sec[2]=[23,35];
  const cnt={}; pool.forEach(n=>{ const s=sec.findIndex(r=>n>=r[0]&&n<=r[1]); cnt[s]=(cnt[s]||[]).concat(n); });
  Object.values(cnt).forEach(arr=>{ if(arr.length>=4) arr[0]&&killSet.add(arr[0]); });
  // 重号保守：若上期存在可杀1个（可选，不强制）
  if(prev&&Array.isArray(prev.front)){ prev.front.forEach(n=>killSet.add(n)); }
  const remain = pool.filter(n=>!killSet.has(n)).sort((a,b)=>a-b);
  return {kill:[...killSet].filter(n=>pool.includes(n)).sort((a,b)=>a-b), remain};
}
function killBack(lot, board){
  // 双色球蓝01-16；大乐透后区01-12
  const max = lot==='ssq'?16:12;
  const base = lot==='ssq'? [board.shenGong, board.zhiFu, board.zhiShi].flatMap(g=>{
     // 蓝/后区按宫位映射（确定化）
     const m={1:[1,9],2:[2,10],3:[3,11],4:[4,12],5:[5],6:[6],7:[7],8:[8],9:[9]};
     return m[g]||[];
  }) : [board.shenGong, board.zhiFu, board.zhiShi].flatMap(g=>{
     const m={1:[1,9],2:[2,10],3:[3,11],4:[4,12],5:[5],6:[6],7:[7],8:[8],9:[9]};
     return m[g]||[];
  });
  let pool=[...new Set(base)].filter(n=>n>=1&&n<=max).sort((a,b)=>a-b);
  const kill=board.kwong.flatMap(g=>{const m={1:[1,9],2:[2,10],3:[3,11],4:[4,12]};return m[g]||[];});
  const remain=pool.filter(n=>!kill.includes(n));
  // 保底：若过滤完太少，取原池末位兜底（确定化，非随机）
  const fallback = lot==='ssq'? [1,16,9,8] : [1,12,9,8];
  const finalRemain = remain.length? remain : pool.length? pool : fallback.filter(n=>n<=max);
  return {kill:kill.filter(n=>pool.includes(n)), remain:finalRemain};
}

/* ========== 褚天一擒号形态 + 精选 ========== */
function sumA(a){return a.reduce((s,x)=>s+x,0)}
function ac(a){let c=0;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(Math.abs(a[i]-a[j])>1)c++;return c}
function pickNotes(lot, frontPool, backPool, prev){
  const out=[];
  const targetF = lot==='ssq'?6:5;
  // 确定化组合（不做随机）：按窗口/规则取可复现注
  const takeFront = frontPool.slice(0, Math.max(targetF, frontPool.length)).sort((a,b)=>a-b);
  // 大小比/和值/跨度/连号约束（轻量）
  const big = takeFront.filter(n=>n> (lot==='ssq'?16:17)).length;
  const small = takeFront.length-big;
  const span = takeFront[takeFront.length-1]-takeFront[0];
  const ok = (lot==='ssq'? (big>=2&&big<=4&&span>=15&&ac(takeFront)>=6)
                       : (big>=2&&big<=3&&span>=20&&ac(takeFront)>=7));
  const back = backPool.slice(0, lot==='ssq'?1:2);
  if(ok && takeFront.length===targetF && back.length){
    out.push({front:takeFront, back});
  }else{
    // 退阶：取前区前N+后区，标明“退阶”
    out.push({front:takeFront.slice(0,targetF), back:back.slice(0, lot==='ssq'?1:2), note:'退阶/池过窄'});
  }
  // 生成3注（通过稳定偏移，非随机）
  const res=[];
  for(let i=0;i<3;i++){
    const f = frontPool.slice(i, i+targetF) || [];
    const b = backPool.slice(0, lot==='ssq'?1:2);
    if(f.length===targetF && b.length) res.push({front:f.sort((a,b)=>a-b), back:b, note:i?'偏移':'主盘'});
    if(res.length>=3) break;
  }
  return res.length? res : out;
}

/* ========== 自动获取最新开奖（不读本地 /data/*.json） ========== */
async function fetchLatest(lot){
  // 双色球：福彩官网前端接口（非承诺开放API，仅个人研究低频用）
  // 大乐透：体彩官网前端接口（同理）
  if(lot==='ssq'){
    const url = 'https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=1&pageNo=1&pageSize=1';
    const r = await fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}});
    if(!r.ok) throw new Error('HTTP '+r.status+' 或跨域被拦');
    const j = await r.json();
    // 返回结构常见：result.data.list[{issue,date,red,blue}] 或类似；做兼容
    const item = j?.result?.data?.list?.[0] || j?.data?.list?.[0] || j?.list?.[0];
    if(!item) throw new Error('福彩接口返回结构变化，请核对');
    const red = (item.red||item.openCode||'').split(',').map(Number).filter(Number.isFinite);
    const blue = [Number(item.blue||(item.openCode||'').split(',').pop())];
    return {issue:item.issue||item.expect, date:item.date||item.openTime, front:red, back:blue};
  }else{
    // 体彩大乐透
    const url = 'https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageNo=1&pageSize=1&isVerify=1';
    const r = await fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}});
    if(!r.ok) throw new Error('HTTP '+r.status+' 或跨域被拦');
    const j = await r.json();
    const item = j?.result?.data?.list?.[0] || j?.data?.list?.[0] || j?.list?.[0];
    if(!item) throw new Error('体彩接口返回结构变化，请核对');
    // 常见字段：frontNum/backNum 或 openCode
    const f = (item.frontNum||item.openCode||'').split(',').map(Number).filter(Number.isFinite);
    const b = (item.backNum||'').split(',').map(Number).filter(Number.isFinite);
    return {issue:item.issue||item.expect, date:item.date||item.openTime, front:f, back:b};
  }
}

/* ========== 渲染 ========== */
const pad=n=>String(n).padStart(2,'0');
function show(id, arr, cls='red'){
  document.getElementById(id).innerHTML = arr.map(n=>`<span class="ball ${cls}">${pad(n)}</span>`).join('')||'(空)';
}
function showPicks(list, lot){
  const cls = lot==='ssq'?'red':'gold';
  document.getElementById('picksOut').innerHTML = list.map((p,i)=>`
    <div class="pick-card">
      <div class="pick-row">
        ${p.front.map(n=>`<span class="ball ${cls}">${pad(n)}</span>`).join('')}
        <span class="sep">+</span>
        ${p.back.map(n=>`<span class="ball blue">${pad(n)}</span>`).join('')}
        <span class="pick-label">精选${i+1}${p.note?`(${p.note})`:''}</span>
      </div>
      <div class="sub">和值${sumA(p.front)} 跨度${p.front[p.front.length-1]-p.front[0]} AC${ac(p.front)}</div>
    </div>
  `).join('')||'<div class="sub">未生成</div>';
}

/* ========== 主运行 ========== */
function run(){
  const status=document.getElementById('status'), err=document.getElementById('errBox');
  err.textContent=''; status.textContent='运算中...';
  try{
    const nd = nextDrawTime(lotNow, new Date());
    const ts = trueSolar(nd, 121.6);
    const board = buildBoard(ts, lotNow);
    const init = initFromBoard(board, lotNow);
    const ext = extFromBoard(board, init, lotNow);
    const k = killStep(ext, board, lotNow, prevData);
    const kb = killBack(lotNow, board);
    const notes = pickNotes(lotNow, k.remain, kb.remain, prevData);

    show('initPool', init, lotNow==='ssq'?'red':'gold');
    show('extPool', ext, lotNow==='ssq'?'red':'gold');
    show('killList', k.kill, 'kill');
    document.getElementById('remainPool').innerHTML =
      (lotNow==='ssq'?'红：':'前区：') + k.remain.map(n=>`<span class="ball ${lotNow==='ssq'?'red':'gold'}">${pad(n)}</span>`).join('')
      + ' <span class="sep">'+(lotNow==='ssq'?'蓝：':'后区：')+'</span>' + kb.remain.map(n=>`<span class="ball blue">${pad(n)}</span>`).join('');
    showPicks(notes, lotNow);

    status.innerHTML = `<span class="ok">✓ 运算完成</span>｜下期${lotNow==='ssq'?'双色球':'大乐透'}（北京）${nd.toLocaleString('zh-CN')}｜真太阳时${ts.toLocaleString('zh-CN')}｜${board.isYang?'阳遁':'阴遁'}${board.ju}局｜节${board.jie}｜日${board.dayGZ}时${board.hgz}`;
  }catch(e){
    err.textContent = '运算出错：'+e.message + (e.message.includes('CORS')||e.message.includes('跨域')?'（跨域限制，建议本地代理/同域/仅用排盘不依赖开奖拉取）':'');
    status.textContent='等待起局...';
  }
}

/* ========== 事件 ========== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); lotNow=t.dataset.lot;
  document.getElementById('status').textContent='已切换：'+ (lotNow==='ssq'?'双色球':'大乐透')+'，可重新起局/获取';
});
document.getElementById('btnTime').onclick=()=>{
  const nd=nextDrawTime(lotNow,new Date()), ts=trueSolar(nd,121.6);
  document.getElementById('timeInfo').innerHTML=`下期（北京）${nd.toLocaleString('zh-CN')}｜真太阳时${ts.toLocaleString('zh-CN')}`;
};
document.getElementById('btnRun').onclick=run;
document.getElementById('btnPrev').onclick=async()=>{
  const s=document.getElementById('status'), e=document.getElementById('errBox');
  s.textContent='正在自动获取最新开奖...'; e.textContent='';
  try{
    const d = await fetchLatest(lotNow);
    prevData = d;
    s.innerHTML = `<span class="ok">✓ 已获取${lotNow==='ssq'?'双色球':'大乐透'} ${d.issue||''}（${d.date||''}）前/红:${d.front.join(',')} 后/蓝:${d.back.join(',')}</span>（将用于重号参考/杀号，非预测结果）`;
  }catch(err){
    e.textContent = '自动获取失败：'+err.message+'（常见原因：github.io跨域/CORS、接口结构变化、需本地代理；不要依赖 /data/*.json 了）';
    s.textContent='等待起局...';
  }
};

// 初始识别时间
document.getElementById('btnTime').click();
</script>


<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>奇门V9-开奖时间起局-双重缩水(可点调试版)</title>
<style>
  body{margin:0;background:#0b1030;color:#eee;font-family:-apple-system,"PingFang SC",sans-serif;padding:12px}
  h1{color:#ffd34a;font-size:24px;margin:8px 0}
  .sub{color:#9ab;font-size:13px;margin-bottom:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  button{padding:12px 16px;border-radius:10px;border:0;font-size:15px;cursor:pointer}
  .y{background:#ffd34a;color:#222}.b{background:#2f80ed;color:#fff}.o{background:#ff7a1a;color:#fff}
  .g{background:#27ae60;color:#fff}.p{background:#9b51e0;color:#fff}.x{background:transparent;color:#eee;border:1px solid #555}
  input,select{padding:10px;border-radius:8px;border:1px solid #555;background:#111;color:#eee}
  .card{background:#0f1535;border:1px solid #223;padding:10px;border-radius:12px;margin-top:10px}
  .log{background:#050818;padding:10px;border-radius:10px;white-space:pre-wrap;font-size:13px;min-height:60px}
  .pan span{display:inline-block;margin:4px;padding:6px 8px;background:#111a3d;border-radius:8px}
  .bad{color:#ff6b6b}.ok{color:#6bff8a}
  .note{color:#8ab;font-size:12px}
</style>
</head>
<body>
<h1>奇门V9（按开奖/封盘时间起局）</h1>
<div class="sub">可点调试版｜九宫全息取数 → 盘层缩水 → 号层和值/跨度/奇偶/大小/连号/重号过滤 → 输出</div>

<div class="row">
  <label>起局时间(默认=下期开奖估算)<input id="t" type="datetime-local"></label>
  <select id="mode">
    <option value="open">按开奖时间</option>
    <option value="close">按封盘时间</option>
  </select>
</div>
<div class="row">
  <button class="y" data-act="ssq3">双色球3注</button>
  <button class="y" data-act="ssq5">双色球5注</button>
  <button class="y" data-act="dlt3">大乐透3注</button>
  <button class="y" data-act="dlt5">大乐透5注</button>
</div>
<div class="row">
  <button class="b" data-act="pan">排盘详情</button>
  <button class="o" data-act="inject">注入上期</button>
  <button class="g" data-act="export">导出</button>
  <button class="p" data-act="weight">权重分析</button>
  <button class="x" data-act="clear">清空</button>
</div>
<div class="row">
  <input id="lf" placeholder="前区如 05 12 21">
  <input id="lb" placeholder="后区如 07 / 07 11">
</div>

<div class="card">
  <div id="panBox">排盘：等待</div>
</div>
<div class="card">
  <div id="res">等待选号…</div>
</div>
<div class="card log" id="log">日志：加载中…</div>
<div class="note">注：双色球前1-33/后1-16；大乐透前1-35/后1-12；起局为娱乐映射，不提升真实中奖率。</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const logEl = $('log'), resEl = $('res'), panBox = $('panBox');
  let lastPan = null, lastFront=null, lastBack=null;

  function log(s){ logEl.textContent += '\n' + s; logEl.scrollTop = logEl.scrollHeight; }
  function fmt(a){ return '['+a.map(x=>String(x).padStart(2,'0')).join(' ')+']'; }
  function rand(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; }
  function range(lo,hi){const r=[];for(let i=lo;i<=hi;i++)r.push(i);return r;}

  // 下期开奖时间估算（仅按周几粗算，别当官方精确）
  function nextOpenTime(lot){
    const d=new Date(), w=d.getDay();
    let target=null;
    if(lot==='ssq'){ // 二/四/日 21:15
      const map={0:0,1:1,2:0,3:2,4:0,5:2,6:0}; const add=map[w];
      target=new Date(d); target.setHours(21,15,0,0);
      if(add===0 && d<target) {/*今天*/} else target=new Date(target.getTime()+add*86400000);
      // 简化：若今天不是开奖日就顺延到最近
      while(![0,2,4].includes(target.getDay())) target=new Date(target.getTime()+86400000);
    }else{ // 大乐透 一/三/六 21:25
      target=new Date(d); target.setHours(21,25,0,0);
      while(![1,3,6].includes(target.getDay())) target=new Date(target.getTime()+86400000);
      if(d>target) target=new Date(target.getTime()+86400000);
    }
    return target;
  }
  function getUseTime(lot){
    const v=$('t').value;
    if(v) return new Date(v);
    const t=nextOpenTime(lot);
    if($('mode').value==='close') return new Date(t.getTime()-3600000); // 粗略封盘=开奖前1h
    return t;
  }

  // 简化起局：用时间哈希定九宫权重/值符/时干/空亡/马星/三奇（娱乐可复现，非专业置闰）
  function buildPan(lot){
    const t=getUseTime(lot);
    const seed = t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate()*10+t.getHours()+t.getMinutes();
    const luo=[1,2,3,4,5,6,7,8,9];
    const names=['坎','坤','震','巽','中','乾','兑','艮','离'];
    const jx=['休','生','伤','杜','景','死','惊','开'];
    const shen=['值符','腾蛇','太阴','六合','白虎','玄武','九地','九天'];
    const sanQi=[2,3,4]; // 乙丙丁映射示例
    const kongIdx = (seed%9);
    const maIdx = ((seed>>3)%8);
    const zfIdx = ((seed>>5)%9);
    const shiIdx = ((seed>>7)%9);
    const gong=[];
    for(let i=0;i<9;i++){
      let w = 10 + luo[i]*2;
      if(i===zfIdx) w+=40;
      if(i===shiIdx) w+=25;
      if(i===maIdx) w+=18;
      if(jx[i%8]==='生'||jx[i%8]==='开'||jx[i%8]==='休') w+=12;
      if(shen[i%8]==='值符'||shen[i%8]==='六合') w+=10;
      if(sanQi.includes(luo[i])) w+=8;
      if(i===kongIdx) w-=30;
      gong.push({
        n:i+1,name:names[i],luo:luo[i],weight:Math.max(1,w),
        jx:jx[i%8],shen:shen[i%8],
        kong:i===kongIdx,isMa=i===maIdx,isZF:i===zfIdx,isShi:i===shiIdx,
        isSanQi:sanQi.includes(luo[i]),ruMu:(luo[i]===6||luo[i]===8)
      });
    }
    return {
      time:t, lot,
      desc:`起局=${t.toLocaleString()} 模式=${$('mode').value} 值符宫${zfIdx+1} 时干宫${shiIdx+1} 空亡宫${kongIdx+1} 马宫${maIdx+1}`,
      gongData:gong, zfIdx, shiIdx, kongIdx, maIdx, seed
    };
  }

  // 盘层取数（洛书映射到号段）+盘层缩水（去低权/空亡优先压掉）
  function basePool(pan, frontLo, frontHi, backLo, backHi){
    const front=[], back=[];
    pan.gongData.forEach(g=>{
      const f1 = ((g.luo-1)%frontHi)+1;
      const f2 = ((g.luo*3+pan.seed)%frontHi)+1;
      const b1 = ((g.luo+pan.seed/7|0)%backHi)+backLo;
      if(g.kong){ /*空亡降权：只小概率进*/ if(Math.random()>0.2) return; }
      if(g.weight>=20) { front.push(f1); front.push(f2); }
      else if(g.weight>=10) { front.push(f1); }
      if(g.isMa||g.isSanQi||g.shen==='六合') back.push(b1);
      if(g.isZF||g.isShi) back.push(b1);
    });
    return {front:Array.from(new Set(front)).filter(x=>x>=frontLo&&x<=frontHi),
            back:Array.from(new Set(back)).filter(x=>x>=backLo&&x<=backHi)};
  }

  // 号层过滤（双重缩水第二步）
  function passFilter(arr, lot, lastF, lastB){
    const sum=arr.reduce((a,b)=>a+b,0);
    const span=Math.max(...arr)-Math.min(...arr);
    const odd=arr.filter(x=>x%2).length;
    const big=arr.filter(x=>x>(lot==='ssq'?16:17)).length;
    const cons=arr.sort((a,b)=>a-b).filter((x,i,a)=>i&&x===a[i-1]+1).length;
    // 和值粗区间
    const okSum = lot==='ssq' ? (sum>=70&&sum<=130) : (sum>=85&&sum<=155);
    if(!okSum) return false;
    if(span<15) return false;
    if(odd<2||odd>arr.length-1) return false;
    if(big<2||big>arr.length-1) return false;
    if(cons>2) return false;
    // 重号/邻号（有上期时别全重）
    if(lastF&&lastF.length){
      const hit=arr.filter(x=>lastF.includes(x)).length;
      const near=arr.filter(x=>lastF.some(y=>Math.abs(x-y)===1)).length;
      if(hit>=Math.min(3,arr.length-2)) return false;
      if(near>3) return false;
    }
    return true;
  }

  function makeOne(lot, pan){
    const cfg = lot==='ssq'?{fn:6,bn:1,fl:1,fh:33,bl:1,bh:16}
              :{fn:5,bn:2,fl:1,fh:35,bl:1,bh:12};
    const pool=basePool(pan,cfg.fl,cfg.fh,cfg.bl,cfg.bh);
    let front=null, back=null, tries=0;
    while(tries++<5000){
      const f=shuffle(pool.front.length?pool.front:range(cfg.fl,cfg.fh)).slice(0,cfg.fn).sort((a,b)=>a-b);
      if(passFilter(f,lot,lastFront,lastBack)){front=f;break}
    }
    while(tries++<5000){
      const b=shuffle(pool.back.length?pool.back:range(cfg.bl,cfg.bh)).slice(0,cfg.bn).sort((a,b)=>a-b);
      if(lot==='ssq'||passFilter(b,'dlt_back',lastBack,null)){back=b;break}
    }
    if(!front||!back){ log('本轮回选号过滤过严未成，放松一次'); front=shuffle(range(cfg.fl,cfg.fh)).slice(0,cfg.fn).sort((a,b)=>a-b); back=shuffle(range(cfg.bl,cfg.bh)).slice(0,cfg.bn).sort((a,b)=>a-b);}
    return lot==='ssq'?{front,back}:{front,back};
  }

  function gen(lot,n){
    const pan=buildPan(lot); lastPan=pan;
    showPan(pan);
    const out=[];
    for(let i=0;i<n;i++) out.push(makeOne(lot,pan));
    const txt = out.map((o,i)=>`第${i+1}注 前${fmt(o.front)} 后${fmt(o.back)}`).join('\n');
    resEl.innerHTML = `<div class="ok">已生成(${lot} ${n}注)</div><pre>${txt}</pre><div class="note">${pan.desc}</div>`;
    log(`生成 ${lot} ${n}注 | ${pan.desc}`);
  }

  function showPan(pan){
    panBox.innerHTML = `<b>${pan.desc}</b><br>` + pan.gongData.map(g=>
      `<span>宫${g.n}/${g.name} 洛${g.luo} 权${g.weight} ${g.jx}${g.shen}`+
      (g.kong?' <span class="bad">空</span>':'')+(g.isMa?'马':'')+(g.isSanQi?'三奇':'')+(g.ruMu?'墓':'')+'</span>'
    ).join('');
  }

  function inject(){
    lastFront=($('lf').value||'').trim().split(/\D+/).map(Number).filter(x=>!isNaN(x));
    lastBack=($('lb').value||'').trim().split(/\D+/).map(Number).filter(x=>!isNaN(x));
    log(`注入上期 前${lastFront.length?fmt(lastFront):'无'} 后${lastBack.length?fmt(lastBack):'无'}`);
  }

  function exportTxt(){
    const t=(resEl.innerText||'')+'\n---日志---\n'+(logEl.textContent||'');
    const b=new Blob([t],{type:'text/plain;charset=utf-8'});
    const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=`奇门V9_${Date.now()}.txt`;a.click();URL.revokeObjectURL(u);
    log('已导出');
  }
  function weightAnalysis(){
    const p=lastPan||buildPan('ssq'); lastPan=p; showPan(p);
    log(p.gongData.map(g=>`宫${g.n}权${g.weight} ${g.shen} ${g.jx}`).join('\n'));
  }

  document.querySelectorAll('button[data-act]').forEach(b=>{
    b.addEventListener('click',()=>{
      const a=b.getAttribute('data-act');
      try{
        if(a==='ssq3') gen('ssq',3);
        else if(a==='ssq5') gen('ssq',5);
        else if(a==='dlt3') gen('dlt',3);
        else if(a==='dlt5') gen('dlt',5);
        else if(a==='pan'){ const p=lastPan||buildPan('ssq'); lastPan=p; showPan(p); log(p.desc); }
        else if(a==='inject') inject();
        else if(a==='export') exportTxt();
        else if(a==='weight') weightAnalysis();
        else if(a==='clear'){ resEl.innerHTML='等待选号…'; logEl.textContent=''; lastFront=null;lastBack=null; }
      }catch(e){
        log('❌ 出错: '+(e&&e.message?e.message:String(e)));
        console.error(e);
        resEl.innerHTML = '<span class="bad">执行出错，见日志/Console</span>';
      }
    });
  });

  lastPan=buildPan('ssq'); showPan(lastPan);
  log('奇门V9调试版已加载（按开奖/封盘时间起局+双重缩水）');
  log('诊断页已确认JS可点，本版把异常会打在日志区');
})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇门选号极简验证版</title>
<style>
body{background:#07103a;color:#fff;font-family:sans-serif;padding:12px;box-sizing:border-box}
input,select,button{font-size:16px;margin:6px 0;box-sizing:border-box}
button{padding:14px 18px;border-radius:10px;border:0;background:#ffd400;color:#000;margin:4px}
.b{blue{background:#2f80ed;color:#fff}}
.o{background:#ff7a18;color:#fff}
.g{background:#27ae60;color:#fff}
.p{background:#a855f7;color:#fff}
pre{background:#000;padding:10px;border-radius:8px;white-space:pre-wrap}
.note{opacity:.8;font-size:12px;margin-top:8px}
</style>
</head>
<body>

<h2>奇门选号·极简验证（先确认能出）</h2>
<div>起局：<input id="tm" type="datetime-local"> 
<select id="mode"><option value="kai">按开奖时间估算</option><option value="feng">按封盘时间估算</option></select></div>

<button id="bSsq3">双色球3注</button>
<button id="bSsq5">双色球5注</button>
<button id="bDlt3">大乐透3注</button>
<button id="bDlt5">大乐透5注</button><br>

<button id="bPan" class="b">排盘详情</button>
<button id="bTest" class="o">强制输出测试</button>
<button id="bClear" >清空</button>

<div>前区上期(如 05 12 21)：<input id="lf"></div>
<div>后区上期(如 07 11)：<input id="lb"></div>

<div>排盘：<pre id="pan">等待</pre></div>
<div>结果：<pre id="res">等待选号...</pre></div>
<div>日志：<pre id="log">加载中...</pre></div>

<div class="note">双色球前1-33/后1-16；大乐透前1-35/后1-12；本为娱乐映射，不提升真实中奖率。访问加 ?v=101 防缓存。</div>

<script>
(function(){
  function $(id){return document.getElementById(id);}
  function say(s,err){ $('log').textContent += (err?'❌ ':'')+s+'\n'; }
  function setRes(h){ $('res').innerHTML = h; }
  function fmt(a){ return a.slice().sort((x,y)=>x-y).map(x=>String(x).padStart(2,'0')).join(' '); }

  // 极简“盘权重”（保证不依赖复杂奇门库，可复现）
  function buildPan(lot){
    var d = new Date();
    var gong=[];
    for(var i=1;i<=9;i++){
      gong.push({n:i,name:['坎','坤','震','巽','中','乾','兑','艮','离'][i-1],luo:i,weight:(10+((i*d.getSeconds()+d.getMinutes()*7+i*13)%30)),jx:'景',shen:'值符',kong:false,isMa:false});
    }
    return {desc:'极简起局(验证用) '+d.toLocaleString()+' '+lot, gongData:gong};
  }

  function randPool(lot){
    if(lot==='ssq') return {front:[1,33],back:[1,16]};
    return {front:[1,35],back:[1,12]};
  }

  function pick(lot){
    var p=randPool(lot);
    var s=new Set(),t=new Set();
    while(s.size<(lot==='ssq'?6:5)) s.add(Math.floor(Math.random()*p.front[1])+1);
    while(t.size<(lot==='ssq'?1:2)) t.add(Math.floor(Math.random()*p.back[1])+1);
    return {front:Array.from(s),back:Array.from(t)};
  }

  function gen(lot,n){
    try{
      var pan=buildPan(lot);
      var out=[];
      for(var i=0;i<n;i++) out.push(pick(lot));
      var txt=out.map((o,i)=>'第'+(i+1)+'注 '+(lot==='ssq'?'红':'前')+fmt(o.front)+' | '+(lot==='ssq'?'蓝':'后')+fmt(o.back)).join('\n');
      setRes('<div>✅ 已生成 '+lot+' / '+n+'注</div><pre>'+txt+'</pre><div class="note">'+pan.desc+'</div>');
      $('pan').textContent=pan.desc+'\n'+pan.gongData.map(g=>'宫'+g.n+'/'+g.name+'权'+g.weight).join('\n');
      say('生成 '+lot+' '+n+'注');
    }catch(e){
      say('生成异常: '+(e&&e.message?e.message:String(e)),true);
      console.error(e);
      setRes('异常见日志');
    }
  }

  $('bSsq3').onclick=function(){gen('ssq',3);};
  $('bSsq5').onclick=function(){gen('ssq',5);};
  $('bDlt3').onclick=function(){gen('dlt',3);};
  $('bDlt5').onclick=function(){gen('dlt',5);};
  $('bPan').onclick=function(){
    var p=buildPan('ssq');
    $('pan').textContent=p.desc+'\n'+p.gongData.map(g=>'宫'+g.n+'/'+g.name+'权'+g.weight).join('\n');
    say('排盘输出');
  };
  $('bTest').onclick=function(){
    setRes('✅ 强制输出测试成功 @'+new Date().toLocaleString());
    say('强制测试被点');
  };
  $('bClear').onclick=function(){setRes('等待选号...');$('log').textContent='';say('已清空');};

  $('log').textContent='极简验证版已绑定（按id）\n';
  say('就绪；若仍不出，基本是缓存/没加载到本文件');
})();
</script>
</body>
</html>

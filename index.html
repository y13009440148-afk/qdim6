<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇门·真盘取数(历法CDN·拆补·洛书·四害加权+筛选过滤+旋转矩阵精选)</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-calendar@1.6.6/dist/lunar-calendar.min.js"></script>
<style>
:root{--bg:#07102a;--box:#0d1740;--line:#3b6cff;--hi:#ff4d4f;--mid:#4ea3ff;--lo:#8a93b3;--txt:#cfd8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",monospace}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input,select,button{background:#0a1230;color:var(--txt);border:1px solid #2b3f7a;padding:7px 9px;border-radius:8px}
button{background:#d92d3f;color:#fff;border:none;padding:9px 12px;cursor:pointer}
.card{background:var(--box);border:1px solid #1f2f66;border-radius:12px;padding:10px 12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.g{border:1px solid #2c4378;border-radius:10px;padding:9px;min-height:78px;background:#081233;color:#cfd8ff}
.g.hi{border-color:#ff4d4f;background:#2a0f12;color:#ffb3b3;box-shadow:0 0 12px #ff4d4f55 inset}
.g.mid{border-color:#4ea3ff;background:#0f2147;color:#b9dcff;box-shadow:0 0 10px #4ea3ff44 inset}
.g.lo{border-color:#243058;background:#0a1026;color:#7580a5}
.tag{opacity:.8;font-size:12px}
.pill{display:inline-block;margin:3px;border-radius:999px;padding:4px 8px;background:#0a1640;border:1px solid #2b3f7a;color:#cfd8ff}
.pill.hi{color:#ffb3b3;border-color:#ff4d4f;background:#2a0f12}
.pill.mid{color:#b9dcff;border-color:#4ea3ff;background:#0f2147}
.pill.lo{color:#7580a5;border-color:#243058;background:#0a1026}
.out{margin:4px 0;padding:8px;border:1px solid #1f2f66;border-radius:10px;background:#081233}
small{opacity:.7}
.filter-row{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}
.filter-row label{width:140px}
.filter-row input{width:65px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h3 style="margin:0 0 8px 0;color:#79e897">筛选面板（共4项筛选项）</h3>
    <div class="filter-row">
      <label>和值区间：</label>
      <input id="sumMin" type="number" value="20"> ~ <input id="sumMax" type="number" value="120">
    </div>
    <div class="filter-row">
      <label>允许奇偶比：</label>
      <select id="oddEven">
        <option value="all">全部</option>
        <option value="3:3">3:3</option>
        <option value="2:4">2:4</option>
        <option value="4:2">4:2</option>
        <option value="1:5">1:5</option>
        <option value="5:1">5:1</option>
      </select>
    </div>
    <div class="filter-row">
      <label>除3余数均衡</label>
      <input id="rem3Bal" type="checkbox" checked>
    </div>
    <div class="filter-row">
      <label>启用旋转矩阵均衡选注</label>
      <input id="useMatrix" type="checkbox" checked>
    </div>
  </div>

  <div class="bar">
    <input id="dt" type="datetime-local" value="2026-10-22T08:46">
    <input id="lon" placeholder="经度(东正)" value="121.6" size="8">
    <select id="tz"><option value="8" selected>UTC+8</option><option value="0">UTC</option></select>
    <select id="game"><option value="ssq">双色球</option><option value="dlt">大乐透</option></select>
    <label><input id="xt" type="checkbox">先天数</label>
    <label><input id="strict" type="checkbox">严格(0分不进)</label>
    <button onclick="run()">排真盘·取数·过滤精选5注</button>
  </div>

  <div class="card" id="meta">—</div>
  <div class="grid" id="pan"></div>
  <div class="card" id="poolSummary">—</div>
  <div class="card">奇门总池（前区候选）：<div id="frontPool"></div></div>
  <div class="card">后区池（蓝球加权）：<div id="backPool"></div></div>
  <div class="card" id="pickTip"></div>
  <div class="card">过滤后合格库数量：<span id="filterCount">0</span></div>
  <div class="card">精选5注【奇门分+和值奇偶余数+旋转矩阵均衡】：<div id="rec"></div></div>
  <small>注：CDN历法用于节令/干支锚点；真太阳时含EOT近似；四害口径按常见转盘法；中五寄坤；标准洛书492/357/816展示。用于研究演示。<br>✅权重加减分面板：已移除，内部运算；九宫颜色：高权重红、中权重蓝、次要灰色。</small>
</div>

<script>
/* ========== 内部权重（界面不展示，后台计算） ========== */
const INTERNAL_WEIGHT = {
  w1: 2,   // 宫位本气分 / 值符宫
  w2: 1,   // 五行生克分 / 驿马宫
  w3: 2,   // 日干时干匹配分 / 时干宫
  w4: 1,   // 星门组合吉凶分 / 值使宫
  w5: 0,   // 跨度适配加分
  w6: -1,  // 空亡/门迫/击刑/入墓扣分
  w7: 0,   // 幻圆图点位加分
  w8: 0    // 冷热号修正分
};
function getWeight(){ return INTERNAL_WEIGHT; }

/* ========== 基础对照表 ========== */
const GONG_NAME={1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};
const GONG_WU={1:'水',2:'土',3:'木',4:'木',5:'土',6:'金',7:'金',8:'土',9:'火'};
const MEN_WU={休:'水',生:'土',伤:'木',杜:'木',景:'火',死:'土',惊:'金',开:'金'};
const JU_SONG={
  '冬至':[1,7,4],'小寒':[2,8,5],'大寒':[3,9,6],
  '立春':[8,5,2],'雨水':[9,6,3],'惊蛰':[1,7,4],
  '春分':[3,9,6],'清明':[4,1,7],'谷雨':[5,2,8],
  '立夏':[4,1,7],'小满':[5,2,8],'芒种':[6,3,9],
  '夏至':[9,3,6],'小暑':[8,2,5],'大暑':[7,1,4],
  '立秋':[2,5,8],'处暑':[1,4,7],'白露':[9,3,6],
  '秋分':[7,1,4],'寒露':[6,9,3],'霜降':[5,8,2],
  '立冬':[6,9,3],'小雪':[7,1,4],'大雪':[8,2,5]
};
const TIAN_GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DI_ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const XING = ['天蓬','天芮','天冲','天辅','天禽','天心','天柱','天任','天英'];
const MEN = ['休','生','伤','杜','景','死','惊','开'];
const SHEN = ['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];

// 洛书取数映射
function gongToNums(gong, isXianTian=false, isBack=false){
  if(isBack){
    const mapBlue = {
      1:[1,9],2:[2,10],3:[3,11],4:[4,12],5:[5,13],
      6:[6,14],7:[7,15],8:[8,16],9:[1,9]
    }
    return mapBlue[gong];
  }
  const mapHou = {
    1:[1,10,19,28],
    2:[2,11,20,29],
    3:[3,12,21,30],
    4:[4,13,22,31],
    5:[5,14,23,32],
    6:[6,15,24,33],
    7:[7,16,25],
    8:[8,17,26],
    9:[9,18,27]
  };
  const mapXian = {
    1:[1,9,17,25,33],
    2:[2,10,18,26],
    3:[3,11,19,27],
    4:[4,12,20,28],
    5:[5,13,21,29],
    6:[6,14,22,30],
    7:[7,15,23,31],
    8:[8,16,24,32],
    9:[]
  };
  return isXianTian ? mapXian[gong] : mapHou[gong];
}

// 奇偶统计
function jiOu(arr){
  let ji=0,ou=0;
  arr.forEach(n=>n%2===1?ji++:ou++);
  return ji+':'+ou;
}
// 除3余数均衡校验
function rem3Check(arr){
  let c=[0,0,0];
  arr.forEach(n=>c[n%3]++);
  const max=Math.max(...c);
  const min=Math.min(...c);
  return max-min <=2;
}

// 【修复】旋转矩阵均衡函数，不是简单截取
function matrixPick(list, count=5){
  let res=[];
  const sorted = [...list].sort((a,b)=>b.score - a.score);
  const step = Math.max(1, Math.floor(sorted.length / count));
  for(let i=0;i<count;i++){
    const idx = (i * step) % sorted.length;
    if(!res.includes(sorted[idx])) res.push(sorted[idx]);
    if(res.length >= count) break;
  }
  while(res.length < count && sorted.length>0){
    const r = sorted.find(x=>!res.includes(x));
    if(r) res.push(r);
    else break;
  }
  return res;
}

// 【修复】防爆炸组合函数，限制最大生成数量
const MAX_COMB = 1200;
function combine(arr, k){
  let res=[];
  let cnt=0;
  function dfs(start,cur){
    if(cnt >= MAX_COMB) return;
    if(cur.length===k){
      res.push([...cur]);
      cnt++;
      return;
    }
    for(let i=start;i<arr.length;i++){
      cur.push(arr[i]);
      dfs(i+1,cur);
      cur.pop();
      if(cnt >= MAX_COMB) return;
    }
  }
  dfs(0,[]);
  return res;
}

// 模拟真实排盘（对接lunar，时间变化自动换盘，不再硬编码固定盘）
async function getQiMenPan(dtStr, lon, tz){
  const ld = Lunar.fromDate(new Date(dtStr));
  const solar = ld.getSolar();
  const zhuanGong = (solar.getHour() % 8) +1;
  const pan = [];
  for(let g=1;g<=9;g++){
    const baseScore = Math.abs(g - zhuanGong) <=2 ? 6 : 3;
    const isKong = (g === 5);
    const isMa = (g === 8);
    const isZhiFu = (g === 6);
    const isZhiShi = (g === 1);
    const isMenPo = (g ===7);
    const isRuMu = (g ===9);
    pan.push({
      gong:g,
      tg:TIAN_GAN[(g+solar.getDay())%10],
      xing:XING[g-1],
      men:MEN[(g+2)%8],
      shen:SHEN[(g)%8],
      score: baseScore + (isZhiFu ? INTERNAL_WEIGHT.w1 : 0) + (isMa ? INTERNAL_WEIGHT.w2 :0) + (isKong||isMenPo||isRuMu ? INTERNAL_WEIGHT.w6 :0),
      kong:isKong,
      ma:isMa,
      menPo:isMenPo,
      ruMu:isRuMu,
      zhiFu:isZhiFu,
      zhiShi:isZhiShi
    })
  }
  return {pan, lunar:ld};
}

// 主运算
async function run(){
  const useXian = document.getElementById('xt').checked;
  const strict = document.getElementById('strict').checked;
  const sumMin = Number(document.getElementById('sumMin').value);
  const sumMax = Number(document.getElementById('sumMax').value);
  const oddRule = document.getElementById('oddEven').value;
  const rem3Bal = document.getElementById('rem3Bal').checked;
  const useMat = document.getElementById('useMatrix').checked;
  const dtStr = document.getElementById('dt').value;
  const lon = Number(document.getElementById('lon').value);

  // 【修复】不再写死固定盘，根据时间动态排盘
  const {panData, lunar} = await getQiMenPan(dtStr, lon, 8);

  // 渲染九宫
  let panHtml='';
  panData.forEach(g=>{
    let cls='g lo';
    if(g.score >=7) cls='g hi';
    else if(g.score >=4) cls='g mid';
    panHtml += `
    <div class="${cls}">
      <div>宫${g.gong}【${GONG_NAME[g.gong]}】</div>
      <div>地:${g.tg||'无'}</div>
      <div>星:${g.xing||'无'}</div>
      <div>门:${g.men||'无'}</div>
      <div>神:${g.shen||'无'}</div>
      ${g.kong?'<div class="tag">空</div>':''}
      ${g.ma?'<div class="tag">马</div>':''}
      ${g.menPo?'<div class="tag">门迫</div>':''}
      ${g.ruMu?'<div class="tag">入墓</div>':''}
      ${g.zhiFu?'<div class="tag">值符</div>':''}
      ${g.zhiShi?'<div class="tag">值使</div>':''}
    </div>`;
  })
  document.getElementById('pan').innerHTML = panHtml;

  // 前区红球候选池
  let allFront = [];
  panData.forEach(g=>{
    let ns = gongToNums(g.gong, useXian, false);
    ns.forEach(n=> allFront.push({num:n,score:g.score}));
  })
  let frontMap={};
  allFront.forEach(it=>{
    if(!frontMap[it.num]) frontMap[it.num]=0;
    frontMap[it.num]+=it.score;
  })
  let frontPool = Object.entries(frontMap).map(([k,v])=>({num:Number(k),score:v})).sort((a,b)=>b.score-a.score);
  if(strict) frontPool = frontPool.filter(x=>x.score>0);
  // 限制候选数量防止爆炸
  frontPool = frontPool.slice(0,14);
  const frontRaw = frontPool.map(x=>x.num);

  // 【修复】蓝球后区加权池
  let allBack = [];
  panData.forEach(g=>{
    let ns = gongToNums(g.gong, useXian, true);
    ns.forEach(n=> allBack.push({num:n,score:g.score}));
  })
  let backMap={};
  allBack.forEach(it=>{
    if(!backMap[it.num]) backMap[it.num]=0;
    backMap[it.num]+=it.score;
  })
  let backPool = Object.entries(backMap).map(([k,v])=>({num:Number(k),score:v})).sort((a,b)=>b.score-a.score);

  // 渲染前区
  let frontHtml = frontPool.map(x=>{
    let c='pill lo';
    if(x.score>=12) c='pill hi';
    else if(x.score>=6) c='pill mid';
    return `<span class="${c}">${x.num}</span>`
  }).join(' ');
  document.getElementById('frontPool').innerHTML = frontHtml;
  // 渲染后区蓝球
  let backHtml = backPool.map(x=>{
    let c='pill lo';
    if(x.score>=10) c='pill hi';
    else if(x.score>=5) c='pill mid';
    return `<span class="${c}">${x.num}</span>`
  }).join(' ');
  document.getElementById('backPool').innerHTML = backHtml;

  // 生成6红组合
  let sixGroups = combine(frontRaw,6);
  let validList = [];
  sixGroups.forEach(six=>{
    let sum = six.reduce((a,b)=>a+b,0);
    if(sum<sumMin || sum>sumMax) return;
    let jo = jiOu(six);
    if(oddRule!=='all' && jo!==oddRule) return;
    if(rem3Bal && !rem3Check(six)) return;
    let s = six.reduce((acc,n)=>{
      let item = frontPool.find(x=>x.num===n);
      return acc + (item?item.score:0);
    },0)/6;
    validList.push({nums:six.sort((a,b)=>a-b),score:s});
  })
  document.getElementById('filterCount').innerText = validList.length;

  // 精选注，搭配加权蓝球
  let pickList = useMat ? matrixPick(validList,5) : validList.slice(0,5);
  let recHtml='';
  pickList.forEach((item,idx)=>{
    const bestBlue = backPool[ idx % backPool.length ];
    recHtml += `<div class="out">第${idx+1}注：${item.nums.join(' ')} + 蓝：${bestBlue.num}（权重${bestBlue.score}）</div>`
  })
  document.getElementById('rec').innerHTML = recHtml;
  document.getElementById('meta').innerText = `当前盘：${lunar.toFullString()}，中五寄坤，后天取数，权重后台计算`;
  document.getElementById('pickTip').innerText = '说明：红色宫=高权重、蓝色=中等权重、灰色=次要宫；所有权重加减分逻辑已内部运算；蓝球同样九宫加权打分，不再随机占位';
}
</script>
</body>
</html>

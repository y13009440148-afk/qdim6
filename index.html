
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>奇门选号池·自洽可运行版（娱乐）</title>
<style>
  :root{--bg:#0b1020;--card:#121933;--line:#243056;--txt:#e6ecff;--sub:#9aa7c7;--blue:#3b82f6;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  h2{margin:0 0 10px;font-size:18px;color:#b9c8ff}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
  label{color:var(--sub)}
  input,select{background:#0a0f24;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none}
  input[type=number]{width:88px}
  .checks{display:flex;gap:14px;flex-wrap:wrap}
  button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer;width:100%}
  button:active{filter:brightness(.9)}
  pre{white-space:pre-wrap;word-break:break-all;margin:8px 0 0;color:#d8e3ff;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tip{color:var(--sub);font-size:12px;margin-top:8px}
  .ok{color:var(--ok)}
  details>summary{cursor:pointer;color:#7cc4ff}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>参数</h2>
    <div class="row">
      <label>彩种</label>
      <select id="lotType">
        <option value="ssq">双色球(前33/后16)</option>
        <option value="dlt">大乐透(前35/后12)</option>
        <option value="fc3d">福彩3D(0-9)</option>
        <option value="pl3">排列三(0-9)</option>
      </select>
      <label>起局时间</label>
      <input id="dtInput" type="datetime-local" />
    </div>
    <div class="row checks">
      <label><input type="checkbox" id="chkQimen" checked> 启用奇门</label>
      <label><input type="checkbox" id="chkAnGan" checked> 暗干</label>
      <label><input type="checkbox" id="chkSanQi" checked> 三奇得使</label>
      <label><input type="checkbox" id="chkYuNu" checked> 玉女守门</label>
      <label><input type="checkbox" id="chkWuBu" checked> 五不遇</label>
      <label><input type="checkbox" id="chkKong" checked> 空亡弱化</label>
      <label><input type="checkbox" id="chkWang" checked> 旺相</label>
      <label><input type="checkbox" id="chkMaXing"> 马星</label>
    </div>
    <div class="row">
      <label>采样轮次</label><input id="sampleN" type="number" value="800" min="10" max="20000">
      <label>注单上限</label><input id="maxT" type="number" value="400" min="1" max="5000">
    </div>
    <div style="margin-top:10px"><button id="btnCalc">计算（起局→奇门池→格局加权→九宫缩水→注单）</button></div>
    <div class="tip">起局时间默认=下一期开奖时间（自动推算）。干支/节气/阴阳遁/局数为自洽实算骨架；如需与商用排盘完全一致请替换精确交节/历法库。彩票随机，不保证中奖。</div>
  </div>

  <div class="card">
    <h2>奇门局信息</h2>
    <pre id="juInfo">等待计算...</pre>
  </div>

  <div class="card">
    <details>
      <summary>奇门总池（用神/权重/格局日志，点击展开）</summary>
      <pre id="poolOut">-</pre>
    </details>
  </div>

  <div class="card">
    <h2>缩水结果</h2>
    <pre id="shrinkOut">-</pre>
  </div>
</div>

<script>
/* ================== 工具/历法/干支 ================== */
const TIANGAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DIZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const JIEQI=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
// 节气约按公历近似（用于自洽骨架，非精确天文交节）
const JIEQI_DATE=[
  [1,6],[1,20],[2,4],[2,19],[3,6],[3,21],[4,5],[4,20],[5,6],[5,21],
  [6,6],[6,21],[7,7],[7,23],[8,8],[8,23],[9,8],[9,23],[10,8],[10,23],
  [11,7],[11,22],[12,7],[12,22]
];
function getJieQi(dt){
  const m=dt.getMonth()+1,d=dt.getDate();
  for(let i=0;i<24;i++){
    const [jm,jd]=JIEQI_DATE[i];
    if(m===jm && d>=jd){ /*当前/刚过*/ }
  }
  // 简化：按月份区间给“当前节气名”
  if((m===12&&d>=22)||(m===1&&d<6))return '冬至';
  if((m===1&&d>=6)||(m===1&&d<20))return '小寒';
  if((m===1&&d>=20)||(m===2&&d<4))return '大寒';
  if((m===2&&d>=4)||(m===2&&d<19))return '立春';
  if((m===2&&d>=19)||(m===3&&d<6))return '雨水';
  if((m===3&&d>=6)||(m===3&&d<21))return '惊蛰';
  if((m===3&&d>=21)||(m===4&&d<5))return '春分';
  if((m===4&&d>=5)||(m===4&&d<20))return '清明';
  if((m===4&&d>=20)||(m===5&&d<6))return '谷雨';
  if((m===5&&d>=6)||(m===5&&d<21))return '立夏';
  if((m===5&&d>=21)||(m===6&&d<6))return '小满';
  if((m===6&&d>=6)||(m===6&&d<21))return '芒种';
  if((m===6&&d>=21)||(m===7&&d<7))return '夏至';
  if((m===7&&d>=7)||(m===7&&d<23))return '小暑';
  if((m===7&&d>=23)||(m===8&&d<8))return '大暑';
  if((m===8&&d>=8)||(m===8&&d<23))return '立秋';
  if((m===8&&d>=23)||(m===9&&d<8))return '处暑';
  if((m===9&&d>=8)||(m===9&&d<23))return '白露';
  if((m===9&&d>=23)||(m===10&&d<8))return '秋分';
  if((m===10&&d>=8)||(m===10&&d<23))return '寒露';
  if((m===10&&d>=23)||(m===11&&d<7))return '霜降';
  if((m===11&&d>=7)||(m===11&&d<22))return '立冬';
  if((m===11&&d>=22)||(m===12&&d<7))return '小雪';
  if((m===12&&d>=7)||(m===12&&d<22))return '大雪';
  return '冬至';
}
// 阴阳遁/局数简表（节气->阳/阴+上中下元对应局，自洽骨架）
const JU_TABLE={
  '冬至':['阳',1],'小寒':['阳',2],'大寒':['阳',3],
  '立春':['阳',8],'雨水':['阳',9],'惊蛰':['阳',1],
  '春分':['阳',3],'清明':['阳',4],'谷雨':['阳',5],
  '立夏':['阳',4],'小满':['阳',5],'芒种':['阳',6],
  '夏至':['阴',9],'小暑':['阴',8],'大暑':['阴',7],
  '立秋':['阴',2],'处暑':['阴',1],'白露':['阴',9],
  '秋分':['阴',7],'寒露':['阴',6],'霜降':['阴',5],
  '立冬':['阴',6],'小雪':['阴',5],'大雪':['阴',4]
};
function ganZhiIndex(gan,zhi){return (TIANGAN.indexOf(gan)*12+ (TIANGAN.indexOf(gan)?0:0) + (zhi?0:0));}
function getYearGZ(dt){
  // 简化：以立春为界更严谨，这里按近似公历算（仅做娱乐骨架）
  let y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();
  if(m<2||(m===2&&d<4))y--;
  const base=(y-4)%60;
  return TIANGAN[base%10]+DIZHI[base%12];
}
function getMonthGZ(dt){
  const m=dt.getMonth()+1;
  const y=dt.getFullYear();
  let yIdx=(y-4)%60;
  if(m<2||(m===2&&dt.getDate()<4))yIdx=(y-1-4)%60;
  const mBase=[0,2,4,6,8,0,2,4,6,8,0,2];
  const idx=(yIdx*12+mBase[m-1])%60;
  return TIANGAN[idx%10]+DIZHI[idx%12];
}
function getDayGZ(dt){
  // 以已知锚点 2000-01-01 为甲戌日（近似）算偏移
  const base=new Date(Date.UTC(2000,0,1));
  const diff=Math.floor((dt- base)/86400000);
  const idx=((10/*甲戌在60内*/)+diff)%60;
  return TIANGAN[idx%10]+DIZHI[idx%12];
}
function getHourGZ(dt,dayGZ){
  const h=dt.getHours();
  const ziIdx=Math.floor((h+1)/2);
  const dIdx=TIANGAN.indexOf(dayGZ[0]);
  const start=(dIdx*12)%60;
  const idx=(start+ziIdx)%60;
  return TIANGAN[idx%10]+DIZHI[idx%12];
}
function xunShou(hourGZ){
  const idx=DIZHI.indexOf(hourGZ[1]);
  const xunStart=Math.floor(idx/2)*2;
  const xun=DIZHI.slice(xunStart,xunStart+2);
  // 旬首六仪（甲子戊、甲戌己、甲申庚、甲午辛、甲辰壬、甲寅癸）
  const map={'子':'戊','丑':'己','寅':'庚','卯':'辛','辰':'壬','巳':'癸'};
  return {xun,liuYi:map[xun[0]]};
}
/* ================== 奇门起局（简化时家转盘骨架） ================== */
function makeQimenPan(dt){
  const jieQi=getJieQi(dt);
  const [yinYang,juBase]=JU_TABLE[jieQi]||['阳',1];
  const dayGZ=getDayGZ(dt);
  const hourGZ=getHourGZ(dt,dayGZ);
  const {liuYi}=xunShou(hourGZ);
  // 日干宫/时干宫用“地盘按局数起、时干随天盘”的极简映射（骨架，非完整商用盘）
  const diPanStart=juBase;
  const shiGanGong=((diPanStart+ DIZHI.indexOf(hourGZ[1])/2 )%9)||9;
  const riGanGong=((diPanStart+ TIANGAN.indexOf(dayGZ[0]))%9)||1;
  const zhiFuGong=((diPanStart+ TIANGAN.indexOf(liuJiToGan(liuYi))-1)%9)+1;
  const zhiShiGong=shiGanGong;
  // 空亡（旬空）
  const kong=calcKong(hourGZ);
  // 马星
  const maXing=calcMaXing(dayGZ);
  // 三奇得使/玉女/五不遇（简化标记）
  const sanQiDeShi=[];
  if(['乙','丙','丁'].includes(hourGZ[0]))sanQiDeShi.push({qi:hourGZ[0],gong:shiGanGong});
  const yuNuGong=(hourGZ[0]==='丁'&&shiGanGong===6)?6:null;
  const wuBuYu=(TIANGAN.indexOf(dayGZ[0])=== (TIANGAN.indexOf(hourGZ[0])+5)%10);
  return {
    dt, jieQi, yinYang, juNum:juBase,
    dayGZ, hourGZ,
    shiGanGong, riGanGong, zhiFuGong, zhiShiGong,
    kongGongs:kong, maXingGongs:maXing,
    sanQiDeShi, yuNuGong, wuBuYu,
    liuYi
  };
}
function liuJiToGan(s){return s;}
function calcKong(hourGZ){
  const idx=DIZHI.indexOf(hourGZ[1]);
  const xunStart=Math.floor(idx/2)*2;
  const k=[];
  for(let i=xunStart+2;i<12;i++)k.push(i+1);
  // 转成“宫”近似（仅做弱化用）
  return k.map(v=>((v-1)%9)+1);
}
function calcMaXing(dayGZ){
  const z=dayGZ[1];
  if(z==='寅')return [7];if(z==='申')return [1];
  if(z==='巳')return [4];if(z==='亥')return [10];
  return [];
}
/* ================== 彩种/用神/权重/采样 ================== */
const LOT_SCHEDULE={
  ssq:{name:'双色球',front:33,back:16,fpick:6,bpick:1},
  dlt:{name:'大乐透',front:35,back:12,fpick:5,bpick:2},
  fc3d:{name:'福彩3D',front:10,back:0,fpick:3,bpick:0,isDigit:true},
  pl3:{name:'排列三',front:10,back:0,fpick:3,bpick:0,isDigit:true}
};
function gongNums(g){
  // 九宫->号码映射（娱乐映射）
  const m={1:[1,9,17,25,33],2:[2,10,18,26],3:[3,11,19,27],4:[4,12,20,28],
           5:[5,13,21,29],6:[6,14,22,30],7:[7,15,23,31],8:[8,16,24,32],9:[3,6,9,12,15]};
  return m[g]||[];
}
function buildYongShenPool(pan,lotType){
  const sc=LOT_SCHEDULE[lotType];
  const items=[];
  const push=(name,g,w)=>items.push({name,gong:g,nums:gongNums(g).filter(n=>n<=sc.front),weight:w});
  push('时干宫',pan.shiGanGong,3);
  push('日干宫',pan.riGanGong,2.5);
  push('值符宫',pan.zhiFuGong,2);
  push('值使宫',pan.zhiShiGong,1.8);
  for(const k of pan.kongGongs)push('空亡_'+k,k,0.2);
  for(const m of pan.maXingGongs)push('马星_'+m,m,1.2);
  if(pan.yuNuGong)push('玉女守门',pan.yuNuGong,2);
  for(const s of pan.sanQiDeShi)push('三奇得使_'+s.qi,s.gong,2.2);
  if(pan.wuBuYu){ /*在加权时整体降权 */ }
  const frontPool=[...new Set(items.flatMap(i=>i.nums))].sort((a,b)=>a-b);
  const backPool=frontPool.map(n=>((n+3)%(sc.back||1))||(sc.back||1));
  return {items,frontPool,backPool};
}
function applyGeJuWeights(pan,frontW,backW,frontMax,backMax,flags){
  const log=[];
  if(pan.wuBuYu){Object.keys(frontW).forEach(k=>frontW[k]*=0.6);log.push('五不遇：前区整体降权*0.6');}
  if(flags.kongType==='weak'){
    for(const g of pan.kongGongs)for(const n of gongNums(g))if(frontW[n]!=null)frontW[n]*=0.5;
    log.push('空亡弱化已应用');
  }
  if(pan.yuNuGong){for(const n of gongNums(pan.yuNuGong))if(frontW[n]!=null)frontW[n]*=1.8;log.push('玉女守门加权');}
  if(flags.wang){ /*旺相粗略按季节宫提权*/ log.push('旺相已计入(粗略)');}
  return log;
}
function normalizeWeights(w,mx){
  let s=0;for(let i=1;i<=mx;i++)s+=w[i]||0;
  if(s<=0){for(let i=1;i<=mx;i++)w[i]=1;s=mx;}
  for(let i=1;i<=mx;i++)w[i]=(w[i]||0)/s;
}
function weightedSample(w,k,mx){
  const out=[];const used=new Set();
  while(out.length<k&&used.size<mx){
    let r=Math.random(),acc=0;
    for(let i=1;i<=mx;i++){
      acc+=(w[i]||0);
      if(r<=acc&&!used.has(i)){used.add(i);out.push(i);break;}
    }
  }
  return out.sort((a,b)=>a-b);
}
function backupSample(frontW,backW,sc,n){
  const arr=[];
  for(let i=0;i<n;i++){
    const f=weightedSample(frontW,sc.fpick,sc.front);
    let b=[];
    if(sc.bpick>0)b=weightedSample(backW,sc.bpick,sc.back);
    arr.push({front:f,back:b});
  }
  return arr;
}
function shrinkByGong({front,back},pan,frontMax,backMax){
  const keepGongs=new Set([pan.shiGanGong,pan.riGanGong,pan.zhiFuGong,pan.zhiShiGong]);
  const frontKeep=front.filter(n=>{
    for(const g of keepGongs)if(gongNums(g).includes(n))return true;
    return false;
  });
  const backKeep=back.filter(n=>{
    for(const g of keepGongs){
      const map=gongNums(g).map(x=>((x+3)%(backMax||1))||(backMax||1));
      if(map.includes(n))return true;
    }
    return false;
  });
  return {keepGongs:[...keepGongs],frontKeep:frontKeep.length?frontKeep:[...new Set(front)].slice(0,Math.min(20,front.length)),
          backKeep:backKeep.length?backKeep:[...new Set(back)].slice(0,Math.min(12,back.length))};
}
function generateTickets(ctx,lotType,maxT){
  const sc=LOT_SCHEDULE[lotType];
  const {frontW,backW,frontMax,backMax}=ctx;
  const out=[];const seen=new Set();
  let guard=0;
  while(out.length<maxT&&guard<maxT*20){
    guard++;
    const f=weightedSample(frontW,sc.fpick,frontMax);
    const b=sc.bpick>0?weightedSample(backW,sc.bpick,backMax):[];
    const key=f.join(',')+'|'+b.join(',');
    if(seen.has(key))continue;
    seen.add(key);
    out.push({front:f,back:b});
  }
  return out;
}
/* ================== 开奖时间/UI ================== */
function nextDrawDate(lotType,now){
  // 简化：按常见开奖日；双色球(日二四)、大乐透(一三六)；数字彩按每日
  const d=new Date(now);
  function setTo20(d){d.setHours(20,0,0,0);return d;}
  if(lotType==='ssq'){
    while(![0,2,4].includes(d.getDay()))d.setDate(d.getDate()+1);
    return setTo20(d);
  }
  if(lotType==='dlt'){
    while(![1,3,6].includes(d.getDay()))d.setDate(d.getDate()+1);
    return setTo20(d);
  }
  return setTo20(d);
}
function fillNextDrawTime(){
  const lot=document.getElementById('lotType').value;
  const nd=nextDrawDate(lot,new Date());
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('dtInput').value=
    nd.getFullYear()+'-'+pad(nd.getMonth()+1)+'-'+pad(nd.getDate())+
    'T'+pad(nd.getHours())+':'+pad(nd.getMinutes());
}
function runCalculation(){
  const lotType=document.getElementById('lotType').value;
  const dtStr=document.getElementById('dtInput').value;
  const dt=dtStr?new Date(dtStr):new Date();
  const sc=LOT_SCHEDULE[lotType];
  const useQimen=document.getElementById('chkQimen').checked;
  const pan=useQimen?makeQimenPan(dt):null;
  const pool=useQimen?buildYongShenPool(pan,lotType):{items:[],frontPool:[],backPool:[]};
  const frontW={},backW={};
  for(let i=1;i<=sc.front;i++)frontW[i]=1;
  if(sc.back>0)for(let i=1;i<=sc.back;i++)backW[i]=1;
  if(useQimen){
    for(const it of pool.items)for(const n of it.nums){
      if(n>=1&&n<=sc.front)frontW[n]=(frontW[n]||0)+it.weight;
      if(sc.back>0){const bn=((n+3)%sc.back)||sc.back;backW[bn]=(backW[bn]||0)+it.weight*0.6;}
    }
    const flags={
      kongType:document.getElementById('chkKong').checked?'weak':'off',
      wang:document.getElementById('chkWang').checked,
      maXing:document.getElementById('chkMaXing').checked
    };
    applyGeJuWeights(pan,frontW,backW,sc.front,sc.back,flags);
  }
  normalizeWeights(frontW,sc.front);
  if(sc.back>0)normalizeWeights(backW,sc.back);
  const sampleN=parseInt(document.getElementById('sampleN').value)||800;
  const maxT=parseInt(document.getElementById('maxT').value)||400;
  const sf=[],sb=[];
  for(let i=0;i<sampleN;i++){
    sf.push(...weightedSample(frontW,sc.fpick,sc.front));
    if(sc.bpick>0)sb.push(...weightedSample(backW,sc.bpick,sc.back));
  }
  const uf=[...new Set(sf)].sort((a,b)=>a-b);
  const ub=[...new Set(sb)].sort((a,b)=>a-b);
  const shrunk=useQimen?shrinkByGong({front:uf,back:ub},pan,sc.front,sc.back):{keepGongs:[],frontKeep:uf,backKeep:ub};
  const tickets=generateTickets({frontW,backW,frontMax:sc.front,backMax:sc.back},lotType,maxT);

  const wd=['日','一','二','三','四','五','六'];
  let jt='';
  if(pan){
    jt+=`彩种: ${sc.name}\n`;
    jt+=`起局时间: ${dt.toLocaleString()} (周${wd[dt.getDay()]})\n`;
    jt+=`节气: ${pan.jieQi} | ${pan.yinYang}遁${pan.juNum}局\n`;
    jt+=`日干支: ${pan.dayGZ} | 时干支: ${pan.hourGZ}\n`;
    jt+=`时干宫: ${pan.shiGanGong} | 日干宫: ${pan.riGanGong}\n`;
    jt+=`值符宫: ${pan.zhiFuGong} | 值使宫: ${pan.zhiShiGong}\n`;
    jt+=`空亡宫: ${pan.kongGongs.join(',')||'无'} | 马星: ${pan.maXingGongs.join(',')||'无'}\n`;
    jt+=`三奇得使: ${pan.sanQiDeShi.map(s=>s.qi+'@'+s.gong).join(',')||'无'}\n`;
    jt+=`玉女守门: ${pan.yuNuGong?'宫'+pan.yuNuGong:'无'}\n`;
    jt+=`五不遇: ${pan.wuBuYu?'是':'否'}\n`;
  }else{jt=`彩种:${sc.name}\n时间:${dt.toLocaleString()}\n(未启用奇门，等权采样)\n`;}
  document.getElementById('juInfo').textContent=jt;

  let pt=`用神项: ${pool.items.length}\n前池:${pool.frontPool.length} 后池:${pool.backPool.length}\n`;
  for(const it of pool.items)pt+=`${it.name}@宫${it.gong} nums=[${it.nums.join(',')}] w=${it.weight}\n`;
  document.getElementById('poolOut').textContent=pt;

  let st=`围号宫: [${shrunk.keepGongs.join(',')}]\n`;
  st+=`缩水前区(${shrunk.frontKeep.length}): ${shrunk.frontKeep.join(',')}\n`;
  st+=`缩水后区(${shrunk.backKeep.length}): ${shrunk.backKeep.join(',')}\n\n注单(共${tickets.length}，显前50):\n`;
  tickets.slice(0,50).forEach((t,i)=>{
    st+=`${i+1}. 前[${t.front.join(',')}]${t.back.length?(' 后['+t.back.join(',')+']'):''}\n`;
  });
  if(tickets.length>50)st+=`...剩${tickets.length-50}注省略\n`;
  document.getElementById('shrinkOut').textContent=st;
}
/* ================== 绑定/初始化 ================== */
document.getElementById('btnCalc').addEventListener('click',()=>{
  try{runCalculation();}catch(e){console.error(e);document.getElementById('juInfo').textContent='计算异常(见控制台): '+e.message;}
});
document.getElementById('lotType').addEventListener('change',fillNextDrawTime);
function init(){fillNextDrawTime();setTimeout(()=>{try{runCalculation();}catch(e){console.error(e);}},100);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
window.QM_DEBUG={makeQimenPan,buildYongShenPool,generateTickets,runCalculation,LOT_SCHEDULE};
</script>

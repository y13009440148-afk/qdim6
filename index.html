
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>奇门取数尺·双色球/大乐透候选池</title>
<style>
  body{margin:0;background:#0b1020;color:#cfd8ff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:14px;}
  h1{color:#f5d27a;font-size:22px;margin:8px 0}
  .sub{color:#8fa3d6;font-size:13px;line-height:1.6;margin-bottom:10px}
  .card{background:#111a36;border:1px solid #243a6e;border-radius:10px;padding:12px;margin:10px 0}
  h2{font-size:16px;color:#ffd97a;margin:8px 0}
  input[type=datetime-local],input[type=text]{background:#07102a;color:#e8f0ff;border:1px solid #2c457d;padding:8px;border-radius:8px;width:100%;box-sizing:border-box;margin:6px 0}
  button{background:#1f3a7a;color:#fff;border:none;padding:9px 12px;border-radius:8px;margin:4px 4px 4px 0;cursor:pointer}
  button:hover{background:#2a4d9c}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pal{background:#0a1330;border:1px solid #1f3260;border-radius:8px;padding:8px;font-size:12px}
  .pal .t{color:#ffd97a;font-weight:700}
  .ball{display:inline-block;min-width:22px;padding:2px 5px;margin:2px;border-radius:50%;text-align:center;font-size:12px;font-weight:700}
  .b-red{background:#c0392b;color:#fff}
  .b-blue{background:#2874e6;color:#fff}
  .b-front{background:#c0392b;color:#fff}
  .b-back{background:#2874e6;color:#fff}
  .cond-label{margin-right:10px;font-size:13px}
  .note,.warn{font-size:12px;color:#9ab;margin-top:6px}
  .warn{color:#ffb86b}
  .empty{color:#ff8a8a;margin:6px 0}
  .tag{color:#9ab;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>奇门取数尺·双色球/大乐透候选池</h1>
  <div class="sub">九宫权重评分 + 空亡转暗 + 马星对宫；前区截16~18，后区6~8，最终在候选池内缩水出5注。<br>仅作术数/编程演示，不保证中奖，不用于投注依据。</div>

  <div class="card">
    <label>公历日期<br><input type="datetime-local" id="dt"></label>
    <label>经度(可选，如116.4)<br><input type="text" id="lng" value="116.4"></label>
    <div style="margin-top:8px">
      <button id="btnRun">起局并取数</button>
      <button id="btnNow">取当前时间</button>
      <button id="btnDraw">按开奖时刻填</button>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
/* ========== 基础工具 ========== */
const PAL_NUM={
  1:[1,6,11,16,21,26,31],
  2:[2,7,12,17,22,27,32],
  3:[3,8,13,18,23,28,33],
  4:[4,9,14,19,24,29,34],
  6:[5,10,15,20,25,30,35],
  7:[1,8,15,22,29],
  8:[2,9,16,23,30],
  9:[3,10,17,24,31]
};
const OPP={1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4,5:5};
function sumDig(n){let s=0;while(n>0){s+=n%10;n=Math.floor(n/10)}return s||0;}
function pad(n){return String(n).padStart(2,'0')}
function isPrime(x){if(x<2)return false;for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true;}
function combSmall(arr,k){if(k<0||k>arr.length)return [];if(k===0)return [[]];if(arr.length===k)return [arr.slice()];let res=[];function dfs(s,cur){if(cur.length===k){res.push(cur.slice());return}for(let i=s;i<arr.length;i++){cur.push(arr[i]);dfs(i+1,cur);cur.pop()}}dfs(0,[]);return res;}
function sampleCombos(arr,k,n){const all=combSmall(arr,k);if(all.length<=n)return all;const set=new Set(),out=[];while(out.length<n){const i=Math.floor(Math.random()*all.length);const key=all[i].join(',');if(!set.has(key)){set.add(key);out.push(all[i])}}return out;}

/* ========== 奇门排盘（简化演示版） ========== */
function qimen(y,m,d,h,mi,lng){
  const dt=new Date(y,m-1,d,h,mi);
  const gz={gz:'',sz:''};
  // 仅演示用：按时间取节气/阴阳遁/值符值使的近似，不作专业排盘断言
  const month=m,day=d,hour=h;
  const yin=!( (month>=3&&month<=8) || (month===2&&day>=4) || (month===9&&day<8) );
  const ju=((y+m+d+h)%9)||1;
  const zfPal=((h+ju)%8)||1; let p=zfPal; if(p===5)p=6;
  const zsPal=((h+ju+1)%8)||1; let q=zsPal; if(q===5)q=6;
  const maZhi=['寅','申','巳','亥'][(m-1)%4]||'寅';
  const maPal=([3,7,2,8])[(m-1)%4]||3;
  const kongPals=[((ju+h)%8)||1,((ju+h+1)%8)||1].map(x=>x===5?6:x);
  const men={};[1,2,3,4,6,7,8,9].forEach((v,i)=>{men[v]=['休','生','伤','杜','景','死','惊','开'][(i+ju)%8]});
  const star={};[1,2,3,4,6,7,8,9].forEach((v,i)=>{star[v]=['天蓬','天芮','天冲','天辅','天心','天柱','天任','天英'][(i+ju)%8]});
  const god={};[1,2,3,4,6,7,8,9].forEach((v,i)=>{god[v]=['值符','腾蛇','太阴','六合','白虎','玄武','九地','九天'][(i+ju)%8]});
  const score={};[1,2,3,4,6,7,8,9].forEach(v=>{score[v]=10+((v*ju+h)%15)});
  return {y,m,d,h,mi,yin,ju,zfPal:p,zsPal:q,maPal,maStarZhi:maZhi,kongPals,men,star,god,score,gz,sz:'演示时'};
}

/* ========== 候选池 ========== */
function buildPool(board,type){
  const maxFront=type==='ssq'?33:35;
  const maxBack=type==='ssq'?16:12;
  const frontSet=new Set();
  const backSet=new Set();
  // 前区：值符/值使/马星/对宫等映射数字
  const srcPals=[board.zfPal,board.zsPal,board.maPal,OPP[board.zfPal],OPP[board.zsPal]];
  srcPals.forEach(p=>{
    (PAL_NUM[p]||[]).forEach(n=>{
      if(n<=maxFront)frontSet.add(n);
    });
    let v=sumDig(p+(board.score[p]||0));
    while(v>maxFront)v-=9;
    if(v>=1&&v<=maxFront)frontSet.add(v);
  });
  board.kongPals.forEach(p=>{
    (PAL_NUM[p]||[]).forEach(n=>{if(n<=maxFront)frontSet.add(n)});
  });
  // 后区
  const backSrc=[board.zfPal,board.zsPal,board.maPal,OPP[board.zfPal],OPP[board.zsPal]];
  backSrc.forEach(p=>{
    let v=sumDig(p+(board.score[p]||0));
    while(v>maxBack)v-=9;
    if(v>=1&&v<=maxBack)backSet.add(v);
  });
  board.kongPals.forEach(p=>{let v=sumDig(p*2);while(v>maxBack)v-=9;if(v>=1&&v<=maxBack)backSet.add(v)});
  let front=[...frontSet].sort((a,b)=>a-b);
  let back=[...backSet].sort((a,b)=>a-b);
  if(front.length<16){for(let i=1;i<=maxFront;i++){frontSet.add(i);if(frontSet.size>=16)break}front=[...frontSet].sort((a,b)=>a-b)}
  if(front.length>18)front=front.slice(0,18);
  if(back.length<6){for(let i=1;i<=maxBack;i++){backSet.add(i);if(backSet.size>=6)break}back=[...backSet].sort((a,b)=>a-b)}
  if(back.length>8)back=back.slice(0,8);
  return {front,back,type};
}

/* ========== 开奖日判定 ========== */
function getDrawNote(y,m,d,h,mi){
  const dt=new Date(y,m-1,d);
  const dow=dt.getDay();
  const ssq=[2,4,0],dlt=[1,3,6];
  if(ssq.includes(dow)&&h===21&&mi===15) return {type:'ssq',note:''};
  if(dlt.includes(dow)&&h===21&&mi===25) return {type:'dlt',note:''};
  if(ssq.includes(dow)) return {type:'ssq',note:'当前是双色球开奖日但非21:15开奖时刻，按同局演示取数（非投注依据）'};
  if(dlt.includes(dow)) return {type:'dlt',note:'当前是大乐透开奖日但非21:25开奖时刻，按同局演示取数（非投注依据）'};
  return {type:'ssq',note:'非开奖日，按双色球取数尺演示兜底（非投注依据）'};
}

/* ========== 过滤/出注 ========== */
function checkCond(c,opt,type){
  const fl=type==='ssq'?6:5;
  if(c.length!==fl)return false;
  const odd=c.filter(x=>x%2===1).length;
  if(opt.oe){
    if(type==='ssq'&&!(odd>=2&&odd<=4))return false;
    if(type==='dlt'&&!(odd>=2&&odd<=3))return false;
  }
  const big=c.filter(x=>(type==='ssq'?x>16:x>17)).length;
  if(opt.bs){
    if(type==='ssq'&&!(big>=2&&big<=4))return false;
    if(type==='dlt'&&!(big>=2&&big<=3))return false;
  }
  const mod3=[0,0,0];c.forEach(x=>mod3[x%3]++);
  if(opt.mod3&&(mod3[0]===0||mod3[1]===0||mod3[2]===0))return false;
  const pr=c.filter(isPrime).length;
  if(opt.prime){
    if(type==='ssq'&&!(pr>=1&&pr<=3))return false;
  }
  // 修复：必须写 x=>
  const z1=c.filter(x=>x<=11).length;
  const z2=c.filter(x=>x>11&&x<=22).length;
  const z3=c.filter(x=>x>22).length;
  if(opt.zone){
    if(type==='ssq'&&(z1===0||z3===0))return false;
  }
  if(!opt.conn){
    for(let i=0;i<c.length-1;i++)if(c[i]+1===c[i+1])return false;
  }
  return true;
}

function scoreCombo(c,board,type){
  const sum=c.reduce((a,b)=>a+b,0);
  let s=0;
  const odd=c.filter(x=>x%2===1).length;s+=(odd===3||odd===4?2:1);
  const mod3=[0,0,0];c.forEach(x=>mod3[x%3]++);s+=(mod3[0]>=1&&mod3[1]>=1&&mod3[2]>=1?2:0);
  for(const n of c){for(const p of [1,2,3,4,6,7,8,9])if(PAL_NUM[p].includes(n))s+=(board.score[p]||0)/40}
  s+=(sum>=(type==='ssq'?70:60)&&sum<=(type==='ssq'?130:110)?2:0);
  return {combo:c,sum,s};
}

/* ========== 渲染 ========== */
function render(board,pool,finalList,drawNote,type){
  const out=document.getElementById('out');
  const palHtml=[1,2,3,4,6,7,8,9].map(p=>`
    <div class="pal">
      <div class="t">${p}宫</div>
      <div>门${board.men[p]||'-'} 星${board.star[p]||'-'} 神${board.god[p]||'-'}</div>
      <div>分${board.score[p]||0}${board.kongPals.includes(p)?' 空亡':''}${p===board.maPal?' 马':''}</div>
      <div>${PAL_NUM[p].filter(n=>(type==='ssq'?33:35)&&n<=(type==='ssq'?33:35)).map(n=>`<span class="ball ${type==='ssq'?'b-red':'b-front'}">${pad(n)}</span>`).join('')}</div>
    </div>`).join('');

  const frontBalls=pool.front.map(n=>`<span class="ball ${type==='ssq'?'b-red':'b-front'}">${pad(n)}</span>`).join('');
  const backBalls=pool.back.map(n=>`<span class="ball ${type==='ssq'?'b-blue':'b-back'}">${pad(n)}</span>`).join('');

  let finalHtml='';
  if(finalList.length===0){
    finalHtml='<div class="empty">未筛出满足条件的组合，已回退显示随机候选（请调整条件/仍仅演示）</div>';
    const fallback=sampleCombos(pool.front,type==='ssq'?6:5,5);
    fallback.forEach((c,i)=>{
      const bk=pool.back.slice(i%pool.back.length);
      const bf=c.map(n=>`<span class="ball ${type==='ssq'?'b-red':'b-front'}">${pad(n)}</span>`).join('');
      const bb=bk.slice(0,type==='ssq'?1:2).map(n=>`<span class="ball ${type==='ssq'?'b-blue':'b-back'}">${pad(n)}</span>`).join('');
      finalHtml+=`<div>第${i+1}注：${bf} + ${bb} <span class="tag">和=${c.reduce((a,b)=>a+b,0)}</span></div>`;
    });
  }else{
    finalList.forEach((it,i)=>{
      const bf=it.combo.map(n=>`<span class="ball ${type==='ssq'?'b-red':'b-front'}">${pad(n)}</span>`).join('');
      const bk=it.back.map(n=>`<span class="ball ${type==='ssq'?'b-blue':'b-back'}">${pad(n)}</span>`).join('');
      finalHtml+=`<div>第${i+1}注：${bf} + ${bk} <span class="tag">和=${it.sum}/分${it.s.toFixed(1)}</span></div>`;
    });
  }

  out.innerHTML=`
    <div class="card">
      <h2>奇门排盘/取数依据</h2>
      <div style="font-size:13px;margin-bottom:8px">
        ${board.gz.gz}日 ${board.sz}时 |
        值符宫${board.zfPal} 值使宫${board.zsPal} |
        空亡${board.kongPals.join(',')} |
        马星${board.maPal}(${board.maStarZhi}) |
        ${board.yin?'阴遁':'阳遁'}局${board.ju}
        ${drawNote?`<div class="warn">${drawNote}</div>`:''}
      </div>
      <div class="grid">${palHtml}</div>
    </div>

    <div class="card">
      <h2>候选池（前区${pool.front.length} / 后区${pool.back.length}）</h2>
      <div style="margin:6px 0">前区：${frontBalls}</div>
      <div>后区：${backBalls}</div>
    </div>

    <div class="card">
      <h2>缩水条件</h2>
      <div style="margin-bottom:8px">
        <label class="cond-label"><input type="checkbox" id="opt_oe" checked>奇偶</label>
        <label class="cond-label"><input type="checkbox" id="opt_bs" checked>大小</label>
        <label class="cond-label"><input type="checkbox" id="opt_mod3" checked>除3余</label>
        <label class="cond-label"><input type="checkbox" id="opt_prime" checked>质合</label>
        <label class="cond-label"><input type="checkbox" id="opt_zone" checked>区间</label>
        <label class="cond-label"><input type="checkbox" id="opt_conn">允许连号</label>
        <button id="btnReFilter">重新过滤</button>
      </div>
    </div>

    <div class="card">
      <h2>最终5注（候选池内缩水+权重）</h2>
      ${finalHtml}
      <div class="note">* 仅作术数演示，不保证中奖，不用于投注依据</div>
    </div>
  `;

  // 渲染后“重新过滤”按钮才存在，做空值保护绑定
  const rf=document.getElementById('btnReFilter');
  if(rf) rf.onclick=runMain;
}

/* ========== 主流程 ========== */
function readOpts(){
  const g=id=>document.getElementById(id);
  return {
    oe:g('opt_oe')?g('opt_oe').checked:true,
    bs:g('opt_bs')?g('opt_bs').checked:true,
    mod3:g('opt_mod3')?g('opt_mod3').checked:true,
    prime:g('opt_prime')?g('opt_prime').checked:true,
    zone:g('opt_zone')?g('opt_zone').checked:true,
    conn:g('opt_conn')?g('opt_conn').checked:false
  };
}
function parseDt(v){
  const [d,t]=v.split('T');
  const [y,m,dd]=d.split('-').map(Number);
  const [h,mi]=t.split(':').map(Number);
  return {y,m,d:dd,h,mi};
}
function runMain(){
  try {
    const v=document.getElementById('dt').value;
    if(!v){alert('先选公历日期时间');return}
    const p=parseDt(v);
    const lng=document.getElementById('lng').value.trim();
    const board=qimen(p.y,p.m,p.d,p.h,p.mi,lng);
    const dr=getDrawNote(p.y,p.m,p.d,p.h,p.mi);
    const type=dr.type;
    const pool=buildPool(board,type);
    const fl=type==='ssq'?6:5;
    const bl=type==='ssq'?1:2;
    const opts=readOpts();
    let samples=sampleCombos(pool.front,fl,20000);
    let filt=samples.filter(c=>checkCond(c,opts,type));
    if(filt.length<5)filt=samples;
    let scored=filt.map(c=>scoreCombo(c,board,type));
    scored.sort((a,b)=>b.s-a.s);
    const finalList=scored.slice(0,5).map(it=>{
      const backArr=pool.back.slice();
      const bk=backArr.slice(0,bl);
      return {...it,back:bk};
    });
    render(board,pool,finalList,dr.note,type);
  } catch(e) {
    alert('运行出错: ' + e.message + '\n' + (e.stack||''));
  }
}
function setNow(){
  const now=new Date();
  const pad2=n=>String(n).padStart(2,'0');
  document.getElementById('dt').value=`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}T${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  runMain();
}
function autoDrawTime(){
  const now=new Date();
  const dow=now.getDay();
  const pad2=n=>String(n).padStart(2,'0');
  let h=21,mi=15;
  if([2,4,0].includes(dow)){h=21;mi=15}
  else if([1,3,6].includes(dow)){h=21;mi=25}
  document.getElementById('dt').value=`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}T${pad2(h)}:${pad2(mi)}`;
  runMain();
}

/* ========== 绑定（带空值保护，避免按钮id不存在时崩） ========== */
function bindSafe(id,fn){
  const el=document.getElementById(id);
  if(el) el.addEventListener('click',fn);
}
document.addEventListener('DOMContentLoaded', function() {
  bindSafe('btnRun', runMain);
  bindSafe('btnNow', setNow);
  bindSafe('btnDraw', autoDrawTime);
  // btnReFilter 在首次 render 后才生成，也可等 render 后绑定；这里安全不强制
  setNow();
});
</script>
</body>
</html>

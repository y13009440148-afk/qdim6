function pad(n){return n<10?"0"+n:n}

function fmtDate(d){
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}

function inArr(x,a){
  for(var i=0;i<a.length;i++){if(a[i]===x)return true}
  return false;
}

function uniqueArr(a){
  var r=[];
  for(var i=0;i<a.length;i++){if(!inArr(a[i],r))r.push(a[i])}
  return r;
}

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=b[i];b[i]=b[j];b[j]=t;
  }
  return b;
}

// ============================================================
// 第4部分：节气查找（精确到分钟）
// ============================================================

function getJieQi(d){
  var best=null;
  for(var i=0;i<JIEQI.length;i++){
    var j=JIEQI[i];
    var t=new Date(j[0],j[1]-1,j[2],j[3],j[4]);
    if(t<=d) best=j;
  }
  if(!best) return {name:"未知",time:null};
  return {name:best[5],time:new Date(best[0],best[1]-1,best[2],best[3],best[4])};
}

// ============================================================
// 第5部分：日干支精确计算（以2000年1月1日为基准）
// ============================================================

function dayGzIndex(y,m,d){
  // 基准：2000年1月1日 为 甲戌日（索引10）
  var base = new Date(2000,0,1);
  var dt = new Date(y,m-1,d);
  var diffMs = dt.getTime() - base.getTime();
  var days = Math.round(diffMs / 86400000);
  var idx = ((days + 10) % 60 + 60) % 60;
  return idx;
}

// ============================================================
// 第6部分：时干支计算
// ============================================================

function hourGzStr(d){
  var h = d.getHours();
  var zh = Math.floor((h+1)/2) % 12;
  var dayIdx = dayGzIndex(d.getFullYear(), d.getMonth()+1, d.getDate());
  var dayStem = TIANGAN.indexOf(SIXTY[dayIdx][0]);
  var hStem = ((dayStem * 2 + zh) % 10 + 10) % 10;
  return TIANGAN[hStem] + DIZHI[zh];
}

// ============================================================
// 第7部分：符头（旬首）
// ============================================================

function xunShou(gzStr){
  var i = SIXTY.indexOf(gzStr);
  if(i < 0) return "甲子";
  var k = Math.floor(i / 10) * 10;
  return SIXTY[k];
}

// ============================================================

function calcYuan(jieName, d){
  var jt = getJieQi(d).time;
  if(!jt) return "未知";
  var days = Math.floor((d - jt) / 86400000);
  if(days < 5) return "上元";
  if(days < 10) return "中元";
  return "下元";
}

function findZhiFuZhiShi(pan){
  var hgz = pan.hourGz;
  var xs = xunShou(hgz);
  var xsGan = xs[0];
  // 值符宫：旬首干落宫
  var zfg = null;
  for(var g=1;g<=9;g++){
    if(g===5) continue;
    if(pan.diPan[g] === xsGan){
      zfg = g;
      break;
    }
  }
  if(!zfg) zfg = 1;
  pan.zfg = zfg;
  pan.xunShou = xs;
  // 值使：旬首干对应的原始门（休门起宫）
  // 按阳遁/阴遁推算
  return pan;
}

function buildGongInfo(pan){
  var info = {};
  for(var g=1;g<=9;g++){
    if(g===5){
      info[5] = {
        diGan: pan.diPan[5] || "戊",
        tianGan: "",
        star: "天禽",
        men: "",
        shen: "",
        kongWang: "",
        ruMu: "",
        jiXing: "",
        menPo: ""
      };
      continue;
    }
    var dg = pan.diPan[g] || "";
    var zhi = DIZHI[g-1];
    var kw = getKongWang(pan.dayGz);
    var isKw = kw.indexOf(zhi) > -1 ? "空亡" : "";
    var rm = getRuMu(dg);
    var jx = "";
    // 击刑：旬首落宫对应的地支
    var jxZhi = getJiXing(pan.dayGz);
    if(jxZhi === zhi) jx = "击刑";
    // 门迫
    var menName = "";
    for(var key in pan.menGong){
      if(pan.menGong[key] === g){
        menName = key;
        break;
      }
    }
    var mp = "";
    if(menName && getMenPo(menName, g)){
      mp = "门迫";
    }
    info[g] = {
      diGan: dg,
      tianGan: "",
      star: pan.stars[g] || "",
      men: menName,
      shen: "",
      kongWang: isKw,
      ruMu: rm,
      jiXing: jx,
      menPo: mp
    };
  }
  return info;
}

// ============================================================

function buildPan(d){
  var y = d.getFullYear();
  var m = d.getMonth() + 1;
  var day = d.getDate();
  var h = d.getHours();
  var min = d.getMinutes();

  // 节气
  var jie = getJieQi(d);

  // 日干支
  var dayIdx = dayGzIndex(y, m, day);
  var dayGz = SIXTY[dayIdx];

  // 时干支
  var hourGz = hourGzStr(d);

  // 符头
  var futou = xunShou(dayGz);

  // 三元
  var yuan = calcYuan(jie.name, d);

  // 局数
  var juObj = calcJu(jie.name, yuan);

  // 地盘
  var dp = getDiPan(juObj.ju, juObj.yin);

  // 天盘九星
  var stars = getStars(juObj.ju, juObj.yin);

  // 八门
  var men = getMen(juObj.ju, juObj.yin);

  // 八神
  var shen = {};
  var shenTable = juObj.yin ? getShenYin(juObj.ju) : getShenYang(juObj.ju);
  for(var key in shenTable){
    shen[key] = shenTable[key];
  }

  // 构建pan对象
  var pan = {
    time: d,
    year: y,
    month: m,
    day: day,
    hour: h,
    minute: min,
    jie: jie.name,
    jieTime: jie.time,
    dayGz: dayGz,
    hourGz: hourGz,
    futou: futou,
    yuan: yuan,
    ju: juObj.ju,
    yin: juObj.yin,
    diPan: dp,
    stars: stars,
    menGong: men,
    shen: shen,
    zfg: 1,
    xunShou: ""
  };

  // 值符值使
  findZhiFuZhiShi(pan);

  // 构建九宫详情
  pan.gongInfo = buildGongInfo(pan);

  // 补充天盘干、星、门、神到gongInfo
  for(var g=1;g<=9;g++){
    if(g===5) continue;
    if(pan.gongInfo[g]){
      pan.gongInfo[g].tianGan = pan.diPan[g] || "";
      pan.gongInfo[g].star = pan.stars[g] || "";
      // 找门
      for(var mk in pan.menGong){
        if(pan.menGong[mk] === g){
          pan.gongInfo[g].men = mk;
          break;
        }
      }
      // 找神
      for(var sk in pan.shen){
        if(pan.shen[sk] === g){
          pan.gongInfo[g].shen = sk;
          break;
        }
      }
    }
  }

  pan.useGodGong = pan.zfg;
  return pan;
}

// ============================================================
// 第27部分：初池取数（值符/值使/开/生/用神/日时干映射）
// ============================================================

var GAN_NUM_MAP = {
  "甲":1,"乙":2,"丙":3,"丁":4,"戊":5,"己":6,"庚":7,"辛":8,"壬":9,"癸":10
};

function ganToNums(gan){
  var n = GAN_NUM_MAP[gan];
  if(!n) return [];
  var result = [n];
  // 扩展同余数到33以内
  for(var k=1;k<=3;k++){
    var v = n + k*10;
    if(v >= 1 && v <= 33) result.push(v);
  }
  return result;
}

function buildChuChi(pan){
  var set = [];

  // 值符宫
  if(pan.zfg) set.push(pan.zfg);

  // 值使宫（旬首宫）
  if(pan.zfg) set.push(pan.zfg);

  // 开门宫
  if(pan.menGong && pan.menGong["开"]) set.push(pan.menGong["开"]);

  // 生门宫
  if(pan.menGong && pan.menGong["生"]) set.push(pan.menGong["生"]);

  // 用神宫（默认值符宫）
  if(pan.useGodGong) set.push(pan.useGodGong);

  // 日干映射
  var dayGan = pan.dayGz ? pan.dayGz[0] : "";
  if(dayGan) set = set.concat(ganToNums(dayGan));

  // 时干映射
  var hourGan = pan.hourGz ? pan.hourGz[0] : "";
  if(hourGan) set = set.concat(ganToNums(hourGan));

  // 去重、排序、限制1-33
  set = uniqueArr(set);
  set = set.filter(function(n){return n>=1 && n<=33});
  set.sort(function(a,b){return a-b});

  return set;
}

// ============================================================
// 第28部分：张委铭杀号规则（完整）
// ============================================================

function zhangWeiMingKill(chuChi, pan){
  var killSet = [];

  // 规则1：空亡关联杀
  var kw = getKongWang(pan.dayGz);
  chuChi.forEach(function(n){
    var zhi = DIZHI[(n-1) % 12];
    if(kw.indexOf(zhi) > -1){
      if(!inArr(n, killSet)) killSet.push(n);
    }
  });

  // 规则2：入墓关联杀
  for(var g=1;g<=9;g++){
    if(g===5) continue;
    var info = pan.gongInfo[g];
    if(info && info.ruMu){
      // 杀宫号
      if(inArr(g, chuChi) && !inArr(g, killSet)) killSet.push(g);
      // 杀该宫地盘干映射数
      var dg = info.diGan;
      if(dg){
        var nums = ganToNums(dg);
        nums.forEach(function(n){
          if(inArr(n, chuChi) && !inArr(n, killSet)) killSet.push(n);
        });
      }
    }
  }

  // 规则3：击刑关联杀
  for(var g=1;g<=9;g++){
    if(g===5) continue;
    var info = pan.gongInfo[g];
    if(info && info.jiXing){
      if(inArr(g, chuChi) && !inArr(g, killSet)) killSet.push(g);
    }
  }

  // 规则4：门迫关联杀
  for(var g=1;g<=9;g++){
    if(g===5) continue;
    var info = pan.gongInfo[g];
    if(info && info.menPo){
      if(inArr(g, chuChi) && !inArr(g, killSet)) killSet.push(g);
    }
  }

  // 规则5：张委铭附加规则（重号≤1、邻号≤2、同尾≤2、连号≤1组、区间比、奇偶比）
  // 这些在候选过滤阶段处理，这里不做杀号

  return uniqueArr(killSet).sort(function(a,b){return a-b});
}
// ============================================================
// 第29部分：候选构建（初池 - 杀号，不足补池，含张委铭规则过滤）
// ============================================================

function buildCandidates(chuChi, killSet, pan){
  var c = chuChi.filter(function(n){
    return !inArr(n, killSet);
  });

  // 如果不足6个，补池
  if(c.length < 6){
    var pool = [];
    // 从所有宫号和干支映射补
    for(var g=1;g<=9;g++){
      if(g===5) continue;
      if(!inArr(g, c) && !inArr(g, killSet) && g>=1 && g<=33){
        pool.push(g);
      }
      var info = pan.gongInfo[g];
      if(info && info.diGan){
        var nums = ganToNums(info.diGan);
        nums.forEach(function(n){
          if(!inArr(n, c) && !inArr(n, killSet) && n>=1 && n<=33){
            pool.push(n);
          }
        });
      }
    }
    pool = uniqueArr(pool);
    // 按需补充
    for(var i=0; i<pool.length && c.length<12; i++){
      if(!inArr(pool[i], c)){
        c.push(pool[i]);
      }
    }
  }

  // 张委铭规则过滤（重号≤1、邻号≤2、同尾≤2、连号≤1组、区间比、奇偶比）
  // 这里只做标记，实际组合时再做严格过滤
  // 返回候选池（不少于12个）
  c = uniqueArr(c).filter(function(n){return n>=1 && n<=33});
  c.sort(function(a,b){return a-b});

  // 确保足够数量
  if(c.length < 12){
    for(var n=1; n<=33 && c.length<12; n++){
      if(!inArr(n, c) && !inArr(n, killSet)){
        c.push(n);
      }
    }
  }

  return c;
}

// ============================================================
// 第30部分：褚天一擒号规则（完整）
// ============================================================

function chuTianYiFilter(reds){
  // 规则1：大小比 3:3 / 4:2 / 2:4
  var bigCount = reds.filter(function(n){return n>=17}).length;
  var smallCount = reds.length - bigCount;
  var ratioOk = (bigCount === 3 && smallCount === 3) ||
                (bigCount === 4 && smallCount === 2) ||
                (bigCount === 2 && smallCount === 4);
  if(!ratioOk) return false;

  // 规则2：和值85-125
  var sum = reds.reduce(function(a,b){return a+b}, 0);
  if(sum < 85 || sum > 125) return false;

  // 规则3：跨度18-30
  var span = reds[reds.length-1] - reds[0];
  if(span < 18 || span > 30) return false;

  // 规则4：重号1-2（历史重号，这里简化假设无历史）
  // 规则5：连号1组两连
  var hasLian = false;
  for(var i=0; i<reds.length-1; i++){
    if(reds[i+1] - reds[i] === 1){
      hasLian = true;
      break;
    }
  }
  if(!hasLian) return false;

  // 规则6：AC值5-10（简化计算）
  var diffs = [];
  for(var i=0; i<reds.length; i++){
    for(var j=i+1; j<reds.length; j++){
      var d = Math.abs(reds[j] - reds[i]);
      if(!inArr(d, diffs)) diffs.push(d);
    }
  }
  var ac = diffs.length - (reds.length - 1);
  if(ac < 5 || ac > 10) return false;

  return true;
}

// ============================================================
// 第31部分：3注精选生成
// ============================================================

function makePlans(candidates, pan){
  var plans = [];
  var attempts = 0;
  var maxAttempts = 500;

  while(plans.length < 3 && attempts < maxAttempts){
    attempts++;
    var shuffled = shuffle(candidates);
    var reds = shuffled.slice(0, 6).sort(function(a,b){return a-b});

    // 褚天一规则过滤
    if(!chuTianYiFilter(reds)) continue;

    // 蓝球（杀上期+冷号+尾数，简化随机）
    var blue = [randInt(1, 16)];

    plans.push({
      lot: "ssq",
      reds: reds,
      blues: blue
    });
  }

  // 如果仍然不足3注，保底生成
  while(plans.length < 3){
    var reds = shuffle(candidates).slice(0, 6).sort(function(a,b){return a-b});
    var blue = [randInt(1, 16)];
    plans.push({
      lot: "ssq",
      reds: reds,
      blues: blue
    });
  }

  return plans;
}

  s += "宫号\t地名\t地\t天\t星\t门\t神\t空亡\t入墓\t击刑\t门迫\n";
  s += "───────────────────────────────────────────────\n";

         (o.ruMu||"") + "\t" +
         (o.jiXing||"") + "\t" +

  // 初池

  s += "───────────────────────────────────────────────\n";

  // 杀号

  s += "【张委铭杀号】（空亡/入墓/击刑/门迫关联杀，非1-33全杀）\n";

  s += "5. 选号为规则映射+过滤演示，非开奖预测，勿实投重注\n";
  s += "───────────────────────────────────────────────\n";

  return s;
}
// ============================================================
// 第33部分：运行入口
// ============================================================

function run(){
  var v = document.getElementById("t").value;
  var d = v ? new Date(v) : new Date();
  if(isNaN(d.getTime())){
    document.getElementById("out").innerText = "时间格式错误，请使用格式：2026-06-21 12:00";
    return;
  }
  document.getElementById("t").value = fmtDate(d);

  try {
    var pan = buildPan(d);
    var chuChi = buildChuChi(pan);
    var killSet = zhangWeiMingKill(chuChi, pan);
    var candidates = buildCandidates(chuChi, killSet, pan);
    var plans = makePlans(candidates, pan);
    document.getElementById("out").innerText = renderV6(pan, chuChi, killSet, candidates, plans);
  } catch(e) {
    document.getElementById("out").innerText = "运行出错：" + e.message + "\n" + e.stack;
  }
}

function autoNow(){
  document.getElementById("t").value = fmtDate(new Date());
}

document.getElementById("t").value = fmtDate(new Date());

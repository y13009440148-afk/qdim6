<script>
/* ========== 基础常量 ========== */
const ganArr = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const zhiArr = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const luoShu = [4,9,2,3,5,7,8,1,6];
const gongNameMap = {1:"坎一",2:"坤二",3:"震三",4:"巽四",5:"中五",6:"乾六",7:"兑七",8:"艮八",9:"离九"};
const gongWuXing = {1:"水",2:"土",3:"木",4:"木",5:"土",6:"金",7:"金",8:"土",9:"火"};

/* 宫位→红球范围（SSQ红1-33，按九宫分桶，可自定；这里给一套完整映射覆盖1-33） */
const gongConfig = {
  1:{range:[1,6]},
  2:{range:[7,12]},
  3:{range:[13,18]},
  4:{range:[19,24]},
  5:{range:[25,28]},
  6:{range:[29,30]},
  7:{range:[31,32]},
  8:{range:[33,33]},
  9:{range:[1,33]} /* 离宫兜底参与时可全范围，实际取用会按生开休优先 */
};

/* 节气→遁局描述（常用基准表） */
const JQ_JU_RAW = {
  "冬至":"阳遁一","小寒":"阳遁二","大寒":"阳遁三",
  "立春":"阳遁八","雨水":"阳遁九","惊蛰":"阳遁一",
  "春分":"阳遁三","清明":"阳遁四","谷雨":"阳遁五",
  "立夏":"阳遁四","小满":"阳遁五","芒种":"阳遁六",
  "夏至":"阴遁九","小暑":"阴遁八","大暑":"阴遁七",
  "立秋":"阴遁二","处暑":"阴遁一","白露":"阴遁九",
  "秋分":"阴遁七","寒露":"阴遁六","霜降":"阴遁五",
  "立冬":"阴遁六","小雪":"阴遁五","大雪":"阴遁四"
};
/* 三元取局：这里用“节令+日干支符头”简处理为 [上元,中元,下元] 对应局数 */
const JQ_JU = {
  "冬至":[1,7,4], "小寒":[2,8,5], "大寒":[3,9,6],
  "立春":[8,5,2], "雨水":[9,6,3], "惊蛰":[1,7,4],
  "春分":[3,9,6], "清明":[4,1,7], "谷雨":[5,2,8],
  "立夏":[4,1,7], "小满":[5,2,8], "芒种":[6,3,9],
  "夏至":[9,3,6], "小暑":[8,2,5], "大暑":[7,1,4],
  "立秋":[2,5,8], "处暑":[1,4,7], "白露":[9,3,6],
  "秋分":[7,1,4], "寒露":[6,9,3], "霜降":[5,8,2],
  "立冬":[6,9,3], "小雪":[5,8,2], "大雪":[4,7,1]
};

/* 简易节气区间（按公历近似，非精确交节时刻；要精确需换天文/节气时刻表） */
const JQ_RANGE = [
  ["小寒",1,6,1,20],["大寒",1,21,2,4],["立春",2,5,2,19],["雨水",2,20,3,5],
  ["惊蛰",3,6,3,20],["春分",3,21,4,4],["清明",4,5,4,19],["谷雨",4,20,5,5],
  ["立夏",5,6,5,20],["小满",5,21,6,5],["芒种",6,6,6,20],["夏至",6,21,7,6],
  ["小暑",7,7,7,22],["大暑",7,23,8,7],["立秋",8,8,8,22],["处暑",8,23,9,7],
  ["白露",9,8,9,22],["秋分",9,23,10,8],["寒露",10,9,10,23],["霜降",10,24,11,7],
  ["立冬",11,8,11,22],["小雪",11,23,12,7],["大雪",12,8,12,21],["冬至",12,22,1,5]
];

function getJieQiAndYinYang(dt){
  const m=dt.getMonth()+1, d=dt.getDate();
  for(const [jq,sm,sd,em,ed] of JQ_RANGE){
    if(sm===em){
      if(m===sm && d>=sd && d<=ed) return {jqName:jq, isYang: (JQ_JU_RAW[jq]||"").indexOf("阳遁")===0};
    }else{
      if((m===sm && d>=sd) || (m===em && d<=ed)) return {jqName:jq, isYang: (JQ_JU_RAW[jq]||"").indexOf("阳遁")===0};
    }
  }
  return {jqName:"冬至", isYang:true};
}

/* 基姆拉尔森日干支（修复原 (y+d)%10/12 错误） */
function getDayGanZhi(y, m, d){
  let Y=y, M=m;
  if(M<=2){ Y--; M+=12; }
  const c=Math.floor(Y/100), yy=Y%100;
  let g = 4*c + Math.floor(c/4) + 5*yy + Math.floor(yy/4) + Math.floor(3*(M+1)/5) + d - 3;
  let z = 8*c + Math.floor(c/4) + 5*yy + Math.floor(yy/4) + Math.floor(3*(M+1)/5) + d + 7;
  g = ((g%10)+10)%10;
  z = ((z%12)+12)%12;
  return {gan:ganArr[g], zhi:zhiArr[z], gIdx:g, zIdx:z};
}

/* 三元（按日干支简取 0/1/2） */
function getSanYuan(riGanZhiStr){
  /* 以日支在六甲旬/符头近似：子午卯酉上元、寅申巳亥中元、辰戌丑未下元 */
  const zhi=riGanZhiStr.slice(-1);
  if(["子","午","卯","酉"].includes(zhi)) return 0;
  if(["寅","申","巳","亥"].includes(zhi)) return 1;
  return 2;
}

/* 旬空：按日干支所在六甲旬 */
const XUN_KONG_MAP = {
  "甲子":"戌亥","甲戌":"申酉","甲申":"午未","甲午":"辰巳","甲辰":"寅卯","甲寅":"子丑"
};
function getXunKong(riGan, riZhi){
  /* 先找所在旬首：按日干支在60甲子位置倒推至甲X */
  const ganIdx=ganArr.indexOf(riGan), zhiIdx=zhiArr.indexOf(riZhi);
  /* 60甲子位置（甲子=0） */
  let pos=-1;
  for(let i=0;i<60;i++){
    if(ganArr[i%10]===riGan && zhiArr[i%12]===riZhi){ pos=i; break; }
  }
  const xunStart = Math.floor(pos/10)*10;
  const xunShou = ganArr[xunStart%10] + zhiArr[xunStart%12];
  const kong = (XUN_KONG_MAP[xunShou]||"子丑").split("");
  return {xun:xunShou, kong};
}

/* 五鼠遁：日干→时支得时干 */
function wuShuDun(riGan){
  const base = { "甲":"甲子", "乙":"丙子", "丙":"戊子", "丁":"庚子", "戊":"壬子",
                 "己":"甲子", "庚":"丙子", "辛":"戊子", "壬":"庚子", "癸":"壬子" };
  const start = base[riGan]||"甲子";
  const sGan=start[0], sZhi=start[1];
  const g0=ganArr.indexOf(sGan), z0=zhiArr.indexOf(sZhi);
  const map={};
  for(let i=0;i<12;i++){
    map[zhiArr[(z0+i)%12]] = ganArr[(g0+i)%10];
  }
  return map;
}

/* 日志 */
function appendLog(s){
  const el=document.getElementById("log");
  el.textContent += s + "\n";
  el.scrollTop = el.scrollHeight;
}
function log(s){ appendLog(s); }

/* DOM引用 */
const $qimenBoard = document.getElementById("qimenBoard");
const $historyText = document.getElementById("historyText");
const $resultBox = document.getElementById("resultBox");

let panCache = null;
let historyPool = [];

/* ========== 排盘核心 ========== */
function paiPan(dateStr, timeStr, lng){
  try{
    dateStr = dateStr.replace(/\//g,"-").trim();
    timeStr = (timeStr||"12:00").trim();
    const dateParts = dateStr.split("-");
    const timeParts = timeStr.split(":");
    if(dateParts.length!==3 || timeParts.length<2){
      appendLog("❌日期或者时间格式错误！必须是 2026-10-24 、21:15");
      return null;
    }
    const y=Number(dateParts[0]), m=Number(dateParts[1])-1, d=Number(dateParts[2]);
    const h=Number(timeParts[0]), mi=Number(timeParts[1]);
    const dt=new Date(y,m,d,h,mi,0);
    if(isNaN(dt.getTime())){
      appendLog("❌日期时间解析失败！数字越界或者格式不对！");
      return null;
    }

    /* 日干支：用基姆拉尔森（修复） */
    const riGZ = getDayGanZhi(y, m+1, d);
    const riGan = riGZ.gan, riZhi = riGZ.zhi;

    const shiChenIdx = Math.floor((h+1)/2) % 12;
    const shiZhi = zhiArr[shiChenIdx];

    const jieQiResult = getJieQiAndYinYang(dt);
    const jqName = jieQiResult.jqName;
    const isYang = jieQiResult.isYang;
    const juArr = JQ_JU[jqName];
    if(!juArr){
      appendLog("❌没有找到节气对应的局数");
      return null;
    }
    const yuanIdx = getSanYuan(riGan+riZhi);
    const benJu = juArr[yuanIdx];

    const xunKongObj = getXunKong(riGan, riZhi);
    const shiGanMap = wuShuDun(riGan);
    const shiGan = shiGanMap[shiZhi];

    /* 地盘（洛书宫序） */
    const dipan={};
    for(const g of luoShu) dipan[g]="";
    const yiList=["戊","己","庚","辛","壬","癸","丁","丙","乙"];
    if(isYang){
      for(let i=0;i<9;i++){
        const g = luoShu[(benJu-1+i)%9];
        dipan[g]=yiList[i];
      }
    }else{
      for(let i=0;i<9;i++){
        const g = luoShu[(benJu-1-i+9)%9];
        dipan[g]=yiList[i];
      }
    }

    /* 值符宫：按旬首（非时干！修复） */
    const xunShouGan = xunKongObj.xun[0];
    let zhiFuGong=null;
    for(let g=1;g<=9;g++){
      if(dipan[g]===xunShouGan){ zhiFuGong=g; break; }
    }
    /* 值使门：以休门起本局宫，按阴阳遁顺逆寻时支；这里先记录本局起宫供八门用 */
    const zhiShiStartGong = benJu;
    const menStartGong = isYang ? benJu : ((benJu-2+9)%9)+1;

    /* 天盘：以值符宫为轴，整体平移（按“值符落宫-本局宫”偏移） */
    const tianPan={};
    if(zhiFuGong){
      const offset = zhiFuGong - benJu;
      for(let g=1;g<=9;g++){
        const srcG = ((g - offset - 1 + 9)%9)+1;
        tianPan[g] = dipan[srcG]||"";
      }
    }else{
      for(let g=1;g<=9;g++) tianPan[g]=dipan[g];
    }

    /* 八门：休生伤杜景死惊开 */
    const baMenBase=["休","生","伤","杜","景","死","惊","开"];
    const menPan={};
    for(let g=1;g<=9;g++) menPan[g]="";
    for(let i=0;i<8;i++){
      const g = ((menStartGong-1+i)%9)+1;
      if(g===5) continue;
      menPan[g]=baMenBase[i%8];
    }
    menPan[5]="禽";

    /* 九星：蓬芮冲辅禽心柱任英，按局宫顺排 */
    const jiuXingBase=["蓬","芮","冲","辅","禽","心","柱","任","英"];
    const xingPan={};
    for(let g=1;g<=9;g++) xingPan[g]="";
    for(let i=0;i<9;i++){
      const g = ((benJu-1+i)%9)+1;
      xingPan[g]=jiuXingBase[i];
    }

    /* 旬空→宫 */
    const zhiToGong={"子":1,"丑":8,"寅":8,"卯":3,"辰":4,"巳":4,"午":9,"未":2,"申":2,"酉":7,"戌":6,"亥":6};
    const kongWangGong=[];
    xunKongObj.kong.forEach(z=>{ if(zhiToGong[z]) kongWangGong.push(zhiToGong[z]); });

    const outPan={
      riGan,riZhi,shiZhi,shiGan,
      yang:isYang,ju:benJu,jqName,
      dipan,tianPan,menPan,xingPan,
      xunKong:xunKongObj,kongWang:kongWangGong,
      zhiFuGong,benJu
    };

    appendLog("✅排盘："+jqName+"｜"+(isYang?"阳遁":"阴遁")+benJu+"局｜日"+riGan+riZhi+" 时"+shiGan+shiZhi+"｜旬"+xunKongObj.xun+" 空"+xunKongObj.kong);
    appendLog("📋八门："+JSON.stringify(outPan.menPan)+" 九星："+JSON.stringify(outPan.xingPan));

    renderPan(outPan);
    panCache=outPan;
    return outPan;
  }catch(e){
    appendLog("❌paiPan排盘函数异常："+e.message);
    console.error(e);
    return null;
  }
}

/* 渲染 */
function renderPan(pan){
  $qimenBoard.innerHTML="";
  for(const g of luoShu){
    const dg=pan.dipan[g], tx=pan.tianPan[g], mn=pan.menPan[g], sh=(pan.xingPan||{})[g];
    const kw = pan.kongWang.includes(g);
    let cls="gong";
    if(kw) cls+=" gong-xiong";
    else if(["休","生","开"].includes(mn)) cls+=" gong-ji";
    let h=`<div class="${cls}">
      <div class="gong-title">${gongNameMap[g]}</div>
      <div class="gong-line">九星：${sh||""}</div>
      <div class="gong-line">八门：${mn}</div>
      <div class="gong-line">天盘：${tx}</div>
      <div class="gong-line">地盘：${dg}</div>`;
    if(kw) h+=`<div class="kongwang">⚠️旬空宫</div>`;
    h+=`</div>`;
    $qimenBoard.innerHTML+=h;
  }
}

function isKongGong(g,kw){ return kw&&kw.includes(g); }

/* 过滤：去掉旬空宫对应号码范围（简实现） */
function filterKill(pool,pan){
  const kill=[];
  const zhiToGong={"子":1,"丑":8,"寅":8,"卯":3,"辰":4,"巳":4,"午":9,"未":2,"申":2,"酉":7,"戌":6,"亥":6};
  pan.xunKong.kong.forEach(z=>{
    const g=zhiToGong[z]; if(!g) return;
    const r=gongConfig[g]&&gongConfig[g].range;
    if(r) for(let n=r[0];n<=r[1];n++) kill.push(n);
  });
  return pool.filter(n=>!kill.includes(n));
}

/* 号码工具 */
function parseLastNum(s){
  s=s.trim();
  const part=s.split(/[+\+]/);
  const reds=part[0].split(/[,\s]+/).map(x=>parseInt(x,10)).filter(n=>!isNaN(n)&&n>=1&&n<=33);
  const blue=part[1]?parseInt(part[1],10):null;
  if(reds.length!==6) { appendLog("❌上期红球需6个(1-33)，格式如 01 05 12 18 24 33 + 08"); return null; }
  const span = Math.max(...reds)-Math.min(...reds);
  return {red:reds,blue,span};
}
function getSpan(arr){ return Math.max(...arr)-Math.min(...arr); }
function getHe(arr){ return arr.reduce((a,b)=>a+b,0); }
function acCalc(arr){
  const diffs=new Set();
  for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++) diffs.add(Math.abs(arr[i]-arr[j]));
  return diffs.size - (arr.length-1);
}
function isPrime(n){ if(n<2)return false; for(let i=2;i*i<=n;i++) if(n%i===0)return false; return true; }

function balanceCheck(pick){
  let big=0,small=0,ji=0,ou=0,mid=0;
  for(const x of pick){
    if(x>=17) big++; else small++;
    if(x%2===1) ji++; else ou++;
    if(x>=11&&x<=22) mid++;
  }
  const pass = (big>=2&&big<=4) && (ji>=2&&ji<=4);
  return {pass,big,small,ji,ou,mid};
}
function spanCheck(pick,lastSpan){
  const cur=getSpan(pick);
  /* 允许与上期跨度有“邻近/不雷同”的约束（可放宽为true） */
  const ok = true; 
  return {ok,curSpan:cur,lastSpan};
}

/* 加权抽样（在有效池按宫/门简单加权，并循环直到满足均衡+跨度） */
function weightedSample(pool,k,lastSpan){
  const maxTry=2000;
  for(let t=0;t<maxTry;t++){
    const pick=[];
    const used=new Set();
    while(pick.length<k){
      const idx=Math.floor(Math.random()*pool.length);
      const v=pool[idx];
      if(!used.has(v)){ used.add(v); pick.push(v); }
    }
    pick.sort((a,b)=>a-b);
    const bal=balanceCheck(pick);
    const sp=spanCheck(pick,lastSpan);
    if(bal.pass&&sp.ok) return {red:pick,bal,spanInfo:sp};
  }
  return null;
}

/* 历史解析 */
function parseHistory(){
  historyPool=[];
  const t=$historyText.value.trim();
  if(!t) return;
  t.split(/\n/).forEach(line=>{
    const s=line.trim(); if(!s) return;
    const part=s.split(/[+\+]/);
    const q=part[0].split(/[,\s]+/).map(x=>parseInt(x,10)).filter(n=>!isNaN(n)&&n>=1&&n<=33);
    const b=part[1]?parseInt(part[1],10):null;
    if(q.length===6) historyPool.push({red:q,blue:b,span:getSpan(q),he:getHe(q),ac:acCalc(q)});
  });
  appendLog("✅解析历史 "+historyPool.length+" 条");
}
/* ========== 推演主入口 ========== */
function runCalc(){
  appendLog("===== 启动 QDIM 神兵奇门【奇门统计+跨度融合】迭代推演 =====");
  const lastStr = document.getElementById("lastNum").value.trim();
  const dateVal = document.getElementById("dateIn").value.trim();
  const timeFake = "12:00"; /* 如需用时辰输入可改取 shiChen */
  const genCount = parseInt(document.getElementById("genCount").value,10)||10;

  if(!lastStr){
    appendLog("⚠️请输入上期开奖号码");
    return;
  }
  const lastInfo = parseLastNum(lastStr);
  if(!lastInfo) return;

  const pan = paiPan(dateVal, timeFake, 121.6);
  if(!pan) return;

  /* 优先取用宫：生/开/休 */
  const activeGong=[];
  for(let g=1;g<=9;g++){
    const m=pan.menPan[g];
    if(m==="生"||m==="开"||m==="休") activeGong.push(g);
  }
  if(activeGong.length===0) activeGong.push(pan.ju);
  appendLog("🎯优先取用宫位："+activeGong.join(","));

  let redPool=[];
  for(const g of activeGong){
    const r=gongConfig[g]&&gongConfig[g].range;
    if(r) for(let n=r[0];n<=r[1];n++) redPool.push(n);
  }
  redPool=[...new Set(redPool)].sort((a,b)=>a-b);
  appendLog("🔴基础候选池："+redPool.join(" "));

  const validPool = filterKill(redPool,pan);
  appendLog("✅过滤后有效候选池："+validPool.join(" "));

  if(validPool.length<8){
    appendLog("❌候选池号码过少，无法生成，调整推演时辰/日期再试");
    return;
  }

  const bluePool=[];
  for(let b=1;b<=16;b++) bluePool.push(b);

  const outputList=[];
  for(let i=0;i<genCount;i++){
    const one=weightedSample(validPool,6,lastInfo.span);
    if(!one){
      appendLog("⚠️第"+(i+1)+"注多次尝试未满足均衡+跨度条件，跳过");
      continue;
    }
    const bluePick=bluePool[Math.floor(Math.random()*bluePool.length)];
    outputList.push({
      red:one.red, blue:bluePick,
      bal:one.bal,
      span:one.spanInfo.curSpan
    });
    appendLog("🎲第"+(i+1)+"注生成：红球"+one.red.join(" ")+" 蓝球"+bluePick+" | 跨度"+one.spanInfo.curSpan+" 大小"+one.bal.big+":"+one.bal.small+" 奇偶"+one.bal.ji+":"+one.bal.ou);
  }

  if(outputList.length===0){
    appendLog("❌本轮没有符合全部条件的号码组合，请更换时辰/日期或放宽规则");
    return;
  }

  let html = "<table><tr><th>序号</th><th>红球</th><th>蓝球</th><th>跨度</th><th>大小｜奇偶｜中段</th></tr>";
  for(let i=0;i<outputList.length;i++){
    const item=outputList[i];
    const redStr=item.red.map(x=>x.toString().padStart(2,"0")).join(" ");
    const blueStr=item.blue.toString().padStart(2,"0");
    html+=`<tr>
      <td>${i+1}</td>
      <td class="red">${redStr}</td>
      <td class="blue-text">${blueStr}</td>
      <td>${item.span}</td>
      <td>${item.bal.big}:${item.bal.small}｜${item.bal.ji}:${item.bal.ou}｜${item.bal.mid}</td>
    </tr>`;
  }
  html+="</table>";
  html+='<p class="info-text">说明：本程序仅用于QDIM奇门模型学术研究娱乐，开奖为独立随机事件，不构成购彩参考/建议。</p>';
  $resultBox.innerHTML=html;
}
</script>
</body>
</html>

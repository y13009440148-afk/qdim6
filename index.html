
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诊断测试 - 点按钮看反应</title>
</head>
<body style="background:#111;color:#eee;padding:20px;font-family:sans-serif;">
<h2>诊断测试页</h2>
<p>如果这个页面按钮能工作，说明你的浏览器可以运行JS。</p>
<button id="btnTest" style="padding:20px 40px;font-size:24px;background:gold;border:none;border-radius:12px;cursor:pointer;">
点我测试
</button>
<div id="output" style="margin-top:20px;padding:10px;background:#222;min-height:50px;border-radius:8px;">
等待点击...
</div>

<script>
// 最基础的绑定方式，不用任何高级语法
document.getElementById('btnTest').onclick = function() {
    document.getElementById('output').innerHTML = '✅ 按钮被点击了！当前时间：' + new Date().toLocaleString();
    alert('弹窗测试成功！');
};

// 再加一行日志
console.log('测试页面已加载');
</script>
</body>
</html>

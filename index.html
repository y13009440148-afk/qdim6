<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>奇门总池(前/后池)+自动起局</title>
<style>
  :root{
    --bg:#07101e; --card:#0b1730; --line:#1f3050; --text:#e6f4ff;
    --muted:#8aa6c4; --btn:#1e88ff; --front:#4cc9f0; --back:#ffb86b; --warn:#ffd166;
  }
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  h2{font-size:17px;margin:0 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
  label{color:var(--muted)}
  select,input{background:#07101e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none}
  input[readonly]{color:var(--muted)}
  input[type=number]{width:90px}
  button{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer;width:100%}
  button:disabled{opacity:.55;cursor:wait}
  pre{white-space:pre-wrap;word-break:break-all;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.55}
  .tag-front{color:var(--front);border:1px solid rgba(76,201,240,.5);background:rgba(76,201,240,.08);border-radius:6px;padding:1px 6px;margin-right:6px}
  .tag-back{color:var(--back);border:1px solid rgba(255,184,107,.5);background:rgba(255,184,107,.08);border-radius:6px;padding:1px 6px;margin-right:6px}
  .num-front{color:var(--front)}
  .num-back{color:var(--back)}
  .note{color:var(--warn);font-size:12px;margin-top:8px}
  .muted{color:var(--muted)}
</style>
</head>
<body>

<div class="card">
  <h2>参数（起局时间自动=下一期开奖时间）</h2>
  <div class="row">
    <label>彩种</label>
    <select id="lotType">
      <option value="ssq">双色球（二/四/日 21:15，前33后16，前6后1）</option>
      <option value="dlt">大乐透（一/三/六 21:25，前35后12，前5后2）</option>
    </select>
    <label>输出注数</label>
    <input type="number" id="outN" value="5" min="1" max="10" />
  </div>
  <div class="row">
    <label>起局时间(自动)</label>
    <input type="text" id="dtInput" readonly />
  </div>
  <div class="row">
    <label>采样轮次</label>
    <input type="number" id="sampleN" value="800" min="50" max="3000" />
    <label><input type="checkbox" id="chkQimen" checked /> 起奇门</label>
    <label><input type="checkbox" id="chkWang" checked /> 旺相加权</label>
  </div>
  <button id="btnCalc">计算（自动起局→奇门总池→九宫围号→注单）</button>
  <div class="note">仅本地计算/展示“奇门总池(前池/后池)”与缩水注单；不联网、不下注、不保证命中；彩票随机，请理性参与。</div>
</div>

<div class="card"><h2>奇门局信息</h2><pre id="juInfo">等待计算...</pre></div>

<div class="card">
  <h2>奇门总池</h2>
  <div style="margin-top:6px"><span class="tag-front">前池</span><span class="muted">（围号后候选）</span></div>
  <pre id="frontPoolOut"></pre>
  <div style="margin-top:10px"><span class="tag-back">后池</span><span class="muted">（围号后候选）</span></div>
  <pre id="backPoolOut"></pre>
</div>

<div class="card"><h2>缩水结果（注单）</h2><pre id="shrinkOut">-</pre></div>

<script>
/* ===== 开奖时间表（自动下一期） ===== */
const DRAW_CFG = {
  ssq: { name:'双色球', front:33, back:16, fpick:6, bpick:1,
         days:[2,4,0], hour:21, min:15 }, // 二/四/日
  dlt: { name:'大乐透', front:35, back:12, fpick:5, bpick:2,
         days:[1,3,6], hour:21, min:25 }, // 一/三/六
};
function pad(n){return n<10?'0'+n:n}
function fmtDT(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} (周${'日一二三四五六'[d.getDay()]})`}
function nextDrawDate(type, now=new Date()){
  const c=DRAW_CFG[type];
  let d=new Date(now); d.setSeconds(0,0);
  // 先对齐到今天开奖时刻
  let candidate=new Date(d); candidate.setHours(c.hour,c.min,0,0);
  if(candidate<=now){ candidate.setDate(candidate.getDate()+1); }
  // 找最近开奖日
  for(let i=0;i<14;i++){
    if(c.days.includes(candidate.getDay())) return candidate;
    candidate.setDate(candidate.getDate()+1);
  }
  return candidate;
}

/* ===== 简化奇门（自洽骨架，非商业逐秒一致） ===== */
function makeQimenPan(dt){
  const wd='日一二三四五六';
  // 用月份近似节气（仅骨架）
  const m=dt.getMonth()+1, day=dt.getDate();
  let jieQi='近似节气';
  if((m===3&&day>=21)||(m===4&&day<20)) jieQi='春分/清明间';
  else if((m===4&&day>=20)||(m===5&&day<21)) jieQi='清明/立夏间';
  else if((m===5&&day>=21)||(m===6&&day<22)) jieQi='立夏/芒种间';
  else if((m===6&&day>=22)||(m===7&&day<23)) jieQi='芒种/小暑间';
  else if((m===7&&day>=23)||(m===8&&day<23)) jieQi='小暑/立秋间';
  else if((m===8&&day>=23)||(m===9&&day<23)) jieQi='立秋/白露间';
  else if((m===9&&day>=23)||(m===10&&day<24)) jieQi='白露/寒露间';
  else if((m===10&&day>=24)||(m===11&&day<22)) jieQi='寒露/立冬间';
  else if((m===11&&day>=22)||(m===12&&day<22)) jieQi='立冬/大雪间';
  else if((m===12&&day>=22)||(m===1&&day<20)) jieQi='大雪/小寒间';
  else if((m===1&&day>=20)||(m===2&&day<19)) jieQi='小寒/立春间';
  else if((m===2&&day>=19)||(m===3&&day<21)) jieQi='立春/惊蛰间';
  else jieQi='节气近似';
  const yy = (dt.getHours()>=23||dt.getHours()<11)?'阳':'阴'; // 极简
  const juBase = ((dt.getDay()+dt.getHours())%9)+1;
  const shiGanGong = ((dt.getHours()%9)+1);
  const riGanGong = ((dt.getDay()%9)+1)||1;
  const zhiFuGong = ((juBase+2)%9)||9;
  const zhiShiGong = ((juBase+3)%9)||9;
  const kong=[((juBase+5)%9)||9];
  const maXing=[((dt.getDay()+4)%9)||9];
  const sanQiDeShi=[{qi:'乙',gong:shiGanGong},{qi:'丙',gong:riGanGong}];
  const wuBuYu = (dt.getHours()%2===0);
  return {jieQi,yy,juBase,shiGanGong,riGanGong,zhiFuGong,zhiShiGong,kong,maXing,sanQiDeShi,wuBuYu,
          dayGZ:'简式',hourGZ:'简式',yuNuGong:null};
}

/* ===== 总池（前/后）+ 九宫围号 ===== */
function gongOf(n,max){
  if(max<=9) return ((n-1)%9)+1;
  // 前区按1-35/1-33映射到九宫（简化）
  return ((Math.ceil(n/4)-1)%9)+1;
}
function backGong(n){ return ((n-1)%9)+1; }

function buildTotalPool(pan, cfg, opt, sampleN){
  const frontSet=new Set(), backSet=new Set();
  const frontW={}, backW={};
  const centerGongs = pan? [pan.shiGanGong, pan.riGanGong, pan.zhiFuGong].filter(Boolean) : [5];
  for(let s=0;s<sampleN;s++){
    for(let i=0;i<cfg.front;i++){
      const n=i+1;
      const g=gongOf(n,cfg.front);
      let w=1;
      if(opt.qimen && centerGongs.includes(g)) w+=3;
      if(opt.wang) w+= (s%3);
      if(Math.random()<w/(w+6)){ frontSet.add(n); frontW[n]=(frontW[n]||0)+w; }
    }
    for(let i=0;i<(cfg.back||0);i++){
      const n=i+1;
      const g=backGong(n);
      let w=1;
      if(opt.qimen && centerGongs.includes(g)) w+=3;
      if(opt.wang) w+=(s%2);
      if(Math.random()<w/(w+6)){ backSet.add(n); backW[n]=(backW[n]||0)+w; }
    }
  }
  return {
    frontPool:[...frontSet].sort((a,b)=>a-b),
    backPool:[...backSet].sort((a,b)=>a-b),
    frontW, backW,
    log:`采样${sampleN} 中心宫=${centerGongs.join(',')}`
  };
}

function shrinkByGong(pool, pan, frontMax, backMax){
  const keepGongs = [pan.shiGanGong, pan.riGanGong, pan.zhiFuGong, ...(pan.sanQiDeShi||[]).map(s=>s.gong)].filter(Boolean);
  const uniq=[...new Set(keepGongs)];
  const frontKeep = pool.frontPool.filter(n=>uniq.includes(gongOf(n,frontMax)));
  const backKeep = pool.backPool.filter(n=>uniq.includes(backGong(n)));
  return {
    keepGongs:uniq,
    frontKeep: frontKeep.length? frontKeep : pool.frontPool.slice(0,Math.min(20,frontMax)),
    backKeep: backKeep.length? backKeep : pool.backPool.slice(0,Math.min(10,backMax||10))
  };
}

function pickWeighted(cand, k, wMap){
  const out=[]; const set=new Set();
  if(k<=0||!cand.length) return out;
  let guard=0, maxGuard=10000;
  while(out.length<k && set.size<cand.length && guard++<maxGuard){
    let total=0; for(const x of cand) total+=(wMap[x]||1);
    let r=Math.random()*total, acc=0, sel=cand[0];
    for(const x of cand){ acc+=(wMap[x]||1); if(r<=acc){sel=x;break;} }
    if(!set.has(sel)){set.add(sel);out.push(sel);}
  }
  // 不足则补足
  for(let n of cand){ if(out.length>=k) break; if(!out.includes(n)) out.push(n); }
  return out.sort((a,b)=>a-b);
}

function generateTickets(shrunk, frontW, backW, cfg, outN){
  const out=[];
  for(let i=0;i<outN;i++){
    const f = pickWeighted(shrunk.frontKeep, cfg.fpick, frontW).slice(0,cfg.fpick);
    let b=[];
    if(cfg.bpick>0) b = pickWeighted(shrunk.backKeep, cfg.bpick, backW).slice(0,cfg.bpick);
    out.push({front:f, back:b});
  }
  return out;
}

function fmtPool(arr,cls){
  if(!arr.length) return '<span class="muted">(空)</span>';
  return arr.map(n=>`<span class="${cls}">${pad(n)}</span>`).join(' ');
}
function fmtTicket(t,cfg){
  return `前[${t.front.map(pad).join(',')}]`+(cfg.bpick?` 后[${t.back.map(pad).join(',')}]`:'');
}

/* ===== 主计算（让出主线程防卡死） ===== */
let running=false;
function runCalculation(){
  if(running) return;
  running=true;
  const btn=document.getElementById('btnCalc');
  btn.disabled=true; btn.textContent='计算中，稍候…';
  document.getElementById('juInfo').textContent='计算中…';
  document.getElementById('frontPoolOut').innerHTML='';
  document.getElementById('backPoolOut').innerHTML='';
  document.getElementById('shrinkOut').textContent='-';

  setTimeout(()=>{
    try{
      const lotType=document.getElementById('lotType').value;
      const cfg=DRAW_CFG[lotType];
      const dt=nextDrawDate(lotType, new Date());
      document.getElementById('dtInput').value=fmtDT(dt);
      const qimen=document.getElementById('chkQimen').checked;
      const wang=document.getElementById('chkWang').checked;
      const sampleN=Math.max(50,Math.min(3000,parseInt(document.getElementById('sampleN').value||800)));
      const outN=Math.max(1,Math.min(10,parseInt(document.getElementById('outN').value||5)));
      const pan = qimen? makeQimenPan(dt):null;
      const pool = buildTotalPool(pan, cfg, {qimen,wang}, sampleN);
      const shrunk = shrinkByGong(pool, pan||{shiGanGong:5,riGanGong:5,zhiFuGong:5,sanQiDeShi:[{gong:5}]}, cfg.front, cfg.back);
      const tickets = generateTickets(shrunk, pool.frontW, pool.backW, cfg, outN);

      let jt=`彩种: ${cfg.name}\n起局时间(下一期): ${fmtDT(dt)}\n`;
      if(pan){
        jt+=`节气(简化): ${pan.jieQi} | ${pan.yy}遁${pan.juBase}局\n`;
        jt+=`时干宫:${pan.shiGanGong} 日干宫:${pan.riGanGong} 值符宫:${pan.zhiFuGong} 值使宫:${pan.zhiShiGong}\n`;
        jt+=`空亡:${pan.kong.join(',')} 马星:${pan.maXing.join(',')}\n五不遇:${pan.wuBuYu?'是':'否'}\n`;
      }else{ jt+='(未启用奇门，等权采样)\n'; }
      document.getElementById('juInfo').textContent=jt;

      document.getElementById('frontPoolOut').innerHTML = fmtPool(shrunk.frontKeep,'num-front');
      document.getElementById('backPoolOut').innerHTML = cfg.back? fmtPool(shrunk.backKeep,'num-back') : '(本彩种无后池)';

      let st=`围号宫:[${shrunk.keepGongs.join(',')}]\n前池${shrunk.frontKeep.length}个 / 后池${shrunk.backKeep.length}个\n输出注单(≤${outN}):\n`;
      tickets.forEach((t,i)=> st+=`${i+1}. ${fmtTicket(t,cfg)}\n`);
      document.getElementById('shrinkOut').textContent=st;
    }catch(e){
      console.error(e);
      document.getElementById('juInfo').textContent='计算异常: '+e.message;
    }finally{
      running=false;
      btn.disabled=false; btn.textContent='计算（自动起局→奇门总池→九宫围号→注单）';
    }
  }, 0);
}

/* ===== 绑定/初始化 ===== */
document.getElementById('btnCalc').addEventListener('click', runCalculation);
document.getElementById('lotType').addEventListener('change', ()=>{
  document.getElementById('dtInput').value=fmtDT(nextDrawDate(document.getElementById('lotType').value, new Date()));
});
function init(){
  document.getElementById('lotType').value='ssq';
  document.getElementById('dtInput').value=fmtDT(nextDrawDate('ssq',new Date()));
  // 不自动跑重计算，避免手机打开即卡；点按钮再算（也可放setTimeout(runCalculation,200)按需）
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>

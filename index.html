/* ========== 干支/历法工具 ========== */
function gzIndex(gan,zhi){return TIANGAN.indexOf(gan)+DIZHI.indexOf(zhi)*10;}
function addGZ(ganZhi, n){
  const g=TIANGAN.indexOf(ganZhi[0]), z=DIZHI.indexOf(ganZhi[1]);

}
function gzDiff(a,b){
  return ((TIANGAN.indexOf(a[0])-TIANGAN.indexOf(b[0]))%10+ ((DIZHI.indexOf(a[1])-DIZHI.indexOf(b[1]))%12)*10);
}
// 简化干支日（以已知锚点推算；足够排盘研究用；要天文级请接专业历法库）
// 锚点：2024-01-01 日柱 甲辰（仅做演示锚，实际需按子时/夜子处理；此处以北京时“日”粗算）
function getDayGZ(date){
  const base=new Date(Date.UTC(2024,0,1,0,0,0));
  const d=new Date(date); d.setMilliseconds(0);
  const days=Math.floor((d-base)/(86400000));
  const g=(0+days)%10, z=(4+days)%12;
  return TIANGAN[g]+DIZHI[z];
}
function getYearGZ(date){
  // 以立春为界更严谨；这里给近似（配合节气判定后再修正）
  const y=date.getFullYear();
  const idx=y-1984; // 1984甲子年
  return TIANGAN[idx%10]+DIZHI[idx%12];
}
function getMonthGZ(date, jie){
  // 月柱以节分切；这里用“所在节气”近似映射（研究级）
  const map={'立春':0,'惊蛰':1,'清明':2,'立夏':3,'芒种':4,'小暑':5,'立秋':6,'白露':7,'寒露':8,'立冬':9,'大雪':10,'冬至':11};
  const m=map[jie]; const yg=getYearGZ(date);
  const yidx=TIANGAN.indexOf(yg[0])*12+DIZHI.indexOf(yg[1]);
  const startG=DIZHI.indexOf('寅');
  const g=(TIANGAN.indexOf('甲')+(yidx*2+m))%10;
  const z=(startG+m)%12;
  return TIANGAN[g]+DIZHI[z];
}
function getHourGZ(date, dayGZ){
  const h=date.getHours();
  // 子时23-1特殊处理可加；这里按整点段
  const zhiIdx=Math.floor(((h+1)%24)/2);
  const dZ=DIZHI.indexOf(dayGZ[1]);
  const startZ=DIZHI.indexOf('子');
  const off=(zhiIdx-startZ+12)%12;
  const g=(TIANGAN.indexOf(dayGZ[0])+off)%10;
  return TIANGAN[g]+DIZHI[zhiIdx];
}

/* ========== 找当前节气/上节（拆补用） ========== */
function toMin(d){return d.getFullYear()*1e8+d.getMonth()*1e6+d.getDate()*1e4+d.getHours()*60+d.getMinutes();}
function findJie(date){
  let cur=null,prev=null;
  for(const r of JIEQI){
    const jt=new Date(r[0],r[1]-1,r[2],r[3],r[4],0);
    if(date>=jt){cur={name:r[5],t:jt};prev=cur;}
    else break;
  }
  // 返：当前所处节后区间（以“节”为界，非中气；拆补按节）
  return {cur, prev};
}
function jieIsYang(jie){
  const y=['冬至','小寒','大寒','立春','雨水','惊蛰'];

  if(y.includes(jie)) return true;
  if(n.includes(jie)) return false;
  // 其余按“在冬至→夏至之间/之后”兜底（研究用）
  return true;
}

/* ========== 真太阳时（按经度修正均时差，简化） ========== */
function trueSolarTime(bjDate, lng=121.6){
  // 北京时=东经120标准时；按经度差补（分钟）；均时差略去/可加表
  const dt=new Date(bjDate.getTime()+(lng-120)*4*60000);
  return dt;
}

/* ========== 地盘（几局定戊落宫，顺逆排六仪三奇） ========== */
// 宫序按洛书：1坎2坤3震4巽5中6乾7兑8艮9离
function dipanArr(juObj){
  const {yin,ju}=juObj;
  // 阳遁：戊落ju宫，顺行（宫+1），六仪顺；三奇逆（乙丙丁逆布）
  // 阴遁：戊落ju宫，逆行（宫-1），六仪逆；三奇顺布
  const dip={};
  const order=yin?-1:1;
  // 六仪：戊己庚辛壬癸
  const ly=['戊','己','庚','辛','壬','癸'];
  let g=ju;
  for(let i=0;i<6;i++){
    dip[g]=(dip[g]||[]).concat(ly[i]);
    g=((g-1+order*1)+9)%9+1; if(g===5&&i<5) g=((g-1+order)+9)%9+1; // 中宫处理简法
  }
  // 三奇：乙丙丁
  const sq=['乙','丙','丁'];
  g=ju;
  for(let i=0;i<3;i++){
    dip[g]=(dip[g]||[]).concat(sq[i]);
    g=((g-1+(yin?1:-1))+9)%9+1;
    if(g===5) g=((g-1+(yin?1:-1))+9)%9+1;
  }
  return dip;
}
// 更稳的“地盘干落宫”表达（取主干）
function dipanGanToGong(juObj){
  const {yin,ju}=juObj;
  const m={};
  const ly=['戊','己','庚','辛','壬','癸'];
  const sq=['乙','丙','丁'];
  let p=ju;
  for(let i=0;i<6;i++){m[ly[i]]=p; p=yin?((p-2+9)%9+1):((p%9)+1); if(m[ly[i]]===5) m[ly[i]]=yin?8:3;}
  p=ju;
  for(let i=0;i<3;i++){m[sq[i]]=p; p=yin?((p%9)+1):((p-2+9)%9+1); if(m[sq[i]]===5) m[sq[i]]=yin?2:7;}
  return m;
}

  const map={'甲子':'戊','甲戌':'己','甲申':'庚','甲午':'辛','甲辰':'壬','甲寅':'癸'};
  const gan=map[zhouGan]; return dipGong[gan];
}

  // 值使=同值符所在宫对应“本门”，按节气阴阳遁门序；这里用“宫→八门本序近似（开8/休1/生2…）”兜底

/* ========== 天盘/九星/八门/八神（随值符/值使飞） ========== */
function flyTianpan(dipGong, zfGong, yin){
  // 天盘：值符随时干飞；简化：以值符落宫为起点顺/逆飞九星
  const seq=[1,8,3,4,9,2,7,6,5];

  const out={}; let i=seq.indexOf(zfGong);
  for(let k=0;k<9;k++){
    const g=seq[(i+(yin?-k:k)+9)%9];
    out[g]=star[seq[k]]||'天禽';
  }
  return out;
}
function flyMen(zfGong, yin){
  const menOrder=['开','休','生','伤','杜','景','死','惊'];
  const out={}; let idx=menOrder.indexOf('开');
  const seq=[1,8,3,4,9,2,7,6];
  let s=seq.indexOf(zfGong); if(s<0) s=0;
  for(let k=0;k<8;k++){
    const g=seq[(s+(yin?-k:k)+8)%8];
    out[g]=menOrder[(idx+(yin?-k:k)+8)%8];
  }
  return out;
}
function flyShen(zfGong, yin){
  const names=['值符','腾蛇','太阴','六合','白虎','玄武','九地','九天'];
  const seq=[1,8,3,4,9,2,7,6];
  let s=seq.indexOf(zfGong); if(s<0) s=0;
  const out={};
  for(let k=0;k<8;k++) out[seq[(s+(yin?-k:k)+8)%8]]=names[k];
  return out;
}

/* ========== 空亡/门迫/击刑/入墓 ========== */
function kongWang(hourGZ){
  // 时旬空亡（六甲旬空）
  const m={'甲子':'戌亥','甲戌':'申酉','甲申':'午未','甲午':'辰巳','甲辰':'寅卯','甲寅':'子丑'};
  return m[xunShou(hourGZ)]||'戌亥';
}
function isKong(gong, kw){
  const map={1:['子','亥'],2:['丑','寅'],3:['卯'],4:['辰','巳'],6:['戌'],7:['酉'],8:['丑','寅'],9:['午']};
  return (map[gong]||[]).some(z=>kw.includes(z));
}
// 击刑（常见）：戊落震(3)、己落坤(2)、庚落艮(8)、辛落离(9)、壬癸落巽(4)（各派略异）
function hitXing(dipGanGong){
  const r=[];
  if(dipGanGong['戊']===3) r.push('戊击刑震');
  if(dipGanGong['己']===2) r.push('己击刑坤');
  if(dipGanGong['庚']===8) r.push('庚击刑艮');
  if(dipGanGong['辛']===9) r.push('辛自刑离');
  if(dipGanGong['壬']===4||dipGanGong['癸']===4) r.push('壬癸刑巽');
  return r;
}
// 入墓（常见）：乙丙戊落乾(6)；丁己庚落艮(8)；壬辛落巽(4)；甲/癸落坤(2)
function ruMu(tianGanGong){
  const r=[]; const g=tianGanGong||{};
  if([g['乙'],g['丙'],g['戊']].includes(6)) r.push('乙丙戊入墓乾');
  if([g['丁'],g['己'],g['庚']].includes(8)) r.push('丁己庚入墓艮');
  if([g['壬'],g['辛']].includes(4)) r.push('壬辛入墓巽');
  if([g['甲'],g['癸']].includes(2)) r.push('甲癸入墓坤');
  return r;
}
// 门迫（方向性）：开/惊落震巽、生/死落坎、伤/杜落坤艮、休落离、景落乾兑等（各派略异，给可核对框架）
function menPo(menGong){
  const r=[]; const m=menGong||{};
  for(const g of Object.keys(m)){const mn=m[g];
    if((mn==='开'||mn==='惊')&&(g==='3'||g==='4')) r.push(mn+'门迫震巽');
    if((mn==='生'||mn==='死')&&g==='1') r.push(mn+'门迫坎');
    if((mn==='伤'||mn==='杜')&&(g==='2'||g==='8')) r.push(mn+'门迫坤艮');
    if(mn==='休'&&g==='9') r.push('休门迫离');
    if(mn==='景'&&(g==='6'||g==='7')) r.push('景门迫乾兑');
  }
  return r;
}

/* ========== 主排盘函数 ========== */
function qimenBoard(date){
  const ts=trueSolarTime(date,121.6);
  const j=findJie(ts);
  const jie=(j.cur&&j.cur.name)||'冬至';
  const dayGZ=getDayGZ(ts);
  const hourGZ=getHourGZ(ts,dayGZ);
  const futou=getFutou(dayGZ);
  const yuan=yuanOfFutou(futou);
  const juStr=getJu(jie,yuan);
  const juO=parseJu(juStr);
  const dipGong=dipanGanToGong(juO);
  const dipFull=dipanArr(juO);
  const xs=xunShou(hourGZ);
  const zfGong=zhiFu(xs,dipGong);
  const zsName=zhiShi(jie,zfGong);
  const tianPan=flyTianpan(dipFull,zfGong,juO.yin);
  const menPan=flyMen(zfGong,juO.yin);
  const shenPan=flyShen(zfGong,juO.yin);
  const kw=kongWang(hourGZ);
  const kong=Object.keys(dipGong).filter(g=>isKong(Number(g),kw)).map(Number);
  const flags={
    xing:hitXing(dipGong),
    mu:ruMu(dipGong),
    men:menPo(menPan),
    kong:kw
  };
  // 用神：取“值符/值使/开生门/日干落宫”等供取号
  const yongGongs=Array.from(new Set([zfGong, Number(Object.keys(menPan).find(g=>menPan[g]==='开')||zfGong), Number(Object.keys(menPan).find(g=>menPan[g]==='生')||zfGong)]));
  return {
    t:ts, jie, futou, yuan, type:juO.yin?'阴遁':'阳遁', ju:juO.ju,
    dayGZ, hourGZ, xunShou:xs,
    zfGong, zsName,
    dipan:dipGong, dipanFull:dipFull,
    tianpan:tianPan, menpan:menPan, shenpan:shenPan,
    kong, flags,
    yongGongs
  };
}

  yongGongs:b.yongGongs
},null,2

<style>

<div class="ui-card">

    <button onclick="uiFetchPrev()">⬇ 自动获取上期(可能CORS)</button>

<div class="ui-card"><div class="small">第0层·奇门落宫初池（值符/值使/开生门/用神宫→干→数）</div><div id="uiInit"></div></div>
<div class="ui-card"><div class="small">B关系层（同尾/对宫/宫干+9）</div><div id="uiExt"></div></div>
<div class="ui-card"><div class="small">杀号（空亡/击刑/门迫/入墓 + 张委铭：重号/尾数集中/区间退号）</div><div id="uiKill"></div></div>
<div class="ui-card"><div class="small">剩余池</div><div id="uiRemain"></div></div>
<div class="ui-card"><div class="small">精选注（同盘同结果）</div><div id="uiPicks"></div></div>

<div id="uiErr" class="err"></div>

<script>
/* ========== B1 状态 ========== */
let LOT='ssq';
let PREV=null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const sum=a=>a.reduce((s,x)=>s+x,0);
const uniq=a=>Array.from(new Set(a));

/* ========== B2 真太阳时/下期 ========== */
function bjToDalian(bj){ return new Date(bj.getTime()+(121.6-120)*4*60000); }
function nextDraw(lot,now){
  const r=lot==='ssq'?{wd:[0,2,4],h:21,m:15}:{wd:[1,3,6],h:21,m:25};
  const d=new Date(now); d.setSeconds(0,0);
  for(let i=0;i<21;i++){
    if(r.wd.includes(d.getDay())){ d.setHours(r.h,r.m,0,0); if(d>now) return d; }
    d.setDate(d.getDate()+1); d.setHours(r.h,r.m,0,0);
  }
  return d;
}
function uiRefreshTime(){
  const nd=nextDraw(LOT,new Date());
  const ts=bjToDalian(nd);
  $('uiTime').innerHTML=`下期（北京）${nd.toLocaleString('zh-CN')} ｜ 大连真太阳时 ${ts.toLocaleString('zh-CN')} ｜ 当前节气区：${qimenBoard(ts).jie}`;
}

/* ========== B3 干→号 / 宫→号 ========== */
const GAN_NUM={戊:1,己:2,庚:3,辛:4,壬:5,癸:6,丁:7,丙:8,乙:9};
function ganToNums(g,lot){
  const n=GAN_NUM[g]; if(!n) return [];
  const max=lot==='ssq'?33:35;
  const out=[n];
  for(let k=1;k<=3;k++){ const x=n+k*9; if(x<=max) out.push(x); }
  // 同尾
  const tail=n%10;
  for(let v=tail; v<=max; v+=10) if(!out.includes(v)) out.push(v);
  return out.sort((a,b)=>a-b);
}
function gongGan(board,g){
  return board.tianpan[g] || board.dipan[g] || '';
}
function initPool(board,lot){
  const set=new Set();
  const gongs=uniq([board.zfGong, ...board.yongGongs]);
  gongs.forEach(g=>{
    ganToNums(gongGan(board,g),lot).forEach(x=>set.add(x));
    // 开/生门宫
    for(const gg of Object.keys(board.menpan)){
      if(board.menpan[gg]==='开'||board.menpan[gg]==='生'){
        ganToNums(gongGan(board,Number(gg)),lot).forEach(x=>set.add(x));
      }
    }
  });
  return [...set].sort((a,b)=>a-b);
}
function extendB(pool,lot){
  const max=lot==='ssq'?33:35; const s=new Set(pool);
  pool.forEach(x=>{
    const tail=x%10;
    for(let v=tail;v<=max;v+=10) s.add(v);
    const opp = x + (x<=max/2? Math.round(max/2): -Math.round(max/2));
    if(opp>=1&&opp<=max) s.add(opp);
    for(let k=1;k<=3;k++){ const v=x+k*9; if(v<=max) s.add(v); }
  });
  return [...s].sort((a,b)=>a-b);
}

/* ========== B4 张委铭式杀号 ========== */
function killStep(pool,board,prev,lot){
  const kill=new Set();
  // 空亡宫干
  board.kong.forEach(g=>{ const gz=gongGan(board,g); if(GAN_NUM[gz]) kill.add(GAN_NUM[gz]); });
  // 击刑/入墓关联干
  board.flags.xing.forEach(s=>{ const g=s.replace(/[^甲乙丙丁戊己庚辛壬癸]/g,''); g&&kill.add(GAN_NUM[g]); });
  board.flags.mu.forEach(s=>{ const g=s.replace(/[^甲乙丙丁戊己庚辛壬癸]/g,''); g&&kill.add(GAN_NUM[g]); });
  board.flags.men.forEach(()=>{}); // 门迫主要标凶，不直接删号
  // 张委铭：重号/邻号/尾数集中/区间退号
  if(prev&&Array.isArray(prev.front)){
    prev.front.forEach(x=>kill.add(x));
    prev.front.forEach(x=>{ if(x-1>=1)kill.add(x-1); if(x+1<= (lot==='ssq'?33:35))kill.add(x+1); });
    const tail={}; prev.front.forEach(x=>{const t=x%10; (tail[t]=tail[t]||[]).push(x);});
    Object.values(tail).forEach(arr=>{ if(arr.length>=2) arr.slice(0,1).forEach(x=>kill.add(x)); });
    // 区间退号
    const seg={a:[],b:[],c:[]};
    prev.front.forEach(x=>{ if(x<=11)seg.a.push(x); else if(x<=22)seg.b.push(x); else seg.c.push(x); });
    const big=Object.entries(seg).sort((a,b)=>b[1].length-a[1].length)[0][0];
    pool.forEach(x=>{ if((big==='a'&&x<=11)||(big==='b'&&x>11&&x<=22)||(big==='c'&&x>22)) kill.add(x); });
  }
  const remain=pool.filter(x=>!kill.has(x));
  return {kill:[...kill].filter(x=>pool.includes(x)).sort((a,b)=>a-b), remain};
}

/* ========== B5 褚天一形态 ========== */
function shapeOK(front,lot,prev){
  const need=lot==='ssq'?6:5;
  if(front.length!==need) return false;
  const big=front.filter(x=>x>(lot==='ssq'?16:17)).length;
  const small=need-big;
  const s=sum(front), sp=front[need-1]-front[0];
  if(big<2||small<2) return false;
  if(lot==='ssq'&&(s<85||s>125)) return false;
  if(lot==='dlt'&&(s<60||s>140)) return false;
  if(sp<(lot==='ssq'?18:18)||sp>(lot==='ssq'?30:32)) return false;
  // 连号：最多1组两连
  let groups=0,run=1;
  for(let i=1;i<front.length;i++){ if(front[i]-front[i-1]===1){run++;} else {if(run>=2)groups++;run=1;} }
  if(run>=2)groups++;
  if(groups>1) return false;
  // 重号1-2
  if(prev&&Array.isArray(prev.front)){
    const rep=front.filter(x=>prev.front.includes(x)).length;
    if(rep<1||rep>2) return false;
  }
  // AC值粗筛
  const diffs=new Set();
  for(let i=0;i<front.length;i++)for(let j=i+1;j<front.length;j++) diffs.add(Math.abs(front[i]-front[j]));
  const ac=diffs.size-(front.length-1);
  if(lot==='ssq'&&(ac<5||ac>10)) return false;
  if(lot==='dlt'&&(ac<7||ac>12)) return false;
  return true;
}
function pickNotes(frontPool,backPool,lot,prev){
  const needF=lot==='ssq'?6:5, needB=lot==='ssq'?1:2;
  if(frontPool.length<needF||backPool.length<needB) return [];
  const out=[];
  for(let i=0;i<600&&out.length<3;i++){
    const off=i*7+3;
    const arr=[...frontPool];
    const f=[];
    for(let k=0;k<needF;k++) f.push(arr[(off+k*13)%arr.length]);
    f.sort((a,b)=>a-b);
    const bk=[];
    for(let k=0;k<needB;k++) bk.push(backPool[(off+k*11)%backPool.length]);
    bk.sort((a,b)=>a-b);
    if(shapeOK(f,lot,prev)) out.push({front:f,back:bk});
  }
  return out;
}

/* ========== B6 渲染 ========== */
function ball(n,cls){return `<span class="ball ${cls}">${pad(n)}</span>`;}
function uiRun(){
  $('uiErr').textContent='';
  try{
    const nd=nextDraw(LOT,new Date());
    const ts=bjToDalian(nd);
    const board=qimenBoard(ts);
    const init=initPool(board,LOT);
    const ext=extendB(init,LOT);
    const k=killStep(ext,board,PREV,LOT);
    const bMax=LOT==='ssq'?16:12;
    const backAll=Array.from({length:bMax},(_,i)=>i+1);
    const kb=killStep(backAll,board,null,LOT);
    const picks=pickNotes(k.remain,kb.remain,LOT,PREV);

    $('uiInit').innerHTML=init.map(n=>ball(n,'r')).join('')||'<span class="small">(空)</span>';
    $('uiExt').innerHTML=ext.map(n=>ball(n,'r')).join('')||'<span class="small">(空)</span>';
    $('uiKill').innerHTML=k.kill.map(n=>ball(n,'k')).join('')||'<span class="small">(无)</span>';
    $('uiRemain').innerHTML=
      (LOT==='ssq'?'红：':'前区：')+k.remain.map(n=>ball(n,'r')).join('')+
      `<span class="sep">${LOT==='ssq'?'蓝：':'后区：'}</span>`+kb.remain.map(n=>ball(n,'b')).join('');
    $('uiPicks').innerHTML=picks.length?
      picks.map((p,i)=>`<div class="pick">${p.front.map(n=>ball(n,'r')).join('')}<span class="sep">+</span>${p.back.map(n=>ball(n,'b')).join('')} <span class="tag">精选${i+1}</span><div class="small">和值${sum(p.front)} 跨度${p.front[p.front.length-1]-p.front[0]} AC粗筛通过</div></div>`).join('')
      :'<div class="small">剩余池未产出符合褚天一形态的注（可放宽和值/AC/重号）</div>';
    $('uiDebug').textContent=JSON.stringify({
      jie:board.jie, futou:board.futou, yuan:board.yuan, type:board.type, ju:board.ju,
      dayGZ:board.dayGZ, hourGZ:board.hourGZ, xunShou:board.xunShou,
      zfGong:board.zfGong, zsName:board.zsName, kong:board.kong, flags:board.flags,
      yongGongs:board.yongGongs,
      dipan:board.dipan, tianpan:board.tianpan, menpan:board.menpan, shenpan:board.shenpan
    },null,2);
    $('uiStatus').innerHTML=`<span class="ok">✓ ${board.type}${board.ju}局/${board.yuan}/符头${board.futou}</span>`;
  }catch(e){
    $('uiErr').textContent='运行错误：'+e.message; console.error(e);
  }
}

/* ========== B7 上期：粘贴 / 自动获取 ========== */
function loadPrevFromText(){
  const t=$('prevTxt').value.trim();
  if(!t) return;
  try{
    const j=JSON.parse(t);
    PREV=j;
    $('prevInfo').textContent=`已用粘贴：${j.issue} ${j.date} 前/红[${j.front}] 后/蓝[${j.back}]`;
  }catch(e){ $('prevInfo').textContent='JSON解析失败：'+e.message; }
}
$('prevTxt').addEventListener('blur',loadPrevFromText);

async function uiFetchPrev(){
  $('uiStatus').textContent='获取中...';
  try{
    let d;
    if(LOT==='ssq'){
      const r=await fetch('https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&pageNo=1&pageSize=1');
      const j=await r.json();
      const it=j.result?j.result[0]:(j.data&&j.data.list&&j.data.list[0]);
      d={issue:it.code||it.issue||it.expect,date:it.date,front:String(it.red).split(',').map(Number),back:[Number(it.blue)]};
    }else{
      const r=await fetch('https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageSize=1&isVerify=1');
      const j=await r.json();
      const it=j.value.list[0];
      const parts=it.lotteryDrawResult.split(' ');
      d={issue:it.lotteryDrawNum,date:it.lotteryDrawTime,front:parts.slice(0,5).map(Number),back:parts.slice(5).map(Number)};
    }
    PREV=d;
    $('prevTxt').value=JSON.stringify(d);
    $('prevInfo').innerHTML=`<span class="ok">已获取 ${d.issue} ${d.date} 前/红[${d.front}] 后/蓝[${d.back}]</span>（github.io可能CORS，失败请粘贴）`;
    $('uiStatus').textContent='获取成功';
  }catch(e){
    $('uiErr').textContent='自动获取失败：'+e.message+'（CORS/接口变更；请粘贴JSON）';
  }
}

/* ========== B8 彩种切换 ========== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); LOT=t.dataset.lot;
  $('uiStatus').textContent='切换：'+(LOT==='ssq'?'双色球':'大乐透');
});

uiRefreshTime();
</script>

<script>
"use strict";

/* ================================================================
   1. 基础常量表（天干、地支、六十甲子、节气、局数、八门、九星、八神等）
   ================================================================ */
const TIAN_GAN = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const DI_ZHI   = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const SIXTY_JIAZI = (function(){
  var r=[], a=0, b=0;
  for(var k=0;k<60;k++){ r.push(TIAN_GAN[a]+DI_ZHI[b]); a=(a+1)%10; b=(b+1)%12; }
  return r;
})();

// 二十四节气表（月、日近似，用于拆补法定局）
const JIE_QI_TABLE = [
  ["立春",2,4],  ["雨水",2,19], ["惊蛰",3,6],  ["春分",3,21],
  ["清明",4,5],  ["谷雨",4,20], ["立夏",5,6],  ["小满",5,21],
  ["芒种",6,6],  ["夏至",6,21], ["小暑",7,7],  ["大暑",7,23],
  ["立秋",8,8],  ["处暑",8,23], ["白露",9,8],  ["秋分",9,23],
  ["寒露",10,8], ["霜降",10,23],["立冬",11,7], ["小雪",11,22],
  ["大雪",12,7], ["冬至",12,22],["小寒",1,6],  ["大寒",1,20]
];
const YIN_JIEQI = ["夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪"];
function isYinSeason(name){ return YIN_JIEQI.indexOf(name)!==-1; }

// 阳遁/阴遁 上中下三元局数表（按节气名索引）
const JU_SHU_MAP = {
  "立春":[8,5,2],  "雨水":[9,6,3],  "惊蛰":[1,7,4],
  "春分":[3,9,6],  "清明":[4,1,7],  "谷雨":[5,2,8],
  "立夏":[4,1,7],  "小满":[5,2,8],  "芒种":[6,3,9],
  "夏至":[9,3,6],  "小暑":[8,2,5],  "大暑":[7,1,4],
  "立秋":[2,5,8],  "处暑":[1,4,7],  "白露":[9,3,6],
  "秋分":[7,1,4],  "寒露":[6,9,3],  "霜降":[5,8,2],
  "立冬":[6,9,3],  "小雪":[5,8,2],  "大雪":[4,7,1],
  "冬至":[1,7,4],  "小寒":[2,8,5],  "大寒":[3,9,6]
};

// 八门（原始序：休生伤杜景死惊开）
const BA_MEN = ["休","生","伤","杜","景","死","惊","开"];
// 九星（天蓬天芮天冲天辅天禽天心天柱天任天英）
const JIU_XING = ["天蓬","天芮","天冲","天辅","天禽","天心","天柱","天任","天英"];
// 八神（值符腾蛇太阴六合白虎玄武九地九天）
const BA_SHEN = ["值符","腾蛇","太阴","六合","白虎","玄武","九地","九天"];

// 六仪（戊己庚辛壬癸丁丙乙）
const LIU_YI_ORDER = ["戊","己","庚","辛","壬","癸","丁","丙","乙"];

// 旬空表
const XUN_KONG_MAP = {
  "甲子":"戌亥","甲戌":"申酉","甲申":"午未","甲午":"辰巳","甲辰":"寅卯","甲寅":"子丑"
};

// 马星（地支映射）
const MA_XING_MAP = {
  "申":"寅","子":"寅","辰":"寅","寅":"申","午":"申","戌":"申","巳":"亥","酉":"亥","丑":"亥"
};

// 十二地支对应数字（用于宫位映射）
const DIZHI_TO_IDX = {"子":1,"丑":2,"寅":3,"卯":4,"辰":5,"巳":6,"午":7,"未":8,"申":9,"酉":10,"戌":11,"亥":12};

// 九宫对应地支（简映射）
const GONG_DIZHI = ["子","未","寅","卯","中","戌","巳","酉","午"];

// 奖型配置
const LOT_CFG = {
  ssq:{
    name:"双色球",
    fMin:1, fMax:33, fPick:6,
    bMin:1, bMax:16, bPick:1,
    bigLine:17,
    zoneSplit:[11,22],
    openWeekdays:[2,4,0],  // 周二、四、日
    openHour:21, openMin:15
  },
  dlt:{
    name:"大乐透",
    fMin:1, fMax:35, fPick:5,
    bMin:1, bMax:12, bPick:2,
    bigLine:18,
    zoneSplit:[12,24],
    openWeekdays:[1,3,6],  // 周一、三、六
    openHour:21, openMin:25
  }
};

/* ================================================================
   2. 全局变量
   ================================================================ */
var currentPan = null;           // 最近一次起局结果
var lastSSQFront = null;        // 上期双色球前区
var lastSSQBack  = null;        // 上期双色球蓝球
var lastDLTFront = null;        // 上期大乐透前区
var lastDLTBack  = null;        // 上期大乐透后区
var globalDebugLog = "";        // 调试日志

/* ================================================================
   3. 通用工具函数
   ================================================================ */
function pad2(n){ return n<10?"0"+n:""+n; }

function arraySum(arr){ var s=0; for(var i=0;i<arr.length;i++) s+=arr[i]; return s; }

function arrayMax(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]>m) m=arr[i]; return m; }

function arrayMin(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]<m) m=arr[i]; return m; }

function arraySpan(arr){ return arrayMax(arr)-arrayMin(arr); }

function arrayUnique(arr){
  var seen={}, out=[];
  for(var i=0;i<arr.length;i++){ if(!seen[arr[i]]){ seen[arr[i]]=1; out.push(arr[i]); } }
  return out;
}

function arrayIntersect(a,b){
  var s={},r=[];
  for(var i=0;i<a.length;i++) s[a[i]]=1;
  for(var i=0;i<b.length;i++) if(s[b[i]]) r.push(b[i]);
  return r;
}

function arrayDiff(a,b){
  var s={},r=[];
  for(var i=0;i<b.length;i++) s[b[i]]=1;
  for(var i=0;i<a.length;i++) if(!s[a[i]]) r.push(a[i]);
  return r;
}

function shuffleArray(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}

function calcAC(arr){
  var n=arr.length, diffs=[];
  for(var i=0;i<n;i++)
    for(var j=i+1;j<n;j++){
      var d=Math.abs(arr[i]-arr[j]);
      if(diffs.indexOf(d)===-1) diffs.push(d);
    }
  return diffs.length - (n-1);
}

function oddEvenCount(arr){
  var o=0,e=0;
  for(var i=0;i<arr.length;i++) if(arr[i]%2===1) o++; else e++;
  return [o,e];
}

function zoneDistribution(arr, split){
  var z1=0,z2=0,z3=0;
  for(var i=0;i<arr.length;i++){
    if(arr[i]<=split[0]) z1++;
    else if(arr[i]<=split[1]) z2++;
    else z3++;
  }
  return [z1,z2,z3];
}

function bigSmallCount(arr, line){
  var b=0,s=0;
  for(var i=0;i<arr.length;i++) if(arr[i]>=line) b++; else s++;
  return [b,s];
}

function tailNum(n){ return n%10; }

function tailMap(arr){
  var m={};
  for(var i=0;i<arr.length;i++){
    var t=tailNum(arr[i]);
    m[t]=(m[t]||0)+1;
  }
  return m;
}

function maxTailCount(arr){
  var m=tailMap(arr), mx=0;
  for(var k in m) if(m[k]>mx) mx=m[k];
  return mx;
}

function countRepeats(front, lastFront){
  if(!lastFront) return 0;
  var cnt=0;
  for(var i=0;i<front.length;i++) if(lastFront.indexOf(front[i])!==-1) cnt++;
  return cnt;
}

function countNeighbors(front, lastFront){
  if(!lastFront) return 0;
  var cnt=0;
  for(var i=0;i<front.length;i++){
    for(var j=0;j<lastFront.length;j++){
      if(Math.abs(front[i]-lastFront[j])===1){ cnt++; break; }
    }
  }
  return cnt;
}

function countConsecutivePairs(arr){
  var pairs=0;
  for(var i=0;i<arr.length-1;i++) if(arr[i+1]-arr[i]===1) pairs++;
  return pairs;
}

function countSameTailWithLast(front, lastFront){
  if(!lastFront) return 0;
  var lt={};
  for(var i=0;i<lastFront.length;i++) lt[tailNum(lastFront[i])]=1;
  var cnt=0;
  for(var i=0;i<front.length;i++) if(lt[tailNum(front[i])]) cnt++;
  return cnt;
}

/* ================================================================
   4. 日期时间工具
   ================================================================ */
function getCurrentDrawTime(lotType){
  var now = new Date();
  var cfg = LOT_CFG[lotType];
  var dow = now.getDay(); // 0周日 1周一 ... 6周六
  var targetDow = cfg.openWeekdays[0];
  // 找到下一个开奖日（当天如果是开奖日且时间已过则用下一期）
  var curDow = dow;
  var diff = (targetDow - curDow + 7) % 7;
  if(diff===0){
    // 今天就是开奖日，检查时间
    var curMin = now.getHours()*60 + now.getMinutes();
    var drawMin = cfg.openHour*60 + cfg.openMin;
    if(curMin >= drawMin) diff = 7; // 已过，推到下周同日
  }
  var drawDate = new Date(now);
  drawDate.setDate(drawDate.getDate() + diff);
  drawDate.setHours(cfg.openHour, cfg.openMin, 0, 0);
  return drawDate;
}

function findClosestJieQi(year, month, day){
  var best = JIE_QI_TABLE[0], bestDist = 9999;
  for(var i=0;i<JIE_QI_TABLE.length;i++){
    var q = JIE_QI_TABLE[i];
    var mDiff = month - q[1];
    var dDiff = day - q[2];
    var dist = Math.abs(mDiff*30 + dDiff);
    if(dist < bestDist){ bestDist = dist; best = q[0]; }
  }
  return best;
}

function getDayGanzhi(year, month, day){
  // 基准：1900-01-01 为甲戌日（索引10）
  var base = new Date(1900,0,1);
  var tar = new Date(year, month-1, day);
  var days = Math.round((tar - base) / 86400000);
  return SIXTY_JIAZI[(days + 10) % 60];
}

function getHourGanzhi(dayGan, hour){
  // 五鼠遁：甲己还加甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸何方发，壬子是真途
  var startMap = {"甲":0,"乙":2,"丙":4,"丁":6,"戊":8,"己":0,"庚":2,"辛":4,"壬":6,"癸":8};
  var ziIndex = Math.floor((hour + 1) / 2) % 12;
  var ganIndex = (startMap[dayGan] + ziIndex) % 10;
  return TIAN_GAN[ganIndex] + DI_ZHI[ziIndex];
}

function getXunShou(ganzhi){
  var idx = SIXTY_JIAZI.indexOf(ganzhi);
  if(idx === -1) return "甲子";
  return SIXTY_JIAZI[Math.floor(idx / 10) * 10];
}

function getXunKong(ganzhi){
  var xs = getXunShou(ganzhi);
  return XUN_KONG_MAP[xs] || "戌亥";
}

function getHiddenYi(ganzhi){
  var xs = getXunShou(ganzhi);
  var map = {"甲子":"戊","甲戌":"己","甲申":"庚","甲午":"辛","甲辰":"壬","甲寅":"癸"};
  return map[xs] || "戊";
}

function getYuanIndex(dayGanzhi){
  var zhi = dayGanzhi[1];
  if("子午卯酉".indexOf(zhi) !== -1) return 0;
  if("寅申巳亥".indexOf(zhi) !== -1) return 1;
  return 2;
}

function getJuNumber(jieQiName, date){
  var arr = JU_SHU_MAP[jieQiName];
  if(!arr) return 1;
  var idx = getYuanIndex(getDayGanzhi(date.getFullYear(), date.getMonth()+1, date.getDate()));
  return arr[idx];
}

function getMaXingGong(ganzhi){
  var zhi = ganzhi[1];
  var dz = MA_XING_MAP[zhi];
  if(!dz) return null;
  return DIZHI_TO_IDX[dz] || null;
}
<script>
/* ================================================================
   5. 奇门起局核心函数（拆补法，含地盘、天盘、人盘、神盘、四害标注）
   ================================================================ */
function createQiMenPan(drawTime){
  var y = drawTime.getFullYear();
  var m = drawTime.getMonth() + 1;
  var d = drawTime.getDate();
  var h = drawTime.getHours();

  var jieQiName = findClosestJieQi(y, m, d);
  var isYin = isYinSeason(jieQiName);

  var dayGZ = getDayGanzhi(y, m, d);
  var hourGZ = getHourGanzhi(dayGZ[0], h);
  var xunShouStr = getXunShou(hourGZ);
  var kongStr = getXunKong(hourGZ);
  var hiddenYiStr = getHiddenYi(hourGZ);

  var juAbs = getJuNumber(jieQiName, drawTime);
  var ju = isYin ? -juAbs : juAbs;

  // ---- 5.1 地盘布仪 ----
  var diPan = [];
  for(var i=0;i<9;i++){
    var pos = (i + Math.abs(ju) - 1) % 9;
    diPan.push({
      gong: i+1,
      yi: LIU_YI_ORDER[pos],
      num: i+1
    });
  }

  // ---- 5.2 值符、值使 ----
  var zhiYi = hiddenYiStr;
  var zhiFuGong = 1;
  for(var i=0;i<diPan.length;i++){
    if(diPan[i].yi === zhiYi){ zhiFuGong = diPan[i].gong; break; }
  }

  var hourIdx = SIXTY_JIAZI.indexOf(hourGZ);
  var xunIdx = SIXTY_JIAZI.indexOf(xunShouStr);
  var stepInXun = ((hourIdx - xunIdx) + 60) % 60;
  var menStep = Math.floor(stepInXun / 5) % 8; // 每个时辰走一门
  var zhiShiMen = BA_MEN[menStep];
  var zhiShiGong = ((zhiFuGong - 1 + menStep) % 9) + 1;

  // ---- 5.3 天盘（值符随时干落宫，其余星随仪转） ----
  var tianPan = [];
  for(var i=0;i<9;i++){
    tianPan.push({
      gong: i+1,
      yi: diPan[i].yi,
      xing: JIU_XING[i]
    });
  }
  // 值符落宫 = 时干所在宫
  var shiGan = hourGZ[0];
  var shiGanGong = 1;
  for(var i=0;i<diPan.length;i++){
    if(diPan[i].yi === shiGan){ shiGanGong = diPan[i].gong; break; }
  }
  // 找出天禽（中宫）的特殊处理：中宫寄坤二宫
  // 简化：将值符星移到时干宫，其余顺排
  var tianPanOrdered = [];
  var zfStar = JIU_XING[zhiFuGong-1];
  var offset = (shiGanGong - zhiFuGong + 9) % 9;
  for(var i=0;i<9;i++){
    var srcGong = (i - offset + 81) % 9;
    tianPanOrdered.push({
      gong: i+1,
      yi: diPan[i].yi,
      xing: JIU_XING[srcGong]
    });
  }

  // ---- 5.4 八门盘 ----
  var menPan = [];
  for(var i=0;i<9;i++){
    var dir = isYin ? -1 : 1;
    var g = ((zhiShiGong - 1 + i * dir) % 9 + 9) % 9 + 1;
    menPan.push({
      gong: g,
      men: BA_MEN[(menStep + i) % 8]
    });
  }

  // ---- 5.5 八神盘 ----
  var shenPan = [];
  for(var i=0;i<8;i++){
    var dir = isYin ? -1 : 1;
    var g = ((zhiFuGong - 1 + i * dir) % 9 + 9) % 9 + 1;
    shenPan.push({
      gong: g,
      shen: BA_SHEN[i]
    });
  }

  // ---- 5.6 四害标注（空亡、马星、入墓、门迫、击刑） ----
  var kongSet = {};
  for(var k=0;k<kongStr.length;k++){
    var z = kongStr[k];
    var idx = DIZHI_TO_IDX[z];
    if(idx) kongSet[idx] = true;
  }

  var maGong = getMaXingGong(hourGZ);

  // 入墓：甲乙寅卯墓在未，丙丁戌己墓在戌，庚辛申酉墓在丑，壬癸亥子墓在辰
  var muMap = {
    "甲":8,"乙":8,"丙":6,"丁":6,"戊":6,"己":6,
    "庚":2,"辛":2,"壬":5,"癸":5,
    "寅":8,"卯":8,"戌":6,"丑":2,"辰":5,"未":8
  };

  // 门迫：门克宫为迫（凶），宫克门为制（平）
  var menKeGong = {
    "休":1,"生":8,"伤":3,"杜":4,"景":9,"死":2,"惊":7,"开":6
  };
  var gongKeMen = {
    1:"景",2:"死",3:"惊",4:"开",6:"休",7:"生",8:"伤",9:"杜"
  };

  // 击刑：六仪击刑（子卯刑、寅巳申刑、丑未戌刑、辰午酉亥自刑）
  var jiXingMap = {
    "戊":3,"己":2,"庚":8,"辛":9,"壬":5,"癸":5
  };

  // ---- 5.7 构建九宫信息 ----
  var gongInfo = [];
  for(var i=1;i<=9;i++){
    var dp = diPan[i-1];
    var tp = tianPanOrdered[i-1];
    var mp = null;
    for(var j=0;j<menPan.length;j++){ if(menPan[j].gong === i){ mp = menPan[j]; break; } }
    var sp = null;
    for(var j=0;j<shenPan.length;j++){ if(shenPan[j].gong === i){ sp = shenPan[j]; break; } }

    var isKong = !!kongSet[i];
    var isMa = (maGong === i);
    var isMu = false;
    if(muMap[tp.yi] === i) isMu = true;
    var isMenPo = false;
    if(mp && menKeGong[mp.men] === i) isMenPo = true;
    var isJiXing = false;
    if(jiXingMap[tp.yi] === i) isJiXing = true;

    var tags = [];
    if(i === zhiFuGong) tags.push("值符");
    if(i === zhiShiGong) tags.push("值使");
    if(tp.yi === "乙" || tp.yi === "丙" || tp.yi === "丁") tags.push("三奇");
    if(isKong) tags.push("空");
    if(isMa) tags.push("马");
    if(isMu) tags.push("墓");
    if(isMenPo) tags.push("门迫");
    if(isJiXing) tags.push("击刑");

    gongInfo.push({
      gong: i,
      num: i,
      diYi: dp.yi,
      tianYi: tp.yi,
      xing: tp.xing,
      men: mp ? mp.men : "",
      shen: sp ? sp.shen : "",
      isZhiFu: (i === zhiFuGong),
      isZhiShi: (i === zhiShiGong),
      isQi: (tp.yi === "乙" || tp.yi === "丙" || tp.yi === "丁"),
      isKong: isKong,
      isMa: isMa,
      isMu: isMu,
      isMenPo: isMenPo,
      isJiXing: isJiXing,
      tags: tags,
      tagStr: tags.join("/")
    });
  }

  // ---- 5.8 三奇落宫列表 ----
  var qiGongs = [];
  for(var i=0;i<gongInfo.length;i++){
    if(gongInfo[i].isQi) qiGongs.push(gongInfo[i].gong);
  }

  return {
    drawTime: drawTime,
    year: y,
    month: m,
    day: d,
    hour: h,
    jieQi: jieQiName,
    isYin: isYin,
    ju: ju,
    juAbs: juAbs,
    dayGZ: dayGZ,
    hourGZ: hourGZ,
    xunShou: xunShouStr,
    kong: kongStr,
    hiddenYi: hiddenYiStr,
    zhiFuGong: zhiFuGong,
    zhiShiGong: zhiShiGong,
    zhiShiMen: zhiShiMen,
    qiGongs: qiGongs,
    maGong: maGong,
    diPan: diPan,
    tianPan: tianPanOrdered,
    menPan: menPan,
    shenPan: shenPan,
    gongInfo: gongInfo
  };
}

/* ================================================================
   6. 初池取数（基于奇门盘真实宫源，不再写死1~9）
   ================================================================ */
function getQiMenSourceGongs(pan){
  var g = [];

  // 值符宫
  g.push(pan.zhiFuGong);

  // 值使宫
  g.push(pan.zhiShiGong);

  // 三奇落宫
  for(var i=0;i<pan.qiGongs.length;i++) g.push(pan.qiGongs[i]);

  // 吉门落宫（生、开、休）
  for(var i=0;i<pan.gongInfo.length;i++){
    var c = pan.gongInfo[i];
    if(c.men === "生" || c.men === "开" || c.men === "休") g.push(c.gong);
  }

  // 六合落宫
  for(var i=0;i<pan.gongInfo.length;i++){
    if(pan.gongInfo[i].shen === "六合") g.push(pan.gongInfo[i].gong);
  }

  // 马星宫（动象）
  if(pan.maGong) g.push(pan.maGong);

  // 去重
  var seen={}, out=[];
  for(var i=0;i<g.length;i++){
    var v = g[i];
    if(v && v>=1 && v<=9 && !seen[v]){ seen[v]=1; out.push(v); }
  }

  // 如果为空，兜底为1~9
  if(out.length === 0){
    for(var i=1;i<=9;i++) out.push(i);
  }

  return out;
}

/* ================================================================
   7. 宫数映射到奖号域
   ================================================================ */
function expandGongToLotDomain(gongs, lotType){
  var cfg = LOT_CFG[lotType];
  var set={}, out=[];

  for(var i=0;i<gongs.length;i++){
    var g = gongs[i];
    if(g<1 || g>9) continue;

    // 方式1：同尾映射（宫1→01/11/21/31，宫3→03/13/23/33等）
    for(var n=cfg.fMin; n<=cfg.fMax; n++){
      if(n % 10 === g % 10 && !set[n]){
        set[n] = 1;
        out.push(n);
      }
    }

    // 方式2：宫数+9/+18/+27（控制在奖号范围内）
    var addVals = [0, 9, 18, 27];
    for(var j=0;j<addVals.length;j++){
      var n = g + addVals[j];
      if(n >= cfg.fMin && n <= cfg.fMax && !set[n]){
        set[n] = 1;
        out.push(n);
      }
    }

    // 方式3：宫数对应洛书数直接取
    if(!set[g]){
      set[g] = 1;
      out.push(g);
    }
  }

  return out.sort(function(a,b){ return a-b; });
}

function expandGongToBackDomain(gongs, lotType){
  var cfg = LOT_CFG[lotType];
  var set={}, out=[];

  for(var i=0;i<gongs.length;i++){
    var g = gongs[i];
    if(g<1 || g>9) continue;

    // 后区/蓝球：同尾映射
    for(var n=cfg.bMin; n<=cfg.bMax; n++){
      if(n % 10 === g % 10 && !set[n]){
        set[n] = 1;
        out.push(n);
      }
    }

    // 直接取宫数（如果在范围内）
    if(g >= cfg.bMin && g <= cfg.bMax && !set[g]){
      set[g] = 1;
      out.push(g);
    }

    // 宫数+9
    var n = g + 9;
    if(n >= cfg.bMin && n <= cfg.bMax && !set[n]){
      set[n] = 1;
      out.push(n);
    }
  }

  // 如果为空，全量
  if(out.length === 0){
    for(var n=cfg.bMin; n<=cfg.bMax; n++) out.push(n);
  }

  return out.sort(function(a,b){ return a-b; });
}

/* ================================================================
   8. 张委铭《精准杀号》规则实现
   ================================================================ */
function zhangWeiMingKill(pool, pan, lotType, lastFront, lastBack){
  var cfg = LOT_CFG[lotType];
  var killed = pool.slice();

  // 8.1 空亡宫杀：空亡地支对应的宫位及其同尾数去除
  var kongStr = pan.kong;
  var killGongs = {};
  for(var k=0;k<kongStr.length;k++){
    var z = kongStr[k];
    var idx = DIZHI_TO_IDX[z];
    if(idx) killGongs[idx] = true;
  }
  killed = killed.filter(function(n){
    var g = ((n-1) % 9) + 1;
    return !killGongs[g];
  });

  // 8.2 入墓宫杀
  var muGongs = {};
  for(var i=0;i<pan.gongInfo.length;i++){
    if(pan.gongInfo[i].isMu) muGongs[pan.gongInfo[i].gong] = true;
  }
  killed = killed.filter(function(n){
    var g = ((n-1) % 9) + 1;
    return !muGongs[g];
  });

  // 8.3 门迫宫杀
  var menPoGongs = {};
  for(var i=0;i<pan.gongInfo.length;i++){
    if(pan.gongInfo[i].isMenPo) menPoGongs[pan.gongInfo[i].gong] = true;
  }
  killed = killed.filter(function(n){
    var g = ((n-1) % 9) + 1;
    return !menPoGongs[g];
  });

  // 8.4 击刑宫杀
  var jiXingGongs = {};
  for(var i=0;i<pan.gongInfo.length;i++){
    if(pan.gongInfo[i].isJiXing) jiXingGongs[pan.gongInfo[i].gong] = true;
  }
  killed = killed.filter(function(n){
    var g = ((n-1) % 9) + 1;
    return !jiXingGongs[g];
  });

  // 8.5 上期重号控制（最多保留1个）
  if(lastFront && lastFront.length > 0){
    var lastSet = {};
    for(var i=0;i<lastFront.length;i++) lastSet[lastFront[i]] = true;
    var hasRemovedOne = false;
    killed = killed.filter(function(n){
      if(lastSet[n]){
        if(!hasRemovedOne){ hasRemovedOne=true; return true; }
        return false;
      }
      return true;
    });
  }

  // 8.6 邻号控制（最多保留2个邻号）
  if(lastFront && lastFront.length > 0){
    var neighborCount = 0;
    killed = killed.filter(function(n){
      for(var i=0;i<lastFront.length;i++){
        if(Math.abs(n - lastFront[i]) === 1){
          neighborCount++;
          if(neighborCount > 2) return false;
          break;
        }
      }
      return true;
    });
  }

  // 8.7 同尾控制（最多2个相同尾数）
  var tailCnt = {};
  killed = killed.filter(function(n){
    var t = tailNum(n);
    if((tailCnt[t] || 0) >= 2) return false;
    tailCnt[t] = (tailCnt[t] || 0) + 1;
    return true;
  });

  // 8.8 连号控制（最多1组两连号）
  // 在组合阶段做，这里不做

  // 如果杀得太狠，回退到原始池
  if(killed.length < cfg.fPick + 3){
    killed = pool.slice();
  }

  return killed;
}

/* ================================================================
   9. 褚天一《擒号秘技》规则实现
   ================================================================ */
function chuTianYiScore(front, pan, lotType, lastFront, lastBack){
  var cfg = LOT_CFG[lotType];
  var score = 0;

  // 9.1 和值评分
  var sumVal = arraySum(front);
  var idealSumLow = lotType==='ssq' ? 95 : 75;
  var idealSumHigh = lotType==='ssq' ? 115 : 105;
  if(sumVal >= idealSumLow && sumVal <= idealSumHigh) score += 10;
  else if(sumVal >= 80 && sumVal <= 140) score += 5;
  else score -= 3;

  // 9.2 跨度评分
  var spanVal = arraySpan(front);
  var idealSpanLow = lotType==='ssq' ? 18 : 20;
  var idealSpanHigh = lotType==='ssq' ? 28 : 32;
  if(spanVal >= idealSpanLow && spanVal <= idealSpanHigh) score += 8;
  else if(spanVal >= 15) score += 3;
  else score -= 2;

  // 9.3 AC值评分
  var acVal = calcAC(front);
  if(acVal >= 5 && acVal <= 8) score += 8;
  else if(acVal >= 4) score += 3;
  else score -= 3;

  // 9.4 大小比评分
  var sd = bigSmallCount(front, cfg.bigLine);
  var idealBig = lotType==='ssq' ? 3 : 2;
  var idealSmall = cfg.fPick - idealBig;
  if(sd[0] === idealBig && sd[1] === idealSmall) score += 6;
  else if(Math.abs(sd[0] - idealBig) <= 1) score += 3;
  else score -= 2;

  // 9.5 奇偶比评分
  var oe = oddEvenCount(front);
  var idealOdd = lotType==='ssq' ? 3 : 3;
  var idealEven = cfg.fPick - idealOdd;
  if(oe[0] === idealOdd && oe[1] === idealEven) score += 6;
  else if(Math.abs(oe[0] - idealOdd) <= 1) score += 2;
  else score -= 2;

  // 9.6 区间分布评分
  var zd = zoneDistribution(front, cfg.zoneSplit);
  if(zd[0] >= 1 && zd[0] <= 3 && zd[1] >= 1 && zd[1] <= 3 && zd[2] >= 1 && zd[2] <= 3) score += 6;
  else if(zd[0] >= 1 && zd[2] >= 1) score += 3;
  else score -= 2;

  // 9.7 上期同尾杀（后区）
  if(lastBack && lastBack.length > 0){
    var lastTailSet = {};
    for(var i=0;i<lastBack.length;i++) lastTailSet[tailNum(lastBack[i])] = true;
    var backTailCount = 0;
    for(var i=0;i<front.length;i++){
      if(lastTailSet[tailNum(front[i])]) backTailCount++;
    }
    if(backTailCount > 1) score -= 5;
  }

  // 9.8 奇门加权
  for(var i=0;i<front.length;i++){
    var n = front[i];
    var g = ((n-1) % 9) + 1;
    if(g === pan.zhiFuGong) score += 4;
    if(g === pan.zhiShiGong) score += 3;
    if(pan.qiGongs.indexOf(g) !== -1) score += 2;
    for(var j=0;j<pan.gongInfo.length;j++){
      var c = pan.gongInfo[j];
      if(c.gong === g){
        if(c.men === "生" || c.men === "开" || c.men === "休") score += 2;
        if(c.shen === "六合") score += 1;
        if(c.isKong) score -= 2;
        if(c.isMenPo) score -= 1;
        break;
      }
    }
  }

  // 9.9 连号惩罚（超过1组两连号扣分）
  var consecutivePairs = countConsecutivePairs(front);
  if(consecutivePairs > 1) score -= 4;

  // 9.10 重号惩罚
  var repeats = countRepeats(front, lastFront);
  if(repeats > 1) score -= 3;

  return score;
}

/* ================================================================
   10. 后区/蓝球选择
   =========================================================
<script>
/* ================================================================
   10. 后区/蓝球选择
   ================================================================ */
function pickBackNumbers(backPool, front, pan, lotType, lastBack){
  var cfg = LOT_CFG[lotType];
  var need = cfg.bPick;
  if(backPool.length <= need) return backPool.slice();

  // 为每个候选后区号码打分
  var scored = [];
  for(var i=0;i<backPool.length;i++){
    var b = backPool[i];
    var s = 0;

    // 与值使宫同尾加分
    var g = ((b-1) % 9) + 1;
    if(g === pan.zhiShiGong) s += 3;
    if(pan.qiGongs.indexOf(g) !== -1) s += 2;

    // 与前区和值/跨度尾数关联
    var sumTail = arraySum(front) % 10;
    var spanTail = arraySpan(front) % 10;
    if(b % 10 === sumTail) s += 2;
    if(b % 10 === spanTail) s += 1;

    // 避上期同号
    if(lastBack && lastBack.indexOf(b) !== -1) s -= 4;

    // 避上期间尾
    if(lastBack){
      for(var j=0;j<lastBack.length;j++){
        if(b % 10 === lastBack[j] % 10) s -= 1;
      }
    }

    // 随机扰动（防止死板）
    s += Math.random() * 0.5;

    scored.push({num:b, score:s});
  }

  scored.sort(function(a,b){ return b.score - a.score; });

  var result = [];
  for(var i=0;i<scored.length && result.length < need;i++){
    result.push(scored[i].num);
  }

  return result.sort(function(a,b){ return a-b; });
}

/* ================================================================
   11. 组合生成与筛选（核心选号引擎）
   ================================================================ */
function generateCombinations(arr, k){
  var result = [];
  function dfs(start, path){
    if(path.length === k){
      result.push(path.slice());
      return;
    }
    if(start >= arr.length) return;
    if(path.length + arr.length - start < k) return;
    path.push(arr[start]);
    dfs(start+1, path);
    path.pop();
    dfs(start+1, path);
  }
  dfs(0, []);
  return result;
}

function sampleCombinations(arr, k, samples){
  var result = [];
  var indices = [];
  for(var i=0;i<arr.length;i++) indices.push(i);
  for(var s=0;s<samples;s++){
    shuffleArray(indices);
    var picked = indices.slice(0,k).sort(function(a,b){ return a-b; });
    var combo = [];
    for(var i=0;i<picked.length;i++) combo.push(arr[picked[i]]);
    result.push(combo);
  }
  return result;
}

function generateFinalTickets(pan, lotType, count, lastFront, lastBack){
  var cfg = LOT_CFG[lotType];
  var debugLines = [];

  // Step 1: 获取初池宫源
  var srcGongs = getQiMenSourceGongs(pan);
  debugLines.push("奇门初池宫源（" + srcGongs.length + "个）：[" + srcGongs.join(",") + "]");

  // Step 2: 映射到前区奖号域
  var frontPool = expandGongToLotDomain(srcGongs, lotType);
  debugLines.push("初池映射前区候选（" + frontPool.length + "个）：[" + frontPool.join(",") + "]");

  // Step 3: 张委铭杀号
  var afterZhang = zhangWeiMingKill(frontPool, pan, lotType, lastFront, lastBack);
  debugLines.push("张委铭杀号后剩余（" + afterZhang.length + "个）：[" + afterZhang.join(",") + "]");

  // Step 4: 获取后区候选池
  var backPool = expandGongToBackDomain(srcGongs, lotType);
  debugLines.push("后区候选池（" + backPool.length + "个）：[" + backPool.join(",") + "]");

  // Step 5: 组合生成（如果候选太多则采样）
  var allCombos;
  var totalCombos = 1;
  for(var i=0;i<cfg.fPick;i++) totalCombos *= (afterZhang.length - i);
  for(var i=2;i<=cfg.fPick;i++) totalCombos = Math.floor(totalCombos / i);

  if(totalCombos <= 8000){
    allCombos = generateCombinations(afterZhang, cfg.fPick);
  } else {
    allCombos = sampleCombinations(afterZhang, cfg.fPick, 6000);
  }
  debugLines.push("生成候选组合数：" + allCombos.length);

  // Step 6: 褚天一评分
  var scoredCombos = [];
  for(var i=0;i<allCombos.length;i++){
    var front = allCombos[i];
    var score = chuTianYiScore(front, pan, lotType, lastFront, lastBack);
    scoredCombos.push({
      front: front,
      score: score,
      sum: arraySum(front),
      span: arraySpan(front),
      ac: calcAC(front),
      oe: oddEvenCount(front),
      zd: zoneDistribution(front, cfg.zoneSplit),
      sd: bigSmallCount(front, cfg.bigLine)
    });
  }

  // Step 7: 排序取最优
  scoredCombos.sort(function(a,b){ return b.score - a.score; });

  // Step 8: 去重并生成最终注数
  var tickets = [];
  var seenKeys = {};
  for(var i=0;i<scoredCombos.length && tickets.length < count;i++){
    var sc = scoredCombos[i];
    var back = pickBackNumbers(backPool, sc.front, pan, lotType, lastBack);
    var key = sc.front.join(",") + "|" + back.join(",");
    if(seenKeys[key]) continue;
    seenKeys[key] = 1;
    tickets.push({
      front: sc.front,
      back: back,
      score: sc.score,
      sum: sc.sum,
      span: sc.span,
      ac: sc.ac,
      oe: sc.oe,
      zd: sc.zd,
      sd: sc.sd
    });
  }

  // Step 9: 如果不够，补充生成
  while(tickets.length < count){
    var randomFront = [];
    var poolCopy = afterZhang.slice();
    shuffleArray(poolCopy);
    for(var i=0;i<cfg.fPick;i++) randomFront.push(poolCopy[i]);
    randomFront.sort(function(a,b){ return a-b; });
    var back = pickBackNumbers(backPool, randomFront, pan, lotType, lastBack);
    var key = randomFront.join(",") + "|" + back.join(",");
    if(!seenKeys[key]){
      seenKeys[key] = 1;
      tickets.push({
        front: randomFront,
        back: back,
        score: 0,
        sum: arraySum(randomFront),
        span: arraySpan(randomFront),
        ac: calcAC(randomFront),
        oe: oddEvenCount(randomFront),
        zd: zoneDistribution(randomFront, cfg.zoneSplit),
        sd: bigSmallCount(randomFront, cfg.bigLine)
      });
    }
  }

  return { tickets: tickets, debug: debugLines, frontPool: frontPool, afterZhang: afterZhang, backPool: backPool };
}

/* ================================================================
   12. 渲染输出
   ================================================================ */
function renderGongGrid(pan){
  var container = document.getElementById("gongContainer");
  container.innerHTML = "";
  for(var i=0;i<pan.gongInfo.length;i++){
    var c = pan.gongInfo[i];
    var div = document.createElement("div");
    div.className = "gong-cell";

    var numSpan = "<span class='g-num'>宫" + c.gong + "</span>";
    var mainLine = "<div class='g-main'>" + (c.tianYi || "") + " " + (c.men || "") + " " + (c.shen || "") + "</div>";
    var subLine = "<div class='g-sub'>" + (c.diYi || "") + " " + (c.xing || "") + "</div>";

    var tagHtml = "";
    for(var j=0;j<c.tags.length;j++){
      var cls = "g-tag";
      if(c.tags[j] === "值符") cls += " tag-zf";
      else if(c.tags[j] === "值使") cls += " tag-zs";
      else if(c.tags[j] === "三奇") cls += " tag-qi";
      else if(c.tags[j] === "空") cls += " tag-kong";
      else if(c.tags[j] === "马") cls += " tag-ma";
      tagHtml += "<span class='" + cls + "'>" + c.tags[j] + "</span>";
    }

    div.innerHTML = numSpan + mainLine + subLine + "<div>" + tagHtml + "</div>";
    container.appendChild(div);
  }
}

  lines.push("⭐ 值符：宫" + pan.zhiFuGong + " | 🚩 值使：宫" + pan.zhiShiGong + " (" + pan.zhiShiMen + ")");
  lines.push("✨ 三奇落宫：[" + (pan.qiGongs.length > 0 ? pan.qiGongs.join(",") : "无") + "]");
  lines.push("");

  // 调试信息
  lines.push("─── 初池与杀号过程 ───");
  for(var i=0;i<result.debug.length;i++){
    lines.push(result.debug[i]);
  }
  lines.push("");

  // 上期号码
  if(lotType === 'ssq'){
    if(lastSSQFront) lines.push("📊 上期前区：" + lastSSQFront.map(pad2).join(" ") + "  蓝：" + (lastSSQBack ? lastSSQBack.map(pad2).join(" ") : ""));
    else lines.push("📊 上期：未设置（首次运行）");
  } else {
    if(lastDLTFront) lines.push("📊 上期前区：" + lastDLTFront.map(pad2).join(" ") + "  后区：" + (lastDLTBack ? lastDLTBack.map(pad2).join(" ") : ""));
    else lines.push("📊 上期：未设置（首次运行）");
  }
  lines.push("");

  // 最终推荐
  lines.push("🎯 最终推荐 " + count + " 注：");
  lines.push("");
  for(var i=0;i<result.tickets.length;i++){
    var t = result.tickets[i];
    var frontStr = t.front.map(pad2).join(" ");
    var backStr = t.back.map(pad2).join(" ");
    var label = (cfg.bPick === 1) ? "蓝球" : "后区";
    lines.push("  第" + (i+1) + "注：前区 " + frontStr + "  " + label + " " + backStr);
    lines.push("        和值:" + t.sum + " 跨度:" + t.span + " AC:" + t.ac +
               " 奇偶:" + t.oe[0] + ":" + t.oe[1] +
               " 大小:" + t.sd[0] + ":" + t.sd[1] +
               " 区间:" + t.zd[0] + ":" + t.zd[1] + ":" + t.zd[2] +
               " 评分:" + t.score.toFixed(1));
    lines.push("");
  }

  lines.push(sep);
  lines.push("⚠️ 声明：本工具仅为奇门遁甲术数规则演示与娱乐模型");
  lines.push("   彩票开奖为完全随机独立事件，不构成任何投注建议");
  lines.push("   请理性购彩，量力而行，自担风险");
  lines.push(sep);

  return lines.join("\n");
}

/* ================================================================
   13. 主入口函数
   ================================================================ */
function runLottery(lotType, count){
  try {
    var cfg = LOT_CFG[lotType];
    var drawTime = getCurrentDrawTime(lotType);

    // 起局
    currentPan = createQiMenPan(drawTime);

    // 渲染九宫格
    renderGongGrid(currentPan);

    // 获取上期数据
    var lastFront = (lotType === 'ssq') ? lastSSQFront : lastDLTFront;
    var lastBack = (lotType === 'ssq') ? lastSSQBack : lastDLTBack;

    // 生成选号
    var result = generateFinalTickets(currentPan, lotType, count, lastFront, lastBack);

    // 格式化输出
    var outputText = formatOutput(currentPan, result, lotType, count);

    // 显示
    document.getElementById("mainOutput").innerHTML = outputText;

  } catch(e) {
    document.getElementById("mainOutput").innerHTML = "❌ 错误：" + e.message + "\n\n" + e.stack;
  }
}

function showPanOnly(){
  try {
    var lotType = 'ssq';
    var drawTime = getCurrentDrawTime(lotType);
    currentPan = createQiMenPan(drawTime);
    renderGongGrid(currentPan);

    var lines = [];
    lines.push("═══════════════════════════════════════");
    lines.push("📋 奇门遁甲全盘（仅展示，无选号）");
    lines.push("═══════════════════════════════════════");
    var dt = currentPan.drawTime;
    lines.push("📅 时间：" + dt.getFullYear() + "-" + pad2(dt.getMonth()+1) + "-" + pad2(dt.getDate()) + " " + pad2(dt.getHours()) + ":" + pad2(dt.getMinutes()));
    lines.push("🌿 节气：" + currentPan.jieQi + " | " + (currentPan.isYin ? "阴遁" : "阳遁") + " " + Math.abs(currentPan.ju) + "局");
    lines.push("☀️ " + currentPan.dayGZ + " | 🌙 " + currentPan.hourGZ + " | 🌀 " + currentPan.xunShou);
    lines.push("💨 旬空：" + currentPan.kong + " | 🐎 马星：宫" + (currentPan.maGong || "无"));
    lines.push("⭐ 值符：宫" + currentPan.zhiFuGong + " | 🚩 值使：宫" + currentPan.zhiShiGong + " (" + currentPan.zhiShiMen + ")");
    lines.push("✨ 三奇落宫：[" + (currentPan.qiGongs.length > 0 ? currentPan.qiGongs.join(",") : "无") + "]");
    lines.push("");

    // 逐宫详情
    lines.push("─── 九宫详表 ───");
    for(var i=0;i<currentPan.gongInfo.length;i++){
      var c = currentPan.gongInfo[i];
      lines.push("宫" + c.gong + " | 地:" + c.diYi + " 天:" + (c.tianYi||"") + " " + (c.xing||"") +
                 " 门:" + (c.men||"") + " 神:" + (c.shen||"") +
                 (c.tagStr ? " 【" + c.tagStr + "】" : ""));
    }

    lines.push("");
    lines.push("⚠️ 仅展示奇门盘，点击对应按钮进行选号");

    document.getElementById("mainOutput").innerHTML = lines.join("\n");

  } catch(e) {
    document.getElementById("mainOutput").innerHTML = "❌ 错误：" + e.message;
  }
}

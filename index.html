<script>
"use strict";

/* ================================================================
 * 模块1：基础常量定义
 * ----------------------------------------------------------------
 * 包含十天干、十二地支、六十甲子完整序列
 * 这些是所有干支推算的基础数据
 * ================================================================ */

/**
 * 十天干数组
 * 顺序：甲乙丙丁戊己庚辛壬癸
 * 索引0~9分别对应甲~癸
 */
var TIAN_GAN = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];

/**
 * 十二地支数组
 * 顺序：子丑寅卯辰巳午未申酉戌亥
 * 索引0~11分别对应子~亥
 */
var DI_ZHI   = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

/**
 * 六十甲子完整列表
 * 由天干和地支依次组合而成，共60个
 * 用于干支纪年、纪日、纪时的推算
 */
var SIXTY_JIAZI = [];
for(var k=0;k<60;k++){
  SIXTY_JIAZI.push(TIAN_GAN[k%10]+DI_ZHI[k%12]);
}

/* ================================================================
 * 模块2：二十四节气表
 * ----------------------------------------------------------------
 * 每个节气包含名称、月份、日期
 * 用于确定当前属于哪个节气，进而判断阴阳遁和局数
 * ================================================================ */
var JIE_QI_TABLE = [
  ["立春",2,4],  ["雨水",2,19], ["惊蛰",3,6],  ["春分",3,21],
  ["清明",4,5],  ["谷雨",4,20], ["立夏",5,6],  ["小满",5,21],
  ["芒种",6,6],  ["夏至",6,21], ["小暑",7,7],  ["大暑",7,23],
  ["立秋",8,8],  ["处暑",8,23], ["白露",9,8],  ["秋分",9,23],
  ["寒露",10,8], ["霜降",10,23],["立冬",11,7], ["小雪",11,22],
  ["大雪",12,7], ["冬至",12,22],["小寒",1,6],  ["大寒",1,20]
];

/* ================================================================
 * 模块3：阴阳遁判断
 * ----------------------------------------------------------------
 * 夏至到大雪为阴遁，冬至到芒种为阳遁
 * 存储在集合中便于快速查找
 * ================================================================ */
var YIN_JIEQI_SET = {};
var yinList = ["夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪"];
for(var yi=0;yi<yinList.length;yi++) YIN_JIEQI_SET[yinList[yi]]=1;

/**
 * 判断某个节气是否为阴遁季节
 * @param {string} name - 节气名称
 * @returns {boolean} true表示阴遁，false表示阳遁
 */
function isYinSeason(name){ return !!YIN_JIEQI_SET[name]; }

/* ================================================================
 * 模块4：拆补法局数表
 * ----------------------------------------------------------------
 * 每个节气对应三个局数（上元、中元、下元）
 * 根据日干支确定属于哪一元
 * ================================================================ */
var JU_SHU_MAP = {
  "立春":[8,5,2],  "雨水":[9,6,3],  "惊蛰":[1,7,4],
  "春分":[3,9,6],  "清明":[4,1,7],  "谷雨":[5,2,8],
  "立夏":[4,1,7],  "小满":[5,2,8],  "芒种":[6,3,9],
  "夏至":[9,3,6],  "小暑":[8,2,5],  "大暑":[7,1,4],
  "立秋":[2,5,8],  "处暑":[1,4,7],  "白露":[9,3,6],
  "秋分":[7,1,4],  "寒露":[6,9,3],  "霜降":[5,8,2],
  "立冬":[6,9,3],  "小雪":[5,8,2],  "大雪":[4,7,1],
  "冬至":[1,7,4],  "小寒":[2,8,5],  "大寒":[3,9,6]
};

/* ================================================================
 * 模块5：八门、九星、八神、三奇六仪
 * ----------------------------------------------------------------
 * 八门：休生伤杜景死惊开
 * 九星：天蓬天芮天冲天辅天禽天心天柱天任天英
 * 八神：值符腾蛇太阴六合白虎玄武九地九天
 * 三奇六仪：戊己庚辛壬癸丁丙乙
 * ================================================================ */

/** 八门数组，顺序固定 */
var BA_MEN = ["休","生","伤","杜","景","死","惊","开"];

/** 九星数组，顺序固定 */
var JIU_XING = ["天蓬","天芮","天冲","天辅","天禽","天心","天柱","天任","天英"];

/** 八神数组，顺序固定 */
var BA_SHEN = ["值符","腾蛇","太阴","六合","白虎","玄武","九地","九天"];

/** 三奇六仪顺序，戊己庚辛壬癸丁丙乙 */
var LIU_YI_ORDER = ["戊","己","庚","辛","壬","癸","丁","丙","乙"];

/* ================================================================
 * 模块6：旬空、马星、入墓、击刑、门迫对照表
 * ----------------------------------------------------------------
 * 这些是奇门遁甲中的各种吉凶判断依据
 * 用于后续的杀号和评分
 * ================================================================ */

/** 六甲旬空亡表，键为旬首，值为空亡地支 */
var XUN_KONG_MAP = {
  "甲子":"戌亥","甲戌":"申酉","甲申":"午未","甲午":"辰巳","甲辰":"寅卯","甲寅":"子丑"
};

/** 马星所在宫位表，键为地支，值为马星对应的宫位数 */
var MA_XING_MAP = {
  "申":"寅","子":"寅","辰":"寅","寅":"申","午":"申","戌":"申","巳":"亥","酉":"亥","丑":"亥"
};

/** 入墓宫位表，键为天干，值为对应的宫位数 */
var RU_MU_MAP = {
  "乙":6,"丙":6,"丁":6,"戊":4,"己":4,"庚":8,"辛":8,"壬":2,"癸":2
};

/** 击刑宫位表，键为天干，值为对应的宫位数 */
var JI_XING_MAP = {
  "戊":3,"己":2,"庚":8,"辛":9,"壬":4,"癸":4
};

/** 门迫宫位表，键为门，值为对应的宫位数 */
var MEN_PO_MAP = {
  "休":1,"生":8,"伤":3,"杜":4,"景":9,"死":2,"惊":7,"开":6
};

/** 地支到数字索引的映射，子=1,丑=2,...,亥=12 */
var DIZHI_TO_IDX = {"子":1,"丑":2,"寅":3,"卯":4,"辰":5,"巳":6,"午":7,"未":8,"申":9,"酉":10,"戌":11,"亥":12};

/* ================================================================
 * 模块7：双色球/大乐透规则配置
 * ----------------------------------------------------------------
 * 包含两种彩票的全部参数：
 *   - 前后区范围、选取个数
 *   - 开奖时间（星期几、几点几分）
 *   - 理想和值、跨度、AC值范围
 *   - 大小分界线、区间分割点
 * ================================================================ */
var LOT_CFG = {
  ssq:{
    name:"双色球",
    fMin:1, fMax:33, fPick:6,   // 前区1~33选6
    bMin:1, bMax:16, bPick:1,   // 后区1~16选1
    bigLine:17,                  // 大小分界线（≥17为大）
    zoneSplit:[11,22],           // 三分区分割点
    openWeekdays:[2,4,0],        // 开奖日：周二、周四、周日
    openHour:21, openMin:15,     // 开奖时间：21:15
    idealSum:[90,125],           // 理想和值范围
    idealSpan:[18,28],           // 理想跨度范围
    idealAC:[5,8],               // 理想AC值范围
    idealOE:[2,4]                // 理想奇偶比（奇数个数范围）
  },
  dlt:{
    name:"大乐透",
    fMin:1, fMax:35, fPick:5,   // 前区1~35选5
    bMin:1, bMax:12, bPick:2,   // 后区1~12选2
    bigLine:18,                  // 大小分界线（≥18为大）
    zoneSplit:[12,24],           // 三分区分割点
    openWeekdays:[1,3,6],        // 开奖日：周一、周三、周六
    openHour:21, openMin:25,     // 开奖时间：21:25
    idealSum:[75,115],           // 理想和值范围
    idealSpan:[20,32],           // 理想跨度范围
    idealAC:[4,7],               // 理想AC值范围
    idealOE:[2,3]                // 理想奇偶比
  }
};

/* ================================================================
 * 模块8：全局状态变量
 * ----------------------------------------------------------------
 * 存储当前奇门盘、上期开奖数据、历史结果等
 * ================================================================ */

/** 当前生成的奇门盘对象 */
var currentPan = null;

/** 上一期双色球前区号码数组 */
var lastSSQFront = null;

/** 上一期双色球后区号码数组 */
var lastSSQBack = null;

/** 上一期大乐透前区号码数组 */
var lastDLTFront = null;

/** 上一期大乐透后区号码数组 */
var lastDLTBack = null;

/** 历史结果记录数组 */
var historyResults = [];

/** 调试模式开关 */
var debugMode = false;

/** 调试日志字符串 */
var debugLog = "";

/**
 * 添加调试日志
 * @param {string} msg - 日志消息
 */
function log(msg){
  if(!debugMode) return;
  debugLog += "["+new Date().toLocaleTimeString()+"] "+msg+"\n";
  var dbgEl=document.getElementById("debugOutput");
  if(dbgEl) dbgEl.textContent=debugLog;
}

/**
 * 切换调试模式
 */
function toggleDebug(){
  debugMode=!debugMode;
  var dbgEl=document.getElementById("debugOutput");
  if(dbgEl) dbgEl.style.display=debugMode?"block":"none";
  if(debugMode) log("调试模式已开启");
}

/* ================================================================
 * 模块9：基础工具函数库（约400行）
 * ----------------------------------------------------------------
 * 包含数组运算、数学计算、格式化等通用工具
 * 所有函数均采用原生JavaScript实现，无外部依赖
 * ================================================================ */

/**
 * 数字补零（两位）
 * @param {number} n - 待格式化的数字
 * @returns {string} 两位字符串，如 3 → "03"
 */
function pad2(n){ return n<10?"0"+n:""+n; }

/**
 * 数字补零（三位）
 * @param {number} n - 待格式化的数字
 * @returns {string} 三位字符串，如 3 → "003"
 */
function pad3(n){ return n<100?(n<10?"00"+n:"0"+n):""+n; }

/**
 * 计算数组元素之和
 * @param {number[]} arr - 数字数组
 * @returns {number} 和值
 */
function arraySum(arr){ var s=0; for(var i=0;i<arr.length;i++) s+=arr[i]; return s; }

/**
 * 计算数组最大值
 * @param {number[]} arr - 数字数组
 * @returns {number} 最大值
 */
function arrayMax(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]>m) m=arr[i]; return m; }

/**
 * 计算数组最小值
 * @param {number[]} arr - 数字数组
 * @returns {number} 最小值
 */
function arrayMin(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]<m) m=arr[i]; return m; }

/**
 * 计算数组跨度（最大值减最小值）
 * @param {number[]} arr - 数字数组
 * @returns {number} 跨度值
 */
function arraySpan(arr){ return arrayMax(arr)-arrayMin(arr); }

/**
 * 计算数组平均值
 * @param {number[]} arr - 数字数组
 * @returns {number} 平均值
 */
function arrayAvg(arr){ return arraySum(arr)/arr.length; }

/**
 * 计算数组中位数
 * @param {number[]} arr - 数字数组
 * @returns {number} 中位数
 */
function arrayMedian(arr){
  var a=arr.slice().sort(function(x,y){return x-y;});
  return a[Math.floor(a.length/2)];
}

/**
 * 计算数组众数（出现次数最多的值）
 * @param {number[]} arr - 数字数组
 * @returns {number|null} 众数值，如果为空则返回null
 */
function arrayMode(arr){
  var m={},mx=0,mv=null;
  for(var i=0;i<arr.length;i++){
    m[arr[i]]=(m[arr[i]]||0)+1;
    if(m[arr[i]]>mx){mx=m[arr[i]];mv=arr[i];}
  }
  return mv;
}

/**
 * 数组去重
 * @param {any[]} arr - 原始数组
 * @returns {any[]} 去重后的新数组
 */
function arrayUnique(arr){
  var seen={},out=[];
  for(var i=0;i<arr.length;i++){
    if(!seen[arr[i]]){ seen[arr[i]]=1; out.push(arr[i]); }
  }
  return out;
}

/**
 * 计算两个数组的交集
 * @param {any[]} a - 第一个数组
 * @param {any[]} b - 第二个数组
 * @returns {any[]} 交集数组
 */
function arrayIntersect(a,b){
  var s={},r=[];
  for(var i=0;i<a.length;i++) s[a[i]]=1;
  for(var i=0;i<b.length;i++) if(s[b[i]]) r.push(b[i]);
  return r;
}

/**
 * 计算两个数组的差集（a中有但b中没有的元素）
 * @param {any[]} a - 第一个数组
 * @param {any[]} b - 第二个数组
 * @returns {any[]} 差集数组
 */
function arrayDiff(a,b){
  var s={},r=[];
  for(var i=0;i<b.length;i++) s[b[i]]=1;
  for(var i=0;i<a.length;i++) if(!s[a[i]]) r.push(a[i]);
  return r;
}

/**
 * 计算两个数组的并集
 * @param {any[]} a - 第一个数组
 * @param {any[]} b - 第二个数组
 * @returns {any[]} 并集数组（已去重）
 */
function arrayUnion(a,b){
  var s={},r=[];
  for(var i=0;i<a.length;i++){if(!s[a[i]]){s[a[i]]=1;r.push(a[i]);}}
  for(var i=0;i<b.length;i++){if(!s[b[i]]){s[b[i]]=1;r.push(b[i]);}}
  return r;
}

/**
 * Fisher-Yates洗牌算法
 * @param {any[]} arr - 待打乱的数组
 * @returns {any[]} 打乱后的新数组
 */
function shuffleArray(arr){
  var result=arr.slice();
  for(var i=result.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=result[i]; result[i]=result[j]; result[j]=tmp;
  }
  return result;
}

/**
 * 计算AC值（算术复杂度）
 * AC值 = 所有两两差值个数 - (选号个数 - 1)
 * 用于衡量号码的离散程度
 * @param {number[]} arr - 已排序的号码数组
 * @returns {number} AC值
 */
function calcAC(arr){
  var n=arr.length,diffs=[];
  for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){
    var d=Math.abs(arr[i]-arr[j]);
    if(diffs.indexOf(d)===-1) diffs.push(d);
  }
  return diffs.length-(n-1);
}

/**
 * 计算奇数和偶数个数
 * @param {number[]} arr - 数字数组
 * @returns {number[]} [奇数个数, 偶数个数]
 */
function oddEvenCount(arr){
  var o=0,e=0;
  for(var i=0;i<arr.length;i++) if(arr[i]%2===1) o++; else e++;
  return [o,e];
}

/**
 * 计算大数和小数个数
 * @param {number[]} arr - 数字数组
 * @param {number} line - 大小分界线
 * @returns {number[]} [大数个数, 小数个数]
 */
function bigSmallCount(arr,line){
  var b=0,s=0;
  for(var i=0;i<arr.length;i++) if(arr[i]>=line) b++; else s++;
  return [b,s];
}

/**
 * 计算三分区分布
 * @param {number[]} arr - 数字数组
 * @param {number[]} split - 分区分割点，如[11,22]
 * @returns {number[]} [一区个数, 二区个数, 三区个数]
 */
function zoneDistribution(arr,split){
  var z1=0,z2=0,z3=0;
  for(var i=0;i<arr.length;i++){
    if(arr[i]<=split[0]) z1++;
    else if(arr[i]<=split[1]) z2++;
    else z3++;
  }
  return [z1,z2,z3];
}

/**
 * 获取个位尾数
 * @param {number} n - 数字
 * @returns {number} 个位数（0~9）
 */
function tailNum(n){ return n%10; }

/**
 * 统计各尾数出现次数
 * @param {number[]} arr - 数字数组
 * @returns {object} 尾数频次对象
 */
function tailMap(arr){
  var m={};
  for(var i=0;i<arr.length;i++){
    var t=tailNum(arr[i]);
    m[t]=(m[t]||0)+1;
  }
  return m;
}

/**
 * 计算最大尾数重复次数
 * @param {number[]} arr - 数字数组
 * @returns {number} 最大重复次数
 */
function maxTailCount(arr){
  var m=tailMap(arr),mx=0;
  for(var k in m) if(m[k]>mx) mx=m[k];
  return mx;
}

/**
 * 统计某个尾数出现的次数
 * @param {number[]} arr - 数字数组
 * @param {number} t - 尾数（0~9）
 * @returns {number} 出现次数
 */
function tailCount(arr,t){
  var c=0;
  for(var i=0;i<arr.length;i++) if(tailNum(arr[i])===t) c++;
  return c;
}

/**
 * 计算与上期的重复号个数
 * @param {number[]} front - 本期前区
 * @param {number[]} lastFront - 上期前区
 * @returns {number} 重复个数
 */
function countRepeats(front,lastFront){
  if(!lastFront) return 0;
  var cnt=0;
  for(var i=0;i<front.length;i++) if(lastFront.indexOf(front[i])!==-1) cnt++;
  return cnt;
}

/**
 * 计算与上期的邻号个数（相差±1）
 * @param {number[]} front - 本期前区
 * @param {number[]} lastFront - 上期前区
 * @returns {number} 邻号个数
 */
function countNeighbors(front,lastFront){
  if(!lastFront) return 0;
  var cnt=0;
  for(var i=0;i<front.length;i++)
    for(var j=0;j<lastFront.length;j++)
      if(Math.abs(front[i]-lastFront[j])===1){ cnt++; break; }
  return cnt;
}

/**
 * 计算连号组数（相邻差1为一组两连）
 * @param {number[]} arr - 已排序的号码数组
 * @returns {number} 连号组数
 */
function countConsecutivePairs(arr){
  var pairs=0;
  for(var i=0;i<arr.length-1;i++) if(arr[i+1]-arr[i]===1) pairs++;
  return pairs;
}

/**
 * 计算与上期同尾号的个数
 * @param {number[]} front - 本期前区
 * @param {number[]} lastFront - 上期前区
 * @returns {number} 同尾个数
 */
function countSameTailWithLast(front,lastFront){
  if(!lastFront) return 0;
  var lt={};
  for(var i=0;i<lastFront.length;i++) lt[tailNum(lastFront[i])]=1;
  var cnt=0;
  for(var i=0;i<front.length;i++) if(lt[tailNum(front[i])]) cnt++;
  return cnt;
}

/**
 * 最大公约数
 * @param {number} a - 整数
 * @param {number} b - 整数
 * @returns {number} 最大公约数
 */
function gcd(a,b){ while(b){ var t=b; b=a%b; a=t; } return a; }

/**
 * 最小公倍数
 * @param {number} a - 整数
 * @param {number} b - 整数
 * @returns {number} 最小公倍数
 */
function lcm(a,b){ return a*b/gcd(a,b); }

/**
 * 数值限幅
 * @param {number} v - 原值
 * @param {number} min - 最小值
 * @param {number} max - 最大值
 * @returns {number} 限幅后的值
 */
function clamp(v,min,max){ return v<min?min:(v>max?max:v); }

/**
 * 四舍五入到指定小数位
 * @param {number} v - 原值
 * @param {number} dec - 小数位数
 * @returns {number} 四舍五入后的值
 */
function roundTo(v,dec){ var f=Math.pow(10,dec); return Math.round(v*f)/f; }

/**
 * 深拷贝对象
 * @param {object} obj - 源对象
 * @returns {object} 深拷贝后的新对象
 */
function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

/**
 * 格式化日期时间为字符串
 * @param {Date} d - 日期对象
 * @returns {string} 格式化字符串，如 "2026-10-21 21:15"
 */
function formatDate(d){
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}

/**
 * 判断数字是否为质数
 * @param {number} n - 正整数
 * @returns {boolean} true表示为质数
 */
function isPrime(n){
  if(n<2) return false;
  if(n===2) return true;
  if(n%2===0) return false;
  var limit=Math.sqrt(n);
  for(var i=3;i<=limit;i+=2) if(n%i===0) return false;
  return true;
}

/**
 * 计算质数个数
 * @param {number[]} arr - 数字数组
 * @returns {number} 质数个数
 */
function primeCount(arr){
  var c=0;
  for(var i=0;i<arr.length;i++) if(isPrime(arr[i])) c++;
  return c;
}

/**
 * 计算012路分布
 * 0路：能被3整除；1路：余1；2路：余2
 * @param {number[]} arr - 数字数组
 * @returns {number[]} [0路个数, 1路个数, 2路个数]
 */
function road012(arr){
  var r0=0,r1=0,r2=0;
  for(var i=0;i<arr.length;i++){
    var mod=arr[i]%3;
    if(mod===0) r0++; else if(mod===1) r1++; else r2++;
  }
  return [r0,r1,r2];
}

/**
 * 获取当前期开奖时间
 * 如果当前时间已过开奖时间，则取下一期
 * @param {string} lotType - 彩票类型 'ssq' 或 'dlt'
 * @returns {Date} 开奖时间
 */
function getCurrentDrawTime(lotType){
  var now=new Date();
  var cfg=LOT_CFG[lotType];
  var dow=now.getDay();
  var targetDow=cfg.openWeekdays[0];
  var diff=(targetDow-dow+7)%7;
  if(diff===0){
    var curMin=now.getHours()*60+now.getMinutes();
    var drawMin=cfg.openHour*60+cfg.openMin;
    if(curMin>=drawMin) diff=7;
  }
  var drawDate=new Date(now);
  drawDate.setDate(drawDate.getDate()+diff);
  drawDate.setHours(cfg.openHour,cfg.openMin,0,0);
  log("当前开奖时间："+formatDate(drawDate));
  return drawDate;
}

/**
 * 获取下一次开奖时间（考虑多个开奖日）
 * @param {string} lotType - 彩票类型
 * @returns {Date} 最近的开奖时间
 */
function getNextDrawTime(lotType){
  var now=new Date();
  var cfg=LOT_CFG[lotType];
  var bestDays=[];
  for(var w=0;w<cfg.openWeekdays.length;w++){
    var diff=(cfg.openWeekdays[w]-now.getDay()+7)%7;
    if(diff===0){
      var curMin=now.getHours()*60+now.getMinutes();
      var drawMin=cfg.openHour*60+cfg.openMin;
      if(curMin>=drawMin) diff=7;
    }
    bestDays.push(diff);
  }
  var minDiff=Math.min.apply(null,bestDays);
  var drawDate=new Date(now);
  drawDate.setDate(drawDate.getDate()+minDiff);
  drawDate.setHours(cfg.openHour,cfg.openMin,0,0);
  return drawDate;
}

/**
 * 查找距离给定日期最近的节气
 * 遍历所有节气，计算日期差，取最小
 * @param {number} year - 年份
 * @param {number} month - 月份（1~12）
 * @param {number} day - 日期
 * @returns {string} 最近的节气名称
 */
function findClosestJieQi(year,month,day){
  var best=JIE_QI_TABLE[0],bestDist=9999;
  for(var i=0;i<JIE_QI_TABLE.length;i++){
    var q=JIE_QI_TABLE[i];
    var dist=Math.abs((month-q[1])*30+(day-q[2]));
    if(dist<bestDist){ bestDist=dist; best=q[0]; }
  }
  log("最近节气："+best);
  return best;
}

 * @returns {string} 日干支，如 "甲子"
 */
function getDayGanzhi(year,month,day){
  var base=new Date(1900,0,1);
  var tar=new Date(year,month-1,day);
  var days=Math.round((tar-base)/86400000);
  var result=SIXTY_JIAZI[(days+10)%60];
  log("日干支："+year+"-"+month+"-"+day+" → "+result);
  return result;
}

/* ================================================================

/**

 * @param {object} pan - 奇门盘对象
 * @returns {number[]} 宫位数组（1~9，已去重排序）

function getQiMenSourceGongs(pan){
  var g=[];
  if(pan.zhiFuGong) g.push(pan.zhiFuGong);
  if(pan.zhiShiGong) g.push(pan.zhiShiGong);
  for(var i=0;i<pan.qiGongs.length;i++) g.push(pan.qiGongs[i]);
  for(var i=0;i<pan.gongInfo.length;i++){
    var c=pan.gongInfo[i];
    if(c.men==="休"||c.men==="生"||c.men==="开") g.push(c.gong);
    if(c.shen==="六合") g.push(c.gong);
  }
  if(pan.maGong) g.push(pan.maGong);
  var seen={},out=[];
  for(var i=0;i<g.length;i++){
    var v=g[i];
    if(!seen[v]){ seen[v]=1; out.push(v); }
  }
  var sorted=out.sort(function(a,b){return a-b;});
  log("初池源宫："+sorted.join(","));
  return sorted;
}

/* ================================================================
 * 模块13：宫数→奖号域映射
 * ----------------------------------------------------------------
 * 将宫位数映射到实际奖号范围：
 *   1. 同尾数扩展（宫位尾数与奖号尾数相同）
 *   2. 宫位本身
 *   3. 加减9的倍数扩展
 * ================================================================ */

/**
 * 将宫位扩展到前区奖号域
 * @param {number[]} gongs - 源宫位数组
 * @param {string} lotType - 彩票类型 'ssq' 或 'dlt'
 * @returns {number[]} 扩展后的前区号码池
 */
function expandGongToLotDomain(gongs, lotType){
  var cfg=LOT_CFG[lotType];
  var set={},out=[];
  for(var i=0;i<gongs.length;i++){
    var g=gongs[i];
    // 宫位本身
    if(g>=cfg.fMin&&g<=cfg.fMax) set[g]=1;
    // 同尾扩展：尾数相同的号
    var tail=g%10;
    for(var n=cfg.fMin;n<=cfg.fMax;n++){
      if(n%10===tail) set[n]=1;
    }
    // 加减9的倍数扩展
    for(var k=1;k<=4;k++){
      var up=g+k*9;
      var down=g-k*9;
      if(up>=cfg.fMin&&up<=cfg.fMax) set[up]=1;
      if(down>=cfg.fMin&&down<=cfg.fMax) set[down]=1;
    }
  }
  for(var key in set) out.push(parseInt(key));
  var sorted=out.sort(function(a,b){return a-b;});
  log("初池扩展后共"+sorted.length+"个号："+sorted.join(","));
  return sorted;
}

/* ================================================================
 * 模块14：张委铭杀号规则
 * ----------------------------------------------------------------
 * 基于上期开奖号码对候选号进行过滤：
 *   1. 重号≤1（与上期重复不超过1个）
 *   2. 邻号≤2（与上期差1的不超过2个）
 *   3. 同尾≤2（与上期间尾的不超过2个）
 *   4. 连号≤1组两连（最多一组两连号）
 *   5. 区间比合理（三分区不能缺区）
 *   6. 奇偶比合理（不能全奇或全偶）
 * ================================================================ */

/**
 * 张委铭杀号：检查一组前区号码是否符合杀号规则
 * @param {number[]} front - 本期前区号码（已排序）
 * @param {number[]} lastFront - 上期前区号码
 * @returns {boolean} true表示通过杀号，false表示被杀掉
 */
function zhangWeiMingKill(front, lastFront){
  // 如果没有上期数据，跳过杀号
  if(!lastFront || lastFront.length===0) return true;

  // 规则1：重号≤1
  var repeats=countRepeats(front,lastFront);
  if(repeats>1){
    log("  杀号：重号"+repeats+"个 >1 → 杀掉");
    return false;
  }

  // 规则2：邻号≤2
  var neighbors=countNeighbors(front,lastFront);
  if(neighbors>2){
    log("  杀号：邻号"+neighbors+"个 >2 → 杀掉");
    return false;
  }

  // 规则3：同尾≤2
  var sameTail=countSameTailWithLast(front,lastFront);
  if(sameTail>2){
    log("  杀号：同尾"+sameTail+"个 >2 → 杀掉");
    return false;
  }

  // 规则4：连号≤1组两连
  var pairs=countConsecutivePairs(front);
  if(pairs>1){
    log("  杀号：连号组数"+pairs+" >1 → 杀掉");
    return false;
  }

  // 规则5：区间比不能缺区（三分区至少各1个）
  var zones=zoneDistribution(front,[11,22]);
  if(zones[0]===0||zones[1]===0||zones[2]===0){
    log("  杀号：缺区 → 杀掉");
    return false;
  }

  // 规则6：奇偶比不能全奇或全偶
  var oe=oddEvenCount(front);
  if(oe[0]===0||oe[1]===0){
    log("  杀号：全奇或全偶 → 杀掉");
    return false;
  }

  return true;
}

/* ================================================================
 * 模块15：褚天一擒号评分系统
 * ----------------------------------------------------------------
 * 对候选号码进行多维评分，分数越高越优：
 *   1. 和值匹配度（理想范围内加分）
 *   2. 跨度匹配度（理想范围内加分）
 *   3. AC值匹配度（理想范围内加分）
 *   4. 大小比合理性（不极端加分）
 *   5. 质数个数合理性（2~3个加分）
 *   6. 012路均衡度（三路都有加分）
 *   7. 后区杀上期同尾
 * ================================================================ */

/**
 * 褚天一评分：对一组前区号码进行综合评分
 * @param {number[]} front - 前区号码（已排序）
 * @param {string} lotType - 彩票类型
 * @param {number[]} lastFront - 上期前区（可选）
 * @returns {number} 综合评分（0~100）
 */
function chuTianYiScore(front, lotType, lastFront){
  var cfg=LOT_CFG[lotType];
  var score=50; // 基础分50

  // 1. 和值评分（±15分）
  var sumVal=arraySum(front);
  if(sumVal>=cfg.idealSum[0]&&sumVal<=cfg.idealSum[1]){
    score+=15;
  } else if(sumVal>=cfg.idealSum[0]-10&&sumVal<=cfg.idealSum[1]+10){
    score+=8;
  } else {
    score-=5;
  }

  // 2. 跨度评分（±10分）
  var spanVal=arraySpan(front);
  if(spanVal>=cfg.idealSpan[0]&&spanVal<=cfg.idealSpan[1]){
    score+=10;
  } else if(spanVal>=cfg.idealSpan[0]-5&&spanVal<=cfg.idealSpan[1]+5){
    score+=5;
  } else {
    score-=5;
  }

  // 3. AC值评分（±10分）
  var acVal=calcAC(front);
  if(acVal>=cfg.idealAC[0]&&acVal<=cfg.idealAC[1]){
    score+=10;
  } else if(acVal>=cfg.idealAC[0]-2&&acVal<=cfg.idealAC[1]+2){
    score+=5;
  } else {
    score-=3;
  }

  // 4. 大小比评分（±8分）
  var bs=bigSmallCount(front,cfg.bigLine);
  var total=bs[0]+bs[1];
  var bigRatio=bs[0]/total;
  if(bigRatio>=0.3&&bigRatio<=0.7){
    score+=8;
  } else if(bigRatio>=0.2&&bigRatio<=0.8){
    score+=4;
  } else {
    score-=4;
  }

  // 5. 质数个数评分（±5分）
  var pc=primeCount(front);
  if(pc>=2&&pc<=3){
    score+=5;
  } else if(pc>=1&&pc<=4){
    score+=2;
  } else {
    score-=3;
  }

  // 6. 012路均衡度评分（±5分）
  var rd=road012(front);
  if(rd[0]>0&&rd[1]>0&&rd[2]>0){
    score+=5;
  } else if(rd[0]>0||rd[1]>0||rd[2]>0){
    score+=2;
  } else {
    score-=2;
  }

  // 7. 与上期对比加分（±7分）
  if(lastFront&&lastFront.length>0){
    var rep=countRepeats(front,lastFront);
    if(rep===1) score+=5;
    else if(rep===0) score+=2;
    else score-=3;
  }

  // 确保分数在0~100之间
  score=Math.max(0,Math.min(100,score));
  return score;
}

/* ================================================================
 * 模块16：后区生成与杀号
 * ----------------------------------------------------------------
 * 根据奇门盘生成后区号码，并应用杀号规则
 * ================================================================ */

/**
 * 生成后区号码
 * @param {string} lotType - 彩票类型
 * @param {number[]} lastBack - 上期后区（可选）
 * @returns {number[]} 后区号码数组
 */
function generateBackNumbers(lotType, lastBack){
  var cfg=LOT_CFG[lotType];
  var pool=[];
  for(var i=cfg.bMin;i<=cfg.bMax;i++) pool.push(i);
  
  // 如果有上期后区，杀掉同尾号
  if(lastBack&&lastBack.length>0){
    var killTails={};
    for(var i=0;i<lastBack.length;i++) killTails[lastBack[i]%10]=1;
    var filtered=[];
    for(var i=0;i<pool.length;i++){
      if(!killTails[pool[i]%10]) filtered.push(pool[i]);
    }
    pool=filtered;
  }

  // 随机选择所需个数
  var shuffled=shuffleArray(pool);
  return shuffled.slice(0,cfg.bPick).sort(function(a,b){return a-b;});
}

/* ================================================================
 * 模块17：主选号引擎 runLottery()
 * ----------------------------------------------------------------
 * 完整的选号流程：
 *   1. 确定开奖时间 → 起奇门盘
 *   2. 提取初池源宫 → 扩展到奖号域
 *   3. 生成大量候选组合
 *   4. 张委铭杀号过滤
 *   5. 褚天一评分排序
 *   6. 取最高分的前3~5注
 *   7. 生成后区号码
 *   8. 渲染输出
 * ================================================================ */

/**
 * 运行选号主流程
 * @param {string} lotType - 'ssq' 或 'dlt'
 * @param {number} noteCount - 注数（3或5）
 */
function runLottery(lotType, noteCount){
  log("===== 开始选号："+LOT_CFG[lotType].name+" "+noteCount+"注 =====");
  var outputEl=document.getElementById("mainOutput");
  outputEl.innerHTML="⏳ 正在起盘选号，请稍候……";

  // 第一步：确定开奖时间
  var drawTime=getNextDrawTime(lotType);
  var cfg=LOT_CFG[lotType];

  // 第二步：起奇门盘
  var pan=createQiMenPan(drawTime);
  currentPan=pan;

  // 第三步：提取初池源宫并扩展
  var sourceGongs=getQiMenSourceGongs(pan);
  var candidatePool=expandGongToLotDomain(sourceGongs,lotType);
  if(candidatePool.length<cfg.fPick){
    outputEl.innerHTML="⚠️ 初池号码不足"+cfg.fPick+"个，无法选号";
    return;
  }

  // 第四步：获取上期数据
  var lastFront=null, lastBack=null;
  if(lotType==='ssq'){
    lastFront=lastSSQFront;
    lastBack=lastSSQBack;
  } else {
    lastFront=lastDLTFront;
    lastBack=lastDLTBack;
  }

  // 第五步：生成大量候选组合
  var candidates=[];
  var maxAttempts=lotType==='ssq'?5000:3000;
  var attempts=0;
  while(candidates.length<noteCount*20&&attempts<maxAttempts){
    attempts++;
    var shuffled=shuffleArray(candidatePool);
    var selected=shuffled.slice(0,cfg.fPick).sort(function(a,b){return a-b;});
    
    // 去重
    var key=selected.join(",");
    var dup=false;
    for(var i=0;i<candidates.length;i++){
      if(candidates[i].key===key){ dup=true; break; }
    }
    if(dup) continue;

    // 张委铭杀号
    if(!zhangWeiMingKill(selected,lastFront)) continue;

    // 褚天一评分
    var score=chuTianYiScore(selected,lotType,lastFront);
    candidates.push({nums:selected,key:key,score:score});
  }

  log("共生成"+candidates.length+"个候选组合");

  // 第六步：按评分排序，取最优
  candidates.sort(function(a,b){return b.score-a.score;});
  var bestCandidates=candidates.slice(0,noteCount);

  // 第七步：生成后区
  var results=[];
  for(var i=0;i<bestCandidates.length;i++){
    var backNums=generateBackNumbers(lotType,lastBack);
    results.push({
      front:bestCandidates[i].nums,
      back:backNums,
      score:bestCandidates[i].score
    });
  }

  // 第八步：渲染输出
  renderResults(lotType,results,pan,drawTime);
  renderGongGrid(pan);
  updateStatBar(pan);
  log("===== 选号完成 =====");
}

  html+="<hr style='border-color:#1a2440;margin:6px 0;'>\n";

    var r=results[i];
    var frontStr=r.front.join(", ");
    var backStr=r.back.join(", ");
    var sumVal=arraySum(r.front);
    var spanVal=arraySpan(r.front);
    var acVal=calcAC(r.front);
    var oe=oddEvenCount(r.front);
    var bs=bigSmallCount(r.front,cfg.bigLine);

    html+="<div><span class='hl-gold'>第"+(i+1)+"注</span> ";

    html+="<span class='hl-gray'>评分："+r.score+"</span></div>\n";

    html+="</div>\n";
  }

  document.getElementById("mainOutput").innerHTML=html;
}

/**
 * 渲染九宫格
 * @param {object} pan - 奇门盘对象
 */
function renderGongGrid(pan){
  var container=document.getElementById("gongContainer");
  var html="";
  for(var i=0;i<pan.gongInfo.length;i++){
    var c=pan.gongInfo[i];
    var tagsHtml="";
    var tagClasses=c.tags;
    for(var t=0;t<tagClasses.length;t++){
      var cls="g-tag";
      if(tagClasses[t]==="值符"||tagClasses[t]==="值使") cls+=" tag-zf";
      else if(tagClasses[t]==="三奇") cls+=" tag-qi";
      else if(tagClasses[t]==="空") cls+=" tag-kong";
      else if(tagClasses[t]==="马") cls+=" tag-ma";
      else if(tagClasses[t]==="入墓") cls+=" tag-mu";
      else if(tagClasses[t]==="门迫") cls+=" tag-po";
      else if(tagClasses[t]==="击刑") cls+=" tag-ji";
      else cls+=" tag-zs";
      tagsHtml+="<span class='"+cls+"'>"+tagClasses[t]+"</span>";
    }
    html+="<div class='gong-cell'>";
    html+="<span class='g-num'>"+c.gong+"宫</span>";
    html+="<div class='g-main'>"+c.men+" · "+c.xing+"</div>";
    html+="<div class='g-sub'>"+c.diYi+"→"+c.tianYi+" · "+c.shen+"</div>";
    html+=tagsHtml;
    html+="</div>";
  }
  container.innerHTML=html;
}

  document.getElementById("mainOutput").innerHTML="";

  debugLog="";

/**
 * 导出结果为文本
 */
function exportResult(){
  var output=document.getElementById("mainOutput").innerText;
  if(!output||output===""){
    alert("没有可导出的结果，请先生成选号");
    return;
  }
  var blob=new Blob([output],{type:"text/plain;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="奇门选号结果_"+new Date().toISOString().slice(0,10)+".txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

/**
 * 注入真实上期号码
 * 从用户输入的文本框读取，自动识别双色球或大乐透
 */
function setRealLastData(){
  var frontInput=document.getElementById("lastFrontInput").value.trim();
  var backInput=document.getElementById("lastBackInput").value.trim();
  if(!frontInput||!backInput){
    alert("请先在输入框中填写真实上期号码\n前区用逗号分隔，后区用逗号分隔");
    return;
  }
  var frontArr=frontInput.split(/[,，\s]+/).map(function(x){return parseInt(x,10);});
  var backArr=backInput.split(/[,，\s]+/).map(function(x){return parseInt(x,10);});
  
  // 自动识别是双色球还是大乐透
  if(frontArr.length===6&&backArr.length===1){
    lastSSQFront=frontArr;
    lastSSQBack=backArr;
    alert("✅ 已注入双色球真实上期\n前区："+frontArr.join(",")+"\n后区："+backArr.join(","));
  } else if(frontArr.length===5&&backArr.length===2){
    lastDLTFront=frontArr;
    lastDLTBack=backArr;
    alert("✅ 已注入大乐透真实上期\n前区："+frontArr.join(",")+"\n后区："+backArr.join(","));
  } else {
    alert("❌ 格式不对\n双色球：前区6个，后区1个\n大乐透：前区5个，后区2个");
  }
}

/**
 * 应用手动输入的上期号码（与setRealLastData联动）
 */
function applyManualLastData(){
  setRealLastData();
}

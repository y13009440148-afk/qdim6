function findCurrentJieQi(d){
  var current = null;
  for(var i = 0; i < JQ.length; i++){
    var item = JQ[i];
    var jqDate = new Date(item[0], item[1]-1, item[2], item[3], item[4], 0);
    if(d >= jqDate) current = item;
    else break;
  }
  if(current === null) current = JQ[0];
  return current;
}

// ======================================================================
// 6. 计算日干支
// ======================================================================
function calcDayGanzhi(d){
  var base = new Date(2000, 0, 7, 0, 0, 0);
  var diffDays = Math.floor((d - base) / (24 * 60 * 60 * 1000));
  var idx = ((diffDays % 60) + 60) % 60;
  return SIXTY_JIAZI[idx];
}

// ======================================================================
// 7. 计算时干支
// ======================================================================
function calcHourGanzhi(d, dayGz){
  var dayIdx = SIXTY_JIAZI.indexOf(dayGz);
  var hourIndex = Math.floor((d.getHours() * 60 + d.getMinutes()) / 120);
  var totalIdx = (dayIdx * 12 + hourIndex) % 60;
  return SIXTY_JIAZI[totalIdx];
}

// ======================================================================
// 8. 找符头
// ======================================================================
function findFutou(dayGz){
  var idx = SIXTY_JIAZI.indexOf(dayGz);
  var xunStart = Math.floor(idx / 10) * 10;
  return SIXTY_JIAZI[xunStart];
}

// ======================================================================
// 9. 定上中下元
// ======================================================================
function calcYuan(dayGz, futou){
  var dayIdx = SIXTY_JIAZI.indexOf(dayGz);
  var fuIdx = SIXTY_JIAZI.indexOf(futou);
  var offset = ((dayIdx - fuIdx) % 10 + 10) % 10;
  if(offset < 3) return "上元";
  else if(offset < 6) return "中元";
  else return "下元";
}

  var zhiFuMap = {

  };
  var zhiFu = zhiFuMap[xunGan] || "天蓬";

function buildPan(d){
  var pan = {};

  var jq = findCurrentJieQi(d);
  pan.jieQi = jq ? jq[5] : "未知";
  
  // 日干支
  pan.dayGz = calcDayGanzhi(d);
  
  // 时干支
  pan.hourGz = calcHourGanzhi(d, pan.dayGz);
  
  // 符头
  pan.futou = findFutou(pan.dayGz);
  
  // 上中下元
  pan.yuan = calcYuan(pan.dayGz, pan.futou);
  
  // 阴阳遁局
  var jy = calcJuAndYinYang(pan.jieQi, pan.yuan);
  pan.isYang = jy.yang;
  pan.isYin = jy.yin;
  pan.ju = jy.ju;
  
  // 地盘
  pan.diPan = buildDiPan(pan.isYang, pan.ju);
  
  // 值符值使
  var zfs = findZhiFuZhiShi(pan.hourGz, pan.diPan);
  pan.zhiFu = zfs.zhiFu;
  pan.zhiShi = zfs.zhiShi;
  pan.zhiFuGong = zfs.zhiFuGong;
  
  // 值符宫修正
  var zfg = pan.zhiFuGong;
  if(zfg === 0) zfg = 5;
  pan.zfg = zfg;
  
  // 天盘星
  pan.starGong = buildStarGong(pan.isYang, zfg);
  
  // 八门
  pan.menGong = buildMenGong(pan.isYang, pan.zhiShi, zfg);
  
  // 八神
  pan.shenGong = buildShenGong(pan.isYang, zfg);
  
  // 空亡
  pan.kongWang = calcKongWang(pan.dayGz);
  
  // 天盘干
  pan.tianPanGan = calcTianPanGan(pan.diPan, zfg);
  
  // 各宫详细信息
  pan.gongInfo = {};
  for(var g = 1; g <= 9; g++){
    if(g == 5) continue;
    var info = {};
    info.gong = g;
    info.diGan = pan.diPan[g] || "";
    info.tianGan = pan.tianPanGan[g] || "";
    info.star = pan.starGong[g] || "";
    info.men = pan.menGong[g] || "";
    info.shen = pan.shenGong[g] || "";
    info.jiXing = calcJiXing(g, pan.diPan);
    info.ruMu = calcRuMu(g, info.tianGan);
    info.menPo = calcMenPo(g, info.men);
    
    // 是否空亡
    var diZhiNum = g;
    if(inArray(diZhiNum, pan.kongWang)) info.kongWang = "空亡";
    else info.kongWang = "";
    
    pan.gongInfo[g] = info;
  }
  
  return pan;
}
// ======================================================================
// 22. 初池取数（值符宫/值使宫/开门宫/生门宫/用神宫）
// ======================================================================
function getChuChiNumbers(pan, lotType){
  var nums = [];
  var targetGongs = [];
  
  // 值符宫
  if(pan.zfg && pan.zfg >= 1 && pan.zfg <= 9) targetGongs.push(pan.zfg);
  
  // 值使门所在宫
  for(var g = 1; g <= 9; g++){
    if(g == 5) continue;
    if(pan.menGong[g] && pan.menGong[g] == pan.zhiShi){
      targetGongs.push(g);
      break;
    }
  }
  
  // 开门宫
  for(var g = 1; g <= 9; g++){
    if(g == 5) continue;
    if(pan.menGong[g] == "开"){targetGongs.push(g); break;}
  }
  
  // 生门宫
  for(var g = 1; g <= 9; g++){
    if(g == 5) continue;
    if(pan.menGong[g] == "生"){targetGongs.push(g); break;}
  }
  
  // 去重
  targetGongs = uniqueArray(targetGongs);
  
  // 从每个目标宫取数
  for(var i = 0; i < targetGongs.length; i++){
    var gong = targetGongs[i];
    var diGan = pan.diPan[gong] || "";
    var tianGan = pan.tianPanGan[gong] || "";
    var star = pan.starGong[gong] || "";
    var men = pan.menGong[gong] || "";
    
    // 将天干、星、门转换为数字
    var ganNum = ganToNum(diGan);
    var tianNum = ganToNum(tianGan);
    var starNum = starToNum(star);
    var menNum = menToNum(men);
    
    if(ganNum > 0) nums.push(ganNum);
    if(tianNum > 0) nums.push(tianNum);
    if(starNum > 0) nums.push(starNum);
    if(menNum > 0) nums.push(menNum);
    
    // 宫位本身作为数字
    if(gong >= 1 && gong <= 9) nums.push(gong);
  }
  
  // 过滤范围
  var filtered = [];
  var maxNum = (lotType == "ssq") ? 33 : 35;
  for(var i = 0; i < nums.length; i++){
    if(nums[i] >= 1 && nums[i] <= maxNum) filtered.push(nums[i]);
  }
  
  return uniqueArray(filtered);
}

// 天干转数字
function ganToNum(gan){
  var map = {"甲":1,"乙":2,"丙":3,"丁":4,"戊":5,"己":6,"庚":7,"辛":8,"壬":9,"癸":10};
  return map[gan] || 0;
}

// 星转数字
function starToNum(star){
  var map = {"天蓬":1,"天芮":2,"天冲":3,"天辅":4,"天禽":5,"天心":6,"天柱":7,"天任":8,"天英":9};
  return map[star] || 0;
}

// 门转数字
function menToNum(men){
  var map = {"休":1,"生":2,"伤":3,"杜":4,"景":5,"死":6,"惊":7,"开":8};
  return map[men] || 0;
}

// ======================================================================
// 23. 张委铭精准杀号
// ======================================================================
function zhangWeimingKill(prevReds, lotType){
  var result = {killSet: [], reason: ""};
  if(!prevReds || prevReds.length == 0) return result;
  
  var maxNum = (lotType == "ssq") ? 33 : 35;
  var allNums = [];
  for(var i = 1; i <= maxNum; i++) allNums.push(i);
  
  var killReasons = {};
  
  // 规则1：重号 ≤ 1（最多保留1个上期号码）
  var keepOne = prevReds[Math.floor(Math.random() * prevReds.length)];
  for(var i = 0; i < prevReds.length; i++){
    if(prevReds[i] != keepOne){
      killReasons[prevReds[i]] = "重号超限";
    }
  }
  
  // 规则2：邻号 ≤ 2（上期每个号码±1，最多保留2个）
  var neighborCandidates = [];
  for(var i = 0; i < prevReds.length; i++){
    if(prevReds[i] - 1 >= 1) neighborCandidates.push(prevReds[i] - 1);
    if(prevReds[i] + 1 <= maxNum) neighborCandidates.push(prevReds[i] + 1);
  }
  var keptNeighbors = [];
  var shuffled = neighborCandidates.slice().sort(function(){return Math.random()-0.5;});
  for(var i = 0; i < Math.min(2, shuffled.length); i++) keptNeighbors.push(shuffled[i]);
  for(var i = 0; i < neighborCandidates.length; i++){
    if(keptNeighbors.indexOf(neighborCandidates[i]) === -1){
      if(!killReasons[neighborCandidates[i]]) killReasons[neighborCandidates[i]] = "邻号超限";
    }
  }
  
  // 规则3：同尾 ≤ 2（每个尾数最多2个号）
  var tailCount = {};
  for(var i = 1; i <= maxNum; i++){
    var tail = i % 10;
    if(!tailCount[tail]) tailCount[tail] = 0;
    tailCount[tail]++;
  }
  for(var i = 1; i <= maxNum; i++){
    var tail = i % 10;
    if(tailCount[tail] > 2 && !killReasons[i]) killReasons[i] = "同尾超限";
  }
  
  // 规则4：连号 ≤ 1组（随机保留1组两连，其余连号杀掉）
  // 简化处理：随机选一组相邻号保留
  
  // 规则5：区间比平衡 3:2:1 或 2:3:1 或 2:2:2
  // 简化：按比例筛选
  
  // 规则6：奇偶比 3:3/4:2/2:4
  
  // 汇总杀号
  var killSet = [];
  for(var k in killReasons){
    killSet.push(parseInt(k));
  }
  result.killSet = uniqueArray(killSet);
  result.reason = "张委铭杀号规则应用完成";
  return result;
}

// ======================================================================
// 24. 褚天一擒号秘技
// ======================================================================
function chuTianyiPlan(prevReds, prevBlues, lotType){
  var plans = [];
  var maxRed = (lotType == "ssq") ? 33 : 35;
  var redCount = (lotType == "ssq") ? 6 : 5;
  var blueCount = (lotType == "ssq") ? 1 : 2;
  var maxBlue = (lotType == "ssq") ? 16 : 12;
  
  // 生成3组候选
  for(var planIdx = 0; planIdx < 3; planIdx++){
    var candidate = [];
    
    // 规则：大小比 3:3/4:2/2:4
    var mid = Math.floor(maxRed / 2);
    var bigSmallRatios = [[3,3],[4,2],[2,4]];
    var ratio = bigSmallRatios[planIdx % 3];
    
    // 规则：和值 85-125
    // 规则：AC值 5-10
    // 规则：重号 1-2
    // 规则：连号 1组两连
    // 规则：跨度 18-30
    
    // 简化生成
    var smallPool = [];
    var bigPool = [];
    for(var i = 1; i <= mid; i++) smallPool.push(i);
    for(var i = mid+1; i <= maxRed; i++) bigPool.push(i);
    
    // 打乱
    smallPool.sort(function(){return Math.random()-0.5;});
    bigPool.sort(function(){return Math.random()-0.5;});
    
    var selected = [];
    for(var i = 0; i < ratio[0]; i++){
      if(i < smallPool.length) selected.push(smallPool[i]);
    }
    for(var i = 0; i < ratio[1]; i++){
      if(i < bigPool.length) selected.push(bigPool[i]);
    }
    
    selected = uniqueArray(selected).sort(function(a,b){return a-b;});
    
    // 补足到6个
    while(selected.length < redCount){
      var extra = Math.floor(Math.random() * maxRed) + 1;
      if(selected.indexOf(extra) === -1) selected.push(extra);
    }
    selected = selected.slice(0, redCount).sort(function(a,b){return a-b;});
    
    // 蓝球
    var blues = [];
    if(prevBlues && prevBlues.length > 0){
      // 杀上期+冷号+尾数
      var avoidBlues = prevBlues.slice();
      for(var b = 1; b <= maxBlue; b++){
        if(avoidBlues.indexOf(b) === -1 && blues.length < blueCount){
          blues.push(b);
        }
      }
    }
    while(blues.length < blueCount){
      var b = Math.floor(Math.random() * maxBlue) + 1;
      if(blues.indexOf(b) === -1) blues.push(b);
    }
    blues = blues.slice(0, blueCount).sort(function(a,b){return a-b;});
    
    plans.push({reds: selected, blues: blues});
  }
  
  return plans;
}

// 25. 一键计算主函数
// ======================================================================
function calcAll(){
  var output = document.getElementById("output");
  var prevText = document.getElementById("prevInput").value.trim();
  var prevData = null;
  
  try{
    if(prevText) prevData = JSON.parse(prevText);
  } catch(e){
    output.innerHTML = "⚠️ 上期号码格式错误，请检查JSON格式";
    return;
  }
  
  var prevReds = prevData ? prevData.red : [];
  var prevBlues = prevData ? prevData.blue : [];
  PREV_REDS = prevReds;
  PREV_BLUES = prevBlues;
  
  // 排盘
  var now = CURRENT_TIME;
  var pan = buildPan(now);
  PAN = pan;
  
  // 初池取数
  var chuChi = getChuChiNumbers(pan, LOT_TYPE);
  
  // 张委铭杀号
  var killResult = zhangWeimingKill(prevReds, LOT_TYPE);
  ZHANG_KILL_RESULT = killResult;
  
  // 褚天一擒号
  var chuPlans = chuTianyiPlan(prevReds, prevBlues, LOT_TYPE);
  CHU_PLANS = chuPlans;
  
  // 输出
  var html = "";
  html += "═══════════════════════════\n";
  html += "  奇门V6.1 · 完整排盘\n";
  html += "═══════════════════════════\n\n";
  html += "📅 时间：" + pan.dateStr + "\n";
  html += "🌿 节气：" + pan.jieQi + "\n";
  html += "☯ 阴阳：" + (pan.isYang ? "阳遁" : "阴遁") + " " + pan.ju + "局\n";
  html += "🔤 日干支：" + pan.dayGz + " | 时干支：" + pan.hourGz + "\n";
  html += "🏷️ 符头：" + pan.futou + " | " + pan.yuan + "\n\n";
  
  html += "─── 九宫信息 ───\n";
  for(var g = 1; g <= 9; g++){
    if(g == 5) continue;
    var info = pan.gongInfo[g];
    html += "宫" + g + "：";
    html += "地[" + info.diGan + "] ";
    html += "天[" + info.tianGan + "] ";
    html += "星[" + info.star + "] ";
    html += "门[" + info.men + "] ";
    html += "神[" + info.shen + "] ";
    if(info.kongWang) html += "⚡" + info.kongWang + " ";
    if(info.jiXing) html += "💥" + info.jiXing + " ";
    if(info.ruMu) html += "🪦" + info.ruMu + " ";
    if(info.menPo) html += "🔥" + info.menPo + " ";
    html += "\n";
  }
  
  html += "\n─── 初池取数 ───\n";
  html += "取数来源：值符/值使/开/生/用神宫\n";
  html += "初池号码：" + chuChi.join(", ") + "\n\n";
  
  html += "─── 张委铭杀号 ───\n";
  if(killResult.killSet.length > 0){
    html += "杀号：" + killResult.killSet.join(", ") + "\n";
  } else {
    html += "无杀号\n";
  }
  html += killResult.reason + "\n\n";
  
  html += "─── 褚天一3注精选 ───\n";
  for(var p = 0; p < chuPlans.length; p++){
    var plan = chuPlans[p];
    html += "第" + (p+1) + "注：红球 " + plan.reds.join(" ") + "  ";
    html += "蓝球 " + plan.blues.join(" ") + "\n";
  }
  
  html += "\n═══════════════════════════\n";
  html += "  奇门V6.1 · 完整版 ✅\n";
  html += "═══════════════════════════\n";
  
  output.innerHTML = html;
}



<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇门取数尺·拆补法·洛书盘</title>
<style>
  body{margin:0;background:#060a1c;color:#dfe6ff;font:15px/1.6 system-ui,"PingFang SC","Microsoft YaHei";max-width:820px;margin:auto;padding:14px}
  h1{color:#f3d27a;font-size:21px;margin:6px 0}
  .sub{color:#8b94c4;font-size:13px;margin-bottom:10px}
  .card{background:#0e1330;border:1px solid #233063;border-radius:12px;padding:12px;margin:10px 0}
  h2{color:#f3d27a;font-size:16px;margin:6px 0 10px}
  input,select{background:#05071c;color:#dfe6ff;border:1px solid #2a3470;border-radius:8px;padding:8px;width:100%;box-sizing:border-box;margin:4px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#15205a;color:#f3d27a;border:1px solid #34408c;border-radius:8px;padding:9px 12px;cursor:pointer}
  .luoshu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:10px auto}
  .cell{border:1px solid #2a3470;border-radius:10px;padding:8px;min-height:78px;background:#080d24;position:relative}
  .cell .gt{color:#f3d27a;font-weight:700}
  .cell .gm{font-size:12px;color:#aab4e8}
  .cell .gn{margin-top:4px;font-size:12px;color:#fff}
  .cell.zf{border-color:#5effc8;box-shadow:0 0 8px #5effc855}
  .cell.zs{border-color:#7ab8ff}
  .cell.kw{opacity:.5}
  .cell.ma::after{content:"马";position:absolute;top:4px;right:6px;color:#ffd27a;font-size:12px}
  .pool{margin-top:8px;font-size:14px}
  .final div{margin:4px 0;font-size:15px}
  .note{color:#8b94c4;font-size:12px;margin-top:8px}
  .tag{color:#f3d27a;font-size:12px;margin-left:6px}
</style>
</head>
<body>

<h1>奇门取数尺·拆补法·洛书盘</h1>
<div class="sub">时家转盘 / 拆补法定局 / 中五寄坤 / 洛书492-357-816 / 空亡转暗 / 马星对宫<br>仅作术数编程演示，不保证中奖，不用于投注依据</div>

<div class="card">
  <label>公历时间<input type="datetime-local" id="dt"></label>
  <div class="row">
    <div style="flex:1"><label>经度<input id="lng" placeholder="116.4" value="116.4"></label></div>
    <div style="flex:1">
      <label>彩种
        <select id="ctype">
          <option value="auto">按开奖时刻自动</option>
          <option value="ssq">双色球 6+1</option>
          <option value="dlt">大乐透 5+2</option>
        </select>
      </label>
    </div>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="btnRun">起局取数</button>
    <button id="btnNow">当前时间</button>
    <button id="btnDraw">开奖时刻</button>
  </div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap">
    <label><input type="checkbox" id="opt_oe" checked>奇偶</label>
    <label><input type="checkbox" id="opt_bs" checked>大小</label>
    <label><input type="checkbox" id="opt_mod3" checked>除3余</label>
    <label><input type="checkbox" id="opt_prime" checked>质合</label>
    <label><input type="checkbox" id="opt_zone" checked>区间</label>
    <label><input type="checkbox" id="opt_conn">允许连号</label>
  </div>
</div>

<div class="card" id="out"></div>

<div class="card">
  <h2>最终5注</h2>
  <div class="final" id="final"></div>
  <button id="btnReFilter" style="margin-top:8px">重新过滤</button>
  <div class="note">缩水：奇门总池 → 奇偶/大小/除3余/质合/区间/连号 → 九宫权重取前5</div>
</div>

<script>
/* ============ 基础 ============ */
const $=id=>document.getElementById(id);
const TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const LIUYI=['戊','己','庚','辛','壬','癸','丁','丙','乙'];
const XUN=['甲子戊','甲戌己','甲申庚','甲午辛','甲辰壬','甲寅癸'];
const STARS={1:'天蓬',2:'天芮',3:'天冲',4:'天辅',5:'天禽',6:'天心',7:'天柱',8:'天任',9:'天英'};
const MENS={1:'休',2:'死',3:'伤',4:'杜',6:'开',7:'惊',8:'生',9:'景'};
const SHEN=['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
const LUOSHU=[[4,9,2],[3,5,7],[8,1,6]];
const OPP={1:6,6:1,2:8,8:2,3:7,7:3,4:9,9:4,5:5};
const JIEQI=[
  [1,6,0,0,'小寒',0],[1,20,0,0,'大寒',0],
  [2,4,0,0,'立春',0],[2,19,0,0,'雨水',0],
  [3,6,0,0,'惊蛰',0],[3,21,0,0,'春分',0],
  [4,5,0,0,'清明',0],[4,20,0,0,'谷雨',0],
  [5,6,0,0,'立夏',0],[5,21,0,0,'小满',0],
  [6,6,0,0,'芒种',0],[6,21,0,0,'夏至',1],
  [7,7,0,0,'小暑',1],[7,23,0,0,'大暑',1],
  [8,8,0,0,'立秋',1],[8,23,0,0,'处暑',1],
  [9,8,0,0,'白露',1],[9,23,0,0,'秋分',1],
  [10,8,0,0,'寒露',1],[10,23,0,0,'霜降',1],
  [11,7,0,0,'立冬',1],[11,22,0,0,'小雪',1],
  [12,7,0,0,'大雪',0],[12,22,0,0,'冬至',0]
];
const JU_TABLE={
  '冬至':[1,7,4],'小寒':[2,8,5],'大寒':[3,9,6],'立春':[8,5,2],'雨水':[9,6,3],'惊蛰':[1,7,4],
  '春分':[3,9,6],'清明':[4,1,7],'谷雨':[5,2,8],'立夏':[4,1,7],'小满':[5,2,8],'芒种':[6,3,9],
  '夏至':[9,3,6],'小暑':[8,2,5],'大暑':[7,1,4],'立秋':[2,5,8],'处暑':[1,4,7],'白露':[9,3,6],
  '秋分':[7,1,4],'寒露':[6,9,3],'霜降':[5,8,2],'立冬':[6,9,3],'小雪':[5,8,2],'大雪':[4,1,7]
};

/* ============ 干支 ============ */
function ganzhi(y,m,d,h,mi){
  const base=Date.UTC(2000,0,1,0,0);
  const t=Date.UTC(y,m-1,d,h,mi);
  const days=Math.floor((t-base)/86400000);
  const dg=(days%10+10)%10, dz=(days%12+12)%12;
  const hz=Math.floor(((h*60+mi)+720)/120)%12;
  const stg=(dg*2+hz)%10;
  return {dg:TG[dg],dz:DZ[dz],sg:TG[stg],sz:DZ[hz]};
}
function trueSolar(y,m,d,h,mi,lng){
  const L=parseFloat(lng)||120;
  const off=(120-L)*4;
  let t=new Date(y,m-1,d,h,mi-off/60);
  return {y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate(),h:t.getHours(),mi:t.getMinutes()};
}
function getJieqi(y,m,d,h,mi){
  let cur=null;
  for(const q of JIEQI){
    const qt=new Date(y,q[0]-1,q[1],q[2],q[3]);
    const ct=new Date(y,m-1,d,h,mi);
    if(ct>=qt) cur=q;
  }
  return cur;
}
function getYuanDay(y,m,d,h,mi){
  const cur=getJieqi(y,m,d,h,mi);
  const qdate=new Date(y,cur[0]-1,cur[1],cur[2],cur[3]);
  const now=new Date(y,m-1,d,h,mi);
  const diff=Math.floor((now-qdate)/86400000);
  let yuan=0;
  if(diff<5)yuan=0; else if(diff<10)yuan=1; else yuan=2;
  return {jie:cur[4],yang:cur[5]===0,yuan,dayIn:diff};
}
function dingJu(yuanInfo){
  const arr=JU_TABLE[yuanInfo.jie];
  return arr[yuanInfo.yuan];
}

/* ============ 排盘 ============ */
function dipan(ju,yang){
  const g={};
  const seq=yang?[1,2,3,4,5,6,7,8,9]:[9,8,7,6,5,4,3,2,1];
  const start=seq.indexOf(ju);
  LIUYI.forEach((w,i)=>{
    let p=seq[(start+i)%9];
    if(p===5)p=2;
    g[p]=w;
  });
  return g;
}
function zhi2pal(z){
  const m={'子':1,'丑':8,'寅':8,'卯':3,'辰':4,'巳':4,'午':9,'未':2,'申':2,'酉':7,'戌':6,'亥':6};
  return m[z]||2;
}
function maXing(dz){
  if('申子辰'.includes(dz))return '寅';
  if('寅午戌'.includes(dz))return '申';
  if('巳酉丑'.includes(dz))return '亥';
  if('亥卯未'.includes(dz))return '巳';
  return '寅';
}
function qimen(y,m,d,h,mi,lng){
  const ts=trueSolar(y,m,d,h,mi,lng);
  const gz=ganzhi(ts.y,ts.m,ts.d,ts.h,ts.mi);
  const yuan=getYuanDay(ts.y,ts.m,ts.d,ts.h,ts.mi);
  const ju=dingJu(yuan);
  const isYang=yuan.yang;
  const dp=dipan(ju,isYang);

  const szIdx=DZ.indexOf(gz.sz);
  const xunIdx=Math.floor(szIdx/2);
  const xun=XUN[xunIdx];
  const xunYi=xun.slice(2);
  let zfPal=parseInt(Object.keys(dp).find(p=>dp[p]===xunYi))||2;
  const zfStar=STARS[zfPal];
  const zsMen=MENS[zfPal];

  const sgYi=({乙:'乙',丙:'丙',丁:'丁',戊:'戊',己:'己',庚:'庚',辛:'辛',壬:'壬',癸:'癸',甲:null})[gz.sg]||xunYi;
  let tpPal=parseInt(Object.keys(dp).find(p=>dp[p]===sgYi))||zfPal;
  if(tpPal===5)tpPal=2;

  const ringOrder=isYang?[1,2,3,4,6,7,8,9]:[9,8,7,6,4,3,2,1];
  const starPal={};
  const zfPos=ringOrder.indexOf(zfPal===5?2:zfPal);
  ringOrder.forEach((p,i)=>{ starPal[p]=STARS[ringOrder[(zfPos+i)%8]]; });
  starPal[tpPal]=zfStar;

  const menMap={'休':1,'死':2,'伤':3,'杜':4,'开':6,'惊':7,'生':8,'景':9};
  const zsPal0=menMap[zsMen];
  const menRing=isYang?[1,2,3,4,6,7,8,9]:[9,8,7,6,4,3,2,1];
  const zsPos=menRing.indexOf(zsPal0);
  const step=(szIdx%6);
  const zsLand=menRing[(zsPos+step)%8];
  const menPal={};
  menRing.forEach((p,i)=>{ menPal[p]=MENS[menRing[(zsLand+i)%8]]; });

  const shen={};
  const shenRing=isYang?[1,2,3,4,6,7,8,9]:[9,8,7,6,4,3,2,1];
  const zfpos2=shenRing.indexOf(tpPal===5?2:tpPal);
  SHEN.forEach((s,i)=>{ shen[shenRing[(zfpos2+i)%8]]=s; });

  const kwDZ=[DZ[(szIdx+10)%12],DZ[(szIdx+11)%12]];
  const kwPal=kwDZ.map(zhi2pal);
  const maPal=zhi2pal(maXing(gz.dz));

  const pal={};
  [1,2,3,4,6,7,8,9].forEach(p=>{
    pal[p]={pal:p,di:dp[p]||'',star:starPal[p]||'',men:menPal[p]||'',shen:shen[p]||'',kong:kwPal.includes(p),ma:(p===maPal)};
  });

  return {gz,ju,yang:isYang,zfPal:tpPal,zsPal:zsLand,maPal,kwPal,pal,dp};
}

/* ============ 取数池 ============ */
function gongBaseNums(p,max){
  const set=new Set(); let n=p;
  while(n<=max){ set.add(n); n+=9; }
  return [...set];
}
function buildPool(board,type){
  const maxF=type==='ssq'?33:35;
  const maxB=type==='ssq'?16:12;
  const frontSet=new Set();
  const backSet=new Set();

  const focus=[board.zfPal, board.zsPal, board.maPal].filter(Boolean);
  focus.forEach(p=>{
    gongBaseNums(p,maxF).forEach(n=>frontSet.add(n));
    gongBaseNums(OPP[p],maxF).forEach(n=>frontSet.add(n));
  });
  board.kwPal.forEach(p=>{
    gongBaseNums(p,maxF).forEach(n=>frontSet.add(n));
    gongBaseNums(OPP[p],maxF).forEach(n=>frontSet.add(n));
  });
  [1,2,3,4,6,7,8,9].forEach(p=>gongBaseNums(p,maxF).forEach(n=>frontSet.add(n)));

  let front=[...frontSet].filter(n=>n>=1&&n<=maxF).sort((a,b)=>a-b);
  if(front.length>18)front=front.slice(0,18);
  if(front.length<16){for(let i=1;i<=maxF&&front.length<16;i++)if(!front.includes(i))front.push(i);front.sort((a,b)=>a-b);}

  const goodPal=[board.zfPal, board.maPal, OPP[board.zfPal]].filter(Boolean);
  goodPal.forEach(p=>{
    let v=p; while(v>maxB)v-=9;
    if(v>=1&&v<=maxB)backSet.add(v);
    gongBaseNums(p,maxB).slice(0,1).forEach(n=>backSet.add(n));
  });
  let back=[...backSet].filter(n=>n>=1&&n<=maxB).sort((a,b)=>a-b);
  if(back.length<6)for(let i=1;i<=maxB&&back.length<6;i++)back.push(i);
  if(back.length>8)back=back.slice(0,8);

  return {front,back};
}

/* ============ 彩种/过滤 ============ */
function getDraw(y,m,d,h,mi,force){
  const dow=new Date(y,m-1,d).getDay();
  const t=h*60+mi;
  if(force==='ssq')return {type:'ssq',note:'强制双色球'};
  if(force==='dlt')return {type:'dlt',note:'强制大乐透'};
  if([2,4,0].includes(dow)&&Math.abs(t-1275)<=15)return {type:'ssq',note:'双色球开奖时刻'};
  if([1,3,6].includes(dow)&&Math.abs(t-1285)<=15)return {type:'dlt',note:'大乐透开奖时刻'};
  return {type:'ssq',note:'非开奖时刻，按双色球演示兜底（非投注依据）'};
}
function combo(arr,k){const res=[];(function f(s,cur){if(cur.length===k){res.push(cur.slice());return}for(let i=s;i<arr.length;i++){cur.push(arr[i]);f(i+1,cur);cur.pop()}})(0,[]);return res;}
function sampleCombos(arr,k,n){const all=combo(arr,k);if(all.length<=n)return all;const out=[],seen=new Set();while(out.length<n){const i=Math.floor(Math.random()*all.length);const kk=all[i].join(',');if(!seen.has(kk)){seen.add(kk);out.push(all[i])}}return out;}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
function checkCond(c,o,t){
  const odd=c.filter(x=>x%2).length;
  const big=t==='ssq'?c.filter(x=>x>16).length:c.filter(x=>x>17).length;
  if(o.oe&&(t==='ssq'?!(odd>=2&&odd<=4):!(odd>=2&&odd<=3)))return false;
  if(o.bs&&(t==='ssq'?!(big>=2&&big<=4):!(big>=2&&big<=3)))return false;
  if(o.mod3){if(new Set(c.map(x=>x%3)).size<3)return false;}
  if(o.prime&&t==='ssq'){const pr=c.filter(isPrime).length;if(!(pr>=1&&pr<=3))return false;}
  if(o.zone&&t==='ssq'){if(c.filter(x=>x<=11).length===0||c.filter(x=>x>22).length===0)return false;}
  if(!o.conn){const s=c.slice().sort((a,b)=>a-b);for(let i=0;i<s.length-1;i++)if(s[i+1]-s[i]===1)return false;}
  return true;
}
function scoreCombo(c,board){
  let s=0;
  c.forEach(n=>{
    let p=((n-1)%9)+1;
    let w=10;
    if(board.kwPal.includes(p))w*=0.6;
    if(p===board.zfPal)w+=6;
    if(p===board.zsPal)w+=4;
    if(p===board.maPal)w+=3;
    s+=w;
  });
  return {c,s};
}

/* ============ 渲染 ============ */
function render(board,pool,list,note,type){
  const out=$('out');
  let h=`<h2>奇门排盘（拆补·洛书492/357/816）</h2>`;
  h+=`<div>${board.gz.dg}${board.gz.dz}日 ${board.gz.sg}${board.gz.sz}时｜${board.yang?'阳遁':'阴遁'}${board.ju}局｜值符落${board.zfPal}宫 值使落${board.zsPal}宫｜空亡${board.kwPal.join('/')}｜马星${board.maPal}｜${note}</div>`;
  h+=`<div class="luoshu">`;
  LUOSHU.flat().forEach(p=>{
    if(p===5){h+=`<div class="cell" style="opacity:.4"><div class="gt">5中(寄坤)</div></div>`;return;}
    const b=board.pal[p];
    const cls=`cell ${b.kong?'kw':''} ${b.ma?'ma':''} ${(board.zfPal===p)?'zf':''} ${(board.zsPal===p)?'zs':''}`;
    const nums=pool.front.filter(n=>((n-1)%9)+1===p).join(' ');
    h+=`<div class="${cls}"><div class="gt">${p}宫</div><div class="gm">${b.di||''} ${b.star||''} ${b.men||''} ${b.shen||''}</div><div class="gn">${nums}</div></div>`;
  });
  h+=`</div>`;
  h+=`<div class="pool"><b>奇门总池（前区）</b>：${pool.front.join(', ')}</div>`;
  h+=`<div class="pool"><b>后区池</b>：${pool.back.join(', ')}</div>`;
  out.innerHTML=h;

  const f=$('final');
  if(!list.length){f.innerHTML='<div class="note">无候选，放宽条件重试</div>';return;}
  f.innerHTML=list.map((it,i)=>{
    const fr=it.c.join(' ');
    const bk=(it.back||[]).join(' ');
    return `<div>第${i+1}注｜${type==='ssq'?'红':'前'}：${fr}｜${type==='ssq'?'蓝':'后'}：${bk}<span class="tag">分${it.s|0}</span></div>`;
  }).join('');
  bindSafe('btnReFilter',runMain);
}

/* ============ 主流程 ============ */
function readOpts(){return {oe:$('opt_oe').checked,bs:$('opt_bs').checked,mod3:$('opt_mod3').checked,prime:$('opt_prime').checked,zone:$('opt_zone').checked,conn:$('opt_conn').checked};}
function parseDt(v){const [d,t]=v.split('T');const [y,m,dd]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);return {y,m,d:dd,h,mi};}
function runMain(){
  try{
    const v=$('dt').value; if(!v){alert('先选时间');return;}
    const p=parseDt(v); const lng=$('lng').value.trim();
    const board=qimen(p.y,p.m,p.d,p.h,p.mi,lng);
    const dr=getDraw(p.y,p.m,p.d,p.h,p.mi,$('ctype').value);
    const pool=buildPool(board,dr.type);
    const fl=dr.type==='ssq'?6:5, bl=dr.type==='ssq'?1:2;
    const opts=readOpts();
    let samples=sampleCombos(pool.front,fl,20000);
    let filt=samples.filter(c=>checkCond(c,opts,dr.type));
    if(filt.length<5)filt=samples;
    let scored=filt.map(c=>scoreCombo(c,board));
    scored.sort((a,b)=>b.s-a.s);
    const list=scored.slice(0,5).map(it=>({...it,back:pool.back.slice(0,bl)}));
    render(board,pool,list,dr.note,dr.type);
  }catch(e){alert('出错：'+e.message+'\n'+(e.stack||''));}
}
function setNow(){const n=new Date();$('dt').value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}T${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;runMain();}
function autoDraw(){const n=new Date();const dow=n.getDay();let h=21,mi=15;if([1,3,6].includes(dow)){h=21;mi=25}$('dt').value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}T${h}:${mi}`;runMain();}
function bindSafe(id,fn){const e=$(id);if(e)e.onclick=fn;}

document.addEventListener('DOMContentLoaded',()=>{
  bindSafe('btnRun',runMain);
  bindSafe('btnNow',setNow);
  bindSafe('btnDraw',autoDraw);
  setNow();
});
</script>
</body>
</html>

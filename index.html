
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QDIM-6 选号研究台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#0a0f1e;color:#e0e6f0;min-height:100vh;display:flex;justify-content:center;padding:12px}
.container{max-width:520px;width:100%}
h1{font-size:20px;text-align:center;padding:14px 0 4px;color:#f0c060;letter-spacing:1px}
.sub{text-align:center;font-size:11px;color:#8899bb;margin-bottom:12px}
.card{background:#141b2b;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #253040}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:13px;color:#99aac5;white-space:nowrap}
select,input[type=text]{background:#1e283a;border:1px solid #334155;color:#e0e6f0;border-radius:6px;padding:8px 10px;font-size:14px;flex:1;min-width:80px}
.btn-group{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#d4a030;color:#0a0f1e}
.btn-secondary{background:#2a3a55;color:#c0cee8}
.btn-danger{background:#4a2a2a;color:#f0a0a0}
.btn:active{opacity:.7}
.layer-title{font-size:13px;color:#b0c4de;margin:10px 0 4px;font-weight:600}
.nums{display:flex;flex-wrap:wrap;gap:4px;min-height:28px}
.num-ball{display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.red{background:#c0392b}
.blue{background:#2980b9}
.gold{background:#d4a030;color:#0a0f1e}
.recommend{background:#1e3040;border-radius:8px;padding:10px;margin:6px 0}
.recommend-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.recommend-label{font-size:12px;color:#8899bb}
.footnote{font-size:11px;color:#667799;text-align:center;margin-top:14px;line-height:1.6}
.highlight{border-left:3px solid #d4a030;padding-left:8px}
</style>
</head>
<body>
<div class="container">

<h1>☯ QDIM-6 选号研究台</h1>
<div class="sub">V6.3 固定局版 · 同彩种同期号结果不变 · A层九宫扩池 · 大乐透严格5+2</div>

<div class="card">
  <div class="row">
    <label>彩种</label>
    <select id="lotteryType">
      <option value="ssq">双色球（红01-33 / 蓝01-16）</option>
      <option value="dlt">大乐透（前01-35 / 后01-12）</option>
    </select>
  </div>
  <div class="row" style="margin-top:8px">
    <label>期号</label>
    <input type="text" id="issueInput" placeholder="自动生成，也可手动改">
  </div>
  <div class="btn-group">
    <button class="btn btn-primary" id="calcBtn">⚡ 起局推算</button>
    <button class="btn btn-secondary" id="lastBtn">📜 上一期开奖</button>
    <button class="btn btn-danger" id="clearBtn">清空</button>
  </div>
  <div style="font-size:11px;color:#7788aa;margin-top:8px;text-align:center">
    QDIM-6 固定局模型：同彩种+同期号→固定盘→固定推荐。不随机抽样。
  </div>
</div>

<!-- 结果显示区 -->
<div id="resultArea"></div>

<div class="footnote">
  📌 数据来源：GitHub Actions 每日定时抓取 cwl.gov.cn 和 lottery.gov.cn 公开开奖公告。<br>
  ⚠️ 彩票随机、独立同分布；本工具仅作排盘/统计/娱乐研究，不代买、不包中、不引导倍投。
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
<script>
// ============================================================
// 1. 基础工具
// ============================================================
function pad2(n){return n<10?'0'+n:''+n}

function createRng(seed){
  const r = new Math.seedrandom(seed);
  return function(){ return r(); };
}

function seededInt(rng, min, max){
  return Math.floor(rng() * (max - min + 1)) + min;
}

function sampleFixed(arr, count, rng){
  const copy = [...arr];
  const result = [];
  for(let i=0; i<count && copy.length>0; i++){
    const idx = Math.floor(rng() * copy.length);
    result.push(copy[idx]);
    copy.splice(idx,1);
  }
  return result;
}

// ============================================================
// 2. 九宫数映射表（每个宫对应的数字，用于扩A层）
// ============================================================
const PALACE_NUMS = {
  1: [1, 6, 11, 16, 21, 26, 31],
  2: [2, 5, 8, 10, 15, 20, 25, 30, 35],
  3: [3, 4, 8, 13, 18, 23, 28, 33],
  4: [3, 4, 5, 8, 14, 19, 24, 29, 34],
  5: [5, 10, 15, 20, 25, 30, 35],
  6: [1, 4, 6, 9, 16, 21, 26, 31],
  7: [2, 4, 7, 9, 17, 22, 27, 32],
  8: [5, 7, 8, 10, 18, 23, 28, 33],
  9: [2, 3, 7, 9, 19, 24, 29, 34]
};

// ============================================================
// 3. 固定起局参数
// ============================================================
function generateQiMenParams(lottery, issue){
  const seedStr = lottery + '_' + issue;
  const rng = createRng(seedStr);
  
  const yinYang = seededInt(rng, 0, 1);
  const ju = seededInt(rng, 1, 9);
  const zhiFu = seededInt(rng, 1, 9);
  const zhiShi = seededInt(rng, 1, 8);
  
  let kongWang1 = seededInt(rng, 0, 11);
  let kongWang2 = seededInt(rng, 0, 11);
  while(kongWang2 === kongWang1) kongWang2 = seededInt(rng, 0, 11);
  
  const yongShenGong = seededInt(rng, 1, 9);
  
  return { yinYang, ju, zhiFu, zhiShi, kongWang: [kongWang1, kongWang2], yongShenGong, seedStr };
}

// ============================================================
// 4. 从固定盘推导 A/B/C 层号码（A层已扩池）
// ============================================================
function deriveLayers(params, lottery){
  const rng = createRng(params.seedStr + '_layers');
  
  let redMin=1, redMax=33, blueMin=1, blueMax=16;
  if(lottery === 'dlt'){
    redMin=1; redMax=35; blueMin=1; blueMax=12;
  }
  
  // ---- A 主层（吉用神本位）- 九宫扩池 ----
  const gong = params.yongShenGong;
  // 从九宫数映射表中获取该宫的所有数字，并限制在红球/前区范围内
  const aPool = (PALACE_NUMS[gong] || []).filter(n => n >= redMin && n <= redMax);
  // 如果不足8个，补充同尾数
  while(aPool.length < 8){
    const last = aPool[aPool.length-1] || gong;
    const next = last + 10;
    if(next <= redMax && !aPool.includes(next)) aPool.push(next);
    else break;
  }
  // 取前8个作为A层红球/前区
  const aRed = aPool.slice(0, Math.min(8, aPool.length));
  
  // A 层蓝球：用神宫映射
  const aBlue = ((params.yongShenGong * 7) % (blueMax - blueMin + 1)) + blueMin;
  
  // ---- B 关系层（同宫+9 / 同尾 / 对宫冲）----
  const bPool = [];
  for(const n of aRed){
    const cand = n + 9;
    if(cand >= redMin && cand <= redMax && !bPool.includes(cand) && !aRed.includes(cand)) bPool.push(cand);
  }
  for(const n of aRed){
    const tail = n % 10;
    for(let t=redMin; t<=redMax; t++){
      if(t % 10 === tail && !bPool.includes(t) && !aRed.includes(t)) bPool.push(t);
    }
  }
  for(const n of aRed){
    const cand1 = n + 17;
    if(cand1 >= redMin && cand1 <= redMax && !bPool.includes(cand1) && !aRed.includes(cand1)) bPool.push(cand1);
    const cand2 = n - 17;
    if(cand2 >= redMin && cand2 <= redMax && !bPool.includes(cand2) && !aRed.includes(cand2)) bPool.push(cand2);
  }
  const bRed = sampleFixed([...new Set(bPool)], Math.min(8, bPool.length), rng);
  
  const bBlue = ((params.zhiFu * 5) % (blueMax - blueMin + 1)) + blueMin;
  
  // ---- C 反相层（凶门得令 / 空亡实出）----
  const cPool = [];
  for(const kw of params.kongWang){
    const base = kw * 3 + 1;
    for(let i=0; i<3; i++){
      const num = base + i;
      if(num >= redMin && num <= redMax && !cPool.includes(num)) cPool.push(num);
    }
  }
  if(params.zhiShi % 2 === 1){
    for(let i=0; i<3; i++){
      const num = seededInt(rng, redMin, redMax);
      if(!cPool.includes(num)) cPool.push(num);
    }
  }
  const cRed = sampleFixed([...new Set(cPool)], Math.min(5, cPool.length), rng);
  
  const cBlue = ((params.kongWang[0] + params.kongWang[1]) % (blueMax - blueMin + 1)) + blueMin;
  
  // ---- Z 综合池：生成推荐注 ----
  const allRed = [...new Set([...aRed, ...bRed, ...cRed])].sort((a,b)=>a-b);
  
  let needRed, needBlue;
  if(lottery === 'ssq'){
    needRed = 6;
    needBlue = 1;
  } else {
    needRed = 5;
    needBlue = 2; // 大乐透后区需要2个
  }
  
  // 生成后区候选池（大乐透专用）
  let backPool = [];
  if(lottery === 'dlt'){
    backPool = [...new Set([
      aBlue, bBlue, cBlue,
      ...aRed.filter(n=>n>=1&&n<=12),
      ...bRed.filter(n=>n>=1&&n<=12),
      ...cRed.filter(n=>n>=1&&n<=12)
    ])].filter(n=>n>=1&&n<=12).sort((a,b)=>a-b);
    // 确保至少2个
    while(backPool.length < 2){
      const extra = seededInt(rng, 1, 12);
      if(!backPool.includes(extra)) backPool.push(extra);
    }
  }
  
  const combRng = createRng(params.seedStr + '_zpool');
  const usedCombos = new Set();
  const candidates = [];
  
  for(let attempt=0; attempt<500; attempt++){
    if(candidates.length >= 10) break;
    
    const picked = sampleFixed(allRed, needRed, combRng);
    if(picked.length < needRed) continue;
    const sortedPick = picked.sort((a,b)=>a-b);
    let key;
    let blues;
    
    if(lottery === 'ssq'){
      const bluePool = [aBlue, bBlue, cBlue];
      const blue = bluePool[Math.floor(combRng() * bluePool.length)];
      blues = [blue];
      key = sortedPick.join(',') + '|' + blue;
    } else {
      // 大乐透：从后区池取2个不同的
      const shuffledBack = sampleFixed(backPool, backPool.length, combRng);
      const twoBlues = shuffledBack.slice(0, 2).sort((a,b)=>a-b);
      if(twoBlues.length < 2) continue;
      blues = twoBlues;
      key = sortedPick.join(',') + '|' + twoBlues.join(',');
    }
    
    if(usedCombos.has(key)) continue;
    usedCombos.add(key);
    
    let score = 0;
    for(const n of sortedPick){
      if(aRed.includes(n)) score += 3;
      else if(bRed.includes(n)) score += 2;
      else score += 1;
    }
    for(const b of blues){
      if(b === aBlue) score += 2;
      else if(b === bBlue) score += 1;
    }
    
    candidates.push({red: sortedPick, blue: blues, score});
  }
  
  candidates.sort((a,b)=>b.score - a.score);
  const top3 = candidates.slice(0, 3);
  
  return {
    params,
    aRed: aRed.sort((a,b)=>a-b),
    aBlue,
    bRed: bRed.sort((a,b)=>a-b),
    bBlue,
    cRed: cRed.sort((a,b)=>a-b),
    cBlue,
    top3,
    allRed: allRed.sort((a,b)=>a-b)
  };
}

// ============================================================
// 5. 渲染结果
// ============================================================
function renderResult(result, lottery){
  const area = document.getElementById('resultArea');
  const isDLT = (lottery === 'dlt');
  const redLabel = isDLT ? '前区' : '红球';
  const blueLabel = isDLT ? '后区' : '蓝球';
  
  let html = '';
  
  const p = result.params;
  const yinYangStr = p.yinYang===0 ? '阳遁' : '阴遁';
  const starNames = ['天蓬','天芮','天冲','天辅','天禽','天心','天柱','天任','天英'];
  const gateNames = ['休门','死门','伤门','杜门','开门','惊门','生门','景门'];
  const diZhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  
  html += `<div class="card highlight">
    <div style="font-size:12px;color:#8899bb;margin-bottom:6px">
      🧭 起局参数：${yinYangStr}${p.ju}局 · 值符${starNames[p.zhiFu-1]} · 
      值使${gateNames[p.zhiShi-1]} · 
      空亡${diZhi[p.kongWang[0]]}${diZhi[p.kongWang[1]]} · 
      用神宫${p.yongShenGong}宫
    </div>
  </div>`;
  
  // A 主层（现在会有8个左右，不再是4个）
  html += `<div class="card">
    <div class="layer-title">☰ A 主层（吉用神本位）— 用神宫${p.yongShenGong}宫（九宫扩池）</div>
    <div class="nums">`;
  for(const n of result.aRed){
    html += `<span class="num-ball red">${pad2(n)}</span>`;
  }
  html += `<span class="num-ball blue">${pad2(result.aBlue)}</span>`;
  html += `</div><div style="font-size:10px;color:#556688;margin-top:4px">共${result.aRed.length}个前区/红球 + 1个后区/蓝球</div></div>`;
  
  // B 关系层
  html += `<div class="card">
    <div class="layer-title">☲ B 关系层（同宫+9 / 同尾 / 对宫冲）</div>
    <div class="nums">`;
  for(const n of result.bRed){
    html += `<span class="num-ball red">${pad2(n)}</span>`;
  }
  html += `<span class="num-ball blue">${pad2(result.bBlue)}</span>`;
  html += `</div></div>`;
  
  // C 反相层
  html += `<div class="card">
    <div class="layer-title">☵ C 反相层（凶门得令 / 空亡实出）</div>
    <div class="nums">`;
  for(const n of result.cRed){
    html += `<span class="num-ball red">${pad2(n)}</span>`;
  }
  html += `<span class="num-ball blue">${pad2(result.cBlue)}</span>`;
  html += `</div></div>`;
  
  // 推荐 3 注
  html += `<div class="card">
    <div class="layer-title">⭐ 推荐 3 注（仅研究用）</div>`;
  for(let i=0; i<result.top3.length; i++){
    const t = result.top3[i];
    const redStr = t.red.map(n=>pad2(n)).join(' ');
    let blueStr;
    if(isDLT){
      blueStr = t.blue.map(n=>pad2(n)).join(' ');
    } else {
      blueStr = pad2(t.blue[0]);
    }
    html += `<div class="recommend">
      <div class="recommend-row">
        <span class="recommend-label">第${i+1}注</span>
        <span style="font-size:12px;color:#667799">评分 ${t.score}</span>
      </div>
      <div style="font-size:16px;font-weight:700;margin-top:4px">
        <span style="color:#e74c3c">${redStr}</span>
        <span style="color:#3498db;margin-left:6px">+ ${blueStr}</span>
      </div>
    </div>`;
  }
  html += `</div>`;
  
  area.innerHTML = html;
}

// ============================================================
// 6. 主逻辑
// ============================================================
function getAutoIssue(lottery){
  const now = new Date();
  const y = now.getFullYear();
  const dayOfYear = Math.floor((now - new Date(y,0,0)) / 86400000);
  const issueNum = Math.floor(dayOfYear * 0.49) + 120;
  return `${y}${pad2(issueNum)}`;
}

document.addEventListener('DOMContentLoaded', function(){
  const typeSelect = document.getElementById('lotteryType');
  const issueInput = document.getElementById('issueInput');
  const calcBtn = document.getElementById('calcBtn');
  const lastBtn = document.getElementById('lastBtn');
  const clearBtn = document.getElementById('clearBtn');
  const area = document.getElementById('resultArea');
  
  issueInput.value = getAutoIssue(typeSelect.value);
  
  typeSelect.addEventListener('change', function(){
    issueInput.value = getAutoIssue(this.value);
  });
  
  calcBtn.addEventListener('click', function(){
    const lottery = typeSelect.value;
    let issue = issueInput.value.trim();
    if(!issue){
      issue = getAutoIssue(lottery);
      issueInput.value = issue;
    }
    
    const params = generateQiMenParams(lottery, issue);
    const result = deriveLayers(params, lottery);
    renderResult(result, lottery);
  });
  
  clearBtn.addEventListener('click', function(){
    area.innerHTML = '';
  });
  
  lastBtn.addEventListener('click', async function(){
    try{
      const resp = await fetch('./data.json?t='+Date.now());
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const data = await resp.json();
      const lottery = typeSelect.value;
      const latest = data[lottery]?.latest;
      if(!latest || !latest.red || latest.red.length===0){
        area.innerHTML = `<div class="card" style="color:#aab;text-align:center">暂无开奖数据，等待 GitHub Actions 自动更新。</div>`;
        return;
      }
      const isDLT = (lottery==='dlt');
      const redStr = latest.red.map(n=>pad2(n)).join(' ');
      let blueStr;
      if(isDLT && Array.isArray(latest.blue)){
        blueStr = latest.blue.map(n=>pad2(n)).join(' ');
      } else {
        blueStr = pad2(latest.blue);
      }
      area.innerHTML = `<div class="card highlight">
        <div style="font-size:13px;color:#8899bb">📜 第 ${latest.issue} 期（${latest.date||''}）</div>
        <div style="font-size:18px;font-weight:700;margin-top:6px">
          <span style="color:#e74c3c">${redStr}</span>
          <span style="color:#3498db;margin-left:8px">+ ${blueStr}</span>
        </div>
        <div style="font-size:11px;color:#667799;margin-top:4px">数据来源：GitHub Actions 自动抓取</div>
      </div>`;
    } catch(e){
      area.innerHTML = `<div class="card" style="color:#aab;text-align:center">读取开奖数据失败：${e.message}</div>`;
    }
  });
  
});
</script>
</body>
</html>

    if (ac < expectedACMin || ac > expectedACMax) {

    }
    if (bs[0] < 2 || bs[0] > 4 || bs[1] < 2 || bs[1] > 4) {
        return false;
    }
    if (cfg.fPick === 6) {
        if (bs[0] < 2 || bs[0] > 4 || bs[1] < 2 || bs[1] > 4) {
            return false;
        }
    }
    for (var bi = 0; bi < back.length; bi++) {
        for (var lbi = 0; lbi < lastBack.length; lbi++) {
            if (back[bi] === lastBack[lbi]) {
                return false;
            }
        }
    }
    return true;
}

function runLottery(type, count) {
    count = count || 5;
    var cfg = LOT_CFG[type];
    var lastFront = null;
    var lastBack = null;
    if (type === 'ssq') {
        lastFront = lastSSQFront;
        lastBack = lastSSQBack;
    } else {
        lastFront = lastDLTFront;
        lastBack = lastDLTBack;
    }
    if (!lastFront || !lastFront.length || !lastBack || !lastBack.length) {
        log("错误：请先注入上期真实开奖数据！");
        alert("请先点击【注入上期】输入上期开奖号码！");
        return [];
    }
    log("开始" + cfg.name + "选号，目标" + count + "注");
    var pan = buildPan(type);
    renderGong(pan);
    var keyNums = extractKeyGongNumbers(pan);
    var basePool = buildTotalPool(pan, cfg);
    log("奇门总池: [" + basePool.join(",") + "] 共" + basePool.length + "个号码");
    var results = [];
    var maxAttempts = 30000;
    var attempts = 0;
    while (results.length < count && attempts < maxAttempts) {
        attempts++;
        var candidateFront = [];
        var poolCopy = basePool.slice();
        for (var fi = 0; fi < cfg.fPick; fi++) {
            if (poolCopy.length === 0) {
                break;
            }
            var idx = Math.floor(Math.random() * poolCopy.length);
            candidateFront.push(poolCopy[idx]);
            poolCopy.splice(idx, 1);
        }
        if (candidateFront.length !== cfg.fPick) {
            continue;
        }
        candidateFront.sort(function(a, b) { return a - b; });
        var candidateBack = [];
        for (var bi = 0; bi < cfg.bPick; bi++) {
            var bNum = cfg.bMin + Math.floor(Math.random() * (cfg.bMax - cfg.bMin + 1));
            candidateBack.push(bNum);
        }
        candidateBack.sort(function(a, b) { return a - b; });
        var candidate = {front: candidateFront, back: candidateBack};
        if (!zhangWeimingSha(lastFront, lastBack, candidate, cfg)) {
            continue;
        }
        if (!chuTianyiQin(lastFront, lastBack, candidate, cfg)) {
            continue;
        }
        results.push(candidate);
    }
    log("选号完成，共生成" + results.length + "注，尝试次数" + attempts);
    if (results.length < count) {
        log("警告：仅生成" + results.length + "注，条件过于严格，放宽中...");
        while (results.length < count && attempts < maxAttempts + 20000) {
            attempts++;
            var candidateFront2 = [];
            var poolCopy2 = basePool.slice();
            for (var fi2 = 0; fi2 < cfg.fPick; fi2++) {
                if (poolCopy2.length === 0) break;
                var idx2 = Math.floor(Math.random() * poolCopy2.length);
                candidateFront2.push(poolCopy2[idx2]);
                poolCopy2.splice(idx2, 1);
            }
            if (candidateFront2.length !== cfg.fPick) continue;
            candidateFront2.sort(function(a, b) { return a - b; });
            var candidateBack2 = [];
            for (var bi2 = 0; bi2 < cfg.bPick; bi2++) {
                var bNum2 = cfg.bMin + Math.floor(Math.random() * (cfg.bMax - cfg.bMin + 1));
                candidateBack2.push(bNum2);
            }
            candidateBack2.sort(function(a, b) { return a - b; });
            var candidate2 = {front: candidateFront2, back: candidateBack2};
            if (!zhangWeimingSha(lastFront, lastBack, candidate2, cfg)) {
                continue;
            }
            results.push(candidate2);
        }
        log("放宽后共生成" + results.length + "注");
    }
    renderResults(type, results, pan, keyNums);
    updateStatBar(type, results);
    return results;
}

function renderGong(pan) {
    var container = document.getElementById("gongContainer");
    if (!container) return;
    var gongData = pan.gongData;
    var html = "";
    for (var g = 0; g < gongData.length; g++) {
        var gd = gongData[g];
        var bgColor = "#0d1424";
        if (gd.isSanQi) bgColor = "#0a2e1a";
        if (gd.menJx === "吉") bgColor = "#0a1a2e";
        if (gd.weight > 30) bgColor = "#1a102e";
        if (gd.isKong) bgColor = "#1a0a0a";
        html += '<div class="gong-cell" style="background:' + bgColor + ';">';
        html += '<div class="g-num">宫' + (g + 1) + ' ' + gd.fangWei + ' ' + gd.luoShu + '</div>';
        html += '<div class="g-main">' + gd.tianGan + '</div>';
        html += '<div class="g-sub">天:' + gd.xing + ' 门:' + gd.men + '</div>';
        html += '<div class="g-sub">神:' + gd.shen + ' 地:' + gd.diGan + '</div>';
        html += '<div class="g-sub">权:' + gd.weight + '</div>';
        html += '<div>';
        for (var ti = 0; ti < gd.tags.length; ti++) {
            var cls = "tag-";
            var tag = gd.tags[ti];
            if (tag === "三奇") cls += "qi";
            else if (tag === "吉门" || tag === "吉神") cls += "ji";
            else if (tag === "马星") cls += "ma";
            else if (tag === "空亡") cls += "kong";
            else if (tag === "入墓" || tag === "门迫" || tag === "击刑") cls += "mu";
            else cls += "zf";
            html += '<span class="g-tag ' + cls + '">' + tag + '</span>';
        }
        html += '</div></div>';
    }
    container.innerHTML = html;
    var ps = document.getElementById("panStatus");
    if (ps) {
        ps.innerHTML = pan.jq + " " + pan.ju + "局 " + (pan.yang ? "阳" : "阴") + " | " + pan.shiGZ.gan + pan.shiGZ.zhi + "时";
    }
}

function renderResults(type, results, pan, keyNums) {
    var out = document.getElementById("mainOutput");
    var cfg = LOT_CFG[type];
    var html = '<div class="hl-gold">═══ ' + cfg.name + ' 精选 ' + results.length + ' 注 ═══</div>';
    html += '<div class="info-line">排盘时间：' + formatDate(pan.dt) + ' | ' + pan.jq + ' ' + (pan.yang ? "阳" : "阴") + pan.ju + '局</div>';
    html += '<div class="info-line">日柱：' + pan.dayGZ.gan + pan.dayGZ.zhi + ' | 时柱：' + pan.shiGZ.gan + pan.shiGZ.zhi + '</div>';
    html += '<div class="info-line">值符宫' + (pan.zhiFuGong + 1) + ' 时干宫' + (pan.shiGanGong + 1) + '</div>';
    html += '<div class="info-line">旬首：' + pan.xunShou + ' 空亡：' + pan.kongWang + ' 马星：' + pan.maZhi + '</div>';
    html += '<div class="info-line">关键宫位取数：';
    for (var ki = 0; ki < keyNums.length; ki++) {
        html += '宫' + (keyNums[ki].gong + 1) + '→' + keyNums[ki].num + '(' + keyNums[ki].reason + ') ';
    }
    html += '</div>';
    html += '<div class="hl-gold">══════════════</div>';
    for (var ri = 0; ri < results.length; ri++) {
        var r = results[ri];
        var frontStr = r.front.map(function(n) { return n < 10 ? "0" + n : "" + n; }).join(" ");
        var backStr = r.back.map(function(n) { return n < 10 ? "0" + n : "" + n; }).join(" ");
        var sum = arraySum(r.front);
        var span = arraySpan(r.front);
        var ac = calcAC(r.front);
        var oe = oddEvenCount(r.front);
        var bs = bigSmallCount(r.front, cfg.bigLine);
        html += '<div class="result-card">';
        html += '<div style="font-size:16px;font-weight:700;color:#f5c542;">第' + (ri + 1) + '注</div>';
        html += '<div><span class="hl-green">前区:</span> <span style="font-size:18px;font-weight:700;color:#e5e7eb;">' + frontStr + '</span></div>';
        html += '<div><span class="hl-blue">后区:</span> <span style="font-size:16px;font-weight:600;color:#93c5fd;">' + backStr + '</span></div>';
        html += '<div class="info-line">和值' + sum + ' | 跨度' + span + ' | AC' + ac + ' | 奇偶' + oe[0] + ':' + oe[1] + ' | 大小' + bs[0] + ':' + bs[1] + '</div>';
        html += '</div>';
    }
    html += '<div class="hl-gold">══════════════</div>';
    out.innerHTML = html;
    var rc = document.getElementById("resultCount");
    if (rc) {
        rc.innerHTML = results.length + "注 | " + cfg.name;
    }
}

function updateStatBar(type, results) {
    var bar = document.getElementById("statBar");
    if (!bar || !results.length) return;
    var cfg = LOT_CFG[type];
    var allFront = [];
    results.forEach(function(r) {
        allFront = allFront.concat(r.front);
    });
    var avgSum = 0;
    var avgSpan = 0;
    var avgAC = 0;
    results.forEach(function(r) {
        avgSum += arraySum(r.front);
        avgSpan += arraySpan(r.front);
        avgAC += calcAC(r.front);
    });
    avgSum = Math.round(avgSum / results.length);
    avgSpan = Math.round(avgSpan / results.length);
    avgAC = Math.round(avgAC * 10) / 10;
    var html = '';
    html += '<span>彩种：' + cfg.name + '</span>';
    html += '<span>注数：' + results.length + '</span>';
    html += '<span>平均和值：' + avgSum + '</span>';
    html += '<span>平均跨度：' + avgSpan + '</span>';
    html += '<span>平均AC：' + avgAC + '</span>';
    html += '<span>号码范围：' + cfg.fMin + '-' + cfg.fMax + '</span>';
    bar.innerHTML = html;
}

function setRealLastData() {
    var frontStr = prompt("请输入上期前区号码（空格分隔）：\n例：05 12 18 23 29 31（双色球6个）\n例：08 11 16 25 32（大乐透5个）");
    if (!frontStr) return;
    var backStr = prompt("请输入上期后区号码（空格分隔）：\n例：07（双色球1个）\n例：03 08（大乐透2个）");
    if (!backStr) return;
    var frontArr = frontStr.trim().split(/[\s,，]+/).map(Number);
    var backArr = backStr.trim().split(/[\s,，]+/).map(Number);
    if (frontArr.length === 6 && backArr.length === 1) {
        lastSSQFront = frontArr;
        lastSSQBack = backArr;
        log("注入双色球上期数据成功：前区[" + frontArr.join(",") + "] 后区[" + backArr.join(",") + "]");
        alert("双色球上期数据注入成功！");
    } else if (frontArr.length === 5 && backArr.length === 2) {
        lastDLTFront = frontArr;
        lastDLTBack = backArr;
        log("注入大乐透上期数据成功：前区[" + frontArr.join(",") + "] 后区[" + backArr.join(",") + "]");
        alert("大乐透上期数据注入成功！");
    } else {
        log("格式错误：前区" + frontArr.length + "个，后区" + backArr.length + "个，不匹配任何彩种");
        alert("格式错误！\n双色球：前区6个 + 后区1个\n大乐透：前区5个 + 后区2个");
    }
}

function exportResult() {

    if (!text || text.indexOf("═══") === -1) {
        alert("没有可导出的结果，请先生成选号");
        return;
    }
    var blob = new Blob([text], {type: "text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "奇门遁甲V9_选号结果_" + new Date().toISOString().slice(0, 10) + ".txt";
    a.click();
    URL.revokeObjectURL(url);
    log("结果已导出");
}


<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>奇门选号池·真实计算版（自动下一期开奖时间）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1120;color:#e2e8f0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:12px}

<body>

<h1>奇门选号池 · 真实计算版</h1>

<div class="card">
  <div class="row">
    <label>彩种
      <select id="lotType">
        <option value="ssq">双色球（二/四/日 21:15）</option>

    <span class="sw"><input type="checkbox" id="chkQimen" checked> 启用奇门</span>

  <div class="row">
    <span class="sw"><input type="checkbox" id="chkWuBu"> 五不遇时（降权）</span>
    <span class="sw"><input type="checkbox" id="chkKong"> 空亡降权</span>

<div class="card">
  <div class="section-title">奇门局信息</div>

</div>

  <details>
    <summary>奇门总池（用神/权重/格局日志，点击展开）</summary>

  <div id="shrinkOut" class="out">—</div>

<script>
"use strict";

/* ========== 1. 开奖时间自动推算 ========== */
const LOT_SCHEDULE = {
  ssq:  { days:[0,2,4],       time:'21:15', name:'双色球', front:33, back:16, fpick:6, bpick:1 },
  dlt:  { days:[1,3,6],       time:'21:25', name:'大乐透', front:35, back:12, fpick:5, bpick:2 },
  qlc:  { days:[1,3,5],       time:'21:15', name:'七乐彩', front:30, back:16, fpick:7, bpick:1 },
  fc3d: { days:[0,1,2,3,4,5,6], time:'21:15', name:'福彩3D', front:10, back:10, fpick:3, bpick:0 },
  pl3:  { days:[0,1,2,3,4,5,6], time:'21:25', name:'排列3', front:10, back:10, fpick:3, bpick:0 },
  pl5:  { days:[0,1,2,3,4,5,6], time:'21:25', name:'排列5', front:10, back:10, fpick:5, bpick:0 },
  qxc:  { days:[2,5,0],       time:'21:25', name:'七星彩', front:10, back:10, fpick:7, bpick:0 },
  kl8:  { days:[0,1,2,3,4,5,6], time:'21:30', name:'快乐8', front:80, back:0, fpick:20, bpick:0 }
};

function pad2(n){return n<10?'0'+n:''+n}

function nextDrawDate(lotType, from){
  from = from || new Date();
  const sc = LOT_SCHEDULE[lotType] || LOT_SCHEDULE.ssq;
  const [hh, mm] = sc.time.split(':').map(Number);
  for(let add=0; add<=7; add++){
    const d = new Date(from.getFullYear(), from.getMonth(), from.getDate()+add, hh, mm, 0, 0);
    if(!sc.days.includes(d.getDay())) continue;
    if(add===0 && from >= d) continue;
    return d;
  }
  return new Date(from.getTime()+7*86400000);
}

function toInputValue(d){
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes());
}

function fillNextDrawTime(){
  const lt = document.getElementById('lotType').value;
  const d = nextDrawDate(lt, new Date());
  document.getElementById('dtInput').value = toInputValue(d);
}

document.getElementById('lotType').addEventListener('change', fillNextDrawTime);
fillNextDrawTime();

/* ========== 2. 干支历法基础 ========== */
const TIAN_GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DI_ZHI   = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const SHENG_XIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

const JIE_QI = ['立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑',
                '立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒'];

// 节气近似日期（月/日），用于局数推算
const JIE_QI_DATE = [
  '02/04','02/19','03/06','03/21','04/05','04/20','05/06','05/21','06/06','06/21','07/07','07/23',
  '08/08','08/23','09/08','09/23','10/08','10/23','11/07','11/22','12/07','12/22','01/06','01/20'
];

// 节气五行属性
const JIE_QI_WX = {
  '立春':'木','雨水':'木','惊蛰':'木','春分':'木','清明':'木','谷雨':'木',
  '立夏':'火','小满':'火','芒种':'火','夏至':'火','小暑':'火','大暑':'火',
  '立秋':'金','处暑':'金','白露':'金','秋分':'金','寒露':'金','霜降':'金',
  '立冬':'水','小雪':'水','大雪':'水','冬至':'水','小寒':'水','大寒':'水'
};

// 九宫五行
const GONG_WX = {1:'水',2:'土',3:'木',4:'木',5:'土',6:'金',7:'金',8:'土',9:'火'};

// 洛书数
const LUO_SHU = {1:1,2:8,3:3,4:4,5:9,6:2,7:7,8:6,9:1};

// 先天八卦数（兑2艮7离9乾6巽4震8坤1坎3）
const XIAN_TIAN = {1:6,2:7,3:8,4:9,5:1,6:2,7:3,8:4,9:5};

// 五行数（河图数）
const WU_XING_NUM = {1:[1,6],2:[2,5,8],3:[3,8],4:[3,8],5:[2,5,8],6:[4,9],7:[4,9],8:[2,5,8],9:[7,2]};

// 八门基本落宫（后天八卦）
const BA_MEN = {'休':1,'生':8,'伤':3,'杜':4,'景':9,'死':2,'惊':7,'开':6};

// 九星（天蓬1、天芮2、天冲3、天辅4、天禽5、天心6、天柱7、天任8、天英9）
const JIU_XING = {1:'天蓬',2:'天芮',3:'天冲',4:'天辅',5:'天禽',6:'天心',7:'天柱',8:'天任',9:'天英'};

// 八神（值符、腾蛇、太阴、六合、白虎、玄武、九地、九天）
const BA_SHEN = ['值符','腾蛇','太阴','六合','白虎','玄武','九地','九天'];

// 六甲旬空（地支索引0-11）
const XUN_KONG = {
  '甲子':[10,11], '甲戌':[8,9], '甲申':[6,7],
  '甲午':[4,5], '甲辰':[2,3], '甲寅':[0,1]
};

// 地支→九宫（粗略映射）
const ZHI_GONG = {'子':1,'丑':8,'寅':8,'卯':3,'辰':4,'巳':4,'午':9,'未':2,'申':2,'酉':7,'戌':6,'亥':6};

// 天干→五行
const GAN_WX = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};

// 五行生克
const KE_MAP = {'木':'土','火':'金','土':'水','金':'木','水':'火'};
const SHENG_MAP = {'木':'火','火':'土','土':'金','金':'水','水':'木'};
/* ========== 3. 干支计算 ========== */

// 获取某日的干支（从1984年2月2日甲子日起算）
function dayGanZhi(date){
  const base = new Date(1984, 1, 2); // 1984-02-02 甲子日
  const diff = Math.round((date - base) / 86400000);
  const g = ((diff % 10) + 10) % 10;
  const z = ((diff % 12) + 12) % 12;
  return {gan: TIAN_GAN[g], zhi: DI_ZHI[z], ganIdx: g, zhiIdx: z};
}

// 获取某时的时干支（根据日干推算）
function hourGanZhi(date, dayGanIdx){
  const h = date.getHours() + date.getMinutes()/60;
  const zhiIdx = Math.floor((h + 1) / 2) % 12;
  // 日上起时法：甲己还加甲，乙庚丙作初...
  const jiaZi = [0,2,4,6,8]; // 甲己0,乙庚2,丙辛4,丁壬6,戊癸8
  const start = jiaZi[dayGanIdx % 5];
  const ganIdx = (start + zhiIdx) % 10;
  return {gan: TIAN_GAN[ganIdx], zhi: DI_ZHI[zhiIdx], ganIdx, zhiIdx};
}

// 获取当前节气（近似）
function getJieQi(date){
  const m = date.getMonth() + 1;
  const d = date.getDate();
  for(let i=0; i<24; i++){
    const parts = JIE_QI_DATE[i].split('/');
    const jm = parseInt(parts[0]), jd = parseInt(parts[1]);
    if(m === jm && d >= jd) return JIE_QI[i];
  }
  // 跨年处理：如果月份小于1月的节气，取最后一个
  if(m === 1 && d < 6) return '小寒';
  if(m === 1 && d < 20) return '小寒';
  return '大寒';
}

// 判断阴阳遁（冬至到夏至前阳遁，夏至到冬至前阴遁）
function getYinYang(jieQi){
  const yangStart = JIE_QI.indexOf('冬至');
  const yangEnd = JIE_QI.indexOf('夏至');
  const idx = JIE_QI.indexOf(jieQi);
  if(idx === -1) return '阳';
  // 冬至到夏至前（含冬至不含夏至）
  if(yangStart <= yangEnd){
    if(idx >= yangStart && idx < yangEnd) return '阳';
  } else {
    if(idx >= yangStart || idx < yangEnd) return '阳';
  }
  return '阴';
}

// 获取局数（简化版，按节气三元，上中下元用日干支判断）
function getJuNumber(jieQi, yinYang, dayZhiIdx){
  // 每个节气三元的局数表（阳遁）
  const YANG_JU = {
    '冬至':[1,7,4], '小寒':[2,8,5], '大寒':[3,9,6],
    '立春':[8,5,2], '雨水':[9,6,3], '惊蛰':[1,7,4],
    '春分':[3,9,6], '清明':[4,1,7], '谷雨':[5,2,8],
    '立夏':[4,1,7], '小满':[5,2,8], '芒种':[6,3,9]
  };
  const YIN_JU = {
    '夏至':[9,3,6], '小暑':[8,2,5], '大暑':[7,1,4],
    '立秋':[2,5,8], '处暑':[1,4,7], '白露':[9,3,6],
    '秋分':[7,1,4], '寒露':[6,9,3], '霜降':[5,8,2],
    '立冬':[6,9,3], '小雪':[5,8,2], '大雪':[4,7,1]
  };
  const table = yinYang === '阳' ? YANG_JU : YIN_JU;
  const arr = table[jieQi] || (yinYang === '阳' ? [1,7,4] : [9,3,6]);
  // 上中下元：根据日支确定（子午卯酉上元，寅申巳亥中元，辰戌丑未下元）
  const yuanMap = {0:0,6:0,3:0,9:0, 1:1,7:1,4:1,10:1, 2:2,8:2,5:2,11:2};
  const yuan = yuanMap[dayZhiIdx] !== undefined ? yuanMap[dayZhiIdx] : 0;
  return arr[yuan] || arr[0];
}

/* ========== 4. 奇门起局核心 ========== */

function makeQimenPan(date){
  // 1. 基础信息
  const dayGZ = dayGanZhi(date);
  const hourGZ = hourGanZhi(date, dayGZ.ganIdx);
  const jieQi = getJieQi(date);
  const yinYang = getYinYang(jieQi);
  const juNum = getJuNumber(jieQi, yinYang, dayGZ.zhiIdx);

  // 2. 地盘排布（按局数起戊）
  const diPan = {};
  const ganOrder = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];
  const startGong = yinYang === '阳' ? ((juNum-1)%9)+1 : ((9-(juNum-1))%9)+1;
  for(let i=0; i<9; i++){
    const gong = yinYang === '阳' ? (((startGong-1+i)%9)+1) : (((startGong-1-i+9)%9)+1);
    diPan[ganOrder[i]] = gong;
  }

  // 3. 时干宫、日干宫
  const shiGanGong = diPan[hourGZ.gan] || diPan['戊'];
  const riGanGong = diPan[dayGZ.gan] || diPan['戊'];

  // 4. 值符、值使（按时柱旬首确定）
  const xunShou = getXunShou(hourGZ.ganIdx, hourGZ.zhiIdx);
  const zhiFuGong = diPan[xunShou.gan] || 1;
  const zhiShiGong = diPan[xunShou.gan] || 1; // 简化，实际需飞宫

  // 5. 八门原始落宫
  const baMen = {...BA_MEN};

  // 6. 旬空
  const kongGongs = getKongGongs(hourGZ.ganIdx, hourGZ.zhiIdx);

  // 7. 马星（寅午戌马在申，申子辰马在寅，巳酉丑马在亥，亥卯未马在巳）
  const maXingGongs = getMaXing(dayGZ.zhiIdx);

  // 8. 三奇得使判定
  const sanQiDeShi = checkSanQiDeShi(diPan, hourGZ, dayGZ);

  // 9. 玉女守门判定
  const yuNuGong = checkYuNuShouMen(diPan, hourGZ, baMen);

  // 10. 五不遇时判定
  const wuBuYu = isWuBuYuShi(hourGZ, dayGZ);

  return {
    date, jieQi, yinYang, juNum, dayGZ, hourGZ,
    diPan, shiGanGong, riGanGong, zhiFuGong, zhiShiGong,
    baMen, kongGongs, maXingGongs,
    sanQiDeShi, yuNuGong, wuBuYu
  };
}

// 获取旬首
function getXunShou(ganIdx, zhiIdx){
  const xunTable = [
    {gan:'甲',zhi:'子', ganIdx:0, zhiIdx:0},
    {gan:'甲',zhi:'戌', ganIdx:0, zhiIdx:10},
    {gan:'甲',zhi:'申', ganIdx:0, zhiIdx:8},
    {gan:'甲',zhi:'午', ganIdx:0, zhiIdx:6},
    {gan:'甲',zhi:'辰', ganIdx:0, zhiIdx:4},
    {gan:'甲',zhi:'寅', ganIdx:0, zhiIdx:2}
  ];
  for(const xun of xunTable){
    if(zhiIdx >= xun.zhiIdx && zhiIdx < xun.zhiIdx + 2){
      return xun;
    }
  }
  return xunTable[0];
}

// 获取旬空宫位
function getKongGongs(ganIdx, zhiIdx){
  const xun = getXunShou(ganIdx, zhiIdx);
  const key = xun.gan + xun.zhi;
  const emptyZhi = XUN_KONG[key] || [];
  return emptyZhi.map(z => ZHI_GONG[DI_ZHI[z]] || 1).filter((v,i,a) => a.indexOf(v)===i);
}

// 获取马星宫位
function getMaXing(zhiIdx){
  const map = {
    2:9, 6:9, 10:9,  // 寅午戌→午（9宫）
    0:3, 4:3, 8:3,   // 申子辰→寅（3宫）
    1:6, 5:6, 9:6,   // 巳酉丑→亥（6宫）
    3:1, 7:1, 11:1   // 亥卯未→巳（1宫）
  };
  return [map[zhiIdx] || 1];
}

// 三奇得使：乙丙丁落宫在休生开杜景等吉门
function checkSanQiDeShi(diPan, hourGZ, dayGZ){
  const result = [];
  const qiGongs = {乙:diPan['乙'],丙:diPan['丙'],丁:diPan['丁']};
  const goodMenGongs = [1,8,6,3,4]; // 休生开杜景
  for(const [qi, gong] of Object.entries(qiGongs)){
    if(gong && goodMenGongs.includes(gong)){
      result.push({qi, gong});
    }
  }
  return result;
}

// 玉女守门：丁奇临休门（1宫）或生门（8宫）或开门（6宫）
function checkYuNuShouMen(diPan, hourGZ, baMen){
  const dingGong = diPan['丁'];
  if(!dingGong) return null;
  if([1,8,6].includes(dingGong)) return dingGong;
  return null;
}

// 五不遇时：时干克日干
function isWuBuYuShi(hourGZ, dayGZ){
  const ke = KE_MAP[GAN_WX[hourGZ.gan]];
  return ke === GAN_WX[dayGZ.gan];
}
/* ========== 5. 用神池构建 ========== */

function buildYongShenPool(pan, lotType){
  const sc = LOT_SCHEDULE[lotType] || LOT_SCHEDULE.ssq;
  const frontMax = sc.front, backMax = sc.back;
  const items = [];

  function addItem(name, gong, weight){
    if(!gong || gong < 1 || gong > 9) return;
    const nums = new Set();
    // 洛书数
    nums.add(LUO_SHU[gong]);
    // 先天数
    nums.add(XIAN_TIAN[gong]);
    // 五行数
    for(const n of (WU_XING_NUM[gong] || [])) nums.add(n);
    // 加上宫本身
    nums.add(gong);
    const arr = [...nums].filter(n => n > 0 && n <= 99);
    items.push({name, gong, nums: arr, weight});
  }

  // 基础用神
  addItem('时干', pan.shiGanGong, 1.2);
  addItem('日干', pan.riGanGong, 1.0);
  addItem('值符', pan.zhiFuGong, 1.5);
  addItem('值使', pan.zhiShiGong, 1.2);
  addItem('生门', pan.baMen['生'] || 8, 1.1);
  addItem('开门', pan.baMen['开'] || 6, 1.0);
  addItem('休门', pan.baMen['休'] || 1, 0.9);
  addItem('景门', pan.baMen['景'] || 9, 0.8);
  addItem('天心', 6, 0.7);
  addItem('天任', 8, 0.7);
  addItem('天辅', 4, 0.6);

  // 三奇得使用神
  for(const sq of pan.sanQiDeShi){
    addItem('三奇得使-' + sq.qi, sq.gong, 1.3);
  }

  // 玉女守门
  if(pan.yuNuGong){
    addItem('玉女守门', pan.yuNuGong, 1.4);
  }

  // 马星
  for(const mg of pan.maXingGongs){
    addItem('马星', mg, 0.5);
  }

  // 构建前后区池
  const frontPool = new Set();
  const backPool = new Set();
  for(const it of items){
    for(const n of it.nums){
      if(n <= frontMax) frontPool.add(n);
      if(backMax > 0){
        const bn = ((n + 3) % backMax) || backMax;
        backPool.add(bn);
      }
    }
  }

  return {
    items,
    frontPool: [...frontPool].sort((a,b)=>a-b),
    backPool: [...backPool].sort((a,b)=>a-b)
  };
}

/* ========== 6. 格局加权 ========== */

function applyGeJuWeights(pan, frontW, backW, frontMax, backMax, flags){
  const logs = [];

  // 暗干：时干宫/日干宫/值符宫的号码额外加权
  if(flags.anGan){
    const anGanGongs = [pan.shiGanGong, pan.riGanGong, pan.zhiFuGong];
    for(const g of anGanGongs){
      if(!g) continue;
      const nums = [LUO_SHU[g], XIAN_TIAN[g], g, ...(WU_XING_NUM[g]||[])];
      for(const n of nums){
        if(n <= frontMax) frontW[n] = (frontW[n]||0) + 0.15;
        if(backMax > 0){
          const bn = ((n+3) % backMax) || backMax;
          backW[bn] = (backW[bn]||0) + 0.09;
        }
      }
    }
    logs.push('暗干加权');
  }

  // 三奇得使
  if(flags.sanQiDeShi && pan.sanQiDeShi.length){
    for(const sq of pan.sanQiDeShi){
      const nums = [LUO_SHU[sq.gong], XIAN_TIAN[sq.gong], sq.gong, ...(WU_XING_NUM[sq.gong]||[])];
      for(const n of nums){
        if(n <= frontMax) frontW[n] = (frontW[n]||0) + 0.3;
        if(backMax > 0){
          const bn = ((n+3) % backMax) || backMax;
          backW[bn] = (backW[bn]||0) + 0.15;
        }
      }
      logs.push(sq.qi + '得使宫' + sq.gong);
    }
  }

  // 玉女守门
  if(flags.yuNuShouMen && pan.yuNuGong){
    const nums = [LUO_SHU[pan.yuNuGong], XIAN_TIAN[pan.yuNuGong], pan.yuNuGong, ...(WU_XING_NUM[pan.yuNuGong]||[])];
    for(const n of nums){
      if(n <= frontMax) frontW[n] = (frontW[n]||0) + 0.5;
      if(backMax > 0){
        const bn = ((n+3) % backMax) || backMax;
        backW[bn] = (backW[bn]||0) + 0.4;
      }
    }
    logs.push('玉女守门宫' + pan.yuNuGong);
  }

  // 五不遇时
  if(flags.wuBuYuShi && pan.wuBuYu){
    for(let i=1; i<=frontMax; i++) frontW[i] = (frontW[i]||0) * 0.5;
    for(let i=1; i<=backMax; i++) backW[i] = (backW[i]||0) * 0.5;
    logs.push('五不遇时降权50%');
  }

  // 空亡降权
  if(flags.kongType === 'weak' && pan.kongGongs.length){
    for(const g of pan.kongGongs){
      const nums = [LUO_SHU[g], XIAN_TIAN[g], g, ...(WU_XING_NUM[g]||[])];
      for(const n of nums){
        if(n <= frontMax) frontW[n] = (frontW[n]||0) * 0.3;
        if(backMax > 0){
          const bn = ((n+3) % backMax) || backMax;
          backW[bn] = (backW[bn]||0) * 0.3;
        }
      }
    }
    logs.push('空亡降权');
  }

  // 旺相
  if(flags.wang){
    const seasonWx = JIE_QI_WX[pan.jieQi] || '土';
    for(let g=1; g<=9; g++){
      const gwx = GONG_WX[g] || '土';
      let status = '平';
      if(SHENG_MAP[seasonWx] === gwx) status = '旺';
      else if(seasonWx === gwx) status = '相';
      else if(KE_MAP[seasonWx] === gwx) status = '休';
      else if(SHENG_MAP[gwx] === seasonWx) status = '囚';
      else if(KE_MAP[gwx] === seasonWx) status = '死';

      const k = {旺:1.6, 相:1.3, 休:0.9, 囚:0.6, 死:0.4, 平:1}[status] || 1;
      const nums = [LUO_SHU[g], XIAN_TIAN[g], g, ...(WU_XING_NUM[g]||[])];
      for(const n of nums){
        if(n <= frontMax) frontW[n] = (frontW[n]||1) * k;
        if(backMax > 0){
          const bn = ((n+3) % backMax) || backMax;
          backW[bn] = (backW[bn]||1) * k;
        }
      }
    }
    logs.push('旺相(季节' + seasonWx + ')');
  }

  // 马星
  if(flags.maXing && pan.maXingGongs.length){
    for(const g of pan.maXingGongs){
      const nums = [LUO_SHU[g], XIAN_TIAN[g], g, ...(WU_XING_NUM[g]||[])];
      for(const n of nums){
        if(n <= frontMax) frontW[n] = (frontW[n]||0) + 0.2;
        if(backMax > 0){
          const bn = ((n+3) % backMax) || backMax;
          backW[bn] = (backW[bn]||0) + 0.1;
        }
      }
    }
    logs.push('马星加权');
  }

  return logs;
}

/* ========== 7. 加权采样 ========== */

function weightedSample(weights, count, max){
  const candidates = [];
  for(let i=1; i<=max; i++) candidates.push(i);
  const ws = candidates.map(i => Math.max(0.0001, weights[i] || 1));
  const total = ws.reduce((a,b)=>a+b, 0);
  const result = new Set();
  let attempts = 0;
  while(result.size < count && attempts < count * 50){
    attempts++;
    let r = Math.random() * total;
    let acc = 0;
    for(let i=0; i<candidates.length; i++){
      acc += ws[i];
      if(r <= acc){
        result.add(candidates[i]);
        break;
      }
    }
  }
  return [...result].sort((a,b)=>a-b);
}

  ]);

  for(const g of keepGongs){

    const nums = [LUO_SHU[g], XIAN_TIAN[g], g, ...(WU_XING_NUM[g]||[])];
    for(const n of nums){
      if(n <= frontMax) frontKeep.add(n);
      if(backMax > 0){
        const bn = ((n+3) % backMax) || backMax;
        backKeep.add(bn);
      }
    }
  }

  // 交集
  const frontFiltered = cands.front.filter(n => frontKeep.has(n));
  const backFiltered = cands.back.filter(n => backKeep.has(n));

  return {

    frontKeep: frontFiltered.length > 0 ? frontFiltered : cands.front.slice(0, 20),
    backKeep: backFiltered.length > 0 ? backFiltered : cands.back.slice(0, 10)

function generateTickets(wp, lotType, maxT){
  const sc = LOT_SCHEDULE[lotType] || LOT_SCHEDULE.ssq;
  const fk = sc.fpick, bk = sc.bpick;
  const frontMax = sc.front, backMax = sc.back;
  const tickets = [];
  const seen = new Set();
  let attempts = 0;

  while(tickets.length < maxT && attempts < maxT * 100){
    attempts++;
    const front = weightedSample(wp.frontW, fk, frontMax);
    const back = bk > 0 ? weightedSample(wp.backW, bk, backMax) : [];
    const key = front.join(',') + '|' + back.join(',');
    if(seen.has(key)) continue;
    seen.add(key);
    tickets.push({front, back});
  }

  return tickets;
}

/* ========== 8. 九宫围号缩水（完整版） ========== */

function shrinkByGong(cands, pan, frontMax, backMax){
  // 收集所有有效宫位
  const keepGongs = new Set();

  // 基础用神宫
  if(pan.shiGanGong) keepGongs.add(pan.shiGanGong);
  if(pan.riGanGong) keepGongs.add(pan.riGanGong);
  if(pan.zhiFuGong) keepGongs.add(pan.zhiFuGong);
  if(pan.zhiShiGong) keepGongs.add(pan.zhiShiGong);

  // 八门吉宫
  if(pan.baMen) {
    if(pan.baMen['生']) keepGongs.add(pan.baMen['生']);
    if(pan.baMen['开']) keepGongs.add(pan.baMen['开']);
    if(pan.baMen['休']) keepGongs.add(pan.baMen['休']);
    if(pan.baMen['景']) keepGongs.add(pan.baMen['景']);
  }

  // 三奇得使
  if(pan.sanQiDeShi && pan.sanQiDeShi.length){
    for(const sq of pan.sanQiDeShi){
      if(sq.gong) keepGongs.add(sq.gong);
    }
  }

  // 玉女守门
  if(pan.yuNuGong) keepGongs.add(pan.yuNuGong);

  // 马星
  if(pan.maXingGongs && pan.maXingGongs.length){
    for(const g of pan.maXingGongs) keepGongs.add(g);
  }

  // 天禽中宫（5宫）也加入
  keepGongs.add(5);

  // 过滤无效宫位
  const validGongs = [...keepGongs].filter(g => g >= 1 && g <= 9);

  // 构建每个宫对应的号码集合
  const frontKeepSet = new Set();
  const backKeepSet = new Set();

  for(const g of validGongs){
    // 洛书数
    frontKeepSet.add(LUO_SHU[g]);
    // 先天数
    frontKeepSet.add(XIAN_TIAN[g]);
    // 宫位数
    frontKeepSet.add(g);
    // 五行数
    for(const n of (WU_XING_NUM[g] || [])) frontKeepSet.add(n);

    // 后区映射（前区号码+3取模）
    if(backMax > 0){
      const backNums = [LUO_SHU[g], XIAN_TIAN[g], g, ...(WU_XING_NUM[g] || [])];
      for(const n of backNums){
        const bn = ((n + 3) % backMax) || backMax;
        backKeepSet.add(bn);
      }
    }
  }

  // 限制范围
  const frontValid = new Set();
  const backValid = new Set();
  for(const n of frontKeepSet){
    if(n >= 1 && n <= frontMax) frontValid.add(n);
  }
  for(const n of backKeepSet){
    if(n >= 1 && n <= backMax) backValid.add(n);
  }

  // 取交集
  const frontFiltered = cands.front.filter(n => frontValid.has(n));
  const backFiltered = cands.back.filter(n => backValid.has(n));

  // 如果缩水后为空，保留采样中权重最高的前20个
  const finalFront = frontFiltered.length > 0 ? frontFiltered : cands.front.slice(0, 20);
  const finalBack = backFiltered.length > 0 ? backFiltered : cands.back.slice(0, 10);

  return {
    keepGongs: validGongs.sort((a,b)=>a-b),
    frontKeep: finalFront,
    backKeep: finalBack
  };
}

/* ========== 9. 注单生成（完整加权随机） ========== */

function generateTickets(wp, lotType, maxT){
  const sc = LOT_SCHEDULE[lotType] || LOT_SCHEDULE.ssq;
  const fk = sc.fpick;
  const bk = sc.bpick;
  const frontMax = sc.front;
  const backMax = sc.back;

  const tickets = [];
  const seen = new Set();
  let attempts = 0;
  const maxAttempts = maxT * 150; // 防止死循环

  while(tickets.length < maxT && attempts < maxAttempts){
    attempts++;

    // 前区加权采样
    const front = weightedSample(wp.frontW, fk, frontMax);
    if(front.length < fk) continue;

    // 后区加权采样
    let back = [];
    if(bk > 0){
      back = weightedSample(wp.backW, bk, backMax);
      if(back.length < bk) continue;
    }

    // 去重
    const key = front.join(',') + '|' + back.join(',');
    if(seen.has(key)) continue;
    seen.add(key);

    tickets.push({
      front: front,
      back: back
    });
  }

  return tickets;
}

/* ========== 10. 权重归一化 ========== */

function normalizeWeights(weights, max){
  let sum = 0;
  for(let i=1; i<=max; i++) sum += weights[i] || 0;
  if(sum <= 0){
    for(let i=1; i<=max; i++) weights[i] = 1/max;
    return;
  }
  for(let i=1; i<=max; i++){
    weights[i] = (weights[i] || 0) / sum;
  }
}

  shrinkText += `缩水后区 (${shrunk.backKeep.length}个): ${shrunk.backKeep.join(',')}\n\n`;
  shrinkText += `--- 生成注单 (共${tickets.length}注，显示前50注) ---\n`;
  for(let i=0; i<Math.min(50, tickets.length); i++){
    const t = tickets[i];
    shrinkText += `${i+1}. 前[${t.front.join(',')}]`;
    if(t.back.length > 0) shrinkText += ` 后[${t.back.join(',')}]`;
    shrinkText += '\n';
  }
  if(tickets.length > 50){
    shrinkText += `... 剩余${tickets.length - 50}注省略\n`;
  }

  document.getElementById('shrinkOut').textContent = shrinkText;
}

// ========== 13. 辅助/兜底函数与调试出口 ==========

function backupSample(frontW, backW, sc, maxT) {
  const out = [];
  const seen = new Set();
  let safety = 0;
  while (out.length < maxT && safety < maxT * 20) {
    safety++;
    const front = weightedSample(frontW, sc.fpick, sc.front)
      .sort((a, b) => a - b);
    let back = [];
    if (sc.bpick > 0) {
      back = weightedSample(backW, sc.bpick, sc.back)
        .sort((a, b) => a - b);
    }
    const key = front.join(',') + '|' + back.join(',');
    if (!seen.has(key)) {
      seen.add(key);
      out.push({ front, back });
    }
  }
  return out;
}

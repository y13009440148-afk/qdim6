function pad2(n) {

}
function pad3(n) {
  if (n < 10) return "00" + n;
  if (n < 100) return "0" + n;
  return "" + n;
}
function arraySum(arr) {
  var s = 0;
  for (var i = 0; i < arr.length; i++) s += arr[i];
  return s;
}
function arrayMax(arr) {
  var m = arr[0];
  for (var i = 1; i < arr.length; i++) if (arr[i] > m) m = arr[i];
  return m;
}
function arrayMin(arr) {
  var m = arr[0];
  for (var i = 1; i < arr.length; i++) if (arr[i] < m) m = arr[i];

}
function arraySpan(arr) {

function arrayAvg(arr) {

function arrayMedian(arr) {

function arrayMode(arr) {

  for (var i = 0; i < arr.length; i++) {

    if (m[arr[i]] > mx) { mx = m[arr[i]]; mv = arr[i]; }

}
function arrayUnique(arr) {
  var seen = {}, out = [];
  for (var i = 0; i < arr.length; i++) {
    if (!seen[arr[i]]) { seen[arr[i]] = 1; out.push(arr[i]); }

}
function arrayIntersect(a, b) {
  var s = {}, r = [];
  for (var i = 0; i < a.length; i++) s[a[i]] = 1;
  for (var i = 0; i < b.length; i++) if (s[b[i]]) r.push(b[i]);
  return r;
}
function arrayDiff(a, b) {
  var s = {}, r = [];
  for (var i = 0; i < b.length; i++) s[b[i]] = 1;
  for (var i = 0; i < a.length; i++) if (!s[a[i]]) r.push(a[i]);
  return r;
}
function arrayUnion(a, b) {
  var s = {}, r = [];
  for (var i = 0; i < a.length; i++) { if (!s[a[i]]) { s[a[i]] = 1; r.push(a[i]); } }
  for (var i = 0; i < b.length; i++) { if (!s[b[i]]) { s[b[i]] = 1; r.push(b[i]); } }
  return r;
}
function arrayChunk(arr, size) {
  var result = [];
  for (var i = 0; i < arr.length; i += size) result.push(arr.slice(i, i + size));
  return result;
}
function arrayFlatten(arr) {
  var result = [];
  for (var i = 0; i < arr.length; i++) {
    if (Array.isArray(arr[i])) {
      for (var j = 0; j < arr[i].length; j++) result.push(arr[i][j]);
    } else {
      result.push(arr[i]);
    }
  }
  return result;
}
function arrayRotateLeft(arr, n) {
  var len = arr.length;
  n = n % len;
  return arr.slice(n).concat(arr.slice(0, n));
}
function arrayRotateRight(arr, n) {
  var len = arr.length;
  n = n % len;
  return arr.slice(len - n).concat(arr.slice(0, len - n));
}
function arrayShuffle(arr) {
  var result = arr.slice();
  for (var i = result.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = result[i];
    result[i] = result[j];

function arrayWeightedSample(items, weights, n) {
  var total = 0;
  for (var i = 0; i < weights.length; i++) total += weights[i];
  var result = [];
  var used = {};
  for (var k = 0; k < n; k++) {
    var r = Math.random() * total;
    var cum = 0;
    for (var i = 0; i < items.length; i++) {
      if (used[i]) continue;
      cum += weights[i];
      if (r <= cum) {
        result.push(items[i]);
        used[i] = 1;
        total -= weights[i];

      }

  }

}

  var sorted = out.sort(function(a, b) { return a - b; });

function expandGongToLotDomain(gongs, lotType) {
  var cfg = LOT_CFG[lotType];
  var set = {}, out = [];
  for (var i = 0; i < gongs.length; i++) {
    var g = gongs[i];
    if (g >= cfg.fMin && g <= cfg.fMax) set[g] = 1;
    var tail = g % 10;
    for (var n = cfg.fMin; n <= cfg.fMax; n++) { if (n % 10 === tail) set[n] = 1; }
    for (var k = 1; k <= 4; k++) {
      var up = g + k * 9;
      var down = g - k * 9;
      if (up >= cfg.fMin && up <= cfg.fMax) set[up] = 1;
      if (down >= cfg.fMin && down <= cfg.fMax) set[down] = 1;
    }
    var gongDz1 = DI_ZHI[((g - 1) * 2) % 12];
    var gongDz2 = DI_ZHI[((g - 1) * 2 + 1) % 12];
    var numFromDz1 = DIZHI_TO_IDX[gongDz1];
    var numFromDz2 = DIZHI_TO_IDX[gongDz2];
    if (numFromDz1 >= cfg.fMin && numFromDz1 <= cfg.fMax) set[numFromDz1] = 1;
    if (numFromDz2 >= cfg.fMin && numFromDz2 <= cfg.fMax) set[numFromDz2] = 1;
    var fiveElementCycle = [g, g + 5, g + 10, g + 15, g + 20, g + 25, g + 30];
    for (var fe = 0; fe < fiveElementCycle.length; fe++) {
      var val = fiveElementCycle[fe];
      if (val >= cfg.fMin && val <= cfg.fMax) set[val] = 1;
    }
    var mirrorSet = [g, 10 - g, 10 + g, 20 - g, 20 + g, 30 - g, 30 + g];
    for (var mi = 0; mi < mirrorSet.length; mi++) {
      var mv = mirrorSet[mi];
      if (mv >= cfg.fMin && mv <= cfg.fMax) set[mv] = 1;
    }
  }
  for (var n = cfg.fMin; n <= cfg.fMax; n++) { if (set[n]) out.push(n); }
  var sorted = out.sort(function(a, b) { return a - b; });
  log("初池扩展后共" + sorted.length + "个号码：" + sorted.join(","));
  return sorted;
}

/* ===================================================================

 * =================================================================== */
function zhangWeiMingKill(front, lastFront) {
  if (!lastFront) return true;
  var repeatCnt = countRepeats(front, lastFront);
  if (repeatCnt > 1) return false;
  var neighborCnt = countNeighbors(front, lastFront);
  if (neighborCnt > 2) return false;
  var tm = tailMap(front);
  var maxTail = 0;
  for (var k in tm) if (tm[k] > maxTail) maxTail = tm[k];
  if (maxTail > 2) return false;
  var consecutivePairs = countConsecutivePairs(front);
  if (consecutivePairs > 1) return false;
  var consecutiveTriples = countConsecutiveTriples(front);
  if (consecutiveTriples > 0) return false;
  var oe = oddEvenCount(front);
  if (oe[0] < 1 || oe[1] < 1) return false;
  var bs = bigSmallCount(front, 17);
  if (bs[0] < 1 || bs[1] < 1) return false;
  return true;
}

/* ===================================================================

 * =================================================================== */
function chuTianYiScore(front, lotType, lastFront) {
  var score = 50;
  var sumVal = arraySum(front);
  var cfg = LOT_CFG[lotType];
  if (sumVal >= cfg.idealSum[0] && sumVal <= cfg.idealSum[1]) score += 15;
  else if (sumVal >= cfg.idealSum[0] - 10 && sumVal <= cfg.idealSum[1] + 10) score += 8;
  else score -= 5;
  var spanVal = arraySpan(front);
  if (spanVal >= cfg.idealSpan[0] && spanVal <= cfg.idealSpan[1]) score += 12;
  else if (spanVal >= cfg.idealSpan[0] - 5 && spanVal <= cfg.idealSpan[1] + 5) score += 6;
  else score -= 4;
  var acVal = calcAC(front);
  if (acVal >= cfg.idealAC[0] && acVal <= cfg.idealAC[1]) score += 12;
  else if (acVal >= cfg.idealAC[0] - 1 && acVal <= cfg.idealAC[1] + 1) score += 6;
  else score -= 4;
  var bs = bigSmallCount(front, cfg.bigLine);
  var bsRatio = bs[0] / Math.max(1, bs[1]);
  if (bsRatio >= 0.5 && bsRatio <= 2.0) score += 8;
  else score -= 3;
  var oe = oddEvenCount(front);
  var oeRatio = oe[0] / Math.max(1, oe[1]);
  if (oeRatio >= 0.4 && oeRatio <= 2.5) score += 8;
  else score -= 3;
  if (lastFront) {
    var sameTailCnt = countSameTailWithLast(front, lastFront);
    if (sameTailCnt <= 1) score += 6;
    else if (sameTailCnt === 2) score += 2;
    else score -= 4;
  }
  var zd = zoneDistribution(front, cfg.zoneSplit);
  if (zd[0] >= 1 && zd[1] >= 1 && zd[2] >= 1) score += 10;
  else if (zd[0] >= 1 && zd[1] >= 1) score += 5;
  else if (zd[1] >= 1 && zd[2] >= 1) score += 5;
  else if (zd[0] >= 1 && zd[2] >= 1) score += 3;
  else score -= 3;
  var primeCnt = primeCount(front);
  if (primeCnt >= 1 && primeCnt <= 3) score += 5;
  else if (primeCnt > 3) score -= 2;
  var compositeCnt = compositeCount(front);
  if (compositeCnt >= 2 && compositeCnt <= 5) score += 3;
  var r012 = road012(front);
  if (r012[0] >= 1 && r012[1] >= 1 && r012[2] >= 1) score += 5;
  var r0369 = road0369(front);
  if (r0369[0] >= 1 && r0369[1] >= 1) score += 3;
  var sd = standardDeviation(front);
  if (sd >= 5 && sd <= 15) score += 4;
  var avg = arrayAvg(front);
  var mid = arrayMedian(front);
  if (Math.abs(avg - mid) <= 5) score += 3;
  var modeVal = arrayMode(front);
  if (modeVal !== null && tailCount(front, tailNum(modeVal)) <= 2) score += 2;
  var iqr = interquartileRange(front);
  if (iqr >= 5 && iqr <= 20) score += 3;
  var sumDigitsVal = sumDigits(arraySum(front));
  if (sumDigitsVal >= 5 && sumDigitsVal <= 20) score += 3;
  var dr = digitRoot(arraySum(front));
  if (dr >= 3 && dr <= 9) score += 2;
  return score;
}

/* ===================================================================
 * 模块11：后区生成系统（约80行）
 * =================================================================== */
function generateBackNumbers(lotType, lastBack) {
  var cfg = LOT_CFG[lotType];
  var pool = [];
  for (var i = cfg.bMin; i <= cfg.bMax; i++) pool.push(i);
  var filtered = [];
  for (var i = 0; i < pool.length; i++) {
    var valid = true;
    if (lastBack) {
      for (var j = 0; j < lastBack.length; j++) {
        if (pool[i] % 10 === lastBack[j] % 10) { valid = false; break; }
      }
    }
    if (valid) filtered.push(pool[i]);
  }
  if (filtered.length < cfg.bPick) filtered = pool.slice();
  var shuffled = arrayShuffle(filtered);
  var selected = shuffled.slice(0, cfg.bPick).sort(function(a, b) { return a - b; });
  return selected;
}

/* ===================================================================
 * 模块12：主选号引擎 runLottery（约120行）
 * =================================================================== */
function runLottery(lotType, noteCount) {
  if (noteCount < 3) noteCount = 3;
  if (noteCount > 5) noteCount = 5;
  var cfg = LOT_CFG[lotType];
  var drawTime = getCurrentDrawTime(lotType);
  var pan = createQiMenPan(drawTime);
  currentPan = pan;
  var sourceGongs = getQiMenSourceGongs(pan);
  var candidatePool = expandGongToLotDomain(sourceGongs, lotType);
  if (candidatePool.length < cfg.fPick) {
    document.getElementById("mainOutput").innerHTML =
      "<span class='hl-red'>⚠️ 初池号码不足" + cfg.fPick + "个，无法选号</span>";
    return;
  }
  var lastFront = null, lastBack = null;
  if (lotType === 'ssq') { lastFront = lastSSQFront; lastBack = lastSSQBack; }
  else { lastFront = lastDLTFront; lastBack = lastDLTBack; }
  var candidates = [];
  var maxAttempts = lotType === 'ssq' ? 8000 : 5000;
  var attempts = 0;
  while (candidates.length < noteCount * 30 && attempts < maxAttempts) {
    attempts++;
    var shuffled = arrayShuffle(candidatePool);
    var selected = shuffled.slice(0, cfg.fPick).sort(function(a, b) { return a - b; });
    var key = selected.join(",");
    var dup = false;
    for (var i = 0; i < candidates.length; i++) {
      if (candidates[i].key === key) { dup = true; break; }
    }
    if (dup) continue;
    if (!zhangWeiMingKill(selected, lastFront)) continue;
    var score = chuTianYiScore(selected, lotType, lastFront);
    candidates.push({nums: selected, key: key, score: score});
  }
  log("共生成" + candidates.length + "个候选组合");
  candidates.sort(function(a, b) { return b.score - a.score; });
  var bestCandidates = candidates.slice(0, noteCount);
  var results = [];
  for (var i = 0; i < bestCandidates.length; i++) {
    var backNums = generateBackNumbers(lotType, lastBack);
    results.push({
      front: bestCandidates[i].nums,
      back: backNums,
      score: bestCandidates[i].score
    });
  }
  renderResults(lotType, results, pan, drawTime);
  renderGongGrid(pan);
  updateStatBar(pan);
  log("===== 选号完成 =====");
}

    " | 值使宫：" + pan.zhiShiGong + "(" + pan.zhiShiMen + ")" +
    " | 三奇落宫：" + (pan.qiGongs.length > 0 ? pan.qiGongs.join(",") : "无") +
    "</div>\n";
  html += "<div class='info-line'>初池源宫：" + getQiMenSourceGongs(pan).join(",") + "</div>\n";
  html += "<br>\n";
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var frontStr = r.front.join(" ");
    var backStr = r.back.join(" ");
    var sumVal = arraySum(r.front);
    var spanVal = arraySpan(r.front);
    var acVal = calcAC(r.front);
    var oe = oddEvenCount(r.front);
    var bs = bigSmallCount(r.front, cfg.bigLine);
    html += "<div style='margin-bottom:10px;padding:8px 10px;background:#0d1325;border-radius:6px;border-left:3px solid #f5c542;'>";
    html += "<strong style='color:#f5c542;font-size:15px;'>第" + (i + 1) + "注</strong>";
    html += " <span class='hl-green'>前区：</span><strong>" + frontStr + "</strong>";
    html += " <span class='hl-blue'>后区：</span><strong>" + backStr + "</strong>";
    html += " <span class='hl-gray'>评分：" + r.score + "</span>";
    html += "<br><span class='hl-gray' style='font-size:11px;'>和值" + sumVal +
      " | 跨度" + spanVal +
      " | AC" + acVal +
      " | 奇偶" + oe[0] + ":" + oe[1] +
      " | 大小" + bs[0] + ":" + bs[1] +
      "</span>";
    html += "</div>\n";
  }
  document.getElementById("mainOutput").innerHTML = html;
}
function renderGongGrid(pan) {
  var container = document.getElementById("gongContainer");
  var html = "";
  for (var i = 0; i < pan.gongInfo.length; i++) {
    var c = pan.gongInfo[i];
    var tagHtml = "";
    for (var t = 0; t < c.tags.length; t++) {
      var tagClass = "";
      if (c.tags[t] === "值符") tagClass = "tag-zf";
      else if (c.tags[t] === "值使") tagClass = "tag-zf";
      else if (c.tags[t] === "三奇") tagClass = "tag-qi";
      else if (c.tags[t] === "空") tagClass = "tag-kong";
      else if (c.tags[t] === "马") tagClass = "tag-ma";
      else if (c.tags[t] === "入墓") tagClass = "tag-mu";
      else if (c.tags[t] === "击刑") tagClass = "tag-ji";
      else if (c.tags[t] === "门迫") tagClass = "tag-po";
      else tagClass = "tag-zf";
      tagHtml += "<span class='g-tag " + tagClass + "'>" + c.tags[t] + "</span>";
    }
    html += "<div class='gong-cell'>";
    html += "<span class='g-num'>" + c.gong + "</span>";
    html += "<div class='g-main'>" + c.diYi + " " + c.tianYi + "</div>";
    html += "<div class='g-sub'>" + c.xing + " | " + c.men + " | " + c.shen + "</div>";
    html += "<div class='g-sub'>" + tagHtml + "</div>";

  container.innerHTML = html;
}

function applyManualLastData() {

  var frontArr = frontInput.split(/[,，\s]+/).map(function(x) { return parseInt(x, 10); });

  }
  if (frontArr.length === 6) {
    lastSSQFront = frontArr;
    if (backInput) {
      var backArr = backInput.split(/[,，\s]+/).map(function(x) { return parseInt(x, 10); });
      for (var i = 0; i < backArr.length; i++) {
        if (isNaN(backArr[i]) || backArr[i] < 1) { alert("后区号码格式错误"); return; }
      }
      lastSSQBack = backArr;
    }

      "<span class='hl-green'>✅ 已注入大乐透上期数据：前区 " + frontArr.join(",") +
      (lastDLTBack ? " 后区 " + lastDLTBack.join(",") : "") + "</span>";

function checkKongWang(hourGz){
  var idx=SIXTY_JIAZI.indexOf(hourGz);
  var xunStart=Math.floor(idx/10)*10;
  var xunEnd=xunStart+9;
  var kw=[];
  for(var i=0;i<60;i++){

// ======================================================================
function getInitPool(pan){
  var pool=[];
  // 值符宫、值使门宫、开门宫、生门宫、用神宫（暂定离9宫）
  var keyGongs=[pan.zhiFuGong];
  for(var g=1;g<=9;g++){
    if(pan.menPan[g]=="开") keyGongs.push(g);
    if(pan.menPan[g]=="生") keyGongs.push(g);
    if(pan.menPan[g]==pan.zhiFu) keyGongs.push(g);
  }
  keyGongs.push(9); // 离宫为用神
  for(var i=0;i<keyGongs.length;i++){
    var g=keyGongs[i];
    if(g>=1&&g<=9){
      // 宫位映射到号码段
      var base=(g-1)*3+1;
      for(var n=0;n<3;n++){
        var num=base+n;
        if(num>=1&&num<=33) pool.push(num);
      }
    }
  }
  return uniqueArray(pool);
}

  // 规则1: 重号最多1个
  var chongHaoCount=0;
  for(var i=0;i<pool.length;i++){
    if(inArray(pool[i],prevReds)){
      chongHaoCount++;
      if(chongHaoCount>1){
        pool.splice(i,1);
        i--;
      }
    }
  }
  // 规则2: 邻号最多2个
  var linHaoCount=0;
  for(var i=0;i<pool.length;i++){
    var isLin=false;
    for(var j=0;j<prevReds.length;j++){
      if(Math.abs(pool[i]-prevReds[j])==1){
        isLin=true;
        break;
      }
    }
    if(isLin){
      linHaoCount++;
      if(linHaoCount>2){
        pool.splice(i,1);
        i--;
      }
    }
  }
  // 规则3: 同尾号最多2个
  var weiCount={};
  for(var i=0;i<pool.length;i++){
    var w=pool[i]%10;
    if(!weiCount[w]) weiCount[w]=0;
    weiCount[w]++;
    if(weiCount[w]>2){
      pool.splice(i,1);
      i--;
    }
  }
  // 规则4: 连号最多1组
  var sorted=pool.slice().sort(function(a,b){return a-b;});
  var lianGroup=0;
  for(var i=0;i<sorted.length-1;i++){
    if(sorted[i+1]-sorted[i]==1){
      lianGroup++;
      if(lianGroup>1){
        pool.splice(pool.indexOf(sorted[i+1]),1);
        sorted=pool.slice().sort(function(a,b){return a-b;});
        i--;
      }
    }
  }
  // 规则5: 区间比平衡（1-11小,12-22中,23-33大）
  var small=pool.filter(function(n){return n>=1&&n<=11;}).length;
  var mid=pool.filter(function(n){return n>=12&&n<=22;}).length;
  var big=pool.filter(function(n){return n>=23&&n<=33;}).length;
  while(small>3||mid>3||big>3){
    if(small>3){
      var idx=pool.findIndex(function(n){return n>=1&&n<=11;});
      if(idx>-1){pool.splice(idx,1);small--;}
    }
    if(mid>3){
      var idx=pool.findIndex(function(n){return n>=12&&n<=22;});
      if(idx>-1){pool.splice(idx,1);mid--;}
    }
    if(big>3){
      var idx=pool.findIndex(function(n){return n>=23&&n<=33;});
      if(idx>-1){pool.splice(idx,1);big--;}
    }
  }
  // 规则6: 奇偶比3:3或4:2或2:4
  var odd=pool.filter(function(n){return n%2==1;}).length;
  var even=pool.filter(function(n){return n%2==0;}).length;
  var total=odd+even;
  if(total>=6){
    var targetOdd=Math.round(total/2);
    if(targetOdd<2) targetOdd=2;
    if(targetOdd>4) targetOdd=4;
    while(odd>targetOdd){
      var idx=pool.findIndex(function(n){return n%2==1;});
      if(idx>-1){pool.splice(idx,1);odd--;total--;}
    }
    while(even>(total-targetOdd)){
      var idx=pool.findIndex(function(n){return n%2==0;});
      if(idx>-1){pool.splice(idx,1);even--;total--;}
    }
  }
  return uniqueArray(pool);
}

// ======================================================================
// 22. 褚天一《擒号秘技》
// ======================================================================
function chuTianYiSelect(pool,prevReds,prevBlues,lotType){
  var plans=[];
  var redCount=(lotType=="ssq"?6:5);
  var blueCount=(lotType=="ssq"?1:2);
  var maxRed=(lotType=="ssq"?33:35);
  var maxBlue=(lotType=="ssq"?16:12);
  
  // 尝试生成多组组合
  for(var attempt=0;attempt<100;attempt++){
    var selected=[];
    var tempPool=pool.slice();
    // 随机选红球
    for(var r=0;r<redCount;r++){
      if(tempPool.length==0) break;
      var idx=Math.floor(Math.random()*tempPool.length);
      selected.push(tempPool[idx]);
      tempPool.splice(idx,1);
    }
    if(selected.length<redCount) continue;
    selected.sort(function(a,b){return a-b;});
    
    // 形态校验
    // 大小比3:3/4:2/2:4
    var big=selected.filter(function(n){return n>=17;}).length;
    var small=selected.filter(function(n){return n<17;}).length;
    if(!(big==3&&small==3||big==4&&small==2||big==2&&small==4)) continue;
    
    // 和值85-125
    var he=sumArr(selected);
    if(he<85||he>125) continue;
    
    // AC值5-10
    var diffs=[];
    for(var i=0;i<selected.length;i++){
      for(var j=i+1;j<selected.length;j++){
        diffs.push(Math.abs(selected[i]-selected[j]));
      }
    }
    var ac=uniqueArray(diffs).length-redCount+1;
    if(ac<5||ac>10) continue;
    
    // 重号1-2个
    var chong=0;
    for(var i=0;i<selected.length;i++){
      if(inArray(selected[i],prevReds)) chong++;
    }
    if(chong<1||chong>2) continue;
    
    // 连号1组两连
    var lianCount=0;
    for(var i=0;i<selected.length-1;i++){
      if(selected[i+1]-selected[i]==1) lianCount++;
    }
    if(lianCount!=1) continue;
    
    // 跨度18-30
    var span=maxArr(selected)-minArr(selected);
    if(span<18||span>30) continue;
    
    // 蓝球过滤
    var blues=[];
    for(var b=1;b<=maxBlue;b++){
      // 杀上期蓝球
      if(inArray(b,prevBlues)) continue;
      // 杀冷号（超过15期未出视为冷号，这里简化处理）
      // 杀某些尾数
      var tail=b%10;
      if(tail==0||tail==5) continue;
      blues.push(b);
    }
    if(blues.length<blueCount) continue;
    
    // 选蓝球
    var selBlues=[];
    var tempBlues=blues.slice();
    for(var b=0;b<blueCount;b++){
      if(tempBlues.length==0) break;
      var idx=Math.floor(Math.random()*tempBlues.length);
      selBlues.push(tempBlues[idx]);
      tempBlues.splice(idx,1);
    }
    if(selBlues.length<blueCount) continue;
    selBlues.sort(function(a,b){return a-b;});
    
    plans.push({reds:selected,blues:selBlues});
    if(plans.length>=3) break;
  }
  return plans;
}

// ======================================================================
// 23. UI交互函数
// ======================================================================
function setLot(type){
  LOT_TYPE=type;
  document.getElementById("tab_ssq").className=type=="ssq"?"primary":"";
  document.getElementById("tab_dlt").className=type=="dlt"?"primary":"";
}

function refreshTime(){
  CURRENT_TIME=new Date();
  out("时间已刷新: "+fmtDate(CURRENT_TIME));
}

function autoFetchPrev(){
  var url=LOT_TYPE=="ssq"?"https://api.xxx.com/ssq/latest":"https://api.xxx.com/dlt/latest";
  fetch(url).then(function(r){return r.json();}).then(function(data){
    document.getElementById("prevInput").value=JSON.stringify(data);
    out("自动获取上期成功");
  }).catch(function(){
    out("自动获取失败，请手动输入上期号码");
  });
}

function out(msg){
  document.getElementById("output").textContent+=msg+"\n";
}

function clearOut(){
  document.getElementById("output").textContent="";
}

function calcAll(){
  clearOut();
  // 解析上期号码
  try{
    var prevData=JSON.parse(document.getElementById("prevInput").value);
    PREV_REDS=prevData.red;
    PREV_BLUES=prevData.blue;
  }catch(e){
    out("错误：上期号码格式不正确，请检查JSON格式");
    return;
  }
  
  // 排盘
  PAN=mainPan();
  out("=== 奇门排盘结果 ===");
  out("时间: "+PAN.time);
  out("节气: "+PAN.jieQi);
  out("日干支: "+PAN.dayGz+"  符头: "+PAN.futou+"  元: "+PAN.yuan);
  out("遁局: "+(PAN.yang?"阳遁":"阴遁")+PAN.ju+"局");
  out("时干支: "+PAN.hourGz+"  值符: "+PAN.zhiFu+"  值符宫: "+PAN.zhiFuGong);
  out("空亡: "+PAN.kongWang.join(","));
  out("击刑宫: "+PAN.jiXing.join(","));
  out("入墓宫: "+PAN.ruMu.join(","));
  out("门迫宫: "+PAN.menPo.join(","));
  
  // 初池
  INIT_POOL=getInitPool(PAN);
  out("\n=== 初池取数 ===");
  out("初池号码: "+INIT_POOL.join(","));
  
  // 张委铭杀号
  ZHANG_KILL_RESULT=zhangWeiMingKill(INIT_POOL,PREV_REDS);
  out("\n=== 张委铭《精准杀号》 ===");
  out("杀号后剩余: "+ZHANG_KILL_RESULT.join(","));
  
  // 褚天一擒号
  CHU_PLANS=chuTianYiSelect(ZHANG_KILL_RESULT,PREV_REDS,PREV_BLUES,LOT_TYPE);
  out("\n=== 褚天一《擒号秘技》 ===");
  for(var i=0;i<CHU_PLANS.length;i++){
    var p=CHU_PLANS[i];
    out("第"+(i+1)+"注: 红["+p.reds.join(",")+"] 蓝["+p.blues.join(",")+"]");
  }
  if(CHU_PLANS.length==0){
    out("未能生成符合条件的组合，请调整参数或扩大初池");
  }
}

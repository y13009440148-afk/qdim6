/* ================================================================
   模块8：全局状态变量
   ================================================================ */
var currentPan = null;
var lastSSQFront = null, lastSSQBack = null;

/* ================================================================
   模块9：基础工具函数（约250行）
   ================================================================ */
function pad2(n){ return n<10?"0"+n:""+n; }
function pad3(n){ return n<100?(n<10?"00"+n:"0"+n):""+n; }

function arraySum(arr){ var s=0; for(var i=0;i<arr.length;i++) s+=arr[i]; return s; }
function arrayMax(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]>m) m=arr[i]; return m; }
function arrayMin(arr){ var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]<m) m=arr[i]; return m; }
function arraySpan(arr){ return arrayMax(arr)-arrayMin(arr); }
function arrayAvg(arr){ return arraySum(arr)/arr.length; }
function arrayMedian(arr){ var a=arr.slice().sort(function(x,y){return x-y;}); return a[Math.floor(a.length/2)]; }
function arrayMode(arr){ var m={},mx=0,mv=null; for(var i=0;i<arr.length;i++){ m[arr[i]]=(m[arr[i]]||0)+1; if(m[arr[i]]>mx){mx=m[arr[i]];mv=arr[i];} } return mv; }

function arrayUnique(arr){ var seen={},out=[]; for(var i=0;i<arr.length;i++){ if(!seen[arr[i]]){ seen[arr[i]]=1; out.push(arr[i]); } } return out; }
function arrayIntersect(a,b){ var s={},r=[]; for(var i=0;i<a.length;i++) s[a[i]]=1; for(var i=0;i<b.length;i++) if(s[b[i]]) r.push(b[i]); return r; }
function arrayDiff(a,b){ var s={},r=[]; for(var i=0;i<b.length;i++) s[b[i]]=1; for(var i=0;i<a.length;i++) if(!s[a[i]]) r.push(a[i]); return r; }
function arrayUnion(a,b){ var s={},r=[]; for(var i=0;i<a.length;i++){if(!s[a[i]]){s[a[i]]=1;r.push(a[i]);}} for(var i=0;i<b.length;i++){if(!s[b[i]]){s[b[i]]=1;r.push(b[i]);}} return r; }

function shuffleArray(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; } return arr; }

function calcAC(arr){
  var n=arr.length,diffs=[];
  for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){
    var d=Math.abs(arr[i]-arr[j]);
    if(diffs.indexOf(d)===-1) diffs.push(d);
  }
  return diffs.length-(n-1);
}

function oddEvenCount(arr){ var o=0,e=0; for(var i=0;i<arr.length;i++) if(arr[i]%2===1) o++; else e++; return [o,e]; }
function bigSmallCount(arr,line){ var b=0,s=0; for(var i=0;i<arr.length;i++) if(arr[i]>=line) b++; else s++; return [b,s]; }
function zoneDistribution(arr,split){ var z1=0,z2=0,z3=0; for(var i=0;i<arr.length;i++){ if(arr[i]<=split[0]) z1++; else if(arr[i]<=split[1]) z2++; else z3++; } return [z1,z2,z3]; }

function tailNum(n){ return n%10; }
function tailMap(arr){ var m={}; for(var i=0;i<arr.length;i++){ var t=tailNum(arr[i]); m[t]=(m[t]||0)+1; } return m; }
function maxTailCount(arr){ var m=tailMap(arr),mx=0; for(var k in m) if(m[k]>mx) mx=m[k]; return mx; }
function tailCount(arr,t){ var c=0; for(var i=0;i<arr.length;i++) if(tailNum(arr[i])===t) c++; return c; }

function countRepeats(front,lastFront){ if(!lastFront) return 0; var cnt=0; for(var i=0;i<front.length;i++) if(lastFront.indexOf(front[i])!==-1) cnt++; return cnt; }
function countNeighbors(front,lastFront){ if(!lastFront) return 0; var cnt=0; for(var i=0;i<front.length;i++) for(var j=0;j<lastFront.length;j++) if(Math.abs(front[i]-lastFront[j])===1){ cnt++; break; } return cnt; }
function countConsecutivePairs(arr){ var pairs=0; for(var i=0;i<arr.length-1;i++) if(arr[i+1]-arr[i]===1) pairs++; return pairs; }
function countSameTailWithLast(front,lastFront){ if(!lastFront) return 0; var lt={}; for(var i=0;i<lastFront.length;i++) lt[tailNum(lastFront[i])]=1; var cnt=0; for(var i=0;i<front.length;i++) if(lt[tailNum(front[i])]) cnt++; return cnt; }

function gcd(a,b){ while(b){ var t=b; b=a%b; a=t; } return a; }
function lcm(a,b){ return a*b/gcd(a,b); }

function clamp(v,min,max){ return v<min?min:(v>max?max:v); }
function roundTo(v,dec){ var f=Math.pow(10,dec); return Math.round(v*f)/f; }

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

function formatDate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
/* ================================================================
   模块10：日期时间与干支推算（约300行）
   ================================================================ */
function getCurrentDrawTime(lotType){
  var now=new Date();
  var cfg=LOT_CFG[lotType];
  var dow=now.getDay();
  var targetDow=cfg.openWeekdays[0];
  var diff=(targetDow-dow+7)%7;
  if(diff===0){
    var curMin=now.getHours()*60+now.getMinutes();
    var drawMin=cfg.openHour*60+cfg.openMin;
    if(curMin>=drawMin) diff=7;
  }
  var drawDate=new Date(now);
  drawDate.setDate(drawDate.getDate()+diff);
  drawDate.setHours(cfg.openHour,cfg.openMin,0,0);
  return drawDate;
}

function getNextDrawTime(lotType){
  var now=new Date();
  var cfg=LOT_CFG[lotType];
  var bestDays=[];
  for(var w=0;w<cfg.openWeekdays.length;w++){
    var diff=(cfg.openWeekdays[w]-now.getDay()+7)%7;
    if(diff===0){
      var curMin=now.getHours()*60+now.getMinutes();
      var drawMin=cfg.openHour*60+cfg.openMin;
      if(curMin>=drawMin) diff=7;
    }
    bestDays.push(diff);
  }
  var minDiff=Math.min.apply(null,bestDays);
  var drawDate=new Date(now);
  drawDate.setDate(drawDate.getDate()+minDiff);
  drawDate.setHours(cfg.openHour,cfg.openMin,0,0);
  return drawDate;
}

function findClosestJieQi(year,month,day){
  var best=JIE_QI_TABLE[0],bestDist=9999;
  for(var i=0;i<JIE_QI_TABLE.length;i++){
    var q=JIE_QI_TABLE[i];
    var dist=Math.abs((month-q[1])*30+(day-q[2]));
    if(dist<bestDist){ bestDist=dist; best=q[0]; }
  }
  return best;
}

function getDayGanzhi(year,month,day){
  var base=new Date(1900,0,1);
  var tar=new Date(year,month-1,day);
  var days=Math.round((tar-base)/86400000);
  return SIXTY_JIAZI[(days+10)%60];
}

function getHourGanzhi(dayGan,hour){
  var startMap={"甲":0,"乙":2,"丙":4,"丁":6,"戊":8,"己":0,"庚":2,"辛":4,"壬":6,"癸":8};
  var ziIndex=Math.floor((hour+1)/2)%12;
  var ganIndex=(startMap[dayGan]+ziIndex)%10;
  return TIAN_GAN[ganIndex]+DI_ZHI[ziIndex];
}

function getXunShou(ganzhi){
  var idx=SIXTY_JIAZI.indexOf(ganzhi);
  if(idx===-1) return "甲子";
  return SIXTY_JIAZI[Math.floor(idx/10)*10];
}

function getXunKong(ganzhi){
  var xs=getXunShou(ganzhi);
  return XUN_KONG_MAP[xs]||"戌亥";
}

function getHiddenYi(ganzhi){
  var xs=getXunShou(ganzhi);
  var map={"甲子":"戊","甲戌":"己","甲申":"庚","甲午":"辛","甲辰":"壬","甲寅":"癸"};
  return map[xs]||"戊";
}

function getYuanIndex(dayGanzhi){
  var zhi=dayGanzhi[1];
  if("子午卯酉".indexOf(zhi)!==-1) return 0;
  if("寅申巳亥".indexOf(zhi)!==-1) return 1;
  return 2;
}

function getJuNumber(jieQiName,date){
  var arr=JU_SHU_MAP[jieQiName];
  if(!arr) return 1;
  var idx=getYuanIndex(getDayGanzhi(date.getFullYear(),date.getMonth()+1,date.getDate()));
  return arr[idx];
}

function getMaXingGong(ganzhi){
  var zhi=ganzhi[1];
  var dz=MA_XING_MAP[zhi];
  if(!dz) return null;
  return DIZHI_TO_IDX[dz]||null;
}

function getRiZhu(year,month,day){
  return getDayGanzhi(year,month,day);
}

function getShiZhu(dayGan,hour){
  return getHourGanzhi(dayGan,hour);
}

function getJiaZiIndex(ganzhi){
  return SIXTY_JIAZI.indexOf(ganzhi);
}

function getXunShouFromIndex(idx){
  return SIXTY_JIAZI[Math.floor(idx/10)*10];
}

function getNaYin(ganzhi){
  var naYinMap={
    "甲子":"海中金","乙丑":"海中金","丙寅":"炉中火","丁卯":"炉中火",

    "丙子":"涧下水","丁丑":"涧下水","戊寅":"城头土","己卯":"城头土",
    "庚辰":"白蜡金","辛巳":"白蜡金","壬午":"杨柳木","癸未":"杨柳木",
    "甲申":"泉中水","乙酉":"泉中水","丙戌":"屋上土","丁亥":"屋上土",
    "戊子":"霹雳火","己丑":"霹雳火","庚寅":"松柏木","辛卯":"松柏木",
    "壬辰":"长流水","癸巳":"长流水","甲午":"沙中金","乙未":"沙中金",
    "丙申":"山下火","丁酉":"山下火","戊戌":"平地木","己亥":"平地木",
    "庚子":"壁上土","辛丑":"壁上土","壬寅":"金箔金","癸卯":"金箔金",
    "甲辰":"覆灯火","乙巳":"覆灯火","丙午":"天河水","丁未":"天河水",
    "戊申":"大驿土","己酉":"大驿土","庚戌":"钗钏金","辛亥":"钗钏金",
    "壬子":"桑柘木","癸丑":"桑柘木","甲寅":"大溪水","乙卯":"大溪水",
    "丙辰":"沙中土","丁巳":"沙中土","戊午":"天上火","己未":"天上火",

  return naYinMap[ganzhi]||"未知";

/* ================================================================
   模块11：奇门排盘核心（约500行）
   ================================================================ */
function createQiMenPan(drawTime){
  var year=drawTime.getFullYear(), month=drawTime.getMonth()+1, day=drawTime.getDate();
  var hour=drawTime.getHours(), minute=drawTime.getMinutes();

  // 节气
  var jieQi=findClosestJieQi(year,month,day);
  var isYin=isYinSeason(jieQi);
  var ju=getJuNumber(jieQi,drawTime);
  if(isYin) ju=-Math.abs(ju); else ju=Math.abs(ju);

  // 干支
  var dayGZ=getDayGanzhi(year,month,day);
  var hourGZ=getHourGanzhi(dayGZ[0],hour);
  var xunShou=getXunShou(hourGZ);
  var kong=getXunKong(hourGZ);
  var maGong=getMaXingGong(hourGZ);
  var hiddenYi=getHiddenYi(hourGZ);
  var naYin=getNaYin(dayGZ);

  // ---- 地盘 ----
  var absJu=Math.abs(ju);
  var startIdx=(absJu-1+9)%9;
  var diPan=[];
  for(var i=0;i<9;i++){
    var gongIdx=isYin ? (9-((startIdx+i)%9)) : ((startIdx+i)%9+1);
    if(gongIdx===0) gongIdx=9;
    if(gongIdx===10) gongIdx=1;
    diPan.push({ gong:gongIdx, yi:LIU_YI_ORDER[i] });
  }

  // ---- 值符值使 ----
  var zhiFuGong=1, zhiShiGong=1;
  for(var i=0;i<diPan.length;i++){
    if(diPan[i].yi===hiddenYi){ zhiFuGong=diPan[i].gong; break; }
  }
  var xunIdx=SIXTY_JIAZI.indexOf(hourGZ);
  var xsIdx=SIXTY_JIAZI.indexOf(xunShou);
  var step=xunIdx-xsIdx;
  zhiShiGong=((zhiFuGong-1+step)%9+9)%9+1;

  // 值使对应的门
  var zhiShiMen=BA_MEN[(zhiShiGong-1+8)%8];

  // ---- 天盘（值符随时干） ----
  var shiGan=hourGZ[0];
  var shiGanGong=1;
  for(var i=0;i<diPan.length;i++){
    if(diPan[i].yi===shiGan){ shiGanGong=diPan[i].gong; break; }
  }
  var tianPan=[];
  for(var i=0;i<9;i++) tianPan.push({ gong:i+1, xing:null, yi:null });

  var zhiFuXing=JIU_XING[zhiFuGong-1];
  tianPan[shiGanGong-1]={ gong:shiGanGong, xing:zhiFuXing, yi:diPan[zhiFuGong-1].yi };

  var zfIdx=JIU_XING.indexOf(zhiFuXing);
  var usedGongs={}; usedGongs[shiGanGong]=1;
  for(var st=1;st<9;st++){
    var srcGong=((zhiFuGong-1+st)%9+9)%9+1;
    var dstGong=((shiGanGong-1+st)%9+9)%9+1;
    if(usedGongs[dstGong]) continue;
    var xingIdx=(zfIdx+st)%9;
    tianPan[dstGong-1]={ gong:dstGong, xing:JIU_XING[xingIdx], yi:diPan[srcGong-1].yi };
    usedGongs[dstGong]=1;
  }
  for(var i=0;i<9;i++){
    if(!tianPan[i].xing){
      tianPan[i].xing=JIU_XING[i];
      tianPan[i].yi=diPan[i].yi;
    }
  }

  // ---- 人盘（值使随时支） ----
  var shiZhi=hourGZ[1];
  var shiZhiNum=DIZHI_TO_IDX[shiZhi];
  var renPan=[];
  for(var i=0;i<9;i++) renPan.push({ gong:i+1, men:null });

  var zhiShiIdx=BA_MEN.indexOf(zhiShiMen);
  var startGong=zhiShiGong;
  var offset=(shiZhiNum-DIZHI_TO_IDX[xunShou[1]]+12)%12;
  var finalGong=((startGong-1+offset)%9+9)%9+1;
  renPan[finalGong-1]={ gong:finalGong, men:zhiShiMen };

  var usedMen={}; usedMen[zhiShiMen]=1;
  for(var st=1;st<8;st++){
    var srcGong=((zhiShiGong-1+st)%9+9)%9+1;
    var dstGong=((finalGong-1+st)%9+9)%9+1;
    var menIdx=(zhiShiIdx+st)%8;
    var men=BA_MEN[menIdx];
    if(usedMen[men]) continue;
    renPan[dstGong-1]={ gong:dstGong, men:men };
    usedMen[men]=1;
  }
  for(var i=0;i<9;i++){
    if(!renPan[i].men){
      renPan[i].men=BA_MEN[i%8];
    }
  }

  // ---- 神盘（八神阳顺阴逆） ----
  var shenPan=[];
  for(var i=0;i<9;i++) shenPan.push({ gong:i+1, shen:null });
  shenPan[zhiFuGong-1]={ gong:zhiFuGong, shen:"值符" };
  for(var st=1;st<8;st++){
    var dir=isYin?-1:1;
    var dstGong=((zhiFuGong-1+dir*st)%9+9)%9+1;
    shenPan[dstGong-1]={ gong:dstGong, shen:BA_SHEN[st] };
  }
  for(var i=0;i<9;i++){
    if(!shenPan[i].shen) shenPan[i].shen="九天";
  }

  // ---- 中宫寄坤 ----
  for(var i=0;i<tianPan.length;i++){
    if(tianPan[i].xing==="天芮"){
      tianPan[i].xing="天芮+天禽";
      break;
    }
  }

  // ---- 构建九宫信息 ----
  var gongInfo=[];
  var qiGongs=[];
  for(var i=0;i<9;i++){
    var g=i+1;
    var di=diPan[i].yi;
    var ti=tianPan[i].yi;
    var xing=tianPan[i].xing;
    var men=renPan[i].men;
    var shen=shenPan[i].shen;

    var tags=[];
    if(g===zhiFuGong) tags.push("值符");
    if(g===zhiShiGong) tags.push("值使");
    if(di==="乙"||di==="丙"||di==="丁") tags.push("三奇");
    else if(ti==="乙"||ti==="丙"||ti==="丁") tags.push("三奇");

    var gongZhi1=DI_ZHI[((g-1)*2)%12];
    var gongZhi2=DI_ZHI[((g-1)*2+1)%12];
    if(kong.indexOf(gongZhi1)!==-1||kong.indexOf(gongZhi2)!==-1) tags.push("空");

    if(maGong===g) tags.push("马");
    if(RU_MU_MAP[di]===g||RU_MU_MAP[ti]===g) tags.push("入墓");
    if(JI_XING_MAP[di]===g) tags.push("击刑");
    if(MEN_PO_MAP[men]===g) tags.push("门迫");

    if(di==="乙"||di==="丙"||di==="丁"||ti==="乙"||ti==="丙"||ti==="丁"){
      if(qiGongs.indexOf(g)===-1) qiGongs.push(g);
    }

    gongInfo.push({
      gong:g, diYi:di, tianYi:ti, xing:xing, men:men, shen:shen,
      tags:tags, tagStr:tags.join(",")
    });
  }

  return {
    drawTime:drawTime,
    jieQi:jieQi, isYin:isYin, ju:ju,
    dayGZ:dayGZ, hourGZ:hourGZ, xunShou:xunShou,
    kong:kong, maGong:maGong, hiddenYi:hiddenYi,
    naYin:naYin,
    zhiFuGong:zhiFuGong, zhiShiGong:zhiShiGong, zhiShiMen:zhiShiMen,
    diPan:diPan, tianPan:tianPan, renPan:renPan, shenPan:shenPan,
    gongInfo:gongInfo, qiGongs:qiGongs
  };
}

/* ================================================================
   模块12：初池——真实宫源提取
   ================================================================ */
function getQiMenSourceGongs(pan){
  var g=[];
  if(pan.zhiFuGong) g.push(pan.zhiFuGong);
  if(pan.zhiShiGong) g.push(pan.zhiShiGong);
  for(var i=0;i<pan.qiGongs.length;i++) g.push(pan.qiGongs[i]);
  for(var i=0;i<pan.gongInfo.length;i++){
    var c=pan.gongInfo[i];
    if(c.men==="休"||c.men==="生"||c.men==="开") g.push(c.gong);
    if(c.shen==="六合") g.push(c.gong);
  }
  if(pan.maGong) g.push(pan.maGong);
  var seen={},out=[];
  for(var i=0;i<g.length;i++){
    var v=g[i];
    if(!seen[v]){ seen[v]=1; out.push(v); }
  }
  return out.sort(function(a,b){return a-b;});
}

/* ================================================================
   模块13：宫数→奖号域映射
   ================================================================ */
function expandGongToLotDomain(gongs, lotType){
  var cfg=LOT_CFG[lotType];
  var set={},out=[];
  for(var i=0;i<gongs.length;i++){
    var g=gongs[i];
    for(var n=cfg.fMin;n<=cfg.fMax;n++){
      if(n%10===g%10 && !set[n]){ set[n]=1; out.push(n); }
    }
    if(g>=cfg.fMin&&g<=cfg.fMax&&!set[g]){ set[g]=1; out.push(g); }
    for(var add=9;add<=27;add+=9){
      var n=g+add;
      if(n>=cfg.fMin&&n<=cfg.fMax&&!set[n]){ set[n]=1; out.push(n); }
      var n2=g-add;
      if(n2>=cfg.fMin&&n2<=cfg.fMax&&!set[n2]){ set[n2]=1; out.push(n2); }
    }
  }
  return out.sort(function(a,b){return a-b;});
}

function expandGongToBackDomain(gongs, lotType){
  var cfg=LOT_CFG[lotType];
  var set={},out=[];
  for(var i=0;i<gongs.length;i++){
    var g=gongs[i];
    for(var n=cfg.bMin;n<=cfg.bMax;n++){
      if(n%10===g%10 && !set[n]){ set[n]=1; out.push(n); }
    }
    if(g>=cfg.bMin&&g<=cfg.bMax&&!set[g]){ set[g]=1; out.push(g); }
    var n=g+9;
    if(n>=cfg.bMin&&n<=cfg.bMax&&!set[n]){ set[n]=1; out.push(n); }
  }
  return out.sort(function(a,b){return a-b;});
}

/* ================================================================
   模块14：张委铭杀号系统
   ================================================================ */
function zhangWeiMingKill(pool, pan, lotType, lastFront, lastBack){
  var p=pool.slice();
  var cfg=LOT_CFG[lotType];
  if(p.length===0) return p;

  // 1. 空亡宫同尾杀
  var kongChars=pan.kong.split("");
  for(var ki=0;ki<kongChars.length;ki++){
    var g=DIZHI_TO_IDX[kongChars[ki]];
    if(!g) continue;
    p=p.filter(function(n){ return ((n-1)%9+1)!==g; });
  }

  // 2. 入墓宫同尾杀
  for(var gi=0;gi<pan.gongInfo.length;gi++){
    var c=pan.gongInfo[gi];
    if(c.tags.indexOf("入墓")!==-1){
      p=p.filter(function(n){ return ((n-1)%9+1)!==c.gong; });
    }
  }

  // 3. 门迫宫同尾杀
  for(var gi=0;gi<pan.gongInfo.length;gi++){
    var c=pan.gongInfo[gi];
    if(c.tags.indexOf("门迫")!==-1){
      p=p.filter(function(n){ return ((n-1)%9+1)!==c.gong; });
    }
  }

  // 4. 击刑宫同尾杀
  for(var gi=0;gi<pan.gongInfo.length;gi++){
    var c=pan.gongInfo[gi];
    if(c.tags.indexOf("击刑")!==-1){
      p=p.filter(function(n){ return ((n-1)%9+1)!==c.gong; });
    }
  }

  // 5. 重号≤1
  if(lastFront && lastFront.length>0){
    var repeats=arrayIntersect(p,lastFront);
    if(repeats.length>1){
      for(var ri=1;ri<repeats.length;ri++){
        p=p.filter(function(n){ return n!==repeats[ri]; });
      }
    }
  }

  // 6. 邻号≤2
  if(lastFront && lastFront.length>0){
    var neighbors=[];
    for(var i=0;i<p.length;i++){
      for(var j=0;j<lastFront.length;j++){
        if(Math.abs(p[i]-lastFront[j])===1){
          neighbors.push(p[i]); break;
        }
      }
    }
    if(neighbors.length>2){
      var keep=neighbors.slice(0,2);
      for(var ni=2;ni<neighbors.length;ni++){
        p=p.filter(function(n){ return n!==neighbors[ni]; });
      }
    }
  }

  // 7. 同尾≤2
  var tailCnt={};
  p=p.filter(function(n){
    var t=n%10;
    if((tailCnt[t]||0)>=2) return false;
    tailCnt[t]=(tailCnt[t]||0)+1;
    return true;
  });

  // 8. 连号≤1组两连
  var temp=p.slice().sort(function(a,b){return a-b;});
  var consecGroups=0;
  for(var i=0;i<temp.length-1;i++){
    if(temp[i+1]-temp[i]===1){
      consecGroups++;
      i++;
    }
  }
  if(consecGroups>1){
    var removeIdx=[];
    var foundFirst=false;
    for(var i=0;i<temp.length-1;i++){
      if(temp[i+1]-temp[i]===1){
        if(!foundFirst){ foundFirst=true; i++; continue; }
        removeIdx.push(temp[i]);
        removeIdx.push(temp[i+1]);
        i++;
      }
    }
    p=p.filter(function(n){ return removeIdx.indexOf(n)===-1; });
  }

  return p;
}
/* ================================================================
   模块15：褚天一擒号评分系统
   ================================================================ */
function chuTianYiScore(front, pan, lotType, lastFront, lastBack){
  var cfg=LOT_CFG[lotType];
  var score=0;

  var sum=arraySum(front);
  var span=arraySpan(front);
  var ac=calcAC(front);
  var oe=oddEvenCount(front);
  var sd=bigSmallCount(front,cfg.bigLine);
  var zd=zoneDistribution(front,cfg.zoneSplit);

  // 和值
  if(sum>=cfg.idealSum[0]&&sum<=cfg.idealSum[1]) score+=12;
  else if(sum>=cfg.idealSum[0]-10&&sum<=cfg.idealSum[1]+10) score+=5;
  else score-=5;

  // 跨度
  if(span>=cfg.idealSpan[0]&&span<=cfg.idealSpan[1]) score+=10;
  else if(span>=cfg.idealSpan[0]-5&&span<=cfg.idealSpan[1]+5) score+=4;
  else score-=4;

  // AC值
  if(ac>=cfg.idealAC[0]&&ac<=cfg.idealAC[1]) score+=10;
  else if(ac>=cfg.idealAC[0]-1&&ac<=cfg.idealAC[1]+1) score+=4;
  else score-=3;

  // 奇偶比
  if(Math.abs(oe[0]-oe[1])<=1) score+=8;
  else if(Math.abs(oe[0]-oe[1])<=2) score+=3;
  else score-=3;

  // 大小比
  if(Math.abs(sd[0]-sd[1])<=1) score+=8;
  else if(Math.abs(sd[0]-sd[1])<=2) score+=3;
  else score-=3;

  // 区间分布均衡加分
  if(zd[0]>=1&&zd[1]>=1&&zd[2]>=1) score+=8;
  else if(zd[0]>=1&&zd[1]>=1||zd[1]>=1&&zd[2]>=1||zd[0]>=1&&zd[2]>=1) score+=3;
  else score-=2;

  // 后区杀上期同尾
  if(lastBack && lastBack.length>0){
    var backTails={};
    for(var i=0;i<lastBack.length;i++) backTails[lastBack[i]%10]=1;
    var frontTails={};
    for(var i=0;i<front.length;i++) frontTails[front[i]%10]=1;
    var conflict=0;
    for(var t in frontTails){
      if(backTails[t]) conflict++;
    }
    if(conflict===0) score+=6;
    else if(conflict<=1) score+=2;
    else score-=3;
  }

  // 值符宫关联加分
  if(pan.zhiFuGong){
    var zfMod=pan.zhiFuGong%10;
    for(var i=0;i<front.length;i++){
      if(front[i]%10===zfMod){ score+=5; break; }
    }
  }

  // 值使宫关联加分
  if(pan.zhiShiGong){
    var zsMod=pan.zhiShiGong%10;
    for(var i=0;i<front.length;i++){
      if(front[i]%10===zsMod){ score+=4; break; }
    }
  }

  // 三奇宫关联加分
  for(var qi=0;qi<pan.qiGongs.length;qi++){
    var qMod=pan.qiGongs[qi]%10;
    for(var i=0;i<front.length;i++){
      if(front[i]%10===qMod){ score+=3; break; }
    }
  }

  // 六合宫关联加分
  for(var gi=0;gi<pan.gongInfo.length;gi++){
    if(pan.gongInfo[gi].shen==="六合"){
      var liuMod=pan.gongInfo[gi].gong%10;
      for(var i=0;i<front.length;i++){
        if(front[i]%10===liuMod){ score+=3; break; }
      }
      break;
    }
  }

  // 重复号惩罚
  if(lastFront && lastFront.length>0){
    var rep=countRepeats(front,lastFront);
    if(rep>1) score-=rep*3;
  }

  return score;
}

/* ================================================================
   模块16：后区选号
   ================================================================ */
function pickBackNumbers(pan, lotType, lastBack){
  var cfg=LOT_CFG[lotType];
  var gongs=getQiMenSourceGongs(pan);
  var pool=expandGongToBackDomain(gongs, lotType);
  if(pool.length<cfg.bPick){
    pool=[];
    for(var n=cfg.bMin;n<=cfg.bMax;n++) pool.push(n);
  }

  // 杀上期同尾
  if(lastBack && lastBack.length>0){
    var bt={};
    for(var i=0;i<lastBack.length;i++) bt[lastBack[i]%10]=1;
    pool=pool.filter(function(n){ return !bt[n%10]; });
  }

  // 不足则补充
  if(pool.length<cfg.bPick){
    for(var n=cfg.bMin;n<=cfg.bMax;n++){
      if(pool.indexOf(n)===-1) pool.push(n);
      if(pool.length>=cfg.bPick*2) break;
    }
  }

  // 随机打乱选最优组合
  var bestComb=null,bestScore=-9999;
  for(var trial=0;trial<200;trial++){
    var shuffled=shuffleArray(pool.slice());
    var comb=shuffled.slice(0,cfg.bPick).sort(function(a,b){return a-b;});
    var sc=0;
    var sum=arraySum(comb);
    if(lotType==='ssq'){
      if(sum>=8&&sum<=20) sc+=10;
      if(arraySpan(comb)>=2&&arraySpan(comb)<=8) sc+=5;
    } else {
      if(sum>=10&&sum<=26) sc+=10;
      if(arraySpan(comb)>=3&&arraySpan(comb)<=10) sc+=5;
    }
    if(sc>bestScore){ bestScore=sc; bestComb=comb; }
  }

  return bestComb || pool.slice(0,cfg.bPick).sort(function(a,b){return a-b;});
}

/* ================================================================
   模块17：选号主引擎
   ================================================================ */
function generateNumbers(pan, lotType, count, lastFront, lastBack){
  var cfg=LOT_CFG[lotType];
  var gongs=getQiMenSourceGongs(pan);
  var pool=expandGongToLotDomain(gongs, lotType);

  // 张委铭杀号
  pool=zhangWeiMingKill(pool, pan, lotType, lastFront, lastBack);

  // 保底：至少保留足够号码
  if(pool.length<cfg.fPick+5){
    pool=[];
    for(var n=cfg.fMin;n<=cfg.fMax;n++) pool.push(n);
    pool=zhangWeiMingKill(pool, pan, lotType, lastFront, lastBack);
  }
  if(pool.length<cfg.fPick+5){
    pool=[];
    for(var n=cfg.fMin;n<=cfg.fMax;n++) pool.push(n);
  }

  // 穷举所有C(pool.length, fPick)组合
  var allCombs=[];
  function combine(arr,start,depth,cur){
    if(depth===cfg.fPick){
      allCombs.push(cur.slice());
      return;
    }
    for(var i=start;i<arr.length-(cfg.fPick-depth)+1;i++){
      cur.push(arr[i]);
      combine(arr,i+1,depth+1,cur);
      cur.pop();
    }
  }
  combine(pool,0,0,[]);

  // 褚天一评分
  var scored=[];
  for(var i=0;i<allCombs.length;i++){
    var sc=chuTianYiScore(allCombs[i], pan, lotType, lastFront, lastBack);
    scored.push({ comb:allCombs[i], score:sc });
  }

  // 按分数降序排列
  scored.sort(function(a,b){ return b.score-a.score; });

  // 去重（避免完全相同的组合）
  var unique=[];
  var seenSet={};
  for(var i=0;i<scored.length;i++){
    var key=scored[i].comb.join(",");
    if(!seenSet[key]){ seenSet[key]=1; unique.push(scored[i]); }
  }

  // 取前N个
  var topN=unique.slice(0,Math.min(count*3, unique.length));

  // 随机从中选count个
  var selected=[];
  var indices=[];
  for(var i=0;i<topN.length;i++) indices.push(i);
  shuffleArray(indices);
  for(var i=0;i<Math.min(count,topN.length);i++){
    selected.push(topN[indices[i]]);
  }

  // 如果还不够，从高分中补
  if(selected.length<count){
    for(var i=0;i<unique.length&&selected.length<count;i++){
      var already=false;
      for(var j=0;j<selected.length;j++){
        if(selected[j].comb.join(",")===unique[i].comb.join(",")){
          already=true; break;
        }
      }
      if(!already) selected.push(unique[i]);
    }
  }

  // 生成后区
  var results=[];
  for(var i=0;i<selected.length;i++){
    var backs=pickBackNumbers(pan, lotType, lastBack);
    results.push({
      front:selected[i].comb.slice().sort(function(a,b){return a-b;}),
      back:backs,
      score:selected[i].score
    });
  }

  // 按分数排序输出
  results.sort(function(a,b){ return b.score-a.score; });

  return results;
}

/* ================================================================
   模块18：渲染输出
   ================================================================ */
function renderPan(pan){
  var container=document.getElementById("gongContainer");
  container.innerHTML="";
  for(var i=0;i<pan.gongInfo.length;i++){
    var c=pan.gongInfo[i];
    var div=document.createElement("div");
    div.className="gong-cell";

    var numSpan=document.createElement("span");
    numSpan.className="g-num";
    numSpan.textContent=c.gong;
    div.appendChild(numSpan);

    var mainSpan=document.createElement("div");
    mainSpan.className="g-main";
    mainSpan.textContent=c.men+" "+c.xing;
    div.appendChild(mainSpan);

    var subSpan=document.createElement("div");
    subSpan.className="g-sub";
    subSpan.textContent=c.diYi+"→"+c.tianYi+" | "+c.shen;
    div.appendChild(subSpan);

    var tagDiv=document.createElement("div");
    tagDiv.style.marginTop="2px";
    for(var t=0;t<c.tags.length;t++){
      var tag=document.createElement("span");
      tag.className="g-tag";
      if(c.tags[t]==="值符"||c.tags[t]==="值使") tag.className+=" tag-zf";
      else if(c.tags[t]==="三奇") tag.className+=" tag-qi";
      else if(c.tags[t]==="空") tag.className+=" tag-kong";
      else if(c.tags[t]==="马") tag.className+=" tag-ma";
      else tag.className+=" tag-zs";
      tag.textContent=c.tags[t];
      tagDiv.appendChild(tag);
    }
    div.appendChild(tagDiv);
    container.appendChild(div);
  }

  // 统计栏
  var statBar=document.getElementById("statBar");
  statBar.innerHTML="<span>节气："+pan.jieQi+"</span>"+
    "<span>阴阳："+(pan.isYin?"阴遁":"阳遁")+"</span>"+
    "<span>局数："+Math.abs(pan.ju)+"</span>"+
    "<span>日柱："+pan.dayGZ+"</span>"+
    "<span>时柱："+pan.hourGZ+"</span>"+
    "<span>旬首："+pan.xunShou+"</span>"+
    "<span>旬空："+pan.kong+"</span>"+
    "<span>值符："+pan.zhiFuGong+"宫</span>"+
    "<span>值使："+pan.zhiShiGong+"宫("+pan.zhiShiMen+")</span>";
}

function renderResults(results, lotType, pan){
  var output=document.getElementById("mainOutput");
  var cfg=LOT_CFG[lotType];
  var html="";

  html+="<span class='hl-gold'>═══════════════════════════════</span><br>";
  html+="<span class='hl-gold'>  "+cfg.name+" · 奇门遁甲V9 选号结果</span><br>";
  html+="<span class='hl-gold'>═══════════════════════════════</span><br>";
  html+="<span class='hl-gray'>开奖时间："+formatDate(pan.drawTime)+"</span><br>";
  html+="<span class='hl-gray'>奇门盘："+pan.jieQi+" "+(pan.isYin?"阴":"阳")+"遁"+Math.abs(pan.ju)+"局</span><br>";
  html+="<span class='hl-gray'>值符"+pan.zhiFuGong+"宫 · 值使"+pan.zhiShiGong+"宫("+pan.zhiShiMen+")</span><br>";
  html+="<span class='hl-gray'>初池源宫："+getQiMenSourceGongs(pan).join(",")+"</span><br>";
  html+="<br>";

  for(var i=0;i<results.length;i++){
    var r=results[i];
    var frontStr=r.front.map(function(n){ return pad2(n); }).join(" ");
    var backStr=r.back.map(function(n){ return pad2(n); }).join(" ");
    var sum=arraySum(r.front);
    var span=arraySpan(r.front);
    var ac=calcAC(r.front);
    var oe=oddEvenCount(r.front);
    var sd=bigSmallCount(r.front,cfg.bigLine);

    html+="<span class='hl-green'>◆ 第"+(i+1)+"注</span>  <span class='hl-gold'>★"+r.score+"分</span><br>";
    html+="<span class='hl-red'>前区："+frontStr+"</span>  ";
    html+="<span class='hl-blue'>后区："+backStr+"</span><br>";
    html+="<span class='hl-gray'>和值"+sum+" 跨度"+span+" AC"+ac+" 奇偶"+oe[0]+":"+oe[1]+" 大小"+sd[0]+":"+sd[1]+"</span><br>";
    if(i<results.length-1) html+="<br>";
  }

  html+="<br><span class='hl-gold'>═══════════════════════════════</span><br>";
  html+="<span class='hl-gray'>生成时间："+formatDate(new Date())+"</span><br>";
  html+="<span class='hl-gray'>共计 "+results.length+" 注</span>";

  output.innerHTML=html;
}

/* ================================================================
   模块19：主入口函数
   ================================================================ */
function runLottery(lotType, count){
  var cfg=LOT_CFG[lotType];
  var drawTime=getCurrentDrawTime(lotType);

  // 获取上期数据
  var lastFront=null, lastBack=null;
  if(lotType==='ssq'){
    lastFront=lastSSQFront;
    lastBack=lastSSQBack;
  } else {
    lastFront=lastDLTFront;
    lastBack=lastDLTBack;
  }

  // 排盘
  var pan=createQiMenPan(drawTime);
  currentPan=pan;

  // 渲染奇门盘
  renderPan(pan);

  // 生成号码
  var results=generateNumbers(pan, lotType, count, lastFront, lastBack);

  // 渲染结果
  renderResults(results, lotType, pan);

  // 记录历史
  historyResults.push({
    time:new Date(),
    lotType:lotType,
    count:count,
    results:results,
    pan:pan
  });
}

/* ================================================================
   模块20：辅助功能
   ================================================================ */
function showPanOnly(){
  if(!currentPan){
    runLottery('ssq',3);
  } else {
    renderPan(currentPan);
    var output=document.getElementById("mainOutput");
    output.innerHTML="<span class='hl-gray'>当前显示仅为奇门盘，点击上方按钮生成选号。</span>";
  }
}

function clearOutput(){
  document.getElementById("mainOutput").innerHTML="<span class='hl-gray'>已清空。</span>";
}

function exportResult(){
  var output=document.getElementById("mainOutput");
  var text=output.innerText || output.textContent;
  var blob=new Blob([text], {type:"text/plain;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="奇门V9_"+(new Date().toISOString().slice(0,10))+".txt";
  a.click();
  URL.revokeObjectURL(url);
}

function setMockLastData(){
  lastSSQFront=[5,12,18,23,29,31];

  lastDLTFront=[3,11,17,24,30];

}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇门统计｜动态转盘B版 优化沙盘</title>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Microsoft YaHei',system-ui,sans-serif; padding:12px; }
h1 { font-size:1.3rem; margin-bottom:8px; color:var(--accent); }
h2 { font-size:1.1rem; margin:12px 0 6px; color:var(--accent); }
h3 { font-size:1rem; margin:8px 0 4px; color:var(--yellow); }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:4px 0; }
label { font-size:0.85rem; color:var(--text); }
input, select, textarea { background:#0d1117; border:1px solid var(--border); color:var(--text); padding:4px 8px; border-radius:4px; font-size:0.85rem; }
textarea { width:100%; height:80px; resize:vertical; font-family:monospace; }
button { background:var(--accent); color:#fff; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:0.85rem; margin:2px; }
button:hover { filter:brightness(1.2); }
button.secondary { background:#30363d; }
button.danger { background:var(--red); }
table { width:100%; border-collapse:collapse; font-size:0.8rem; margin:4px 0; }
th, td { border:1px solid var(--border); padding:3px 6px; text-align:center; }
th { background:#21262d; color:var(--accent); }
.metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:6px; margin:6px 0; }
.metric { background:#21262d; border-radius:4px; padding:6px; text-align:center; }
.metric .value { font-size:1.2rem; font-weight:bold; color:var(--green); }
.metric .label { font-size:0.7rem; color:var(--text); }
.hit { color:var(--green); font-weight:bold; }
.miss { color:var(--red); }
.warn { color:var(--yellow); }
.small { font-size:0.75rem; color:#8b949e; }
.hidden { display:none; }
.tab-btn { background:#21262d; color:var(--text); border:1px solid var(--border); }
.tab-btn.active { background:var(--accent); color:#fff; }
#status { position:fixed; top:10px; right:10px; background:#21262d; border:1px solid var(--border); padding:6px 12px; border-radius:4px; font-size:0.8rem; z-index:100; }
#status.online { border-color:var(--green); color:var(--green); }
#status.offline { border-color:var(--red); color:var(--red); }
</style>
</head>
<body>
<h1>奇门统计｜动态转盘B版 优化沙盘</h1>
<div id="status" class="offline">检查中...</div>

<div class="card">
  <h2>📊 数据源</h2>
  <div class="row">
    <label>彩种：</label>
    <select id="lotteryType">
      <option value="ssq">双色球</option>
      <option value="dlt">大乐透</option>
    </select>
    <button id="btnFetch" class="secondary">🌐 联网更新数据</button>
    <button id="btnLoadPreset" class="secondary">📂 载入内置数据</button>
    <button id="btnClear" class="danger">🗑 清空数据</button>
  </div>
  <div class="row">
    <label>历史数据（每行一期，格式：期号,前区逗号分隔,后区逗号分隔）：</label>
  </div>
  <textarea id="historyData" placeholder="2026001,01,05,12,18,22,30,03,11&#10;2026002,03,07,14,19,25,31,02,08"></textarea>
  <div class="row">
    <label>当前期号：</label>
    <input type="text" id="currentIssue" placeholder="2026003">
    <label>开奖日期：</label>
    <input type="date" id="drawDate">
  </div>
</div>

<div class="card">
  <h2>⚙️ 参数设置</h2>
  <div class="grid">
    <div>
      <h3>奇门起局</h3>
      <div class="row"><label>阴阳遁：</label><select id="yinYang"><option value="阳">阳遁</option><option value="阴">阴遁</option></select></div>
      <div class="row"><label>局数：</label><input type="number" id="juShu" value="0" min="0" max="9" style="width:60px"> <span class="small">0=自动</span></div>
      <div class="row"><label>节气：</label><input type="text" id="solarTerm" placeholder="自动判定" readonly style="width:120px"></div>
      <div class="row"><label>元：</label><select id="yuan"><option value="上元">上元</option><option value="中元">中元</option><option value="下元">下元</option></select></div>
      <div class="row"><label>时辰：</label><input type="text" id="shiChen" placeholder="自动" readonly style="width:100px"></div>
    </div>
    <div>
      <h3>方案池</h3>
      <div class="row"><label>方案A（奇门）：</label><input type="number" id="poolA" value="3" min="0" max="10" style="width:60px"></div>
      <div class="row"><label>方案B（随机）：</label><input type="number" id="poolB" value="3" min="0" max="10" style="width:60px"></div>
      <div class="row"><label>方案C（混合）：</label><input type="number" id="poolC" value="3" min="0" max="10" style="width:60px"></div>
      <div class="row"><label>六爻蓝球池：</label><input type="number" id="poolLiuYao" value="2" min="0" max="10" style="width:60px"></div>
    </div>
    <div>
      <h3>回测参数</h3>
      <div class="row"><label>回测期数：</label><input type="number" id="backtestN" value="20" min="5" max="170" style="width:80px"></div>
      <div class="row"><label>前瞻窗口：</label><input type="number" id="lookahead" value="5" min="0" max="20" style="width:60px"> <span class="small">0=传统回测</span></div>
      <div class="row"><label>随机对照次数：</label><input type="number" id="randomTrials" value="3" min="0" max="10" style="width:60px"></div>
      <div class="row"><label>模式：</label><select id="mode"><option value="backtest">回测</option><option value="predict">预测</option></select></div>
    </div>
  </div>
  <div class="row">
    <button id="btnRun">▶ 执行分析</button>
    <button id="btnExport" class="secondary">💾 导出CSV</button>
    <button id="btnResetParams" class="secondary">↺ 重置参数</button>
  </div>
</div>

<div class="card">
  <h2>📈 分析结果</h2>
  <div id="resultArea"><p class="small">点击「执行分析」开始。</p></div>
</div>

<script>
// ============ 核心工具函数 ============
const LOTTERY_CONFIG = {
  ssq: { frontCount: 6, frontMax: 33, backCount: 1, backMax: 16, name: '双色球' },
  dlt: { frontCount: 5, frontMax: 35, backCount: 2, backMax: 12, name: '大乐透' }
};

// ============ 精确节气模块（天文算法） ============
const QI_MEN_SOLAR_TERMS = [
  { name: '冬至', longitude: 270 }, { name: '小寒', longitude: 285 },
  { name: '大寒', longitude: 300 }, { name: '立春', longitude: 315 },
  { name: '雨水', longitude: 330 }, { name: '惊蛰', longitude: 345 },
  { name: '春分', longitude: 0 },   { name: '清明', longitude: 15 },
  { name: '谷雨', longitude: 30 },  { name: '立夏', longitude: 45 },
  { name: '小满', longitude: 60 },  { name: '芒种', longitude: 75 },
  { name: '夏至', longitude: 90 },  { name: '小暑', longitude: 105 },
  { name: '大暑', longitude: 120 }, { name: '立秋', longitude: 135 },
  { name: '处暑', longitude: 150 }, { name: '白露', longitude: 165 },
  { name: '秋分', longitude: 180 }, { name: '寒露', longitude: 195 },
  { name: '霜降', longitude: 210 }, { name: '立冬', longitude: 225 },
  { name: '小雪', longitude: 240 }, { name: '大雪', longitude: 255 }
];

let termCache = {};

function calcTermMoment(year, longitude) {
  const key = year + '_' + longitude;
  if (termCache[key]) return termCache[key];
  const start = new Date(Date.UTC(year, 0, 1));
  const end = new Date(Date.UTC(year + 1, 0, 1));
  try {
    const time = Astronomy.SearchSunLongitude(longitude, start, end);
    termCache[key] = time;
    return time;
  } catch (e) {
    return null;
  }
}

function buildTermTable(year) {
  const table = [];
  for (let y = year - 1; y <= year + 1; y++) {
    for (const st of QI_MEN_SOLAR_TERMS) {
      const t = calcTermMoment(y, st.longitude);
      if (t) {
        table.push({ name: st.name, time: t.date.getTime() });
      }
    }
  }
  table.sort((a, b) => a.time - b.time);
  return table;
}

function getSolarTerm(dateObj) {
  const y = dateObj.getFullYear();
  const table = buildTermTable(y);
  const now = dateObj.getTime();
  let cur = null;
  for (let i = 0; i < table.length; i++) {
    if (table[i].time <= now) {
      cur = table[i];
    } else {
      break;
    }
  }
  if (!cur) cur = table[0];
  return cur.name;
}

function getTermContext(dateObj) {
  const y = dateObj.getFullYear();
  const table = buildTermTable(y);
  const now = dateObj.getTime();
  let cur = null, next = null;
  for (let i = 0; i < table.length; i++) {
    if (table[i].time <= now) {
      cur = table[i];
    } else {
      next = table[i];
      break;
    }
  }
  if (!cur) cur = table[0];
  if (!next) next = table[table.length - 1];
  return {
    current: cur.name,
    next: next.name,
    currentTime: new Date(cur.time),
    nextTime: new Date(next.time)
  };
}

// ============ 奇门起局（调用精确节气） ============
function qiMenZhuanPan(dateObj, yinYangPref, juPref, yuanPref) {
  const termCtx = getTermContext(dateObj);
  const term = termCtx.current;
  
  // 节气→阴阳遁
  let yinYang = yinYangPref;
  if (yinYangPref === '阳') {
    yinYang = '阳';
  } else if (yinYangPref === '阴') {
    yinYang = '阴';
  } else {
    const yangTerms = ['冬至','小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种'];
    yinYang = yangTerms.includes(term) ? '阳' : '阴';
  }
  
  // 节气→局数（三元）
  let ju = juPref;
  if (!ju || ju === 0) {
    const termIndex = QI_MEN_SOLAR_TERMS.findIndex(t => t.name === term);
    const base = termIndex >= 0 ? (termIndex % 9) + 1 : 1;
    const yuanMap = { '上元': 0, '中元': 3, '下元': 6 };
    const offset = yuanMap[yuanPref] || 0;
    ju = ((base + offset - 1) % 9) + 1;
  }
  
  // 时辰（简化：按小时段）
  const hour = dateObj.getHours();
  const shiChenIndex = Math.floor((hour + 1) / 2) % 12;
  const shiChenNames = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const shiChen = shiChenNames[shiChenIndex];
  
  return { yinYang, ju, term, yuan: yuanPref, shiChen, termCtx };
}

// ============ 随机数工具 ============
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seededRandom(seedStr) {
  let hash = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
    hash ^= seedStr.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return mulberry32(hash);
}

// ============ 号码生成 ============
function generateFront(cfg, rng, excludeSet) {
  const pool = [];
  for (let i = 1; i <= cfg.frontMax; i++) {
    if (!excludeSet || !excludeSet.has(i)) pool.push(i);
  }
  const selected = [];
  for (let i = 0; i < cfg.frontCount; i++) {
    const idx = Math.floor(rng() * pool.length);
    selected.push(pool.splice(idx, 1)[0]);
  }
  return selected.sort((a,b) => a-b);
}

function generateBack(cfg, rng, excludeSet) {
  const pool = [];
  for (let i = 1; i <= cfg.backMax; i++) {
    if (!excludeSet || !excludeSet.has(i)) pool.push(i);
  }
  const selected = [];
  for (let i = 0; i < cfg.backCount; i++) {
    const idx = Math.floor(rng() * pool.length);
    selected.push(pool.splice(idx, 1)[0]);
  }
  return selected.sort((a,b) => a-b);
}

// ============ 数据解析 ============
function parseLotteryData(text, type) {
  const cfg = LOTTERY_CONFIG[type];
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const records = [];
  for (const line of lines) {
    const parts = line.split(/[\s,]+/).filter(p => p.length > 0);
    if (parts.length < cfg.frontCount + cfg.backCount + 1) continue;
    const issue = parts[0];
    const front = parts.slice(1, 1 + cfg.frontCount).map(Number);
    const back = parts.slice(1 + cfg.frontCount, 1 + cfg.frontCount + cfg.backCount).map(Number);
    if (front.some(isNaN) || back.some(isNaN)) continue;
    records.push({ issue, front, back });
  }
  return records;
}

// ============ 评分函数 ============
function calcScore(front, back, qiMenInfo, type) {
  const cfg = LOTTERY_CONFIG[type];
  let score = 0;
  const details = [];
  
  // 1. 奇门局数匹配度（0-20分）
  const ju = qiMenInfo.ju;
  const frontSum = front.reduce((a,b) => a+b, 0);
  const backSum = back.reduce((a,b) => a+b, 0);
  const totalSum = frontSum + backSum;
  const juMatch = (totalSum % 9 === ju % 9) ? 20 : (totalSum % 9 === (ju+1) % 9 ? 10 : 0);
  score += juMatch;
  details.push({ name: '局数匹配', score: juMatch, max: 20 });
  
  // 2. 阴阳遁匹配度（0-10分）
  const yinYangMatch = (qiMenInfo.yinYang === '阳' && frontSum % 2 === 1) || 
                       (qiMenInfo.yinYang === '阴' && frontSum % 2 === 0) ? 10 : 0;
  score += yinYangMatch;
  details.push({ name: '阴阳遁匹配', score: yinYangMatch, max: 10 });
  
  // 3. 五行生克（0-15分）
  const term = qiMenInfo.term;
  const termFiveElement = {
    '立春':'木','雨水':'木','惊蛰':'木','春分':'木','清明':'木','谷雨':'木',
    '立夏':'火','小满':'火','芒种':'火','夏至':'火','小暑':'火','大暑':'火',
    '立秋':'金','处暑':'金','白露':'金','秋分':'金','寒露':'金','霜降':'金',
    '立冬':'水','小雪':'水','大雪':'水','冬至':'水','小寒':'水','大寒':'水'
  };
  const termFe = termFiveElement[term] || '土';
  const frontFe = front.map(n => {
    const fe = ['木','火','土','金','水'][(n-1) % 5];
    return fe;
  });
  let feMatch = 0;
  for (const fe of frontFe) {
    if (fe === termFe) feMatch += 3;
    else if ((fe === '木' && termFe === '土') || (fe === '火' && termFe === '金') ||
             (fe === '土' && termFe === '水') || (fe === '金' && termFe === '木') ||
             (fe === '水' && termFe === '火')) feMatch += 1;
  }
  const feScore = Math.min(15, feMatch * 2);
  score += feScore;
  details.push({ name: '五行生克', score: feScore, max: 15 });
  
  // 4. 大小号偏向（0-10分）
  const frontAvg = frontSum / cfg.frontCount;
  const midPoint = (cfg.frontMax + 1) / 2;
  const sizeBias = Math.abs(frontAvg - midPoint) / midPoint;
  const sizeScore = sizeBias > 0.2 ? 10 : (sizeBias > 0.1 ? 5 : 0);
  score += sizeScore;
  details.push({ name: '大小号偏向', score: sizeScore, max: 10 });
  
  // 5. 奇偶比（0-10分）
  const oddCount = front.filter(n => n % 2 === 1).length;
  const evenCount = cfg.frontCount - oddCount;
  const ratio = Math.abs(oddCount - evenCount);
  const ratioScore = ratio <= 1 ? 10 : (ratio <= 2 ? 5 : 0);
  score += ratioScore;
  details.push({ name: '奇偶比', score: ratioScore, max: 10 });
  
  // 6. 和值区间（0-10分）
  const sumRange = {
    ssq: [80, 120],
    dlt: [60, 100]
  };
  const range = sumRange[type] || [70, 110];
  const inRange = totalSum >= range[0] && totalSum <= range[1];
  const sumScore = inRange ? 10 : (Math.abs(totalSum - (range[0]+range[1])/2) < 20 ? 5 : 0);
  score += sumScore;
  details.push({ name: '和值区间', score: sumScore, max: 10 });
  
  // 7. 跨度（0-5分）
  const span = Math.max(...front) - Math.min(...front);
  const spanScore = span >= 15 && span <= 25 ? 5 : (span >= 10 ? 2 : 0);
  score += spanScore;
  details.push({ name: '跨度', score: spanScore, max: 5 });
  
  // 8. 连号（0-5分）
  let consecutive = 0;
  for (let i = 0; i < front.length - 1; i++) {
    if (front[i+1] - front[i] === 1) consecutive++;
  }
  const conScore = consecutive === 0 ? 5 : (consecutive === 1 ? 3 : 0);
  score += conScore;
  details.push({ name: '连号', score: conScore, max: 5 });
  
  // 9. 后区匹配（0-10分）
  const backSumMod = backSum % 12;
  const juMod = ju % 12;
  const backScore = backSumMod === juMod ? 10 : (Math.abs(backSumMod - juMod) <= 2 ? 5 : 0);
  score += backScore;
  details.push({ name: '后区匹配', score: backScore, max: 10 });
  
  // 10. 天干五合（0-5分）
  const tianGanWuHe = {
    '甲': '己', '乙': '庚', '丙': '辛', '丁': '壬', '戊': '癸',
    '己': '甲', '庚': '乙', '辛': '丙', '壬': '丁', '癸': '戊'
  };
  const shiChen = qiMenInfo.shiChen;
  const shiChenGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][shiChenIndexFromName(shiChen)];
  let wuHeMatch = 0;
  for (const n of front) {
    const nGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][(n-1) % 10];
    if (tianGanWuHe[nGan] === shiChenGan) wuHeMatch++;
  }
  const wuHeScore = wuHeMatch >= 2 ? 5 : (wuHeMatch === 1 ? 2 : 0);
  score += wuHeScore;
  details.push({ name: '天干五合', score: wuHeScore, max: 5 });
  
  return { score, details };
}

function shiChenIndexFromName(name) {
  const names = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  return names.indexOf(name);
}

// ============ 方案生成 ============
function generatePlans(qiMenInfo, type, poolConfig, seedStr) {
  const cfg = LOTTERY_CONFIG[type];
  const rng = seededRandom(seedStr);
  const plans = { A: [], B: [], C: [], L: [] };
  
  // 方案A：奇门驱动
  for (let i = 0; i < poolConfig.A; i++) {
    const front = generateFront(cfg, rng);
    const back = generateBack(cfg, rng);
    plans.A.push({ front, back });
  }
  
  // 方案B：纯随机
  for (let i = 0; i < poolConfig.B; i++) {
    const front = generateFront(cfg, rng);
    const back = generateBack(cfg, rng);
    plans.B.push({ front, back });
  }
  
  // 方案C：混合（奇门+随机）
  for (let i = 0; i < poolConfig.C; i++) {
    const front = generateFront(cfg, rng);
    const back = generateBack(cfg, rng);
    plans.C.push({ front, back });
  }
  
  // 六爻蓝球池
  for (let i = 0; i < poolConfig.L; i++) {
    const back = generateBack(cfg, rng);
    plans.L.push({ back });
  }
  
  return plans;
}

// ============ 回测 ============
function runBacktest(records, type, params) {
  const cfg = LOTTERY_CONFIG[type];
  const results = [];
  const n = Math.min(params.backtestN, records.length - 1);
  
  for (let i = records.length - n - 1; i < records.length - 1; i++) {
    const current = records[i];
    const next = records[i + 1];
    
    // 起局
    const drawDate = parseDateFromIssue(current.issue);
    const qiMen = qiMenZhuanPan(drawDate, params.yinYang, params.juShu, params.yuan);
    
    // 生成方案
    const seedStr = current.issue + qiMen.ju + qiMen.term;
    const plans = generatePlans(qiMen, type, params.pools, seedStr);
    
    // 评估每个方案
    const allPlans = [
      ...plans.A.map((p, idx) => ({ name: `A${idx+1}`, ...p })),
      ...plans.B.map((p, idx) => ({ name: `B${idx+1}`, ...p })),
      ...plans.C.map((p, idx) => ({ name: `C${idx+1}`, ...p }))
    ];
    
    let best = null;
    let bestScore = -1;
    for (const plan of allPlans) {
      const scoreInfo = calcScore(plan.front, plan.back, qiMen, type);
      if (scoreInfo.score > bestScore) {
        bestScore = scoreInfo.score;
        best = { ...plan, scoreInfo };
      }
    }
    
    // 计算命中
    const frontHit = best.front.filter(n => next.front.includes(n)).length;
    const backHit = best.back.filter(n => next.back.includes(n)).length;
    const totalHit = frontHit + backHit;
    
    results.push({
      issue: current.issue,
      nextIssue: next.issue,
      qiMen,
      best,
      frontHit,
      backHit,
      totalHit,
      actualFront: next.front,
      actualBack: next.back
    });
  }
  
  return results;
}

// ============ 预测 ============
function runPredict(records, type, params) {
  const cfg = LOTTERY_CONFIG[type];
  const last = records[records.length - 1];
  const drawDate = parseDateFromIssue(last.issue);
  const qiMen = qiMenZhuanPan(drawDate, params.yinYang, params.juShu, params.yuan);
  
  const seedStr = last.issue + qiMen.ju + qiMen.term;
  const plans = generatePlans(qiMen, type, params.pools, seedStr);
  
  // 评分排序
  const allPlans = [
    ...plans.A.map((p, idx) => ({ name: `A${idx+1}`, ...p })),
    ...plans.B.map((p, idx) => ({ name: `B${idx+1}`, ...p })),
    ...plans.C.map((p, idx) => ({ name: `C${idx+1}`, ...p }))
  ];
  
  const scored = allPlans.map(p => {
    const scoreInfo = calcScore(p.front, p.back, qiMen, type);
    return { ...p, scoreInfo };
  }).sort((a, b) => b.scoreInfo.score - a.scoreInfo.score);
  
  return { qiMen, plans: scored, lastIssue: last.issue };
}

// ============ 日期工具 ============
function parseDateFromIssue(issue) {
  const year = parseInt(issue.substring(0, 4));
  const seq = parseInt(issue.substring(4));
  // 双色球每周二四日，大乐透每周一三六
  const dayOfWeek = issue.length >= 7 ? (seq % 3 + 1) * 2 : (seq % 3 + 1) * 2 - 1;
  const date = new Date(year, 0, 1);
  date.setDate(date.getDate() + (seq - 1) * 3 + dayOfWeek % 7);
  return date;
}

let currentRecords = [];
let currentType = 'ssq';

function loadPreset() {
  const type = document.getElementById('lotteryType').value;
  currentType = type;
  const data = PRESET_DATA[type];
  document.getElementById('historyData').value = data;
  currentRecords = parseLotteryData(data, type);
  const last = currentRecords[currentRecords.length - 1];
  if (last) {
    document.getElementById('currentIssue').value = last.issue;
    const date = parseDateFromIssue(last.issue);
    document.getElementById('drawDate').value = date.toISOString().split('T')[0];
  }
  updateStatus('内置数据已载入 (' + currentRecords.length + '期)');
}

function updateStatus(msg, isOnline = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isOnline ? 'online' : 'offline';
}

function getParams() {
  return {
    yinYang: document.getElementById('yinYang').value,
    juShu: parseInt(document.getElementById('juShu').value) || 0,
    yuan: document.getElementById('yuan').value,
    pools: {

    html += `<div class="row"><label>节气：</label><span>${qiMen.term}</span>`;
    html += `<label>阴阳遁：</label><span>${qiMen.yinYang}遁</span>`;
    html += `<label>局数：</label><span>${qiMen.ju}局</span>`;
    html += `<label>时辰：</label><span>${qiMen.shiChen}时</span></div>`;
    
    html += `<table><tr><th>排名</th><th>方案</th><th>前区</th><th>后区</th><th>评分</th></tr>`;
    plans.slice(0, 10).forEach((p, i) => {
      html += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.front.join(',')}</td><td>${p.back.join(',')}</td><td>${p.scoreInfo.score}</td></tr>`;
    });
    html += `</table>`;
    area.innerHTML = html;
    return;
  }
  
  // 回测结果
  const total = results.length;
  const frontHits = results.reduce((s, r) => s + r.frontHit, 0);
  const backHits = results.reduce((s, r) => s + r.backHit, 0);
  const totalHits = results.reduce((s, r) => s + r.totalHit, 0);
  const avgScore = results.reduce((s, r) => s + r.best.scoreInfo.score, 0) / total;
  
  let html = `<h3>回测结果（${total}期）</h3>`;
  html += `<div class="metrics">`;
  html += `<div class="metric"><div class="value">${frontHits}</div><div class="label">前区总命中</div></div>`;
  html += `<div class="metric"><div class="value">${backHits}</div><div class="label">后区总命中</div></div>`;
  html += `<div class="metric"><div class="value">${totalHits}</div><div class="label">总命中</div></div>`;
  html += `<div class="metric"><div class="value">${(frontHits / (total * cfg.frontCount) * 100).toFixed(1)}%</div><div class="label">前区命中率</div></div>`;
  html += `<div class="metric"><div class="value">${(backHits / (total * cfg.backCount) * 100).toFixed(1)}%</div><div class="label">后区命中率</div></div>`;
  html += `<div class="metric"><div class="value">${avgScore.toFixed(1)}</div><div class="label">平均评分</div></div>`;
  html += `</div>`;
  
  html += `<table><tr><th>期号</th><th>节气</th><th>局数</th><th>最佳方案</th><th>前区命中</th><th>后区命中</th><th>评分</th></tr>`;
  results.forEach(r => {
    html += `<tr>`;
    html += `<td>${r.issue}</td>`;
    html += `<td>${r.qiMen.term}</td>`;
    html += `<td>${r.qiMen.ju}</td>`;
    html += `<td>${r.best.name} [${r.best.front.join(',')} + ${r.best.back.join(',')}]</td>`;
    html += `<td class="${r.frontHit > 0 ? 'hit' : 'miss'}">${r.frontHit}/${cfg.frontCount}</td>`;
    html += `<td class="${r.backHit > 0 ? 'hit' : 'miss'}">${r.backHit}/${cfg.backCount}</td>`;
    html += `<td>${r.best.scoreInfo.score}</td>`;
    html += `</tr>`;
  });
  html += `</table>`;
  
  area.innerHTML = html;
}

function runAnalysis() {
  const params = getParams();
  const type = document.getElementById('lotteryType').value;
  const text = document.getElementById('historyData').value;
  
  currentRecords = parseLotteryData(text, type);
  currentType = type;
  
  if (currentRecords.length < 10) {
    updateStatus('数据不足，至少需要10期');
    return;
  }
  
  updateStatus('分析中...');
  
  setTimeout(() => {
    try {
      if (params.mode === 'predict') {
        const result = runPredict(currentRecords, type, params);
        renderResults({ mode: 'predict', ...result }, type);
      } else {
        const results = runBacktest(currentRecords, type, params);
        renderResults({ mode: 'backtest', results }, type);
      }
      updateStatus('分析完成', true);
    } catch (e) {
      console.error(e);
      updateStatus('错误: ' + e.message);
    }
  }, 100);
}

function exportCSV() {
  const type = document.getElementById('lotteryType').value;
  const text = document.getElementById('historyData').value;
  const records = parseLotteryData(text, type);
  
  if (records.length === 0) {
    updateStatus('无数据可导出');
    return;
  }
  
  let csv = '期号,前区,后区\n';
  records.forEach(r => {
    csv += `${r.issue},${r.front.join(' ')},${r.back.join(' ')}\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${type}_data_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  updateStatus('CSV已导出', true);
}

function resetParams() {
  document.getElementById('yinYang').value = '阳';
  document.getElementById('juShu').value = '0';
  document.getElementById('yuan').value = '上元';
  document.getElementById('poolA').value = '3';
  document.getElementById('poolB').value = '3';
  document.getElementById('poolC').value = '3';
  document.getElementById('poolLiuYao').value = '2';
  document.getElementById('backtestN').value = '20';
  document.getElementById('lookahead').value = '5';
  document.getElementById('randomTrials').value = '3';
  document.getElementById('mode').value = 'backtest';
  updateStatus('参数已重置');
}

// ============ 事件绑定 ============
document.getElementById('btnLoadPreset').addEventListener('click', loadPreset);
document.getElementById('btnRun').addEventListener('click', runAnalysis);
document.getElementById('btnExport').addEventListener('click', exportCSV);
document.getElementById('btnResetParams').addEventListener('click', resetParams);
document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('historyData').value = '';
  currentRecords = [];
  updateStatus('数据已清空');
});

document.getElementById('lotteryType').addEventListener('change', function() {
  loadPreset();
});

// ============ 初始化 ============
loadPreset();
</script>

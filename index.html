<script>
var VERSION = "9.0";
var LOG_BUFFER = [];

function log(m) {
    var e = "[" + new Date().toLocaleTimeString() + "] " + m;
    LOG_BUFFER.push(e);
    if (LOG_BUFFER.length > 300) {
        LOG_BUFFER.shift();
    }
    var l = document.getElementById("logArea");
    if (l) {
        l.innerHTML = LOG_BUFFER.slice(-40).join("<br>");
        l.scrollTop = l.scrollHeight;
    }
}

var TIAN_GAN = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
var DI_ZHI = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
var SIXTY_JIAZI = [];
for (var _ij = 0; _ij < 60; _ij++) {
    SIXTY_JIAZI.push(TIAN_GAN[_ij % 10] + DI_ZHI[_ij % 12]);
}
var LIU_YI_ORDER = ["戊", "己", "庚", "辛", "壬", "癸", "丁", "丙", "乙"];
var JIU_XING = ["天蓬", "天芮", "天冲", "天辅", "天禽", "天心", "天柱", "天任", "天英"];
var BA_MEN = ["休", "死", "伤", "杜", "开", "惊", "生", "景"];
var BA_SHEN = ["值符", "腾蛇", "太阴", "六合", "白虎", "玄武", "九地", "九天"];
var DIZHI_TO_IDX = {子:0, 丑:1, 寅:2, 卯:3, 辰:4, 巳:5, 午:6, 未:7, 申:8, 酉:9, 戌:10, 亥:11};
var XUN_KONG_MAP = {甲子:"戌亥", 甲戌:"申酉", 甲申:"午未", 甲午:"辰巳", 甲辰:"寅卯", 甲寅:"子丑"};
var MA_XING_MAP = {寅:"申", 巳:"亥", 申:"寅", 亥:"巳"};
var RU_MU_MAP = {乙:2, 丙:7, 丁:8, 戊:1, 己:9, 庚:3, 辛:4, 壬:5, 癸:6};
var JI_XING_MAP = {戊:3, 己:2, 庚:8, 辛:7, 壬:4, 癸:9};
var MEN_PO_MAP = {休:1, 生:3, 伤:2, 杜:4, 景:9, 死:8, 惊:7, 开:6};

var JIE_QI_TABLE = [
    ["立春", 2, 4],
    ["雨水", 2, 19],
    ["惊蛰", 3, 6],
    ["春分", 3, 21],
    ["清明", 4, 5],
    ["谷雨", 4, 20],
    ["立夏", 5, 6],
    ["小满", 5, 21],
    ["芒种", 6, 6],
    ["夏至", 6, 21],
    ["小暑", 7, 7],
    ["大暑", 7, 23],
    ["立秋", 8, 7],
    ["处暑", 8, 23],
    ["白露", 9, 8],
    ["秋分", 9, 23],
    ["寒露", 10, 8],
    ["霜降", 10, 23],
    ["立冬", 11, 7],
    ["小雪", 11, 22],
    ["大雪", 12, 7],
    ["冬至", 12, 22],
    ["小寒", 1, 6],
    ["大寒", 1, 20]
];

var YIN_DUN_JIE_QI = ["夏至", "小暑", "大暑", "立秋", "处暑", "白露", "秋分", "寒露", "霜降", "立冬", "小雪", "大雪"];

function isYinSeason(q) {
    return YIN_DUN_JIE_QI.indexOf(q) !== -1;
}

var JU_SHU_MAP = {
    冬至:[1,7,4], 小寒:[2,8,5], 大寒:[3,9,6],
    立春:[8,5,2], 雨水:[9,6,3], 惊蛰:[1,7,4],
    春分:[3,9,6], 清明:[4,1,7], 谷雨:[5,2,8],
    立夏:[4,1,7], 小满:[5,2,8], 芒种:[6,3,9],
    夏至:[9,3,6], 小暑:[8,2,5], 大暑:[7,1,4],
    立秋:[2,5,8], 处暑:[1,4,7], 白露:[9,3,6],
    秋分:[7,1,4], 寒露:[6,9,3], 霜降:[5,8,2],
    立冬:[6,9,3], 小雪:[5,8,2], 大雪:[4,7,1]
};

var LOT_CFG = {
    ssq: {
        name: "双色球",
        fMin: 1,
        fMax: 33,
        fPick: 6,
        bMin: 1,
        bMax: 16,
        bPick: 1,
        openWeekdays: [2, 4, 0],
        openHour: 21,
        openMin: 15,
        idealSum: [90, 145],
        idealSpan: [20, 28],
        idealAC: [6, 10],
        bigLine: 17,
        zoneSplit: [11, 22, 33]
    },
    dlt: {
        name: "大乐透",
        fMin: 1,
        fMax: 35,
        fPick: 5,
        bMin: 1,
        bMax: 12,
        bPick: 2,
        openWeekdays: [1, 3, 6],
        openHour: 21,
        openMin: 25,
        idealSum: [75, 125],
        idealSpan: [20, 30],
        idealAC: [5, 9],
        bigLine: 18,
        zoneSplit: [12, 23, 35]
    }
};

var lastSSQFront = null;
var lastSSQBack = null;
var lastDLTFront = null;
var lastDLTBack = null;
var currentPan = null;

function formatDate(d) {
    return d.getFullYear() + "-" + padZero(d.getMonth() + 1) + "-" + padZero(d.getDate()) + " " + padZero(d.getHours()) + ":" + padZero(d.getMinutes()) + ":" + padZero(d.getSeconds());
}

function padZero(n) {
    return n < 10 ? "0" + n : "" + n;
}

function arraySum(a) {
    var s = 0;
    for (var i = 0; i < a.length; i++) {
        s += a[i];
    }
    return s;
}

function arrayAvg(a) {
    return a.length ? arraySum(a) / a.length : 0;
}

function arraySpan(a) {
    return Math.max.apply(null, a) - Math.min.apply(null, a);
}

function arrayShuffle(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = b[i];
        b[i] = b[j];
        b[j] = t;
    }
    return b;
}

function arrayUnique(a) {
    var o = {};
    for (var i = 0; i < a.length; i++) {
        o[a[i]] = 1;
    }
    return Object.keys(o).map(Number);
}

function countRepeats(c, p) {
    var cnt = 0;
    for (var i = 0; i < c.length; i++) {
        for (var j = 0; j < p.length; j++) {
            if (c[i] === p[j]) {
                cnt++;
            }
        }
    }
    return cnt;
}

function countNeighbors(c, p) {
    var cnt = 0;
    for (var i = 0; i < c.length; i++) {
        for (var j = 0; j < p.length; j++) {
            if (Math.abs(c[i] - p[j]) === 1) {
                cnt++;
            }
        }
    }
    return cnt;
}

function countConsecutivePairs(a) {
    var b = a.slice().sort(function(x, y) { return x - y; });
    var c = 0;
    var i = 0;
    while (i < b.length - 1) {
        if (b[i + 1] - b[i] === 1) {
            c++;
            i += 2;
        } else {
            i++;
        }
    }
    return c;
}

function oddEvenCount(a) {
    var o = 0;
    var e = 0;
    for (var i = 0; i < a.length; i++) {
        if (a[i] % 2) {
            o++;
        } else {
            e++;
        }
    }
    return [o, e];
}

function bigSmallCount(a, l) {
    var b = 0;
    var s = 0;
    for (var i = 0; i < a.length; i++) {
        if (a[i] > l) {
            b++;
        } else {
            s++;
        }
    }
    return [b, s];
}

function calcAC(a) {
    var b = a.slice().sort(function(x, y) { return x - y; });
    var d = {};
    for (var i = 0; i < b.length; i++) {
        for (var j = i + 1; j < b.length; j++) {
            d[b[j] - b[i]] = 1;
        }
    }
    return Object.keys(d).length - (b.length - 1);
}

function countSameTailWithLast(c, p) {
    var cnt = 0;
    for (var i = 0; i < c.length; i++) {
        for (var j = 0; j < p.length; j++) {
            if (c[i] % 10 === p[j] % 10) {
                cnt++;
            }
        }
    }
    return cnt;
}

function zoneDistribution(a, s) {
    var z = [0, 0, 0];
    for (var i = 0; i < a.length; i++) {
        if (a[i] <= s[0]) {
            z[0]++;
        } else if (a[i] <= s[1]) {
            z[1]++;
        } else {
            z[2]++;
        }
    }
    return z;
}
function getCurrentDrawTime(t) {
    var n = new Date();
    var c = LOT_CFG[t];
    var dw = n.getDay();
    var td = c.openWeekdays[0];
    var df = (td - dw + 7) % 7;
    if (df === 0) {
        var cm = n.getHours() * 60 + n.getMinutes();
        var dm = c.openHour * 60 + c.openMin;
        if (cm >= dm) {
            df = 7;
        }
    }
    var dd = new Date(n);
    dd.setDate(dd.getDate() + df);
    dd.setHours(c.openHour, c.openMin, 0, 0);
    log("当前开奖时间：" + formatDate(dd));
    return dd;
}

function findClosestJieQi(y, m, d) {
    var b = JIE_QI_TABLE[0];
    var bd = 365;
    for (var i = 0; i < JIE_QI_TABLE.length; i++) {
        var q = JIE_QI_TABLE[i];
        var dy = m - q[1];
        var dd = d - q[2];
        var dst = Math.abs(dy * 50 + dd);
        if (dst < bd) {
            bd = dst;
            b = q[0];
        }
    }
    log("最近节气：" + b);
    return b;
}

function getDayGanzhi(y, m, d) {
    var base = new Date(1900, 0, 1);
    var target = new Date(y, m - 1, d);
    var ds = Math.round((target - base) / 86400000);
    var r = SIXTY_JIAZI[(ds + 49) % 60];
    log("日干支：" + y + "-" + m + "-" + d + " → " + r);
    return r;
}

function getHourGanzhi(dg, h) {
    var sm = {"甲":0, "乙":2, "丙":4, "丁":6, "戊":8, "己":0, "庚":2, "辛":4, "壬":6, "癸":8};
    var zi = Math.floor((h + 1) / 2) % 12;
    var gi = (sm[dg] + zi) % 10;
    var r = TIAN_GAN[gi] + DI_ZHI[zi];
    log("时干支：" + h + "时 → " + r);
    return r;
}

function getXunShou(gz) {
    var i = SIXTY_JIAZI.indexOf(gz);
    if (i === -1) {
        return "甲子";
    }
    return SIXTY_JIAZI[Math.floor(i / 10) * 10];
}

function getXunKong(gz) {
    var xs = getXunShou(gz);
    return XUN_KONG_MAP[xs] || "戌亥";
}

function getHiddenYi(gz) {
    var xs = getXunShou(gz);
    var mp = {"甲子":"戊", "甲戌":"己", "甲申":"庚", "甲午":"辛", "甲辰":"壬", "甲寅":"癸"};
    return mp[xs] || "戊";
}

function getYuanIndex(dgz) {
    var z = dgz[1];
    if ("子午卯酉".indexOf(z) !== -1) {
        return 0;
    }
    if ("寅申巳亥".indexOf(z) !== -1) {
        return 1;
    }
    return 2;
}

function getJuNumber(jq, dt) {
    var a = JU_SHU_MAP[jq];
    if (!a) {
        return 1;
    }
    var dgz = getDayGanzhi(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
    var idx = getYuanIndex(dgz);
    var ju = a[idx];
    log("局数：" + jq + " 第" + (idx + 1) + "元 → " + ju + "局");
    return ju;
}

function buildPan(lotType) {
    var dt = getCurrentDrawTime(lotType);
    var y = dt.getFullYear();
    var m = dt.getMonth() + 1;
    var d = dt.getDate();
    var h = dt.getHours();
    var jq = findClosestJieQi(y, m, d);
    var yin = isYinSeason(jq);
    var ju = getJuNumber(jq, dt);
    var riGZ = getDayGanzhi(y, m, d);
    var shiGZ = getHourGanzhi(riGZ[0], h);
    var xs = getXunShou(shiGZ);
    var xk = getXunKong(shiGZ);
    var hy = getHiddenYi(shiGZ);
    log("旬首：" + xs + " 旬空：" + xk + " 隐仪：" + hy);
    var zhiFuGong = DIZHI_TO_IDX[xs[1]];
    log("值符落宫(时辰地支)：" + xs[1] + " → 宫" + (zhiFuGong + 1));
    var diPan = {};
    var tianPan = {};
    var baMen = {};
    var baShen = {};
    var liuYiOrder = yin ? LIU_YI_ORDER.slice().reverse() : LIU_YI_ORDER.slice();
    var startIdx = ju - 1;
    for (var i = 0; i < 9; i++) {
        var gongIdx = (startIdx + i) % 9;
        diPan[gongIdx] = liuYiOrder[i];
    }
    log("地盘排布完成，局数=" + ju + " 阴阳=" + (yin ? "阴" : "阳"));
    var shiGan = shiGZ[0];
    var shiZhi = shiGZ[1];
    var shiGanGong = -1;
    for (var k in diPan) {
        if (diPan[k] === shiGan) {
            shiGanGong = parseInt(k);
            break;
        }
    }
    if (shiGanGong === -1) {
        var hyGong = -1;
        for (var kk in diPan) {
            if (diPan[kk] === hy) {
                hyGong = parseInt(kk);
                break;
            }
        }
        shiGanGong = hyGong;
    }
    log("时干" + shiGan + "落宫：" + (shiGanGong + 1));
    tianPan[zhiFuGong] = diPan[zhiFuGong];
    for (var gi = 0; gi < 9; gi++) {
        var srcGong = (zhiFuGong + gi) % 9;
        var tarGong = (shiGanGong + gi) % 9;
        tianPan[tarGong] = diPan[srcGong];
    }
    log("天盘排布完成");
    var menOrder = BA_MEN.slice();
    baMen[zhiFuGong] = menOrder[0];
    for (var mi = 1; mi < 8; mi++) {
        var srcM = (zhiFuGong + mi) % 9;
        var tarM = (shiGanGong + mi) % 9;
        baMen[tarM] = menOrder[mi];
    }
    log("八门排布完成");
    var shenOrder = BA_SHEN.slice();
    baShen[zhiFuGong] = shenOrder[0];
    for (var si = 1; si < 8; si++) {
        var srcS = (zhiFuGong + si) % 9;
        var tarS = (shiGanGong + si) % 9;
        baShen[tarS] = shenOrder[si];
    }
    log("八神排布完成");
    var pan = {
        lotType: lotType,
        dt: dt,
        jq: jq,
        yin: yin,
        ju: ju,
        riGZ: riGZ,
        shiGZ: shiGZ,
        xs: xs,
        xk: xk,
        hy: hy,
        zhiFuGong: zhiFuGong,
        shiGanGong: shiGanGong,
        diPan: diPan,
        tianPan: tianPan,
        baMen: baMen,
        baShen: baShen
    };
    currentPan = pan;
    log("奇门排盘完成！");
    return pan;
}
function getGongNumbers(pan) {
    var nums = {};
    for (var g = 0; g < 9; g++) {
        var di = pan.diPan[g] || "";
        var ti = pan.tianPan[g] || "";
        var men = pan.baMen[g] || "";
        var shen = pan.baShen[g] || "";
        var base = 0;
        if (DIZHI_TO_IDX[di[1]] !== undefined) {
            base += DIZHI_TO_IDX[di[1]] + 1;
        }
        if (DIZHI_TO_IDX[ti[1]] !== undefined) {
            base += DIZHI_TO_IDX[ti[1]] + 1;
        }
        if (men && MEN_PO_MAP[men]) {
            base += MEN_PO_MAP[men];
        }
        if (shen) {
            base += BA_SHEN.indexOf(shen) + 1;
        }
        base += TIAN_GAN.indexOf(di[0]) + 1;
        base += TIAN_GAN.indexOf(ti[0]) + 1;
        var gongNum = ((base % 9) + 9) % 9 + 1;
        nums[g] = gongNum;
    }
    return nums;
}

function getSanQiGongs(pan) {
    var qiGongs = [];
    for (var g = 0; g < 9; g++) {
        var di = pan.diPan[g];
        if (di && "乙丙丁".indexOf(di[0]) !== -1) {
            qiGongs.push({gong: g, type: "三奇", val: di[0]});
        }
        var ti = pan.tianPan[g];
        if (ti && "乙丙丁".indexOf(ti[0]) !== -1) {
            qiGongs.push({gong: g, type: "天三奇", val: ti[0]});
        }
    }
    return qiGongs;
}

function getJiMenGongs(pan) {
    var jiGongs = [];
    for (var g = 0; g < 9; g++) {
        var men = pan.baMen[g];
        if (men && "休生开".indexOf(men) !== -1) {
            jiGongs.push({gong: g, type: "吉门", val: men});
        }
    }
    return jiGongs;
}

function getLiuHeGongs(pan) {
    var liuGongs = [];
    for (var g = 0; g < 9; g++) {
        var shen = pan.baShen[g];
        if (shen === "六合") {
            liuGongs.push({gong: g, type: "六合", val: shen});
        }
    }
    return liuGongs;
}

function getZhiFuGong(pan) {
    return [{gong: pan.zhiFuGong, type: "值符", val: pan.diPan[pan.zhiFuGong] || ""}];
}

function extractKeyGongNumbers(pan) {
    var gongNums = getGongNumbers(pan);
    var keyGongs = [];
    keyGongs = keyGongs.concat(getZhiFuGong(pan));
    keyGongs = keyGongs.concat(getSanQiGongs(pan));
    keyGongs = keyGongs.concat(getJiMenGongs(pan));
    keyGongs = keyGongs.concat(getLiuHeGongs(pan));
    var uniqueGongs = {};
    keyGongs.forEach(function(item) {
        uniqueGongs[item.gong] = true;
    });
    var result = [];
    for (var g in uniqueGongs) {
        result.push({gong: parseInt(g), num: gongNums[g]});
    }
    return result.sort(function(a, b) { return a.gong - b.gong; });
}

function generateBasePool(pan, cfg) {
    var keyNums = extractKeyGongNumbers(pan);
    var pool = [];
    keyNums.forEach(function(item) {
        pool.push(item.num);
    });
    for (var i = 1; i <= 9; i++) {
        if (pool.indexOf(i) === -1) {
            pool.push(i);
        }
    }
    pool = arrayUnique(pool);
    var expanded = [];
    pool.forEach(function(n) {
        expanded.push(n);
        var step = Math.floor((cfg.fMax - cfg.fMin + 1) / 9);
        var mapped = cfg.fMin + (n - 1) * step;
        if (mapped >= cfg.fMin && mapped <= cfg.fMax && expanded.indexOf(mapped) === -1) {
            expanded.push(mapped);
        }
        var mapped2 = cfg.fMax - (9 - n) * step;
        if (mapped2 >= cfg.fMin && mapped2 <= cfg.fMax && expanded.indexOf(mapped2) === -1) {
            expanded.push(mapped2);
        }
    });
    return arrayUnique(expanded).sort(function(a, b) { return a - b; });
}

function zhangWeimingSha(lastFront, lastBack, candidate, cfg) {
    var front = candidate.front;
    var back = candidate.back;
    if (!lastFront || !lastFront.length) {
        return true;
    }
    var repeatCnt = countRepeats(front, lastFront);
    if (repeatCnt > 1) {
        return false;
    }
    var neighborCnt = countNeighbors(front, lastFront);
    if (neighborCnt > 2) {
        return false;
    }
    var tails = {};
    front.forEach(function(n) {
        var t = n % 10;
        tails[t] = (tails[t] || 0) + 1;
    });
    var sameTailCnt = 0;
    for (var t in tails) {
        if (tails[t] > 1) {
            sameTailCnt += tails[t];
        }
    }
    if (sameTailCnt > 2) {
        return false;
    }
    var consecPairs = countConsecutivePairs(front);
    if (consecPairs > 1) {
        return false;
    }
    var zones = zoneDistribution(front, cfg.zoneSplit);
    if (zones[0] < 1 || zones[0] > 4 || zones[1] < 1 || zones[1] > 4 || zones[2] < 1 || zones[2] > 4) {
        return false;
    }
    var oe = oddEvenCount(front);
    if (oe[0] < 1 || oe[0] > 5 || oe[1] < 1 || oe[1] > 5) {
        return false;
    }
    return true;
}

function chuTianyiQin(lastFront, lastBack, candidate, cfg) {
    var front = candidate.front;
    var back = candidate.back;
    var sum = arraySum(front);
    if (sum < cfg.idealSum[0] || sum > cfg.idealSum[1]) {
        return false;
    }
    var span = arraySpan(front);
    if (span < cfg.idealSpan[0] || span > cfg.idealSpan[1]) {
        return false;
    }
    var ac = calcAC(front);
    if (ac < cfg.idealAC[0] || ac > cfg.idealAC[1]) {
        return false;
    }
    var bs = bigSmallCount(front, cfg.bigLine);
    if (bs[0] < 1 || bs[1] < 1) {
        return false;
    }
    if (lastBack && lastBack.length) {
        var backSameTail = countSameTailWithLast(back, lastBack);
        if (backSameTail > 0) {
            return false;
        }
    }
    return true;
}
function runLottery(type, count) {
    count = count || 5;
    var cfg = LOT_CFG[type];
    var lastFront = null;
    var lastBack = null;
    if (type === 'ssq') {
        lastFront = lastSSQFront;
        lastBack = lastSSQBack;
    } else {
        lastFront = lastDLTFront;
        lastBack = lastDLTBack;
    }
    if (!lastFront || !lastBack) {
        log("警告：未注入上期数据，使用随机初始数据");
        lastFront = [];
        lastBack = [];
    }
    log("开始" + cfg.name + "选号，目标" + count + "注");
    var pan = buildPan(type);
    renderGong(pan);
    var keyNums = extractKeyGongNumbers(pan);
    var basePool = generateBasePool(pan, cfg);
    log("初池(奇门取数): [" + basePool.join(",") + "]");
    var results = [];
    var maxAttempts = 8000;
    var attempts = 0;
    while (results.length < count && attempts < maxAttempts) {
        attempts++;
        var candidateFront = [];
        var poolCopy = basePool.slice();
        for (var fi = 0; fi < cfg.fPick; fi++) {
            if (poolCopy.length === 0) {
                break;
            }
            var idx = Math.floor(Math.random() * poolCopy.length);
            candidateFront.push(poolCopy[idx]);
            poolCopy.splice(idx, 1);
        }
        if (candidateFront.length !== cfg.fPick) {
            continue;
        }
        candidateFront.sort(function(a, b) { return a - b; });
        var candidateBack = [];
        for (var bi = 0; bi < cfg.bPick; bi++) {
            var bNum = cfg.bMin + Math.floor(Math.random() * (cfg.bMax - cfg.bMin + 1));
            candidateBack.push(bNum);
        }
        candidateBack.sort(function(a, b) { return a - b; });
        var candidate = {front: candidateFront, back: candidateBack};
        if (!zhangWeimingSha(lastFront, lastBack, candidate, cfg)) {
            continue;
        }
        if (!chuTianyiQin(lastFront, lastBack, candidate, cfg)) {
            continue;
        }
        results.push(candidate);
    }
    log("选号完成，共生成" + results.length + "注");
    renderResults(type, results, pan, keyNums);
    updateStatBar(type, results);
    return results;
}

function renderGong(pan) {
    var container = document.getElementById("gongContainer");
    if (!container) {
        return;
    }
    var html = "";
    for (var g = 0; g < 9; g++) {
        var di = pan.diPan[g] || "";
        var ti = pan.tianPan[g] || "";
        var men = pan.baMen[g] || "";
        var shen = pan.baShen[g] || "";
        var tags = "";
        if (shen === "值符") {
            tags += '<span class="g-tag tag-zf">值符</span>';
        }
        if (di && "乙丙丁".indexOf(di[0]) !== -1) {
            tags += '<span class="g-tag tag-qi">三奇</span>';
        }
        if (ti && "乙丙丁".indexOf(ti[0]) !== -1) {
            tags += '<span class="g-tag tag-qi">天三奇</span>';
        }
        if (men && "休生开".indexOf(men) !== -1) {
            tags += '<span class="g-tag tag-ji">吉门</span>';
        }
        if (shen === "六合") {
            tags += '<span class="g-tag tag-zf">六合</span>';
        }
        html += '<div class="gong-cell">';
        html += '<div class="g-num">宫' + (g + 1) + '</div>';
        html += '<div class="g-main">' + di + '</div>';
        html += '<div class="g-sub">天:' + ti + ' 门:' + men + '</div>';
        html += '<div class="g-sub">神:' + shen + '</div>';
        html += '<div>' + tags + '</div>';
        html += '</div>';
    }
    container.innerHTML = html;
}

function renderResults(type, results, pan, keyNums) {
    var out = document.getElementById("mainOutput");
    var cfg = LOT_CFG[type];
    var html = '<div class="hl-gold">═══ ' + cfg.name + ' 精选 ' + results.length + ' 注 ═══</div>';
    html += '<div class="info-line">排盘时间：' + formatDate(pan.dt) + ' | ' + pan.jq + ' ' + pan.ju + '局</div>';
    html += '<div class="info-line">值符宫' + (pan.zhiFuGong + 1) + ' 时干宫' + (pan.shiGanGong + 1) + '</div>';
    html += '<div class="info-line">关键宫位取数：';
    keyNums.forEach(function(item) {
        html += '宫' + (item.gong + 1) + '→' + item.num + ' ';
    });
    html += '</div>';
    html += '<div class="hl-gold">══════════════</div>';
    for (var i = 0; i < results.length; i++) {
        var r = results[i];
        var frontStr = r.front.map(function(n) { return n < 10 ? "0" + n : "" + n; }).join(" ");
        var backStr = r.back.map(function(n) { return n < 10 ? "0" + n : "" + n; }).join(" ");
        var sum = arraySum(r.front);
        var span = arraySpan(r.front);
        var ac = calcAC(r.front);
        var oe = oddEvenCount(r.front);
        var bs = bigSmallCount(r.front, cfg.bigLine);
        html += '<div style="background:#131b32;border-radius:6px;padding:8px 12px;margin:6px 0;border-left:3px solid ' + (type === 'ssq' ? '#e74c3c' : '#3498db') + '">';
        html += '<div style="font-size:16px;font-weight:700;color:#f5c542;">第' + (i + 1) + '注</div>';
        html += '<div><span class="hl-green">前区:</span> <span style="font-size:18px;font-weight:700;color:#e5e7eb;">' + frontStr + '</span></div>';
        html += '<div><span class="hl-blue">后区:</span> <span style="font-size:16px;font-weight:600;color:#93c5fd;">' + backStr + '</span></div>';
        html += '<div class="info-line">和值' + sum + ' | 跨度' + span + ' | AC' + ac + ' | 奇偶' + oe[0] + ':' + oe[1] + ' | 大小' + bs[0] + ':' + bs[1] + '</div>';
        html += '</div>';
    }
    html += '<div class="hl-gold">══════════════</div>';
    out.innerHTML = html;
}

function updateStatBar(type, results) {
    var bar = document.getElementById("statBar");
    if (!bar || !results.length) {
        return;
    }
    var cfg = LOT_CFG[type];
    var allFront = [];
    results.forEach(function(r) {
        allFront = allFront.concat(r.front);
    });
    var avgSum = 0;
    var avgSpan = 0;
    var avgAC = 0;
    results.forEach(function(r) {
        avgSum += arraySum(r.front);
        avgSpan += arraySpan(r.front);
        avgAC += calcAC(r.front);
    });
    avgSum = Math.round(avgSum / results.length);
    avgSpan = Math.round(avgSpan / results.length);
    avgAC = Math.round(avgAC * 10) / 10;
    var html = '';
    html += '<span>彩种：' + cfg.name + '</span>';
    html += '<span>注数：' + results.length + '</span>';
    html += '<span>平均和值：' + avgSum + '</span>';
    html += '<span>平均跨度：' + avgSpan + '</span>';
    html += '<span>平均AC：' + avgAC + '</span>';
    html += '<span>号码范围：' + cfg.fMin + '-' + cfg.fMax + '</span>';
    bar.innerHTML = html;
}

function setRealLastData() {

function exportResult() {
    var out = document.getElementById("mainOutput");
    var text = out ? out.innerText || out.textContent : "";
    if (!text || text.indexOf("═══") === -1) {
        alert("没有可导出的结果，请先生成选号");
        return;
    }
    var blob = new Blob([text], {type: "text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "奇门遁甲V9_选号结果_" + new Date().toISOString().slice(0, 10) + ".txt";
    a.click();
    URL.revokeObjectURL(url);
    log("结果已导出");
}

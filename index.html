// ===================== 基础常量【先后天八卦核心参数】 =====================
const ganArr = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const zhiArr = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const gan5Map = {"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
// 九宫：后天数、先天数、五行本数
const gongMeta = {
    1:{name:"坎一宫",hou:1,xian:6,wuXing:"水",benShu:[1,6]},
    2:{name:"坤二宫",hou:2,xian:8,wuXing:"土",benShu:[2,5,8,10]},
    3:{name:"震三宫",hou:3,xian:4,wuXing:"木",benShu:[3,4,8]},
    4:{name:"巽四宫",hou:4,xian:5,wuXing:"木",benShu:[3,4,5,8]},
    5:{name:"中五宫",hou:5,xian:0,wuXing:"土",benShu:[5,10]},
    6:{name:"乾六宫",hou:6,xian:1,wuXing:"金",benShu:[1,4,6,9]},
    7:{name:"兑七宫",hou:7,xian:2,wuXing:"金",benShu:[2,4,7,9]},
    8:{name:"艮八宫",hou:8,xian:7,wuXing:"土",benShu:[5,7,8,10]},
    9:{name:"离九宫",hou:9,xian:3,wuXing:"火",benShu:[3,9]}
};
const liuYiSanQi = ["戊","己","庚","辛","壬","癸","丁","丙","乙"];
const baMen = ["休","生","伤","杜","景","死","惊","开"];
const jiuXing = ["蓬","芮","冲","辅","禽","心","柱","任","英"];
const JQ_JU = {
    "冬至":[1,7,4],"小寒":[2,8,5],"大寒":[3,9,6],
    "立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],
    "春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],
    "立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9],
    "夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],
    "立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],
    "秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],
    "立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]
};
const jqDate = [
    ["冬至",12,22],["小寒",1,6],["大寒",1,20],["立春",2,4],["雨水",2,19],["惊蛰",3,6],
    ["春分",3,21],["清明",4,5],["谷雨",4,20],["立夏",5,6],["小满",5,21],["芒种",6,6],
    ["夏至",6,22],["小暑",7,7],["大暑",7,23],["立秋",8,8],["处暑",8,23],["白露",9,8],
    ["秋分",9,23],["寒露",10,8],["霜降",10,23],["立冬",11,7],["小雪",11,22],["大雪",12,7]
];
const luShuOrder = [4,9,2,3,5,7,8,1,6];

let pan = null;
let historyPool = [];
let topQianPool = [];
let numToGong = {};

// 自动获取最近开奖时间
function autoGetDrawTime(gameType){
    const now = new Date();
    const w = now.getDay();
    let drawWeekDays, drawHM;
    if(gameType === "ssq"){
        drawWeekDays = [0,2,4];
        drawHM = "21:15";
    }else{
        drawWeekDays = [1,3,6];
        drawHM = "21:25";
    }
    let targetW = null;
    for(let d of drawWeekDays){
        if(d >= w){ targetW = d;break; }
    }
    if(targetW === null) targetW = drawWeekDays[0];
    const deltaDay = (targetW - w +7) %7;
    const drawDate = new Date(now);
    drawDate.setDate(now.getDate() + deltaDay);
    const [h,m] = drawHM.split(":");
    drawDate.setHours(h,m,0,0);
    if(drawDate < now) drawDate.setDate(drawDate.getDate()+7);
    const dStr = drawDate.toISOString().split('T')[0];
    return {date:dStr, time:drawHM};
}
function autoFillTime(){
    const res = autoGetDrawTime(document.getElementById("gameSel").value);
    document.getElementById("dateInput").value = res.date;
    document.getElementById("timeInput").value = res.time;
}

function getGanIndex(g){ return ganArr.indexOf(g); }
function getZhiIndex(z){ return zhiArr.indexOf(z); }
function wuShuDun(riGan){
    const map = {"甲":0,"己":0,"乙":2,"庚":2,"丙":4,"辛":4,"丁":6,"壬":6,"戊":8,"癸":8};
    const start = map[riGan];
    const shiZhiMap = {};
    for(let i=0;i<12;i++) shiZhiMap[zhiArr[i]] = ganArr[(start+i)%10];
    return shiZhiMap;
}
function getXunKong(gan,zhi){
    const gIdx = getGanIndex(gan);
    const zIdx = getZhiIndex(zhi);
    const sum = (zIdx - gIdx + 12) %12;
    let xunHeadZhiIdx;
    if(sum ===0) xunHeadZhiIdx=0;
    else if(sum===2) xunHeadZhiIdx=2;
    else if(sum===4) xunHeadZhiIdx=4;
    else if(sum===6) xunHeadZhiIdx=6;
    else if(sum===8) xunHeadZhiIdx=8;
    else if(sum===10) xunHeadZhiIdx=10;
    else return {xun:"",kong:""};
    const xunGan = ganArr[xunHeadZhiIdx%10];
    const xunZhi = zhiArr[xunHeadZhiIdx];
    const kong1 = zhiArr[(xunHeadZhiIdx +10)%12];
    const kong2 = zhiArr[(xunHeadZhiIdx +11)%12];
    return {xun:xunGan+xunZhi, kong:kong1+kong2};
}
function getJieQiAndYinYang(dateObj){
    const m = dateObj.getMonth()+1;
    const d = dateObj.getDate();
    let isYang = true;
    if( (m>6 && m<12) || (m===6 && d>=22) || (m===12 && d<22) ) isYang = false;
    let jqName = "";
    for(let j of jqDate){
        const [name,jm,jd] = j;
        if(m === jm && d >= jd){ jqName = name;break; }
    }
    if(!jqName){
        for(let j of jqDate){
            const [name,jm,jd] = j;
            if(m === jm){ jqName = name; break; }
        }
    }
    return {jqName, isYang};
}
function getSanYuan(riZhi){
    if(["子","午","卯","酉"].includes(riZhi)) return 0;
    if(["寅","申","巳","亥"].includes(riZhi)) return 1;
    return 2;
}
function getRedBallClass(s){
    if(s >=40) return "ball-red-high";
    if(s >=20) return "ball-red-mid";
    return "ball-red-low";
}
function getBlueBallClass(s){
    if(s >=40) return "ball-blue-high";
    if(s >=20) return "ball-blue-mid";
    return "ball-blue-low";
}

// ===================== 指标计算函数：AC、跨度、余数、奇偶、大小 =====================
function calcAC(arr){
    const diffs = new Set();
    for(let i=0;i<arr.length;i++){
        for(let j=i+1;j<arr.length;j++){
            diffs.add(Math.abs(arr[i]-arr[j]));
        }
    }
    return diffs.size - (arr.length - 1);
}
function calcSpan(arr){
    return Math.max(...arr) - Math.min(...arr);
}
function calcMod3(arr){
    let r0=0,r1=0,r2=0;
    arr.forEach(n=>{
        const m = n%3;
        if(m===0) r0++;
        else if(m===1) r1++;
        else r2++;
    })
    return {r0,r1,r2};
}
function calcMod4(arr){
    let r0=0,r1=0,r2=0,r3=0;
    arr.forEach(n=>{
        const m = n%4;
        if(m===0)r0++;else if(m===1)r1++;else if(m===2)r2++;else r3++;
    })
    return {r0,r1,r2,r3};
}
function calcOddEven(arr){
    let odd=0,even=0;
    arr.forEach(n=>n%2===1?odd++:even++);
    return {odd,even};
}
function calcBigSmall(arr,maxN){
    const mid = maxN/2;
    let big=0,small=0;
    arr.forEach(n=>n>mid?big++:small++);
    return {big,small};
}

// ===================== 【重构】奇门宫打分：加入先后天、伏吟反吟 =====================
function calcScoreFull(panObj,gongNo,cfg){
    let score = 0;
    const dg = panObj.dipan[gongNo];
    const tx = panObj.tianPan[gongNo];
    const mn = panObj.menPan[gongNo];
    const kw = panObj.kongWang.includes(dg);
    const gongInfo = gongMeta[gongNo];
    const gan5D = gan5Map[dg];
    const gan5S = gan5Map[panObj.shiGan];

    // 先后天、宫五行基础分
    if(gongInfo.wuXing === gan5S) score +=14;
    // 生克
    if( (gan5S === "木" && gan5D === "水") ||
        (gan5S === "火" && gan5D === "木") ||
        (gan5S === "土" && gan5D === "火") ||
        (gan5S === "金" && gan5D === "土") ||
        (gan5S === "水" && gan5D === "金") ){
        score += 32;
    }
    if( (gan5S === "木" && gan5D === "火") ||
        (gan5S === "火" && gan5D === "土") ||
        (gan5S === "土" && gan5D === "金") ||
        (gan5S === "金" && gan5D === "水") ||
        (gan5S === "水" && gan5D === "木") ){
        score += 14;
    }
    // 九星
    if(["蓬","任","冲","辅"].includes(tx)) score +=12;
    if(["英","芮","柱"].includes(tx)) score +=6;
    if(tx === "心") score +=16;
    if(tx === "禽") score +=18;
    // 八门
    if(["开","休","生"].includes(mn)) score +=18;
    if(["杜","景"].includes(mn)) score +=10;
    if(["伤","惊"].includes(mn)) score +=4;
    if(mn === "死") score -=8;
    // 空亡
    if(kw && !cfg.chkHuiLiu) score -=28;
    // 伏吟：天盘星=本宫本位星；反吟对冲宫加分
    const benXingMap = {1:"蓬",2:"芮",3:"冲",4:"辅",5:"禽",6:"心",7:"柱",8:"任",9:"英"};
    const duiGong = {1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4,5:5};
    if(tx === benXingMap[gongNo]) score -=12; //伏吟减分
    if(tx === benXingMap[duiGong[gongNo]]) score +=10; //反吟
    if(score < 0) score = 0;
    return {score:score, kw:kw, gongInfo:gongInfo};
}

    }
    const menPan = {};

    for(let g=1;g<=9;g++){
        const offset = (g - shiGanGong +9)%8;
        menPan[g] = baMen[(menStart + offset)%8];
    }
    const pan = {
        yang: isYang, ju: ju, jq: jqName,
        shiGan: shiGan, shiZhi: shiZhi, riGan: riGan, riZhi: riZhi,
        xun: xunInfo.xun, kongWang: xunInfo.kong,
        dipan: dipan, tianPan: tianPan, menPan: menPan
    };

`✅拆补转盘排盘结果

}

function buildAutoCfg(panObj,gameType){

    cfg.chkLunZhuan = maxLunStep > 0;
    cfg.lunMode = "merge";

    cfg.useWeightCurve = true;
    cfg.sigma = 1.8;
    if(gameType === "ssq"){
        cfg.takeQian = 6; cfg.takeHou = 2; cfg.houMax =16;
        cfg.spanMin =12; cfg.spanMax=28; cfg.oddRateLow=0.3; cfg.oddRateHigh=0.7;
        cfg.acMin=3; cfg.acMax=10;
        cfg.maxNum=33;
    }else{
        cfg.takeQian =5; cfg.takeHou =2; cfg.houMax=12;

// 【改动：从宫的先后天本数取种子号码，绑定宫号】
function dynGetNumFromGong(gongMetaItem, dg, tx, mn, seedWuXing, isQian, houMax, maxQianNum){
    const out = new Set();
    const baseList = gongMetaItem.benShu.map(x=>x);
    // 扩展：基于先后天数字循环映射到号码区间
    function mapToRange(n,upper){
        let v = n;
        while(v>upper) v -= upper;
        while(v<1) v += upper;
        return v;
    }
    const seedCode = {木:11,火:22,土:33,金:44,水:55}[seedWuXing];
    let baseSeed = gongMetaItem.hou * 100 + seedCode + dg.charCodeAt(0) + tx.charCodeAt(0) + mn.charCodeAt(0);
    function rnd(seedIn){
        let x = Math.sin(seedIn++) * 10000;
        return x - Math.floor(x);
    }
    if(isQian){
        // 优先取宫先天后天本数映射，再随机补
        for(let n of baseList){
            const mv = mapToRange(n,maxQianNum);
            out.add(mv);
        }
        while(out.size < 4){
            baseSeed += 1;
            const v = Math.floor(rnd(baseSeed) * maxQianNum)+1;
            out.add(v);
        }
    }else{
        while(out.size < 2){
            baseSeed += 1;
            const v = Math.floor(rnd(baseSeed) * houMax)+1;
            out.add(v);
        }
    }
    return Array.from(out).sort((a,b)=>a-b);
}

// 完整过滤：AC、跨度、奇偶、余数、区间
function filterFull(qianArr,cfg){
    const arr = [...qianArr].sort((a,b)=>a-b);
    const minV = arr[0];
    const maxV = arr[arr.length-1];
    const span = maxV - minV;
    if(span < cfg.spanMin || span > cfg.spanMax) return false;
    const oe = calcOddEven(arr);
    const oddRate = oe.odd / arr.length;
    if(oddRate < cfg.oddRateLow || oddRate > cfg.oddRateHigh) return false;
    const ac = calcAC(arr);
    if(ac < cfg.acMin || ac > cfg.acMax) return false;
    const mod3 = calcMod3(arr);
    // 除三余0/1/2 不能出现0个
    if(mod3.r0===0 || mod3.r1===0 || mod3.r2===0) return false;
    // 区间三分不空
    const q1 = arr.filter(x=>x>=1&&x<=11).length;
    const q2 = arr.filter(x=>x>=12&&x<=22).length;
    const q3 = arr.filter(x=>x>=23&&x<=33).length;
    if(q1===0 || q2===0 || q3===0) return false;
    // 三连号禁止
    let lianCnt = 1,maxLian=1;
    for(let i=1;i<arr.length;i++){
        if(arr[i] === arr[i-1]+1){
            lianCnt++;
            if(lianCnt>maxLian) maxLian=lianCnt;
        }else lianCnt=1;
    }
    if(maxLian >=3) return false;
    return true;
}

function weightedPick(pool,takeCnt,sigma){
    const res=[];
    const src=[...pool];
    const totalScore = src.reduce((s,it)=>s+it.score,0);
    if(totalScore <= 0){
        for(let i=0;i<takeCnt && src.length>0;i++){
            const rIdx = Math.floor(Math.random()*src.length);
            res.push(src.splice(rIdx,1)[0]);
        }
        return res.map(x=>x.num);
    }
    for(let i=0;i<takeCnt && src.length>0;i++){
        const sum=src.reduce((s,it)=>s+it.score,0);
        let r=Math.random()*sum;
        for(let j=0;j<src.length;j++){
            r -= src[j].score;
            if(r<=0){
                res.push(src.splice(j,1)[0]);
                break;
            }
        }
    }
    return res.map(x=>x.num);
}
function calcHitCount(pickArr,hisArr){
    return pickArr.filter(n=>hisArr.includes(n)).length;
}

// 组合生成器
function combinations(arr, k){
    let res = [];
    function dfs(start, path){
        if(path.length === k){
            res.push([...path]);
            return;
        }
        for(let i=start;i<arr.length;i++){
            path.push(arr[i]);
            dfs(i+1,path);
            path.pop();
        }
    }
    dfs(0,[]);
    return res;
}

// ===================== 【新版】奇门宫关系校验核心函数：对冲、隔宫、三合、三刑 =====================
function checkQimenRule(numList, num2gongMap, mode, noSameGong){
    const gongList = numList.map(n=>num2gongMap[n]);
    const gongSet = new Set(gongList);
    const gArr = Array.from(gongSet);
    // 禁止同宫多号
    if(noSameGong === "noSameGong"){
        if(gongList.length !== gongSet.size) return {ok:false,msg:"同宫多个号码，伏吟，驳回"};
    }
    let hasOpp = false;
    let hasSkip = false;
    let hitSanHe = null;
    let hitSanXing = null;
    for(let a of gArr){
        for(let b of gArr){
            if(a===b) continue;
            if(gongOpposite[a] === b) hasOpp=true;
            if(gongSkip[a] && gongSkip[a].includes(b)) hasSkip=true;
        }
    }
    // 检查三合
    for(let sh of sanHeGroups){
        const inter = sh.g.filter(g=>gArr.includes(g));
        if(inter.length >=2){
            hitSanHe = sh.name;
            break;
        }
    }
    // 检查三刑
    for(let xg of sanXingGroups){
        const inter = xg.g.filter(g=>gArr.includes(g));
        if(inter.length >=2){
            hitSanXing = xg.name;
            break;
        }
    }
    let ok = false;
    let note = "";
    switch(mode){
        case "qimen_opp":
            ok = hasOpp; note = hasOpp?"✅对冲宫":""; break;
        case "qimen_skip":
            ok = hasSkip; note = hasSkip?"✅隔宫":""; break;
        case "qimen_mix":
            ok = hasOpp || hasSkip; note = (hasOpp?"✅对冲宫 ":"")+(hasSkip?"✅隔宫 ":""); break;
        case "qimen_sanhe":
            ok = !!hitSanHe; note = hitSanHe ? `✅三合：${hitSanHe}` : ""; break;
        case "qimen_sanxing":
            ok = !!hitSanXing; note = hitSanXing ? `✅三刑：${hitSanXing}` : ""; break;
        case "qimen_sanhe_opp":
            ok = !!hitSanHe || hasOpp; note = (hitSanHe?`✅三合：${hitSanHe} `:"")+(hasOpp?"✅对冲":""); break;
        case "qimen_sanhe_xing":
            ok = !!hitSanHe || !!hitSanXing; note = (hitSanHe?`✅三合：${hitSanHe} `:"")+(hitSanXing?`✅三刑：${hitSanXing}`:""); break;
        default:
            ok = true; note = "";
    }
    if(!ok) return {ok:false,msg:"不满足当前奇门矩阵规则"};
    return {ok:true, msg:note, gongList:gongList};
}

// 奇门矩阵生成
function qimenWheelGen(poolItemList, num2gongMap, selectK, guaranteeK, matrixMode, gongRule){
    const poolNums = poolItemList.map(x=>x.num);
    const fullCom = combinations(poolNums, selectK);
    const wheel = [];
    const covered = new Set();
    for(let c of fullCom){
        const chk = checkQimenRule(c, num2gongMap, matrixMode, gongRule);
        if(!chk.ok) continue;
        const sub = combinations(c, guaranteeK);
        let ok = false;
        for(let s of sub){
            const key = s.sort((a,b)=>a-b).join(",");
            if(!covered.has(key)){ ok=true;break; }
        }
        if(ok){
            wheel.push({nums:c, gongRel:chk.msg, gongs:chk.gongList});
            sub.forEach(s=>covered.add(s.sort((a,b)=>a-b).join(",")));
        }
        if(covered.size >= combinations(poolNums,guaranteeK).length) break;
    }
    return wheel;
}

// ========== 推演函数 ==========
function runTuiYan(){
    if(!pan){ alert("⚠️请先点击【起奇门真盘】！"); return; }
    clearLog();
    const game = document.getElementById("gameSel").value;
    const cfg = buildAutoCfg(pan, game);
    appendLog("===== 配置加载完成｜先后天+AC+余数过滤开启 ====");
    const txt = document.getElementById("historyText").value.trim();
    historyPool = [];
    if(txt){
        const lines = txt.split("\n");
        lines.forEach(line=>{
            line = line.trim();
            if(!line) return;
            const sp = line.split("+");
            const qian = sp[0].split(",").map(Number).filter(x=>!isNaN(x));
            const hou = sp[1] ? sp[1].split(",").map(Number).filter(x=>!isNaN(x)) : [];
            historyPool.push({qian,hou});
        })
    }
    const panList = [];
    if(cfg.chkLunZhuan){
        const maxLunStep = 3;
        for(let s=1;s<=maxLunStep;s++){
            const lp = lunZhuanPan(pan,s,pan.yang);
            panList.push({pan:lp,tag:"轮转第"+s+"步"});
        }
    }else{
        panList.push({pan:pan,tag:"本局"});
    }
    let allQianPool = [];
    let allHouPool = [];
    numToGong = {};
    for(let pItem of panList){
        const p = pItem.pan;
        const seed = gan5Map[p.shiGan];
        for(let g=1;g<=9;g++){
            const sc = calcScoreFull(p,g,cfg);
            const dg = p.dipan[g];
            const tx = p.tianPan[g];
            const mn = p.menPan[g];
            const gongInfo = sc.gongInfo;
            appendLog(`【${gongInfo.name}】先天:${gongInfo.xian} 后天:${gongInfo.hou} 本数:${gongInfo.benShu}｜得分:${sc.score}`);
            const qNums = dynGetNumFromGong(gongInfo, dg, tx, mn, seed, true, cfg.houMax, cfg.maxNum);
            const hNums = dynGetNumFromGong(gongInfo, dg, tx, mn, seed, false, cfg.houMax, cfg.maxNum);
            if(cfg.chkKong && sc.kw && !cfg.chkHuiLiu) continue;
            qNums.forEach(n=>{
                const exist = allQianPool.find(x=>x.num === n);
                if(!exist){
                    allQianPool.push({num:n, score:sc.score});
                    numToGong[n] = g;
                }else if(sc.score > exist.score) exist.score = sc.score;
            });
            if(cfg.chkHouQiMen){
                hNums.forEach(n=>{
                    const exist = allHouPool.find(x=>x.num === n);
                    if(!exist) allHouPool.push({num:n, score:sc.score});
                    else if(sc.score > exist.score) exist.score = sc.score;
                });
            }
        }
    }
    allQianPool.sort((a,b)=>b.score - a.score);
    allHouPool.sort((a,b)=>b.score - a.score);
    topQianPool = allQianPool.map(x=>x.num);

    let poolHtml = "";
    poolHtml += `<div><b>前区总池（高分红｜中分黄｜低分绿）</b></div>`;
    poolHtml += `<div class="ball-wrap">`;
    allQianPool.forEach(x=>{
        const cls = getRedBallClass(x.score);
        poolHtml += `<span class="${cls}">${String(x.num).padStart(2,'0')}</span>`;
    })
    poolHtml += `</div>`;
    poolHtml += `<div style="margin-top:12px"><b>后区总池</b></div>`;
    poolHtml += `<div class="ball-wrap">`;
    allHouPool.forEach(x=>{
        const cls = getBlueBallClass(x.score);
        poolHtml += `<span class="${cls}">${String(x.num).padStart(2,'0')}</span>`;
    })
    poolHtml += `</div>`;
    document.getElementById("poolBox").innerHTML = poolHtml;

    const fiveZhu = [];
    for(let z=0;z<5;z++){
        let qianSel = weightedPick(allQianPool, cfg.takeQian, cfg.sigma);
        let houSel = cfg.chkHouQiMen ? weightedPick(allHouPool, cfg.takeHou, cfg.sigma) : [];
        qianSel.sort((a,b)=>a-b);
        houSel.sort((a,b)=>a-b);
        const pass = filterFull(qianSel,cfg);
        const ac = calcAC(qianSel);
        const span = calcSpan(qianSel);
        const mod3 = calcMod3(qianSel);
        const oe = calcOddEven(qianSel);
        const hitArr = [];
        historyPool.forEach(his=> hitArr.push(calcHitCount(qianSel, his.qian)) );
        fiveZhu.push({
            zhuNo:z+1, qian:qianSel, hou:houSel, pass, hitArr,
            ac,span,mod3,oe
        });
    }
    let fiveHtml = "";
    fiveZhu.forEach(z=>{
        let qianStr = z.qian.map(n=>{
            const item = allQianPool.find(x=>x.num === n);
            const cls = getRedBallClass(item.score);
            return `<span class="${cls}">${String(n).padStart(2,'0')}</span>`;
        }).join('');
        let houStr = z.hou.map(n=>{
            const item = allHouPool.find(x=>x.num === n);
            const cls = getBlueBallClass(item.score);
            return `<span class="${cls}">${String(n).padStart(2,'0')}</span>`;
        }).join('');
        fiveHtml += `<div class="zhu-item">
<b>第${z.zhuNo}柱</b> ${z.pass ? '<span style="color:#22c55e">✅指标校验通过</span>' : '<span style="color:#f87171">❌过滤不通过</span>'}<br>
<div class="info-line">AC:${z.ac} 跨度:${z.span}｜奇偶:${z.oe.odd}:${z.oe.even}｜除三余0:${z.mod3.r0} 余1:${z.mod3.r1} 余2:${z.mod3.r2}</div>
<div class="ball-wrap">前区：${qianStr}</div>
${houStr ? `<div class="ball-wrap">后区：${houStr}</div>`:''}
<br>历史命中：${z.hitArr.join(' | ')}
</div>`;
    })
    document.getElementById("fiveZhuBox").innerHTML = fiveHtml;

    let hitTableHtml = `<table class="hit-table"><tr><th>序号</th><th>历史开奖</th></tr>`;
    historyPool.forEach((his,hi)=>{
        const line = his.qian.join(',') + (his.hou.length>0 ? '+'+his.hou.join(',') : '');
        hitTableHtml += `<tr><td>${hi+1}</td><td>${line}</td></tr>`;
    })
    hitTableHtml += `</table>`;
    document.getElementById("hitTableBox").innerHTML = hitTableHtml;
    document.getElementById("wheelBox").innerText = "";
    appendLog("\n🎉推演完成；可点击【生成奇门宫位矩阵】");
}

function doWheel(){
    if(topQianPool.length===0){ alert("请先执行【启动QDIM推演】，拿到高分池！"); return; }
    const game = document.getElementById("gameSel").value;
    const take = game==="ssq"?6:5;
    const poolCnt = Number(document.getElementById("wheelPoolCnt").value);
    const guarantee = Number(document.getElementById("wheelGuarantee").value);
    const matrixMode = document.getElementById("matrixMode").value;
    const gongRule = document.getElementById("qimenRule").value;

    const usePoolRaw = topQianPool.slice(0,poolCnt);
    const usePoolItem = usePoolRaw.map(n=>({num:n}));

    let wheelList;
    if(matrixMode === "normal"){
        wheelList = wheelGen(usePoolItem, take, guarantee);
        let out = `==== 普通旋转矩阵：候选池前${poolCnt}个，取${take}保中${guarantee} ====\n`;
        wheelList.forEach((arr,idx)=>{
            out += `${idx+1}: ${arr.map(x=>String(x).padStart(2,'0')).join(',')}\n`;
        })
        document.getElementById("wheelBox").innerText = out;
        appendLog(`✅普通矩阵生成，共${wheelList.length}注`);
    }else{
        wheelList = qimenWheelGen(usePoolItem, numToGong, take, guarantee, matrixMode, gongRule);
        let out = `==== 奇门宫位矩阵｜模式:${matrixMode}｜候选前${poolCnt}｜取${take}保${guarantee} ====\n`;
        wheelList.forEach((it,idx)=>{
            out += `${idx+1}: ${it.nums.map(x=>String(x).padStart(2,'0')).join(',')} ｜宫关系：${it.gongRel} 归属宫:${it.gongs.join(',')}\n`;
        })
        document.getElementById("wheelBox").innerText = out;
        appendLog(`✅奇门对冲/隔宫/三合/三刑矩阵生成，共${wheelList.length}注`);
    }
}
// 普通矩阵保留
function wheelGen(poolNumbers, selectK, guaranteeK){
    const fullCom = combinations(poolNumbers, selectK);
    const wheel = [];
    const covered = new Set();
    for(let c of fullCom){
        const sub = combinations(c, guaranteeK);
        let ok = false;
        for(let s of sub){
            const key = s.sort((a,b)=>a-b).join(",");
            if(!covered.has(key)){ ok=true;break; }
        }
        if(ok){
            wheel.push(c);
            sub.forEach(s=>covered.add(s.sort((a,b)=>a-b).join(",")));
        }
        if(covered.size >= combinations(poolNumbers,guaranteeK).length) break;
    }
    return wheel;
}

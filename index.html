
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>奇门取数·时家转盘·收敛15~18总池</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#07102a;color:#ffd875;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;line-height:1.45}
  body{overflow-x:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:14px 12px 80px;overflow-x:hidden}
  h1{font-size:22px;margin:0 0 8px}
  .card{background:#0b1740;border:1px solid #233a6e;border-radius:14px;padding:12px;margin:10px 0;overflow:hidden}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:16px;color:#cfe0ff}
  input,select{background:#050b22;color:#ffd875;border:1px solid #3457a8;border-radius:8px;padding:8px 10px;font-size:17px;min-height:44px}
  button{background:#123a7d;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:17px;min-height:44px;cursor:pointer}
  button.act{background:#b8323a}
  .legend{font-size:15px;color:#cfd9ff;margin:6px 0 10px}
  .legend .r{color:#ff6b6b;background:#2a0810;padding:1px 6px;border-radius:6px}
  .legend .b{color:#6aa9ff;background:#071a3a;padding:1px 6px;border-radius:6px}
  .legend .g{color:#9aa3b2;background:#11172a;padding:1px 6px;border-radius:6px}
  .pan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .g{border:1px solid #2c4378;border-radius:10px;padding:8px;background:#08163a;font-size:14px}
  .g.hi{border-color:#ff6b6b;box-shadow:0 0 8px #ff6b6b55;background:linear-gradient(180deg,#2a0810,#08163a)}
  .g.mid{border-color:#6aa9ff;background:linear-gradient(180deg,#071a3a,#08163a)}
  .g.lo{opacity:.8}
  .g .t{font-weight:700;font-size:16px;color:#ffd875}
  .nums-pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .pill{border:1px solid #ff6b6b;color:#ffb3b3;background:#1a0620;border-radius:9px;padding:7px 10px;font-size:17px;min-width:42px;text-align:center;display:inline-block}
  .pill.hi{border-color:#ff6b6b;color:#fff;background:#3a0a12;box-shadow:0 0 6px #ff6b6b66}
  .pill.mid{border-color:#6aa9ff;color:#cfe1ff;background:#071a3a}
  .pill.lo,.pill.back.lo{color:#9aa3b2;background:#11172a;border-color:#444a5e}
  .pill.back{border-color:#ffd875;color:#ffd875;background:#1a1500}
  .item{border:1px solid #2c4378;border-radius:10px;padding:10px;margin:8px 0;background:#08163a;font-size:17px;word-break:break-all}
  .score{color:#ff6b6b;font-weight:700;margin-right:8px}
  .tip{color:#9aa3b2;font-size:15px}
  .info{font-size:14px;color:#aebddc}
  .small{font-size:15px;color:#cfe0ff}
  /* 总池摘要 */
  .summary{font-size:16px;color:#ffd875;margin:6px 0 4px}
  .warn{color:#ff8a8a;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>奇门取数·时家转盘</h1>
  <div class="card">
    <div class="row">
      <label>时间</label>
      <input id="dt" type="datetime-local" />
      <select id="game">
        <option value="ssq">双色球(红01-33/蓝01-16)</option>
        <option value="dlt">大乐透(前01-35/后01-12)</option>
      </select>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="mode">
        <option value="normal">缩水-常规</option>
        <option value="strict">缩水-严</option>
        <option value="loose">缩水-宽松</option>
      </select>
      <button id="btnRun" class="act">排盘/出5注</button>
      <button id="btnAnchor">锚定示例时间</button>
    </div>
    <div class="legend">
      <span class="r">红=高权(值符/值使/时干/吉门)</span>
      <span class="b">蓝=中性(对宫/马星常规)</span>
      <span class="g">灰=低权/空亡/凶宫暗数</span>
      <br/>约束：奇门总池先收敛到 <b>15~18个</b> 再选号（非全33/全35），可看“精选6~8”小复式。
    </div>
  </div>

  <div class="card">
    <div class="info" id="panInfo"></div>
    <div class="pan" id="pan"></div>
  </div>

  <div class="card">
    <div id="frontTtl">红球总池（收敛15~18，非全33）</div>
    <div class="summary" id="frontSummary"></div>
    <div class="nums-pool" id="frontPool"></div>
    <div id="backTtl" style="margin-top:10px">蓝球候选池（非全16）</div>
    <div class="nums-pool" id="backPool"></div>
    <div class="small" id="pickView" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div style="font-weight:700">加权缩水·推荐5注</div>
    <div id="rec"></div>
  </div>

  <div class="warn">提示：开奖为独立随机事件；本工具按时家奇门做数字推演/娱乐缩号，请理性购彩、勿倍投重仓。起局为拆补法转盘逻辑，中五寄坤。</div>
</div>

<script>
/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const pad2 = n => (n<10?'0'+n:n);
const GONG = {1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};
// 九宫对应号码（按宫数衍生）
function numsOfGong(g, rangeMax){
  // 每宫基础序列：宫序+n*9 / 或按常见映射；这里用 宫号+9k 与 宫号+8k 做覆盖，统一按“宫号为种子+步长9”并裁剪
  let arr=[];
  for(let k=0;k<4;k++){ let v=g + k*9; if(v<=rangeMax) arr.push(v); }
  // 补充同宫常见映射（如乾6/15/24/33，坤2/11/20/29等）保证九宫映射完整
  const map={1:[1,10,19,28],2:[2,11,20,29],3:[3,12,21,30],4:[4,13,22,31],
             5:[5,14,23,32],6:[6,15,24,33],7:[7,16,25,34],8:[8,17,26,35],9:[9,18,27]};
  arr = Array.from(new Set([...arr, ...(map[g]||[])]));
  return arr.filter(n=>n<=rangeMax).sort((a,b)=>a-b);
}
const STAR=['天蓬','天芮(禽)','天冲','天辅','天英','天芮(禽)','天柱','天心','天蓬'];
const MEN=['休','生','伤','杜','景','死','惊','开'];
const SHEN=['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
const JI_MEN=new Set(['生','开','休']);
const XIONG_MEN=new Set(['死','惊','伤']);
// 地支序
const DZ='子丑寅卯辰巳午未申酉戌亥'.split('');
const DZ_IDX=d=>DZ.indexOf(d);
// 干支
const TG='甲乙丙丁戊己庚辛壬癸'.split('');
const DZS='子丑寅卯辰巳午未申酉戌亥'.split('');
function ganZhi(year,month,day,hour){ // 简化干支：用已知算法近似；这里用JS Date配合表更稳可替换；为自包含用基础推算（仅演示用，严谨可接历法库）
  // 以2000-01-01 00时 甲子为基准近似（仅保证代码可跑，生产建议接精确万年历/真太阳时）
  const base=new Date(Date.UTC(2000,0,1,0));
  const now=new Date(Date.UTC(year,month-1,day,hour));
  let d=Math.floor((now-base)/86400000);
  let yG=(4 + year-2000)%10, yZ=(6 + year-2000)%12;
  let dG=(d)%10, dZ=(d+2)%12;
  let hZ=Math.floor(hour/2)%12;
  // 时干按日干推：甲己起甲子… 简化：时柱按日干偏移
  const start={'甲':0,'乙':2,'丙':4,'丁':6,'戊':8,'己':0,'庚':2,'辛':4,'壬':6,'癸':8};
  let s=start[TG[dG]]||0;
  let hG=(s + hZ)%10;
  return {y:TG[yG]+DZS[yZ], d:TG[dG]+DZS[dZ], h:TG[hG]+DZS[hZ], yG,dG,hG,yZ,dZ,hZ};
}

/* ================= 节气/拆补定局 ================= */
function getSolarTerm(d){
  // 近似按月份日判断（够代码自包含；严谨应查精确交节时刻）
  const m=d.getMonth()+1, day=d.getDate();
  if((m==12&&day>=22)||(m==1&&day<6)) return '冬至';
  if(m==1&&day>=6) return '小寒';
  if(m==2&&day<4) return '大寒';
  if(m==2&&day>=4) return '立春';
  if(m==3&&day<6) return '雨水';
  if(m==3&&day>=6) return '惊蛰';
  if(m==4&&day<5) return '春分';
  if(m==4&&day>=5) return '清明';
  if(m==5&&day<6) return '谷雨';
  if(m==5&&day>=6) return '立夏';
  if(m==6&&day<6) return '小满';
  if(m==6&&day>=6) return '芒种';
  if(m==7&&day<7) return '小暑';
  if(m==7&&day>=7) return '大暑';
  if(m==8&&day<8) return '立秋';
  if(m==8&&day>=8) return '处暑';
  if(m==9&&day<8) return '白露';
  if(m==9&&day>=8) return '秋分';
  if(m==10&&day<9) return '寒露';
  if(m==10&&day>=9) return '霜降';
  if(m==11&&day<7) return '立冬';
  if(m==11&&day>=7) return '小雪';
  if(m==12&&day<7) return '大雪';
  return '冬至';
}
// 拆补法用局（主流速记）
const YANG_JU={'冬至':1,'小寒':2,'大寒':3,'立春':5,'雨水':7,'惊蛰':9,'春分':8,'清明':7,'谷雨':5,'立夏':4,'小满':5,'芒种':6};
const YIN_JU ={'夏至':9,'小暑':8,'大暑':7,'立秋':6,'处暑':5,'白露':4,'秋分':3,'寒露':2,'霜降':1,'立冬':9,'小雪':8,'大雪':7};
function getJu(term, dayGanZhi, hourGanZhi){
  const yin=['夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪'];
  const isYin=yin.includes(term);
  const base=isYin?YIN_JU[term]:YANG_JU[term];
  // 拆补：按符头（甲/己及对应子午/寅申/辰戌）分上中下元；这里以日支粗分（自包含可跑，精确可接历法）
  const dZ=dayGanZhi.slice(1);
  let yuan=0;
  if(['子','午','卯','酉'].includes(dZ)) yuan=0;
  else if(['寅','申','巳','亥'].includes(dZ)) yuan=1;
  else yuan=2;
  // 时家同局内按时辰推进不另换局（拆补核心在交节换局，这里保持）
  return {ju:base, yin:isYin, yuan};
}
// 旬首
const XUN={'甲子':'戊','甲戌':'己','甲申':'庚','甲午':'辛','甲辰':'壬','甲寅':'癸'};
function getXun(h){ const t=h.slice(1); const idx=DZ_IDX(t); const heads=['子','戌','申','午','辰','寅']; const k='甲'+heads[Math.floor(DZ_IDX(t)/2)]; return XUN[k]||'戊'; }
function kongWang(dayGanZhi){
  const dZ=dayGanZhi.slice(1);
  const m={子:'戌亥',戌:'申酉',申:'午未',午:'辰巳',辰:'寅卯',寅:'子丑'};
  return m[dZ]||'';
}

/* ================= 时家转盘排局 ================= */
function qimenPan(date){
  const y=date.getFullYear(),mo=date.getMonth()+1,d=date.getDate(),h=date.getHours();
  const gz=ganZhi(y,mo,d,h);
  const term=getSolarTerm(date);
  const {ju,yin}=getJu(term,gz.d,gz.h);
  const xun=getXun(gz.h);
  const kw=kongWang(gz.d);
  // 地盘：从戊起按局数落宫，阳顺阴逆，顺序 戊己庚辛壬癸丁丙乙
  const seq=['戊','己','庚','辛','壬','癸','丁','丙','乙'];
  const dp={}; let cur=ju;
  seq.forEach(k=>{ dp[k]=((cur-1+9)%9)+1; cur += yin?-1:1; });
  // 值符/值使：旬首落宫的原星/原门
  const valDP=dp[xun];
  const starOrder=['天蓬','天芮(禽)','天冲','天辅','天英','天芮(禽)','天柱','天心'];
  const menOrder=['休','生','伤','杜','景','死','惊','开'];
  // 九星按地盘宫固定映射（简用：坎蓬/坤芮/震冲/巽辅/离英/中芮禽/兑柱/乾心/艮任近似；这里按数组环移）
  const starBase={1:'天蓬',2:'天芮(禽)',3:'天冲',4:'天辅',5:'天芮(禽)',6:'天心',7:'天柱',8:'天任',9:'天英'};
  const menBase={1:'休',2:'死',3:'伤',4:'杜',5:'死',6:'开',7:'惊',8:'生',9:'景'};
  const valStar=starBase[valDP]; const valMen=menBase[valDP];
  // 时干落宫（天盘）：值符随时干 -> 把值符移到时干地盘宫
  const shiGan=gz.h[0]; const shiGong=dp[shiGan]||valDP;
  // 天盘星：以值符在shiGong为锚，顺时针跟排
  const tpStar={}; const starList=['天蓬','天任','天冲','天辅','天英','天芮(禽)','天柱','天心'];
  let sIdx=starList.indexOf(valStar); if(sIdx<0) sIdx=0;
  for(let i=0;i<9;i++){ const g=((shiGong-1+i+9)%9)+1; tpStar[g]=starList[(sIdx+i)%8]; }
  // 值使随时支：从旬首本宫起，阳顺阴逆数到时支
  const shiZ=gz.h[1]; const shiZi=DZ_IDX(shiZ); const xunZi0=DZ_IDX(DZ.find(z=>XUN['甲'+z]===xun?z:'子'));
  let menGong=valDP; let steps=((shiZi-xunZi0)+12)%12;
  for(let i=0;i<steps;i++) menGong = yin? ((menGong-2+9)%9)+1 : ((menGong)+1-1+9)%9+1; // 顺逆沿九宫环
  // 人盘八门：值使在menGong，顺时针跟
  const tpMen={}; const mList=['休','生','伤','杜','景','死','惊','开'];
  let mIdx=mList.indexOf(valMen); if(mIdx<0) mIdx=0;
  for(let i=0;i<9;i++){ const g=((menGong-1+i+9)%9)+1; tpMen[g]=mList[(mIdx+i)%8]; }
  // 八神：值符同天盘值符宫，阳顺阴逆
  const tpShen={}; const sList=['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
  let sStart=shiGong;
  for(let i=0;i<9;i++){
    let g; if(!yin) g=((sStart-1+i+9)%9)+1; else g=((sStart-1-i+9)%9)+1;
    tpShen[g]=sList[i%8];
  }
  // 马星（简）：寅午戌马在申，申子辰马在寅，巳酉丑马在亥，亥卯未马在巳；按日支
  const dZ0=gz.d[1];
  let ma=''; if(['寅','午','戌'].includes(dZ0)) ma='申';
  else if(['申','子','辰'].includes(dZ0)) ma='寅';
  else if(['巳','酉','丑'].includes(dZ0)) ma='亥';
  else if(['亥','卯','未'].includes(dZ0)) ma='巳';
  const maGong=ma? (DZ_IDX(ma)+1):0; // 仅示意

  // 构建九宫单元 + 权重
  const cells={};
  for(let g=1;g<=9;g++){
    const star=tpStar[g]||starBase[g];
    const men=tpMen[g]||menBase[g];
    const shen=tpShen[g]||'';
    let w='lo';
    if(shen==='值符' || men===valMen || g===shiGong || JI_MEN.has(men)) w='hi';
    else if(g===10-shiGong || maGong===g) w='mid';
    if(kw.includes(DZ[((g-1)+12)%12]) || XIONG_MEN.has(men)) { w='lo'; }
    cells[g]={g,star,men,shen,dp:Object.keys(dp).find(k=>dp[k]===g)||'',kw:kw.includes(DZ[((g-1)+12)%12]),ma:maGong===g,val:(shen==='值符'),w,
      nums:[]};
  }
  // 映射号码（双色球红/大乐透前）
  // 总池取“落盘有象征的宫”（非全九宫硬铺），并给暗数补充低权
  const info=`${y}-${mo}-${d} ${h}时 | ${gz.y} ${gz.d} ${gz.h} | ${yin?'阴':'阳'}${ju}局 | 旬首${xun} | 值符${valStar}@${valDP}→${shiGong} 值使${valMen}→${menGong} | 空${kw||'-'} 马${ma||'-'}`;
  return {cells, info, ju, yin, shiGong, valDP, menGong, kw, ma, gz};
}

/* ================= 构建“收敛总池（15~18）” ================= */
function buildConvergedPool(pan, game){
  const frontMax = game==='ssq'?33:35;
  const backMax  = game==='ssq'?16:12;
  // 先按宫取数（只取盘上相关宫：值符/时干/值使/吉门/对宫/马，空亡给低权；中五寄坤已含）
  const focusGongs=new Set([pan.shiGong, pan.valDP, pan.menGong]);
  Object.keys(pan.cells).forEach(g=>{ const c=pan.cells[g]; if(JI_MEN.has(c.men)||c.shen==='值符') focusGongs.add(+g); });
  focusGongs.add(10-pan.shiGong); if(pan.ma) focusGongs.add(pan.ma);
  // 收集带权号码
  let items=[];
  focusGongs.forEach(g=>{
    const c=pan.cells[g];
    numsOfGong(g, frontMax).forEach(n=>items.push({n, w:c.w, g}));
  });
  // 暗数/空亡补充（低权，参与但不主推）
  Object.keys(pan.cells).forEach(g=>{
    const c=pan.cells[g];
    if(c.kw||(c.w==='lo'&&!focusGongs.has(+g))){
      numsOfGong(g, frontMax).forEach(n=>{ if(!items.find(x=>x.n===n)) items.push({n,w:'lo',g,ghost:true}); });
    }
  });
  // 去重并按权加权打分，压到15~18
  const map=new Map();
  items.forEach(x=>{ const v=x.w==='hi'?3:(x.w==='mid'?2:1); const old=map.get(x.n); map.set(x.n, old?{...old,w:x.w==='hi'?'hi':(old.w==='hi'?'hi':'mid'),score:old.score+v,g:x.g}:{n:x.n,w:x.w,score:v,g:x.g,ghost:x.ghost}); });
  let arr=Array.from(map.values());
  // 必须保证含高/中优先，目标15~18（双色球/前区）
  const targetMin=15, targetMax=18;
  arr.sort((a,b)=> (b.score-a.score)||(a.n-b.n));
  let front=arr.slice(0, targetMax);
  if(front.length<targetMin){
    // 不足则从同宫延展补到15
    const exist=new Set(front.map(x=>x.n));
    for(let g=1;g<=9;g++){
      numsOfGong(g,frontMax).forEach(n=>{
        if(!exist.has(n)&&front.length<targetMin){ front.push({n,w:'lo',g,ghost:true,score:1}); exist.add(n);}
      });
    }
  }
  // 若超过18（极端重复映射）再按权截；若低于15则保留并提示
  front=front.slice(0, targetMax);
  // 后区/蓝球：从相关宫映射（取小范围/同余），非全
  let backItems=[];
  [pan.shiGong, pan.valDP, pan.menGong, 10-pan.shiGong].forEach(g=>{
    numsOfGong(g, backMax).forEach(n=>backItems.push({n,w:pan.cells[g].w}));
  });
  backItems=Array.from(new Map(backItems.map(x=>[x.n,x])).values()).sort((a,b)=>a.n-b.n);
  if(backItems.length===0) backItems=numsOfGong(pan.shiGong,backMax).map(n=>({n,w:'mid'}));

  const hiF=front.filter(x=>x.w==='hi').map(x=>x.n);
  const midF=front.filter(x=>x.w==='mid').map(x=>x.n);
  const loF=front.filter(x=>x.w==='lo').map(x=>x.n);
  const tagF={}; front.forEach(x=>tagF[x.n]=x.w);
  return {
    front, back:backItems,
    hiF, midF, loF, tagF,
    frontNum:front.map(x=>x.n),
    backNum:backItems.map(x=>x.n),
    size:front.length
  };
}

/* ================= 缩水/组合/评分 ================= */
function passSSQ(c,mode='normal'){
  const o=c.filter(n=>n%2===1).length, e=c.length-o;
  if(o===0||e===0) return false;
  const lo=c.filter(n=>n<=16).length, hi=c.length-lo;
  if(lo===0||hi===0) return false;
  const r=[0,0,0]; c.forEach(n=>r[n%3]++); if(Math.max(...r)===6) return false;
  const a=c.filter(n=>n<=11).length,b=c.filter(n=>n>11&&n<=22).length,cc=c.filter(n=>n>22).length;
  if(a===0||cc===0) return false;
  let cons=0; for(let i=0;i<c.length-1;i++) if(c[i+1]-c[i]===1) cons++;
  if(cons>1&&mode!=='loose') return false;
  const tail={}; c.forEach(n=>{const t=n%10;tail[t]=(tail[t]||0)+1;});
  if(Object.values(tail).some(v=>v>=3)) return false;
  const sum=c.reduce((s,x)=>s+x,0);
  if(mode==='strict'&&(sum<80||sum>120)) return false;
  if(mode==='normal'&&(sum<60||sum>140)) return false;
  return true;
}
function passDLTf(c,mode='normal'){
  const o=c.filter(n=>n%2===1).length,e=c.length-o;
  if(o===0||e===0) return false;
  const lo=c.filter(n=>n<=17).length,hi=c.length-lo;
  if(lo===0||hi===0) return false;
  const r=[0,0,0];c.forEach(n=>r[n%3]++);if(Math.max(...r)===5)return false;
  const a=c.filter(n=>n<=12).length,b=c.filter(n=>n>12&&n<=24).length,cc=c.filter(n=>n>24).length;
  if(a===0||b===0||cc===0) return false;
  let cons=0;for(let i=0;i<c.length-1;i++)if(c[i+1]-c[i]===1)cons++;
  if(cons>1&&mode!=='loose')return false;
  const tail={};c.forEach(n=>{const t=n%10;tail[t]=(tail[t]||0)+1;});
  if(Object.values(tail).some(v=>v>=3))return false;
  const sum=c.reduce((s,x)=>s+x,0);
  if(mode==='strict'&&(sum<80||sum>110))return false;
  if(mode==='normal'&&(sum<60||sum>130))return false;
  return true;
}
function passDLTb(c){
  const o=c.filter(n=>n%2===1).length,e=c.length-o;
  if(o!==1||e!==1)return false;
  const lo=c.filter(n=>n<=6).length,hi=c.length-lo;
  if(lo!==1||hi!==1)return false;
  return true;
}
function comb(arr,k){const res=[];function dfs(s,cur){if(cur.length===k){res.push(cur.slice());return;}for(let i=s;i<arr.length;i++){cur.push(arr[i]);dfs(i+1,cur);cur.pop();}}dfs(0,[]);return res;}
function scoreArr(c,pool){let s=0;c.forEach(n=>{s+=(pool.tagF?.[n]==='hi'?3:(pool.tagF?.[n]==='mid'?2:1));});return s;}

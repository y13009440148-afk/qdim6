<script>
// ===================== 全局常量 & 基础表【奇门排盘用】 =====================
const ganArr = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const zhiArr = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const gan5Map = {"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
const gongNameMap = {1:"坎一宫",2:"坤二宫",3:"震三宫",4:"巽四宫",5:"中五宫",6:"乾六宫",7:"兑七宫",8:"艮八宫",9:"离九宫"};
const liuYiSanQi = ["戊","己","庚","辛","壬","癸","丁","丙","乙"];
const baMen = ["休","生","伤","杜","景","死","惊","开"];
const jiuXing = ["蓬","芮","冲","辅","禽","心","柱","任","英"];
const JQ_JU = {
    "冬至":[1,7,4],"小寒":[2,8,5],"大寒":[3,9,6],
    "立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],
    "春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],
    "立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9],
    "夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],
    "立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],
    "秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],
    "立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]
};
const jqDate = [
    ["冬至",12,22],["小寒",1,6],["大寒",1,20],["立春",2,4],["雨水",2,19],["惊蛰",3,6],
    ["春分",3,21],["清明",4,5],["谷雨",4,20],["立夏",5,6],["小满",5,21],["芒种",6,6],
    ["夏至",6,22],["小暑",7,7],["大暑",7,23],["立秋",8,8],["处暑",8,23],["白露",9,8],
    ["秋分",9,23],["寒露",10,8],["霜降",10,23],["立冬",11,7],["小雪",11,22],["大雪",12,7]
];

// ===================== 工具函数：干支换算、节气、旬空、日上起时 =====================
function getGanIndex(g){ return ganArr.indexOf(g); }
function getZhiIndex(z){ return zhiArr.indexOf(z); }
function wuShuDun(riGan){
    const map = {
        "甲":0,"己":0,
        "乙":2,"庚":2,
        "丙":4,"辛":4,
        "丁":6,"壬":6,
        "戊":8,"癸":8
    };
    const start = map[riGan];
    const shiZhiMap = {};
    for(let i=0;i<12;i++){
        shiZhiMap[zhiArr[i]] = ganArr[(start+i)%10];
    }
    return shiZhiMap;
}
function getXunKong(gan,zhi){
    const gIdx = getGanIndex(gan);
    const zIdx = getZhiIndex(zhi);
    const sum = (zIdx - gIdx + 12) %12;
    let xunHeadZhiIdx;
    if(sum === 0) xunHeadZhiIdx = 0;
    else if(sum === 2) xunHeadZhiIdx = 2;
    else if(sum === 4) xunHeadZhiIdx = 4;
    else if(sum === 6) xunHeadZhiIdx = 6;
    else if(sum === 8) xunHeadZhiIdx = 8;
    else if(sum ===10) xunHeadZhiIdx =10;
    else return {xun:"",kong:""};
    const xunGan = ganArr[xunHeadZhiIdx%10];
    const xunZhi = zhiArr[xunHeadZhiIdx];
    const kong1 = zhiArr[(xunHeadZhiIdx +10)%12];
    const kong2 = zhiArr[(xunHeadZhiIdx +11)%12];
    return {xun:xunGan+xunZhi, kong:kong1+kong2};
}
function getJieQiAndYinYang(dateObj){
    const m = dateObj.getMonth()+1;
    const d = dateObj.getDate();
    let isYang = true;
    if( (m>6 && m<12) || (m===6 && d>=22) || (m===12 && d<22) ) isYang = false;
    let jqName = "";
    for(let j of jqDate){
        const [name,jm,jd] = j;
        if(m === jm && d >= jd){
            jqName = name;break;
        }
    }
    if(!jqName){
        for(let j of jqDate){
            const [name,jm,jd] = j;
            if(m === jm){ jqName = name; break; }
        }
    }
    return {jqName, isYang};
}
function getSanYuan(riZhi){
    if(["子","午","卯","酉"].includes(riZhi)) return 0;
    if(["寅","申","巳","亥"].includes(riZhi)) return 1;
    return 2;
}

// ===================== 【核心真排盘：时家转盘拆补法 paiPan】 =====================
function paiPan(dateStr,timeStr,lng){
    const dt = new Date(dateStr + "T" + timeStr + ":00");
    const riGan = ganArr[dt.getDate()%10];
    const riZhi = zhiArr[dt.getDate()%12];
    const shiZhiIdx = Math.floor(dt.getHours()/2);
    const shiZhi = zhiArr[shiZhiIdx];
    const shiGan = wuShuDun(riGan)[shiZhi];

    const {jqName, isYang} = getJieQiAndYinYang(dt);
    const yuanIdx = getSanYuan(riZhi);
    const ju = JQ_JU[jqName][yuanIdx];

    const dipan = {};
    const gongOrderYang = [1,2,3,4,5,6,7,8,9];
    const gongOrderYin = [1,9,8,7,6,5,4,3,2];
    const walk = isYang ? gongOrderYang : gongOrderYin;
    let startIdx = walk.indexOf(ju);
    for(let i=0;i<9;i++){
        const g = walk[(startIdx+i)%9];
        dipan[g] = liuYiSanQi[i];
    }

    const xunInfo = getXunKong(shiGan,shiZhi);
    const fuHeadGan = xunInfo.xun[0];
    const fuHeadGong = Object.keys(dipan).find(k=>dipan[k]===fuHeadGan)*1;
    const zhiShiIdx = getGanIndex(fuHeadGan);
    const zhiShiMen = baMen[zhiShiIdx%8];

    const tianPan = {};
    const shiGanGong = Object.keys(dipan).find(k=>dipan[k]===shiGan)*1;
    const xingStart = jiuXing.indexOf("蓬");
    for(let g=1;g<=9;g++){
        const offset = (g - fuHeadGong +9)%9;
        tianPan[g] = jiuXing[(xingStart + offset)%9];
    }
    const menPan = {};
    const menStart = baMen.indexOf(zhiShiMen);
    for(let g=1;g<=9;g++){
        const offset = (g - shiGanGong +9)%8;
        menPan[g] = baMen[(menStart + offset)%8];
    }

    const pan = {
        yang: isYang,
        ju: ju,
        jq: jqName,
        shiGan: shiGan,
        shiZhi: shiZhi,
        riGan: riGan,
        riZhi: riZhi,
        xun: xunInfo.xun,
        kongWang: xunInfo.kong,
        dipan: dipan,
        tianPan: tianPan,
        menPan: menPan
    };
    document.getElementById("panLog").innerText =
`✅拆补转盘排盘结果
节气：${jqName} | ${isYang?"阳遁":"阴遁"}${ju}局
日干支：${riGan}${riZhi}  时干支：${shiGan}${shiZhi}
旬首：${xunInfo.xun}  空亡：${xunInfo.kong}
地盘(宫:干)：${JSON.stringify(dipan)}
天盘九星：${JSON.stringify(tianPan)}
人盘八门：${JSON.stringify(menPan)}`;
    log("【真排盘完成】",pan);
    return pan;
}

// ===================== 轮转函数 lunZhuanPan =====================
function lunZhuanPan(basePan,step,isYang){
    const newPan = JSON.parse(JSON.stringify(basePan));
    return newPan;
}

// ===================== 内置自动CFG策略 =====================
function buildAutoCfg(panObj){
    const cfg = {};
    cfg.chkKong = panObj.yang === true;
    cfg.chkHuiLiu = !panObj.yang;
    const maxLunStep = 3;
    cfg.chkLunZhuan = maxLunStep > 0;
    cfg.lunMode = maxLunStep > 1 ? "merge" : "separate";
    const g5 = gan5Map[panObj.shiGan];
    cfg.chkHouQiMen = (g5 === "木" || g5 === "火");
    cfg.houMax = 12;
    cfg.useWeightCurve = true;
    cfg.sigma = 1.8;
    cfg.takeQian = 6;
    cfg.takeHou = 2;
    cfg.chkMatrix = false;
    cfg.matrixType = "6保5";
    cfg.matrixLimit = 12;
    cfg.acMin = 0.25;
    cfg.acMax = 0.78;
    cfg.spanMin = 12;
    cfg.spanMax = 28;
    cfg.oddRateLow = 0.3;
    cfg.oddRateHigh = 0.7;
    return cfg;
}

// ===================== 补齐完整版 calcScore 宫位打分逻辑 =====================
function calcScore(panObj,gongNo,cfg){
    let score = 0;
    const dg = panObj.dipan[gongNo];
    const tx = panObj.tianPan[gongNo];
    const mn = panObj.menPan[gongNo];
    const kw = panObj.kongWang.includes(dg);
    const gan5D = gan5Map[dg];
    const gan5S = gan5Map[panObj.shiGan];
    // 五行生克加分
    if(gan5D === gan5S) score += 22;
    if( (gan5S === "木" && gan5D === "水") ||
        (gan5S === "火" && gan5D === "木") ||
        (gan5S === "土" && gan5D === "火") ||
        (gan5S === "金" && gan5D === "土") ||
        (gan5S === "水" && gan5D === "金") ){
        score += 32;
    }
    if( (gan5S === "木" && gan5D === "火") ||
        (gan5S === "火" && gan5D === "土") ||
        (gan5S === "土" && gan5D === "金") ||
        (gan5S === "金" && gan5D === "水") ||
        (gan5S === "水" && gan5D === "木") ){
        score += 14;
    }
    //九星加分
    if(["蓬","任","冲","辅"].includes(tx)) score +=12;
    if(["英","芮","柱"].includes(tx)) score +=6;
    if(tx === "心") score +=16;
    if(tx === "禽") score +=18;
    //八门加分
    if(["开","休","生"].includes(mn)) score +=18;
    if(["杜","景"].includes(mn)) score +=10;
    if(["伤","惊"].includes(mn)) score +=4;
    if(mn === "死") score -=8;
    //空亡扣分
    if(kw && !cfg.chkHuiLiu) score -=28;
    if(score < 0) score = 0;
    return {score:score, kw:kw};
}

// ===================== 补齐完整版 dynGetNum 奇门宫位取数 =====================
function dynGetNum(g, dg, tx, mn, seed, isQian, houMax){
    const out = new Set();
    const seedCode = {木:11,火:22,土:33,金:44,水:55}[seed];
    let baseSeed = g * 100 + seedCode + dg.charCodeAt(0) + tx.charCodeAt(0) + mn.charCodeAt(0);
    function rnd(seedIn){
        let x = Math.sin(seedIn++) * 10000;
        return x - Math.floor(x);
    }
    if(isQian){
        while(out.size < 4){
            baseSeed += 1;
            const v = Math.floor(rnd(baseSeed) * 33)+1;
            if(v>=1 && v<=33) out.add(v);
        }
    }else{
        while(out.size < 2){
            baseSeed += 1;
            const v = Math.floor(rnd(baseSeed) * houMax)+1;
            if(v>=1 && v<=houMax) out.add(v);
        }
    }
    return Array.from(out).sort((a,b)=>a-b);
}

// ===================== 补齐完整版 filterByIndex 指标过滤：AC、跨度、奇偶、连号、区间 =====================
function filterByIndex(qianArr,cfg){
    const arr = [...qianArr].sort((a,b)=>a-b);
    const minV = arr[0];
    const maxV = arr[arr.length-1];
    const span = maxV - minV;
    //跨度校验
    if(span < cfg.spanMin || span > cfg.spanMax) return false;
    //奇偶统计
    let oddCnt = arr.filter(x=>x%2===1).length;
    const oddRate = oddCnt / arr.length;
    if(oddRate < cfg.oddRateLow || oddRate > cfg.oddRateHigh) return false;
    //AC值简易计算
    const diffSet = new Set();
    for(let i=0;i<arr.length;i++){
        for(let j=i+1;j<arr.length;j++){
            diffSet.add(Math.abs(arr[j]-arr[i]));
        }
    }
    const ac = diffSet.size - (arr.length - 1);
    if(ac < cfg.acMin || ac > cfg.acMax) return false;
    //连号判断：禁止3连及以上
    let lianCnt = 1;
    let maxLian = 1;
    for(let i=1;i<arr.length;i++){
        if(arr[i] === arr[i-1]+1){
            lianCnt++;
            if(lianCnt>maxLian) maxLian=lianCnt;
        }else lianCnt=1;
    }
    if(maxLian >=3) return false;
    //区间：1-11,12-22,23-33，每区至少1个
    const q1 = arr.filter(x=>x>=1&&x<=11).length;
    const q2 = arr.filter(x=>x>=12&&x<=22).length;
    const q3 = arr.filter(x=>x>=23&&x<=33).length;
    if(q1===0 || q2===0 || q3===0) return false;
    return true;
}

// ===================== 补齐完整版 genMatrix 6保5容错矩阵生成 =====================
function genMatrix(baseArr,type,limit){
    const res = [];
    if(type !== "6保5") return res;
    const n = baseArr.length;
    if(n <6) return res;
    //组合：每次去掉一个，6保5
    for(let i=0;i<n;i++){
        const line = baseArr.filter((_,idx)=>idx!==i);
        if(line.length >=6){
            res.push(line.slice(0,6));
        }
        if(res.length >= limit) break;
    }
    return res;
}

// ===================== 加权抽取函数（增加分数为0保护） =====================
function weightedPick(pool,takeCnt,sigma){
    const res=[];
    const src=[...pool];
    //保底：全部分数为0时改为均等抽取
    const totalScore = src.reduce((s,it)=>s+it.score,0);
    if(totalScore <= 0){
        for(let i=0;i<takeCnt && src.length>0;i++){
            const rIdx = Math.floor(Math.random()*src.length);
            res.push(src.splice(rIdx,1)[0]);
        }
        return res.map(x=>x.num);
    }
    for(let i=0;i<takeCnt && src.length>0;i++){
        const sum=src.reduce((s,it)=>s+it.score,0);
        let r=Math.random()*sum;
        for(let j=0;j<src.length;j++){
            r -= src[j].score;
            if(r<=0){
                res.push(src.splice(j,1)[0]);
                break;
            }
        }
    }
    return res.map(x=>x.num);
}

function calcHitCount(pickArr,hisArr){
    return pickArr.filter(n=>hisArr.includes(n)).length;
}

// ===================== 日志、全局变量 =====================
let pan = null;
let historyPool = [];
let lastResultList = [];
function log(txt){ console.log(txt); }

// ===================== 推演主函数 runTuiYan =====================
function runTuiYan(){
    if(!pan){ alert("⚠️请先点击【起真盘】！"); return; }
    const cfg = buildAutoCfg(pan);
    log("===== 自动CFG加载完成 ====",cfg);
    const txt = document.getElementById("historyText").value.trim();
    historyPool = [];
    if(txt){
        const lines = txt.split("\n");
        lines.forEach(line=>{
            line = line.trim();
            if(!line) return;
            const sp = line.split("+");
            const qian = sp[0].split(",").map(Number).filter(x=>!isNaN(x) && x>=1 && x<=33);
            const hou = sp[1] ? sp[1].split(",").map(Number).filter(x=>!isNaN(x) && x>=1 && x<=12) : [];
            historyPool.push({qian,hou});
        })
    }
    const panList = [];
    if(cfg.chkLunZhuan){
        const maxLunStep = 3;
        for(let s=1;s<=maxLunStep;s++){
            const lp = lunZhuanPan(pan,s,pan.yang);
            panList.push({pan:lp,tag:"轮转第"+s+"步"});
        }
    }else{
        panList.push({pan:pan,tag:"本局"});
    }
    let allQianPool = [];
    let allHouPool = [];
    const outList = [];
    for(let pItem of panList){
        const p = pItem.pan;
        log("\n--- "+pItem.tag+" ---");
        let qianPool = [];
        let houPool = [];
        const seed = gan5Map[p.shiGan];
        for(let g=1;g<=9;g++){
            const sc = calcScore(p,g,cfg);
            const dg = p.dipan[g];
            const tx = p.tianPan[g];
            const mn = p.menPan[g];
            const qNums = dynGetNum(g, dg, tx, mn, seed, true, cfg.houMax);
            const hNums = dynGetNum(g, dg, tx, mn, seed, false, cfg.houMax);
            if(cfg.chkKong && sc.kw && !cfg.chkHuiLiu){
                log(gongNameMap[g]+" 旬空过滤，跳过");
                continue;
            }
            log(gongNameMap[g] + " 分数:"+sc.score+" 前区候选:"+qNums.join(',') + " 后区候选:"+hNums.join(','));
            qNums.forEach(n=>{
                const exist = qianPool.find(x=>x.num === n);
                if(!exist) qianPool.push({num:n, score:sc.score});
                else if(sc.score > exist.score) exist.score = sc.score;
            });
            if(cfg.chkHouQiMen){
                hNums.forEach(n=>{
                    const exist = houPool.find(x=>x.num === n);
                    if(!exist) houPool.push({num:n, score:sc.score});
                    else if(sc.score > exist.score) exist.score = sc.score;
                });
            }
        }
        qianPool.sort((a,b)=>b.score - a.score);
        houPool.sort((a,b)=>b.score - a.score);
        log("✅ 本轮盘面前区候选池："+qianPool.map(x=>x.num).join(','));
        if(cfg.chkHouQiMen) log("✅ 本轮盘面后区候选池："+houPool.map(x=>x.num).join(','));
        if(cfg.lunMode === 'separate'){
            let pickQian = [];
            let pickHou = [];
            if(cfg.useWeightCurve){
                pickQian = weightedPick(qianPool, cfg.takeQian, cfg.sigma);
                if(cfg.chkHouQiMen) pickHou = weightedPick(houPool, cfg.takeHou, cfg.sigma);
            }else{
                pickQian = qianPool.slice(0,cfg.takeQian).map(x=>x.num);
                if(cfg.chkHouQiMen) pickHou = houPool.slice(0,cfg.takeHou).map(x=>x.num);
            }
            pickQian.sort((a,b)=>a-b);
            pickHou.sort((a,b)=>a-b);
            const pass = filterByIndex(pickQian, cfg);
            const hitArr = [];
            historyPool.forEach(his=> hitArr.push(calcHitCount(pickQian, his.qian)) );
            outList.push({tag:pItem.tag, qian:pickQian, hou:pickHou, pass:pass, hit:hitArr});
        }else{
            qianPool.forEach(it=>{
                const e = allQianPool.find(x=>x.num===it.num);
                if(!e) allQianPool.push({...it});
                else e.score = Math.max(e.score, it.score);
            });
            if(cfg.chkHouQiMen){
                houPool.forEach(it=>{
                    const e = allHouPool.find(x=>x.num===it.num);
                    if(!e) allHouPool.push({...it});
                    else e.score = Math.max(e.score, it.score);
                });
            }
        }
    }
    if(cfg.chkLunZhuan && cfg.lunMode === 'merge'){
        log("\n===== 合并轮转全部宫位总候选池 =====");
        allQianPool.sort((a,b)=>b.score - a.score);
        allHouPool.sort((a,b)=>b.score - a.score);
        log("合并总前区池："+allQianPool.map(x=>x.num).join(','));
        if(cfg.chkHouQiMen) log("合并总后区池："+allHouPool.map(x=>x.num).join(','));
        let pickQian = [];
        let pickHou = [];
        if(cfg.useWeightCurve){
            pickQian = weightedPick(allQianPool, cfg.takeQian, cfg.sigma);
            if(cfg.chkHouQiMen) pickHou = weightedPick(allHouPool, cfg.takeHou, cfg.sigma);
        }else{
            pickQian = allQianPool.slice(0,cfg.takeQian).map(x=>x.num);
            if(cfg.chkHouQiMen) pickHou = allHouPool.slice(0,cfg.takeHou).map(x=>x.num);
        }
        pickQian.sort((a,b)=>a-b);
        pickHou.sort((a,b)=>a-b);
        const pass = filterByIndex(pickQian, cfg);
        const hitArr = [];
        historyPool.forEach(his=> hitArr.push(calcHitCount(pickQian, his.qian)) );
        outList.push({tag:"【轮转合并总方案】", qian:pickQian, hou:pickHou, pass:pass, hit:hitArr});
    }
    if(cfg.chkMatrix){
        log("\n===== 启动容错矩阵生成 =====");
        let matrixBase = [];
        if(cfg.lunMode === 'merge' || !cfg.chkLunZhuan) matrixBase = allQianPool.map(x=>x.num);
        else matrixBase = outList[0].qian;
        matrixBase = [...new Set(matrixBase)].sort((a,b)=>a-b);
        log("矩阵底池号码："+matrixBase.join(','));
        const matrixGroup = genMatrix(matrixBase, cfg.matrixType, cfg.matrixLimit);
        matrixGroup.forEach((gArr,idx)=>{
            gArr.sort((a,b)=>a-b);
            const pass = filterByIndex(gArr,cfg);
            const hitArr = [];
            historyPool.forEach(his=> hitArr.push(calcHitCount(gArr, his.qian)) );
            outList.push({tag:`容错矩阵${cfg.matrixType} 第${idx+1}注`, qian:gArr, hou:[], pass:pass, hit:hitArr});
        })
    }
    //渲染
    lastResultList = outList;
    const $resultSel = document.getElementById("resultSel");
    const $qianQuWrap = document.getElementById("qianQuWrap");
    const $houQuWrap = document.getElementById("houQuWrap");
    const $resultBox = document.getElementById("resultBox");
    const $hitTableBox = document.getElementById("hitTableBox");
    $resultSel.innerHTML = `<option value="-1">请选择结果组</option>`;
    outList.forEach((it,idx)=>{
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${it.tag} | ${it.qian.join(',')}${it.hou.length>0 ? '+'+it.hou.join(',') : ''} ${it.pass?'✅':'❌'}`;
        $resultSel.appendChild(opt);
    })
    let hitTableHtml = `<table><tr><th>序号</th><th>开奖号码</th><th>命中个数</th></tr>`;
    historyPool.forEach((his,hi)=>{
        const line = his.qian.join(',') + (his.hou.length>0 ? '+'+his.hou.join(',') : '');
        hitTableHtml += `<tr><td>${hi+1}</td><td>${line}</td><td id="hitCol${hi}">-</td></tr>`;
    })
    hitTableHtml += `</table>`;
    $hitTableBox.innerHTML = hitTableHtml;
    let resHtml = "";
    outList.forEach(it=>{
        resHtml += `<div style="margin-bottom:8px;padding:6px;border:1px solid #2a3248;border-radius:6px;">`
        resHtml += `<b>${it.tag}</b> ${it.pass ? '<span style="color:#22c55e">指标校验通过</span>' : '<span style="color:#f87171">指标过滤不通过</span>'}<br>`
        resHtml += `前区：${it.qian.map(x=>x.toString().padStart(2,'0')).join(',')}`
        if(it.hou.length>0) resHtml += ` + 后区：${it.hou.map(x=>x.toString().padStart(2,'0'))}`
        resHtml += `<br>`
        resHtml += `历史命中：${it.hit.join(' | ')}`
        resHtml += `</div>`
    })
    $resultBox.innerHTML = resHtml;
    log("\n🎉推演完成！下拉切换方案");
}

// ===================== window.onload 绑定事件 =====================
window.onload = function(){
    const $paiBtn = document.getElementById("paiBtn");
    const $runBtn = document.getElementById("runBtn");
    const $clearHistory = document.getElementById("clearHistory");
    const $resultSel = document.getElementById("resultSel");
    const now = new Date();
    const dStr = now.toISOString().split('T')[0];
    const tStr = now.toTimeString().slice(0,5);
    document.getElementById('dateInput').value = dStr;
    document.getElementById('timeInput').value = tStr;
    $paiBtn.onclick = function(){
        const d = document.getElementById('dateInput').value;
        const t = document.getElementById('timeInput').value;
        const lng = Number(document.getElementById('lngInput').value);
        pan = paiPan(d,t,lng);
    }
    $runBtn.onclick = runTuiYan;
    $clearHistory.onclick = function(){
        document.getElementById("historyText").value = "";
        historyPool = [];
        log("✅历史库清空");
    }
    $resultSel.onchange = function(){
        const idx = Number(this.value);
        const $qianQuWrap = document.getElementById("qianQuWrap");
        const $houQuWrap = document.getElementById("houQuWrap");
        $qianQuWrap.innerHTML = "";
        $houQuWrap.innerHTML = "";
        if(idx === -1) return;
        const item = lastResultList[idx];
        item.qian.forEach(n=>{
            const b = document.createElement('div');
            b.className = "num-ball q-high ball-selected";
            b.innerText = n.toString().padStart(2,'0');
            $qianQuWrap.appendChild(b);
        })
        item.hou.forEach(n=>{
            const b = document.createElement('div');
            b.className = "num-ball q-back ball-selected";
            b.innerText = n.toString().padStart(2,'0');
            $houQuWrap.appendChild(b);
        })
        item.hit.forEach((h,cnt)=>{
            const td = document.getElementById('hitCol'+cnt);
            if(td) td.innerText = h;
            td.style.color = h>=3 ? "#22c55e" : "#fff";
        })
    }
}
</script>

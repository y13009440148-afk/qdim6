<script>
/* ============================================================
   1. 基础历法/干支
============================================================ */
const TG='甲乙丙丁戊己庚辛壬癸'.split('');
const DZ='子丑寅卯辰巳午未申酉戌亥'.split('');
const GONG_NAME={1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};
const RING=[1,8,3,4,9,2,7,6];
const STAR_RING=['天蓬','天任','天冲','天辅','天英','天芮','天柱','天心'];
const MENS=['休','生','伤','杜','景','死','惊','开'];
const SHENS=['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
const YI_SEQ=['戊','己','庚','辛','壬','癸','丁','丙','乙'];
const XUN_YI={'甲子':'戊','甲戌':'己','甲申':'庚','甲午':'辛','甲辰':'壬','甲寅':'癸'};
const XUN_ORDER=['甲子','甲戌','甲申','甲午','甲辰','甲寅'];

function julianDay(y,m,d,h,mi,s){
  if(m<=2){y--;m+=12;}
  const a=Math.floor(y/100),b=2-a+Math.floor(a/4);
  const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5;
  return jd+(h-12)/24+mi/1440+s/86400;
}
function gzFromJD(jd){
  const d=Math.floor(jd+0.5);
  return {g:TG[(d+49)%10],z:DZ[(d+12)%12]};
}
function hourGZ(dayG,hz){
  const base={'甲':0,'己':0,'乙':2,'庚':2,'丙':4,'辛':4,'丁':6,'壬':6,'戊':8,'癸':8}[dayG];
  return TG[(base+DZ.indexOf(hz))%10]+hz;
}

/* ============================================================
   2. 真太阳时
============================================================ */
function equationOfTime(jd){
  const d=jd-2451545.0;
  const B=2*Math.PI*d/365.25;
  return 9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
}
function trueSolarTime(date,lon,tz){
  const utc=date.getTime()-(tz*60+date.getTimezoneOffset())*60000;
  const d=new Date(utc);
  const jd=julianDay(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds());
  const eot=equationOfTime(jd);
  const corr=eot+(lon-tz*15)*4;
  return new Date(utc+corr*60000);
}

/* ============================================================
   3. 天文节气（太阳黄经牛顿迭代）
============================================================ */
const JIE_NAMES=['春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒','立春','雨水','惊蛰'];
function sunLon(jd){
  const T=(jd-2451545.0)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=357.52911+35999.05029*T-0.0001537*T*T;
  const C=(1.914602-0.004817*T)*Math.sin(M*Math.PI/180)+(0.019993-0.000101*T)*Math.sin(2*M*Math.PI/180)+0.000289*Math.sin(3*M*Math.PI/180);
  return (L0+C)%360;
}
function findTermJD(year,targetLon){
  let jd=julianDay(year,1,1,0,0,0)+targetLon/360*365.25;
  for(let i=0;i<10;i++){
    const L=sunLon(jd);
    let diff=targetLon-L; while(diff>180)diff-=360; while(diff<-180)diff+=360;
    jd+=diff/0.9856;
  }
  return jd;
}
function getTermTable(y){
  const out=[];
  for(let i=0;i<24;i++){
    const lon=i*15;
    out.push({name:JIE_NAMES[i],lon,jd:findTermJD(y,lon)});
  }
  return out;
}
function currentTerm(tst){
  const jd=julianDay(tst.getUTCFullYear(),tst.getUTCMonth()+1,tst.getUTCDate(),tst.getUTCHours(),tst.getUTCMinutes(),tst.getUTCSeconds());
  const tbl=getTermTable(tst.getUTCFullYear()).concat(getTermTable(tst.getUTCFullYear()+1).map(x=>({...x,jd:x.jd+365.25})));
  let prev=tbl[0];
  for(const t of tbl)if(t.jd<=jd)prev=t;
  return prev;
}

/* ============================================================
   4. 拆补定局
============================================================ */
const JIE_JU={'冬至':[1,7,4],'小寒':[2,8,5],'大寒':[3,9,6],'立春':[8,5,2],'雨水':[9,6,3],'惊蛰':[1,7,4],'春分':[3,9,6],'清明':[4,1,7],'谷雨':[5,2,8],'立夏':[4,1,7],'小满':[5,2,8],'芒种':[6,3,9],'夏至':[9,3,6],'小暑':[8,2,5],'大暑':[7,1,4],'立秋':[2,5,8],'处暑':[1,4,7],'白露':[9,3,6],'秋分':[7,1,4],'寒露':[6,9,3],'霜降':[5,8,2],'立冬':[6,9,3],'小雪':[5,8,2],'大雪':[4,7,1]};
const YANG_SET=new Set(['冬至','小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种']);

function fuTouDayGZ(jd){
  let d=Math.floor(jd+0.5);
  for(let i=0;i<10;i++){
    const gz=gzFromJD(d-i+0.5);
    if(gz.g==='甲'||gz.g==='己')return gz;
  }
  return gzFromJD(d+0.5);
}
function yuanOf(z){return ['子','午','卯','酉'].includes(z)?0:['寅','申','巳','亥'].includes(z)?1:2;}
function decideJu(termName,jd){
  const juArr=JIE_JU[termName];
  const ft=fuTouDayGZ(jd);
  return {ju:juArr[yuanOf(ft.z)],yang:YANG_SET.has(termName),yuan:yuanOf(ft.z),term:termName};
}

/* ============================================================
   5. 排盘主链
============================================================ */
function qimenCore(tst){
  const jd=julianDay(tst.getUTCFullYear(),tst.getUTCMonth()+1,tst.getUTCDate(),tst.getUTCHours(),tst.getUTCMinutes(),tst.getUTCSeconds());
  const dg=gzFromJD(jd);
  const termInfo=currentTerm(tst);
  const {ju,yang,yuan}=decideJu(termInfo.name,jd);
  const h=tst.getUTCHours(),mi=tst.getUTCMinutes();
  const zih=Math.floor((h*60+mi)/120);
  const hz=DZ[zih%12];
  const hg=hourGZ(dg.g,hz);
  const xunIdx=Math.floor(DZ.indexOf(hz)/2);
  const xun=XUN_ORDER[xunIdx];
  const xunYi=XUN_YI[xun];

  const dp={};
  let g=ju;
  for(const yi of YI_SEQ){
    const gg=g===5?2:g;
    dp[gg]=yi;
    g=yang?(g%9+1):((g-2+9)%9+1);
  }
  let benG=2; for(let k=1;k<=9;k++){if(dp[k]===xunYi){benG=k;break;}}

  const starAt={1:0,2:1,3:2,4:3,5:5,6:6,7:7,8:8,9:3};
  const menAt={1:0,2:5,3:2,4:3,5:5,6:7,7:6,8:1,9:4};
  const valStarI=starAt[benG===5?2:benG];
  const valMenI=menAt[benG===5?2:benG];

  let shiGong=2; for(let k=1;k<=9;k++){if(dp[k]===hg[0]){shiGong=k;break;}}
  const valGong=shiGong===5?2:shiGong;

  const starMap={};
  const benRingIdx=RING.indexOf(benG===5?2:benG);
  const valRingIdx=RING.indexOf(valGong);
  const rot=(benRingIdx-valRingIdx+8)%8;
  RING.forEach((rg,idx)=>{
    const si=(valStarI+(yang?rot:-rot)+idx*(yang?1:-1)+800)%8;
    starMap[rg]=STAR_RING[((si%8)+8)%8];
  });

  const headHz=xun[1];
  const stepBase=Math.floor(DZ.indexOf(headHz)/2)*2;
  const curHzIdx=DZ.indexOf(hz);
  let steps=((curHzIdx-stepBase)+12)%12;
  if(steps===0)steps=12;
  let menGong=benG===5?2:benG;
  for(let i=0;i<steps;i++){
    const ri=RING.indexOf(menGong);
    menGong=RING[(ri+(yang?1:-1)+8)%8];
  }
  if(menGong===5)menGong=2;
  const menMap={};
  RING.forEach((rg,idx)=>{menMap[rg]=MENS[(valMenI+idx)%8];});

  const shenMap={};
  let sg=valGong;
  for(let i=0;i<8;i++){
    shenMap[sg]=SHENS[i];
    const ri=RING.indexOf(sg);
    sg=RING[(ri+(yang?1:-1)+8)%8];
  }

  const kwDz={'甲子':['戌','亥'],'甲戌':['申','酉'],'甲申':['午','未'],'甲午':['辰','巳'],'甲辰':['寅','卯'],'甲寅':['子','丑']}[xun];
  const dz2gong={子:1,丑:8,寅:8,卯:3,辰:4,巳:4,午:9,未:2,申:2,酉:7,戌:6,亥:6};
  const kwGong=new Set();
  kwDz.forEach(z=>kwGong.add(dz2gong[z]));
  const maDz={寅:'申',午:'申',戌:'申',申:'寅',子:'寅',辰:'寅',巳:'亥',酉:'亥',丑:'亥',亥:'巳',卯:'巳',未:'巳'}[hz];
  const maGong=dz2gong[maDz];

  const cells={};
  for(let gx=1;gx<=9;gx++){
    if(gx===5){cells[gx]={g:5,diPan:dp[2],star:'天禽(寄芮)',men:'-',shen:'-',kong:false,ma:false,score:0};continue;}
    cells[gx]={g:gx,diPan:dp[gx]||'',star:starMap[gx]||'-',men:menMap[gx]||'-',shen:shenMap[gx]||'-',kong:kwGong.has(gx),ma:gx===maGong,score:0};
  }

  return {jd,dg,hg,hz,xun,xunYi,term:termInfo.name,ju,yang,yuan,benG,valGong,valMen:menMap[menGong],menGong,shiGong,dp,cells,kwGong,maGong};
}

/* ============================================================
   6. 门迫/击刑/入墓
============================================================ */
function menPo(men,g){
  const k={休:1,生:8,伤:3,杜:4,景:9,死:2,惊:7,开:6}[men];
  const w={1:'水',2:'土',3:'木',4:'木',6:'金',7:'金',8:'土',9:'火'};
  return ({水:'火',火:'金',金:'木',木:'土',土:'水'}[w[k]]===w[g]);
}
function jiXing(yi,g){
  return (yi==='戊'&&g===3)||(yi==='己'&&(g===2||g===8))||(yi==='庚'&&(g===8||g===4))||(yi==='辛'&&g===9)||(yi==='壬'&&g===4)||(yi==='癸'&&(g===4||g===2));
}
function inMu(gan,g){
  const m={甲:2,乙:2,丙:6,丁:6,戊:8,己:8,庚:8,辛:8,壬:4,癸:4};
  return m[gan]===g;
}

/* ============================================================
   7. 取数
============================================================ */
const LUOSHU={1:1,2:2,3:3,4:4,6:6,7:7,8:8,9:9,5:2};
const XIAN={1:6,2:8,3:4,4:5,6:1,7:2,8:7,9:3};
function expandBy9(base,max){const r=[];let n=base;while(n<=max){if(n>0)r.push(n);n+=9;}return r;}
function scoreCell(c,pan){
  let s=0;
  if(c.g===pan.valGong)s+=4;
  if(c.g===pan.shiGong)s+=3;
  if(c.g===pan.menGong)s+=2;
  if(c.shen==='值符'||c.shen==='六合'||c.shen==='太阴'||c.shen==='九地')s+=1;
  if(c.shen==='白虎'||c.shen==='玄武'||c.shen==='螣蛇')s-=2;
  if(['休','生','开'].includes(c.men))s+=1;
  if(['死','伤','惊'].includes(c.men))s-=2;
  if(c.kong)s-=999;
  if(menPo(c.men,c.g))s-=2;
  if(jiXing(c.diPan,c.g))s-=2;
  if(inMu(c.diPan,c.g))s-=1;
  if(c.ma)s+=1;
  return s;
}
function buildPool(pan,game,useXT,strict){
  const fMax=game==='ssq'?33:35;
  const bMax=game==='ssq'?16:12;
  const cands=new Set([pan.valGong,pan.shiGong,pan.menGong,pan.maGong,10-pan.shiGong]);
  const items=new Map();
  [...cands].forEach(g=>{
    let gg=g===5?2:g;
    const c=pan.cells[gg];
    const sc=scoreCell(c,pan);
    if(strict&&sc<=0)return;
    if(!strict&&sc<0)return;
    const lb=LUOSHU[gg];
    expandBy9(lb,fMax).forEach(n=>{
      const it=items.get(n)||{score:0,src:new Set()};
      it.score+=Math.max(1,sc); it.src.add(`后${lb}(${GONG_NAME[gg]})`);
      items.set(n,it);
    });
    if(useXT){
      const xb=XIAN[gg];
      expandBy9(xb,fMax).forEach(n=>{
        const it=items.get(n)||{score:0,src:new Set()};
        it.score+=Math.max(1,sc-1); it.src.add(`先${xb}(${GONG_NAME[gg]})`);
        items.set(n,it);
      });
    }
  });
  let arr=[...items.entries()].map(([n,v])=>({n,score:v.score,src:[...v.src].join('/')}));
  arr.sort((a,b)=>b.score-a.score||a.n-b.n);
  let pool=arr.slice(0,18);
  if(pool.length<15){
    for(let g=1;g<=9&&pool.length<15;g++){
      if(g===5)continue;
      const c=pan.cells[g];const sc=scoreCell(c,pan);
      if(sc<=0)continue;
      expandBy9(LUOSHU[g],fMax).forEach(n=>{if(pool.find(x=>x.n===n))return;if(pool.length>=15)return;pool.push({n,score:1,src:`补后${LUOSHU[g]}(${GONG_NAME[g]})`});});
    }
  }
  pool=pool.slice(0,18);
  const backSet=new Set();
  [pan.shiGong,pan.menGong,pan.maGong].forEach(g=>{
    let gg=g===5?2:g;
    expandBy9(LUOSHU[gg],bMax).forEach(n=>backSet.add(n));
    if(useXT)expandBy9(XIAN[gg],bMax).forEach(n=>backSet.add(n));
  });
  const back=[...backSet].filter(n=>n<=bMax).slice(0,8);
  return {front:pool.map(x=>x.n),tag:Object.fromEntries(pool.map(x=>[x.n,x.score>=4?'hi':x.score>=2?'mid':'lo'])),src:Object.fromEntries(pool.map(x=>[x.n,x.src])),back};
}

/* ============================================================
   8. 缩水
============================================================ */
function comb(a,k){const r=[];(function f(s,p){if(p.length===k){r.push(p.slice());return;}for(let i=s;i<a.length;i++){p.push(a[i]);f(i+1,p);p.pop();}})(0,[]);return r;}
function passSSQ(c){
  if(c.length!==6)return false;
  const o=c.filter(n=>n%2).length;if(o<2||o>4)return false;
  const lo=c.filter(n=>n<=16).length;if(lo<2||lo>4)return false;
  const r=[0,0,0];c.forEach(n=>r[n%3]++);if(Math.max(...r)>=5)return false;
  let cons=0;for(let i=0;i<c.length-1;i++)if(c[i+1]-c[i]===1)cons++;if(cons>2)return false;
  const sum=c.reduce((a,b)=>a+b,0);if(sum<70||sum>130)return false;
  return true;
}
function passDLT(c){
  if(c.length!==5)return false;
  const o=c.filter(n=>n%2).length;if(o<2||o>3)return false;
  const lo=c.filter(n=>n<=17).length;if(lo<2||lo>3)return false;
  let cons=0;for(let i=0;i<c.length-1;i++)if(c[i+1]-c[i]===1)cons++;if(cons>2)return false;
  const sum=c.reduce((a,b)=>a+b,0);if(sum<60||sum>120)return false;
  return true;
}

/* ============================================================
   9. 渲染
============================================================ */
function fmt(n){return n<10?'0'+n:n;}
function run(){
  try{
    const dtVal=document.getElementById('dt').value;
    const lon=+document.getElementById('lon').value||121.63;
    const tz=+document.getElementById('tz').value||8;
    const game=document.getElementById('game').value;
    const useXT=document.getElementById('useXT').checked;
    const strict=document.getElementById('strict').checked;

    const localDate=dtVal?new Date(dtVal.length===16?dtVal+':00':dtVal):new Date();
    if(isNaN(localDate.getTime())){throw new Error('无效时间');}
    const tst=trueSolarTime(localDate,lon,tz);
    const pan=qimenCore(tst);

    document.getElementById('meta').textContent=
      `真太阳时:${tst.toISOString().replace('T',' ').slice(0,16)} | 节气:${pan.term} ${pan.yang?'阳':'阴'}${pan.ju}局 三元:${['上','中','下'][pan.yuan]} | 日:${pan.dg.g}${pan.dg.z} 时:${pan.hg}${pan.hz} 旬:${pan.xun} | 值符@${pan.valGong}(${GONG_NAME[pan.valGong]}) 值使@${pan.menGong} 时干@${pan.shiGong} 马@${pan.maGong} 空:${[...pan.kwGong].map(g=>GONG_NAME[g]).join('')}`;

    const layout=[9,4,2,3,5,7,8,1,6];
    document.getElementById('pan').innerHTML=layout.map(gx=>{
      if(gx===5)return '<div class="g">中五寄坤二</div>';
      const c=pan.cells[gx];
      const cls=c.score>=4?'hi':c.score>=2?'mid':'lo';
      return `<div class="g ${cls}">${gx}·${GONG_NAME[gx]}<br>地:${c.diPan}<br>星:${c.star}<br>门:${c.men}<br>神:${c.shen}${c.kong?'<br>空':''}${c.ma?'<br>马':''}<br>分:${c.score}</div>`;
    }).join('');

    const pool=buildPool(pan,game,useXT,strict);
    document.getElementById('poolSummary').textContent=
      `总池:${pool.front.length}个 | 高权${pool.front.filter(n=>pool.tag[n]==='hi').length} 中${pool.front.filter(n=>pool.tag[n]==='mid').length} 低${pool.front.filter(n=>pool.tag[n]==='lo').length} | 先天:${useXT?'开':'关'}`;
    document.getElementById('frontPool').innerHTML=pool.front.map(n=>`<span class="pill ${pool.tag[n]}">${fmt(n)}<span class="src">${pool.src[n]||''}</span></span>`).join('');
    document.getElementById('backPool').innerHTML=pool.back.map(n=>`<span class="pill mid">${fmt(n)}</span>`).join('');
    document.getElementById('pickTip').textContent='精选参考: '+pool.front.slice(0,8).map(fmt).join(' ');

    const f=pool.front;let rec=[];
    if(game==='ssq'){
      comb(f,6).filter(passSSQ).forEach(c=>rec.push({c,sc:c.reduce((s,n)=>s+(pool.tag[n]==='hi'?3:pool.tag[n]==='mid'?2:1),0)}));
      rec.sort((a,b)=>b.sc-a.sc);rec=rec.slice(0,5).map(r=>({front:r.c,back:[pool.back[0]||1]}));
    }else{
      comb(f,5).filter(passDLT).forEach(c=>rec.push({c,sc:c.reduce((s,n)=>s+(pool.tag[n]==='hi'?3:pool.tag[n]==='mid'?2:1),0)}));
      rec.sort((a,b)=>b.sc-a.sc);rec=rec.slice(0,5).map(r=>({front:r.c,back:(comb(pool.back,2)[0]||[1,2])}));
    }
    document.getElementById('rec').innerHTML=rec.length?rec.map(r=>`<div class="card">前区 ${r.front.map(fmt).join(' ')} ｜ 后区 ${r.back.map(fmt).join(' ')}</div>`).join(''):'无合格组合（换时间或关严格模式）';
  }catch(e){
    document.getElementById('meta').textContent='错误: '+e.message;
    console.error(e);
  }
}
</script>
</body>
</html>

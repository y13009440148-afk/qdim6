<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>奇门彩票 V6.2 真实起局</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#07102a;color:#cfdfff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px}
  h2{margin:8px 0 12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
  input,select,button{background:#0c1740;color:#cfdfff;border:1px solid #2b3f7d;padding:6px 8px;border-radius:6px}

  .n.h{border-color:#4ea1ff;box-shadow:0 0 8px #4ea1ff99;color:#9fd6ff}

  .sws label{margin-right:10px;font-size:13px}
  pre{white-space:pre-wrap;word-break:break-all;font-size:13px}
</style>
</head>
<body>
<h2>奇门彩票（真实起局 · 戴九履一 · 前18/后6 · 出5注）</h2>

<div class="row">
  <label>彩种
    <select id="lotType">
      <option value="ssq">双色球(前1-33/后1-16)</option>
      <option value="dlt">大乐透(前1-35/后1-12)</option>
    </select>
  </label>
  <label>起局时间
    <input type="datetime-local" id="dtInput">
  </label>
  <button id="btnCalc">真实起局 → 出5注</button>
</div>

<div class="row sws">
  <label><input type="checkbox" id="swHe10" checked>对宫合十</label>
  <label><input type="checkbox" id="swXY" checked>先天后天体用</label>
  <label><input type="checkbox" id="swZhong" checked>中宫二八分寄</label>
  <label><input type="checkbox" id="swWx" checked>五行分布</label>
  <label><input type="checkbox" id="swKw" checked>空亡转暗数</label>
</div>

<div class="panel">
  <div id="juInfo" class="row"></div>
  <div class="pan" id="panOut"></div>
</div>

<div class="panel pools">
  <div>奇门总池 · 前区(<span id="fpCnt">18</span>个) <span class="legend">高权重/中权重/低权重</span></div>
  <div class="balls" id="frontPoolOut"></div>
  <div>后区(6个) <span class="legend">橙色=后区</span></div>
  <div class="balls" id="backPoolOut"></div>
  <div>池明细/宫分</div>
  <pre id="poolDetailOut"></pre>
  <div>加权缩水 · 推荐5注</div>
  <pre id="shrinkOut"></pre>
</div>

<script>
/* ========== 基础表 ========== */
const PORD = [4,9,2,3,5,7,8,1,6]; // 戴九履一渲染序（九宫显示）
const GONG_NAME = {1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};
const GONG_WX   = {1:'水',2:'土',3:'木',4:'木',5:'土',6:'金',7:'金',8:'土',9:'火'};
const GONG_BASE_STAR = {1:'天蓬',2:'天芮',3:'天冲',4:'天辅',5:'天禽',6:'天心',7:'天柱',8:'天任',9:'天英'};
const GONG_BASE_DOOR = {1:'休',2:'死',3:'伤',4:'杜',5:'(中)',6:'开',7:'惊',8:'生',9:'景'};
const STAR={蓬:1,任:8,冲:3,辅:4,英:9,芮:2,柱:7,心:6,禽:5};
const DOOR={休:1,生:8,伤:3,杜:4,景:9,死:2,惊:7,开:6};
const SHEN_ORDER=['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
const JI_MEN=new Set(['开','休','生']);
const JI_STAR=new Set(['天心','天任','天辅','天冲']);
const QI=new Set(['乙','丙','丁']);
const SIX_JIA={'甲子':'戊','甲戌':'己','甲申':'庚','甲午':'辛','甲辰':'壬','甲寅':'癸'};
const TIANGAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DIZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const JIEQI=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
// 节气≈公历日（用于无天文历法时的拆补定位；交节精确可换库）
const JIE_DAY={
  '小寒':6,'大寒':20,'立春':4,'雨水':19,'惊蛰':6,'春分':21,
  '清明':5,'谷雨':20,'立夏':6,'小满':21,'芒种':6,'夏至':21,
  '小暑':7,'大暑':23,'立秋':8,'处暑':23,'白露':8,'秋分':23,
  '寒露':8,'霜降':24,'立冬':7,'小雪':22,'大雪':7,'冬至':22
};
// 阳遁/阴遁与三元局数（歌诀）
const YANG_JU={'冬至':'147','小寒':'285','大寒':'396','立春':'852','雨水':'963','惊蛰':'147',
               '春分':'396','清明':'417','谷雨':'528','立夏':'417','小满':'528','芒种':'639'};
const YIN_JU ={'夏至':'936','小暑':'825','大暑':'714','立秋':'258','处暑':'147','白露':'936',
               '秋分':'714','寒露':'693','霜降':'582','立冬':'693','小雪':'582','大雪':'471','冬至':'147'};
function isYangJie(j){return YANG_JU[j]!==undefined;}
function juListOf(j){return isYangJie(j)?YANG_JU[j].split('').map(Number):YIN_JU[j].split('').map(Number);}

/* ========== 干支/历法（简化） ========== */
function gcd(a,b){return b?gcd(b,a%b):a;}
// 以固定起点算日干支（足够排盘验证；要精确交节建议接lunar）
const BASE_DATE=new Date(Date.UTC(2000,0,7,0,0,0)); // 甲子日起点近似
function dayGanZhi(d){
  const days=Math.floor((d-0)/(24*3600*1000))-Math.floor((BASE_DATE-0)/(24*3600*1000));
  const i=((days%60)+60)%60;
  return TIANGAN[i%10]+DIZHI[i%12];
}
function yearGanZhi(d){
  const y=d.getFullYear(); const i=((y-4)%60+60)%60;
  return TIANGAN[i%10]+DIZHI[i%12];
}
function hourGanZhi(d){
  // 日干起时：甲己起甲，乙庚丙，丙辛戊，丁壬庚，戊癸壬
  const dayG=TIANGAN.indexOf(dayGanZhi(d).slice(0,1));
  const h=d.getHours(); const zh=(Math.floor(h/2))%12;
  const start=[0,2,4,6,8][dayG]||0; // 甲=0
  const ig=(start+zh)%10, iz=(zh)%12;
  return TIANGAN[ig]+DIZHI[iz];
}
function getJie(d){
  // 粗略按公历找当前节气（不处理精确交节时刻）
  const m=d.getMonth()+1, day=d.getDate();
  for(const j of JIEQI){
    const md=JIE_DAY[j]; if(!md)continue;
    if(m===getJieMonth(j) && day>=md){return j;}
  }
  // 回退
  return '冬至';
}
function getJieMonth(j){
  const map={'小寒':1,'大寒':1,'立春':2,'雨水':2,'惊蛰':3,'春分':3,'清明':4,'谷雨':4,'立夏':5,'小满':5,'芒种':6,'夏至':6,
             '小暑':7,'大暑':7,'立秋':8,'处暑':8,'白露':9,'秋分':9,'寒露':10,'霜降':10,'立冬':11,'小雪':11,'大雪':12,'冬至':12};
  return map[j];
}
function yuanOfDay(dayGZ){
  // 拆补：找最近甲/己符头（往回），按日支定三元
  const idx=TIANGAN.indexOf(dayGZ[0])+DIZHI.indexOf(dayGZ[1])*10; // 仅示意
  // 用60甲子序号更稳：
  const base60=((dayGZToIdx(dayGZ))+60)%60;
  const fuTou=base60-(base60%5);
  const yuan=Math.floor(fuTou/5)%3; // 0上1中2下
  return yuan;
}
function dayGZToIdx(gz){
  const g=TIANGAN.indexOf(gz[0]),z=DIZHI.indexOf(gz[1]);
  // 60甲子顺序（甲子=0）
  return ((g*12+z)-0+60)%60; // 近似（实际需按甲子序列对齐，够演示）
}
function getJuNum(d){
  const jie=getJie(d); const dayGZ=dayGanZhi(d);
  const yuan=yuanOfDay(dayGZ); // 0/1/2
  const lst=juListOf(jie); return lst[yuan];
}
function xunShouOf(timeGZ){
  const idx=dayGZToIdx(timeGZ);
  const head=Math.floor(idx/10)*10;
  const keys=['甲子','甲戌','甲申','甲午','甲辰','甲寅'];
  return keys[Math.floor(head/10)];
}
function kongWang(timeGZ){
  const xs=xunShouOf(timeGZ);
  const map={'甲子':'戌亥','甲戌':'申酉','甲申':'午未','甲午':'辰巳','甲辰':'寅卯','甲寅':'子丑'};
  return map[xs];
}
function yiMa(dayGZ){
  const z=dayGZ[1];
  if('寅午戌'.includes(z))return 4; // 申
  if('申子辰'.includes(z))return 10;// 寅
  if('巳酉丑'.includes(z))return 7; // 亥
  if('亥卯未'.includes(z))return 1; // 巳
  return 0;
}

/* ========== 奇门起局（时家转盘/拆补） ========== */
function qimenPan(date){
  const yGZ=yearGanZhi(date), dGZ=dayGanZhi(date), tGZ=hourGanZhi(date);
  const jie=getJie(date);
  const yang=isYangJie(jie);
  const ju=getJuNum(date);
  const xs=xunShouOf(tGZ);
  const diGan=SIX_JIA[xs]; // 旬首所藏
  // 地盘：从ju宫起戊，按 戊己庚辛壬癸丁丙乙；阳顺/阴逆走九宫(1..9)
  const seq=['戊','己','庚','辛','壬','癸','丁','丙','乙'];
  const dipan={}; let cur=ju;
  for(let i=0;i<9;i++){ dipan[cur]=seq[i]; cur=yang?((cur%9)+1):((cur-2+9)%9+1); }
  // 找旬首地盘宫（即diGan所在宫）=值符/值使本位
  let zbG=0; for(const g of Object.keys(dipan)){if(dipan[g]===diGan){zbG=+g;break;}}
  const zbStar=GONG_BASE_STAR[zbG]; const zbDoor=GONG_BASE_DOOR[zbG];
  // 时干落宫（天盘）
  const tGan=tGZ[0];
  let tGanG=0; for(const g of Object.keys(dipan)){if(dipan[g]===tGan||(tGan==='甲'?diGan===diGan:false)){tGanG=+g;break;}} 
  // 甲透出按旬首藏干
  if(tGan==='甲') tGanG=zbG;
  // 值符随时干：天盘值符落时干宫
  const zhiFuG=tGanG;
  // 九星顺排（以值符星为头，按蓬任冲辅英芮柱心禽顺序绕九宫顺/逆）
  const starsArr=['天蓬','天任','天冲','天辅','天英','天芮','天柱','天心','天禽'];
  let si=starsArr.indexOf(zbStar); const tianpan={};
  let g=zhiFuG; for(let i=0;i<9;i++){tianpan[g]=starsArr[(si+i)%9]; g=yang?((g%9)+1):((g-2+9)%9+1);}
  // 值使随时支：从本位门起，数到时支
  const zhiShiG0=zbG;
  const zhiDoorOrder=['休','生','伤','杜','景','死','惊','开'];
  let diIdx=zhiDoorOrder.indexOf(zbDoor); const rendoor={};
  const tZhi=DIZHI.indexOf(tGZ[1])+1; //1..12
  const startZhi=DIZHI.indexOf(Object.keys(dipan).find(k=>dipan[k]===diGan)?'子':DIZHI[0]); // 简化：从本位起按宫序走时辰差
  // 按“值使随时宫”：从值使原宫起子/本旬起点，走时支差；这里用“时支在12序-本宫对应序”近似按宫序走
  let steps=(tZhi-1); let curG=zhiShiG0;
  for(let i=0;i<steps;i++) curG=yang?((curG%9)+1):((curG-2+9)%9+1);
  let dIdx=diIdx; for(let i=0;i<9;i++){rendoor[curG]=zhiDoorOrder[(dIdx+i)%8]; curG=yang?((curG%9)+1):((curG-2+9)%9+1);}
  // 八神：从值符落宫起
  const shen={}; let sg=zhiFuG;
  for(let i=0;i<8;i++){shen[sg]=SHEN_ORDER[i]; sg=yang?((sg%9)+1):((sg-2+9)%9+1);}
  // 空亡
  const kw=kongWang(tGZ); const ym=yiMa(dGZ);
  // 组装
  const pan={date, yGZ,dGZ,tGZ, jie, yang, ju, xs, diGan, zhiFuG, zbStar, zbDoor, tGanG,
             dipan, tianpan, rendoor, shen, kw, ym,
             dayGan:dGZ[0], timeGan:tGZ[0]};
  return pan;
}

/* ========== 数字映射（前区/后区按彩种） ========== */
function frontMapOf(lot){
  // 每宫映射候选数字（按洛书宫+步长，保证覆盖33/35）
  // 1:1/10/19/28/37(截)  2:2/11/20/29  3:3/12/21/30  4:4/13/22/31  5:5/14/23/32
  // 6:6/15/24/33  7:7/16/25/34  8:8/17/26/35  9:9/18/27
  const m={1:[1,10,19,28],2:[2,11,20,29],3:[3,12,21,30],4:[4,13,22,31],
           5:[5,14,23,32],6:[6,15,24,33],7:[7,16,25,34],8:[8,17,26,35],9:[9,18,27]};
  return m;
}
function backMapOf(lot){
  // 后区用宫位直接/取模到范围
  const max=lot==='dlt'?12:16;
  const m={}; for(let g=1;g<=9;g++){ m[g]=[((g-1)%max)+1, ((g+8)%max)+1].filter((v,i,a)=>a.indexOf(v)===i); }
  return m;
}
function inRange(n,lot){return lot==='dlt'?(n>=1&&n<=35):(n>=1&&n<=33);}
function inBackRange(n,lot){return lot==='dlt'?(n>=1&&n<=12):(n>=1&&n<=16);}

/* ========== 宫分 + 选池 ========== */
function scoreGong(pan,opts,cfg){
  const scores={1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:1,9:1};
  const details={};
  const {dipan,tianpan,rendoor,shen,zhiFuG,tGanG,dayGan,timeGan,yang,jie,kw,ym}=pan;
  // 值符/值使/时干/日干
  scores[zhiFuG]+=4;
  // 值使落宫（用八门定位）
  let zsG=0; for(const g of Object.keys(rendoor)){if(rendoor[g]===pan.zbDoor){zsG=+g;break;}}
  if(zsG) scores[zsG]+=3;
  // 时干宫
  scores[tGanG]+=2;
  // 日干：日干在地盘所在宫（近似）
  let dG=0; for(const g of Object.keys(dipan)){if(dipan[g]===dayGan||(dayGan==='甲'?dipan[g]===pan.diGan:false)){dG=+g;break;}} 
  if(dG) scores[dG]+=2;
  // 三奇
  for(const g of Object.keys(dipan)){if(QI.has(dipan[g]))scores[g]+=1.5;}
  // 吉门
  for(const g of Object.keys(rendoor)){if(JI_MEN.has(rendoor[g]))scores[g]+=2;}
  // 吉星/凶星
  for(const g of Object.keys(tianpan)){
    const s=tianpan[g];
    if(JI_STAR.has(s)) scores[g]+=1;
    if(['天蓬','天芮','天柱'].includes(s)) {
      // 临值符/三奇转机
      if(g==zhiFuG || QI.has(dipan[g])) scores[g]+=1; else scores[g]-=1;
    }
  }
  // 凶门处理
  for(const g of Object.keys(rendoor)){
    if(['死','惊','伤','杜'].includes(rendoor[g])){
      if(g==zhiFuG || QI.has(dipan[g])) scores[g]+=1; else scores[g]-=1;
    }
  }
  // 五行旺相（按节气粗略：冬水旺/夏火旺/春木旺/秋金旺/四季土）
  const wang={'冬':'水','夏':'火','春':'木','秋':'金','四季':'土'};
  let wkey='四季'; if(['冬至','小寒','大寒'].includes(jie))wkey='冬';
  if(['立春','雨水','惊蛰','春分','清明','谷雨'].includes(jie))wkey='春';
  if(['立夏','小满','芒种','夏至','小暑','大暑'].includes(jie))wkey='夏';
  if(['立秋','处暑','白露','秋分','寒露','霜降'].includes(jie))wkey='秋';
  const w=wang[wkey];
  if(opts.swWx){ for(const g of Object.keys(scores)){ if(GONG_WX[g]===w) scores[g]+=2; else if(GONG_WX[g]!=='土') scores[g]-=0.5; } }
  // 对宫合十（影响候选，不重复加太多分，给对宫轻微联动）
  if(opts.swHe10){ for(const g of Object.keys(scores)){ const og=10-g; if(og>=1&&og<=9&&og!=g) scores[og]+=0.8; } }
  // 中宫二八分寄
  if(opts.swZhong){ scores[5]+=0.5; scores[2]+=0.5; scores[8]+=0.5; }
  // 空亡：不丢，转暗（这里不强制减，标记用）
  // 击刑/入墓/门迫粗略：遇到值符附近不扣，其它可打折（用系数在取数时处理）
  // 等级
  const gongLevels={};
  for(const g of Object.keys(scores)){ const s=scores[g]; gongLevels[g]= s>=5?'高':(s>=2?'中':'低'); }
  // 细节文本
  for(const g of Object.keys(scores)){
    details[g]=`${GONG_NAME[g]} ${tianpan[g]||''}/${rendoor[g]||''}/${shen[g]||''} 干${dipan[g]||''}`;
  }
  return {scores,details,gongLevels,zhiFuG,tGanG,dG,zhShiG:zsG,kw,ym};
}

function buildPoolV62(pan,opts,cfg){
  const lot=cfg.lot||'ssq';
  const fr=frontMapOf(lot), br=backMapOf(lot);
  const {scores,details,gongLevels,kw,ym}=scoreGong(pan,opts,cfg);
  // 候选收集
  let frontCand=new Set(), backCand=new Set();
  const weightOf={};
  const sortedGongs=Object.keys(scores).map(Number).sort((a,b)=>scores[b]-scores[a]);
  // 按宫分比例取前区
  let targetFront=18, targetBack=6;
  // 明取
  for(const g of sortedGongs){
    const lv=gongLevels[g];
    const arr=fr[g].filter(n=>inRange(n,lot));
    const take=lv==='高'?Math.ceil(arr.length*0.7):(lv==='中'?Math.ceil(arr.length*0.4):Math.min(1,arr.length));
    let got=0; for(const n of arr){ if(got<take){frontCand.add(n); got++; weightOf[n]=lv==='高'?'h':(lv==='中'?'m':'l');} }
    const ba=br[g].filter(n=>inBackRange(n,lot));
    if(lv==='高') ba.forEach(n=>backCand.add(n));
  }
  // 开关扩展
  if(opts.swHe10){
    for(const n of [...frontCand]){ const g=luoshuGong(n); const og=10-g; fr[og]?.forEach(x=>{if(inRange(x,lot)){frontCand.add(x);weightOf[x]=weightOf[x]||'l';}}); }
  }
  if(opts.swXY){
    // 先天卦数交叉（简：坎7/离4等，映射补充）
    const xy={1:7,2:8,3:4,4:2,6:6,7:1,8:3,9:9,5:5};
    for(const g of Object.keys(xy)){ fr[xy[g]]?.forEach(x=>{if(inRange(x,lot)){frontCand.add(x);weightOf[x]=weightOf[x]||'l';}}); }
  }
  if(opts.swZhong){
    fr[5].forEach(x=>{if(inRange(x,lot)){frontCand.add(x);}});
    fr[2].forEach(x=>{if(inRange(x,lot)){frontCand.add(x);}});
    fr[8].forEach(x=>{if(inRange(x,lot)){frontCand.add(x);}});
  }
  if(opts.swKw){
    // 空亡宫数字作暗数加入（不按宫分丢弃）
    // 按旬空地支对应宫粗略：戌亥→乾/离相关，这里直接把对应宫映射补入
    if(kw&&kw.includes('戌')){ fr[6].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('亥')){ fr[9].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('申')){ fr[7].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('酉')){ fr[7].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('午')){ fr[9].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('未')){ fr[2].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('辰')){ fr[4].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('巳')){ fr[4].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('寅')){ fr[8].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('卯')){ fr[3].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('子')){ fr[1].forEach(x=>frontCand.add(x)); }
    if(kw&&kw.includes('丑')){ fr[8].forEach(x=>frontCand.add(x)); }
  }
  // 截断/补齐到18（按权重优先）
  let frontPool=[...frontCand].sort((a,b)=>(weightRank(weightOf[b])-weightRank(weightOf[a]))||(a-b));
  if(frontPool.length>targetFront) frontPool=frontPool.slice(0,targetFront);
  // 若不足，按高宫补
  if(frontPool.length<targetFront){
    for(const g of sortedGongs){
      for(const n of fr[g]){ if(!frontPool.includes(n)&&inRange(n,lot)){frontPool.push(n);} if(frontPool.length>=targetFront)break;}
      if(frontPool.length>=targetFront)break;
    }
    frontPool=frontPool.slice(0,targetFront);
  }
  // 后区补齐到6
  let backPool=[...backCand];
  if(backPool.length<targetBack){
    for(const g of sortedGongs){ for(const n of br[g]){ if(!backPool.includes(n)&&inBackRange(n,lot))backPool.push(n); if(backPool.length>=targetBack)break;} if(backPool.length>=targetBack)break;}
  }
  backPool=backPool.slice(0,targetBack);

  return {frontPool,backPool,weightOf,scores,details,gongLevels,frontMap:fr,backMap:br};
}
function weightRank(w){return w==='h'?3:(w==='m'?2:1);}

/* ========== 注单生成（加权随机，保证组合合法） ========== */
function genTicketsV62(front,back,cfg,k=5){
  const lot=cfg.lot||'ssq'; const out=[];
  for(let i=0;i<k;i++){
    const f=[...front].sort(()=>Math.random()-0.5).slice(0,lot==='dlt'?5:6).sort((a,b)=>a-b);
    const b=[...back].sort(()=>Math.random()-0.5).slice(0,lot==='dlt'?2:1).sort((a,b)=>a-b);
    out.push({front:f,back:b});
  }
  return out;
}

<script>
// ========== 游戏配置 ==========
let currentGame="ssq";
const GAME_CFG={
ssq:{name:"双色球",frontMax:33,backMax:16,frontPick:6,backPick:1,maxFront:16,maxBack:6,drawDays:[0,2,4]},
dlt:{name:"大乐透",frontMax:35,backMax:12,frontPick:5,backPick:2,maxFront:16,maxBack:6,drawDays:[1,3,6]}
};

// ========== 硬编码权重（生子救母体系） ==========
const W={shengWo:12,woSheng:-6,keWo:-10,woKe:-4,biHe:3,kongWang:-8,chong:-7,liuHe:5,xingShengGong:9,xingKeGong:-9,fuYin:10,wangJia:8};

// ========== 常量 ==========
const tianGan=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const diZhi=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const ganWuxing={"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
const chongDizhi={"子":"午","丑":"未","寅":"申","卯":"酉","辰":"戌","巳":"亥","午":"子","未":"丑","申":"寅","酉":"卯","戌":"辰","亥":"巳"};
const xunKongTable={"甲子旬":["戌","亥"],"甲戌旬":["申","酉"],"甲申旬":["午","未"],"甲午旬":["辰","巳"],"甲辰旬":["寅","卯"],"甲寅旬":["子","丑"]};
const wuxingSheng={"水":"金","金":"土","土":"火","火":"木","木":"水"};
const wuxingKe={"水":"火","火":"金","金":"木","木":"土","土":"水"}; // X克Y
const wuxingMap={
"水":{shengWo:"金",woSheng:"木",keWo:"土",woKe:"火",tong:"水"},
"木":{shengWo:"水",woSheng:"火",keWo:"金",woKe:"土",tong:"木"},
"火":{shengWo:"木",woSheng:"土",keWo:"水",woKe:"金",tong:"火"},
"土":{shengWo:"火",woSheng:"金",keWo:"木",woKe:"水",tong:"土"},
"金":{shengWo:"土",woSheng:"水",keWo:"火",woKe:"木",tong:"金"}
};
const GONG_BASE=[4,3,8,9,5,1,2,7,6];
const XING_WUXING={"蓬":"水","芮":"土","冲":"木","辅":"木","禽":"土","心":"金","柱":"金","任":"土","英":"火"};
const XING_FULL={"蓬":"天蓬","芮":"天芮","冲":"天冲","辅":"天辅","禽":"天禽","心":"天心","柱":"天柱","任":"天任","英":"天英"};
const SHEN_LIST=["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];
const GONG_ORDER=[1,2,3,4,6,7,8,9];
const palaceMeta={
1:{name:"坎",tianXian:[1],houTian:[6],origXing:"蓬",origMen:"休",wuXing:"水",dizhi:["子"],jiXiong:"吉"},
2:{name:"坤",tianXian:[2],houTian:[8],origXing:"芮",origMen:"死",wuXing:"土",dizhi:["未","申"],jiXiong:"凶"},
3:{name:"震",tianXian:[3],houTian:[4],origXing:"冲",origMen:"伤",wuXing:"木",dizhi:["卯"],jiXiong:"凶"},
4:{name:"巽",tianXian:[4],houTian:[3],origXing:"辅",origMen:"杜",wuXing:"木",dizhi:["辰","巳"],jiXiong:"平"},
5:{name:"中五",tianXian:[5],houTian:[5],origXing:"禽",origMen:"禽",wuXing:"土",dizhi:[],jiXiong:"平"},
6:{name:"乾",tianXian:[6],houTian:[1],origXing:"心",origMen:"开",wuXing:"金",dizhi:["戌","亥"],jiXiong:"吉"},
7:{name:"兑",tianXian:[7],houTian:[2],origXing:"柱",origMen:"惊",wuXing:"金",dizhi:["酉"],jiXiong:"凶"},
8:{name:"艮",tianXian:[8],houTian:[7],origXing:"任",origMen:"生",wuXing:"土",dizhi:["丑","寅"],jiXiong:"吉"},
9:{name:"离",tianXian:[9],houTian:[9],origXing:"英",origMen:"景",wuXing:"火",dizhi:["午"],jiXiong:"平"}
};
const DUI_CHONG={1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4};
const LIUHE_MAP={"子":"丑","丑":"子","寅":"亥","亥":"寅","卯":"戌","戌":"卯","辰":"酉","酉":"辰","巳":"申","申":"巳","午":"未","未":"午"};
const gridOrder=[4,9,2,3,5,7,8,1,6];
const liuYi=["戊","己","庚","辛","壬","癸","丁","丙","乙"];

// 节气
const solarTerms=[
{name:"小寒",m:1,d:6},{name:"大寒",m:1,d:20},{name:"立春",m:2,d:4},{name:"雨水",m:2,d:19},
{name:"惊蛰",m:3,d:6},{name:"春分",m:3,d:21},{name:"清明",m:4,d:5},{name:"谷雨",m:4,d:20},
{name:"立夏",m:5,d:6},{name:"小满",m:5,d:21},{name:"芒种",m:6,d:6},{name:"夏至",m:6,d:21},
{name:"小暑",m:7,d:7},{name:"大暑",m:7,d:23},{name:"立秋",m:8,d:7},{name:"处暑",m:8,d:23},
{name:"白露",m:9,d:8},{name:"秋分",m:9,d:23},{name:"寒露",m:10,d:8},{name:"霜降",m:10,d:23},
{name:"立冬",m:11,d:7},{name:"小雪",m:11,d:22},{name:"大雪",m:12,d:7},{name:"冬至",m:12,d:22}
];
const dingJuTable={
"冬至":[1,4,7],"小寒":[2,5,8],"大寒":[3,6,9],"立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],
"春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],"立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9],
"夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],"立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],
"秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],"立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]
};
const yangTerms=["冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种"];

function getSolarTerm(d){const m=d.getMonth()+1,dd=d.getDate();let b=null,bd=999;for(let s of solarTerms){let df=Math.abs((m-s.m)*31+(dd-s.d));if(df<bd){bd=df;b=s;}}return b.name;}
function getSeasonWuxing(st){if(["立春","雨水","惊蛰","清明","谷雨"].includes(st))return"木";if(["立夏","小满","芒种","小暑","大暑"].includes(st))return"火";if(["立秋","处暑","白露","秋分","寒露"].includes(st))return"金";if(["立冬","小雪","大雪","冬至","小寒"].includes(st))return"水";return"土";}
function getFuTouYuan(gz){const gi=tianGan.indexOf(gz.dayGan),zi=diZhi.indexOf(gz.dayZhi);let db=0,g=gi;while(g!==0&&g!==5){g=(g-1+10)%10;db++;}let fz=(zi-db+12)%12;let f=diZhi[fz];if(["子","午","卯","酉"].includes(f))return 0;if(["寅","申","巳","亥"].includes(f))return 1;return 2;}
function getDayGanZhi(d){const base=new Date("2000-01-01");const diff=Math.floor((d-base)/(86400000));return{dayGan:tianGan[(diff+5)%10],dayZhi:diZhi[(diff+11)%12]};}
function getHourGan(dayGan,si){const di=tianGan.indexOf(dayGan);return tianGan[((di%5)*2+si)%10];}
function getXunKong(dz){for(let k in xunKongTable){const sz=k.slice(-1);const zi=diZhi.indexOf(sz);const zl=[];for(let i=0;i<10;i++)zl.push(diZhi[(zi+i)%12]);if(zl.includes(dz))return{xunName:k,kongZhi:xunKongTable[k]};}return{xunName:"",kongZhi:[]};}
function arrangeDiPan(ju,yd){const gs=[1,2,3,4,5,6,7,8,9];const pos={};let st=gs.indexOf(ju);for(let i=0;i<9;i++){let p=yd?gs[(st+i)%9]:gs[(st-i+9)%9];pos[p]=liuYi[i];}return pos;}

// ========== 排盘（拆补法+九星旋转） ==========
function qiMenZhuanPan(dateStr,shiIdx){
const d=new Date(dateStr);
const gz=getDayGanZhi(d);
const hourGan=getHourGan(gz.dayGan,shiIdx);
const{xunName,kongZhi}=getXunKong(gz.dayZhi);
const solarTerm=getSolarTerm(d);
const yuan=getFuTouYuan(gz);
const{yangDun,ju}=getDunJuBySolarTerm(solarTerm,yuan);
const diPan=arrangeDiPan(ju,yangDun);
const fuYuanGong=Object.keys(diPan).find(k=>diPan[k]==="戊")*1;
const hourGanIdx=tianGan.indexOf(hourGan);

// 值符宫
let sgGong;
if(yangDun)sgGong=((fuYuanGong-1)+hourGanIdx)%9+1;
else sgGong=((fuYuanGong-1)-hourGanIdx+9)%9+1;

// 天盘
const tianPan={};
for(let g=1;g<=9;g++){let off=(g-sgGong+9)%9;let src=((fuYuanGong-1)+off)%9+1;tianPan[g]=diPan[src];}
const zhiFuGong=sgGong;

// 值使宫
const palaceSeq=[1,2,3,4,6,7,8,9];
const fuOrigIdx=palaceSeq.indexOf(fuYuanGong);
let zsIdx;if(yangDun)zsIdx=(fuOrigIdx+hourGanIdx)%8;else zsIdx=(fuOrigIdx-hourGanIdx+8)%8;
if(palaceSeq[zsIdx]===5)zsIdx=palaceSeq.indexOf(2);
const zhiShiGong=palaceSeq[zsIdx];

// 九星旋转：值符宫=天蓬，然后按洛书序阳顺阴逆
const xingSeq=["蓬","芮","冲","辅","禽","心","柱","任","英"];
const zfPosIdx=GONG_ORDER.indexOf(zhiFuGong);
const rotatedXing={};
for(let i=0;i<8;i++){
    let posIdx;
    if(yangDun) posIdx=(zfPosIdx+i)%8;
    else posIdx=(zfPosIdx-i+8)%8;
    rotatedXing[GONG_ORDER[posIdx]]=xingSeq[i];
}

// 八门
const menBase=["休","死","伤","杜","开","惊","生","景"];
const zhiShiMen=palaceMeta[fuYuanGong].origMen;
const menStartIdx=menBase.indexOf(zhiShiMen);
const menArr={};
for(let i=0;i<8;i++){let pi=yangDun?(zsIdx+i)%8:(zsIdx-i+8)%8;let mi=(menStartIdx+i)%8;menArr[palaceSeq[pi]]=menBase[mi];}

// 八神
const shen={};
for(let i=0;i<8;i++){let g;if(yangDun)g=(zhiFuGong-1+i)%9+1;else g=(zhiFuGong-1-i+9)%9+1;if(g===5)continue;shen[g]=SHEN_LIST[i];}

// 空亡宫、相冲宫
const gongDizhiMap={1:["子"],2:["未","申"],3:["卯"],4:["辰","巳"],5:[],6:["戌","亥"],7:["酉"],8:["丑","寅"],9:["午"]};
let kongGongList=[],chongGongList=[];
kongZhi.forEach(z=>{for(let g=1;g<=9;g++){if(gongDizhiMap[g]&&gongDizhiMap[g].includes(z))kongGongList.push(g);}});
kongZhi.forEach(z=>{const cz=chongDizhi[z];for(let g=1;g<=9;g++){if(gongDizhiMap[g]&&gongDizhiMap[g].includes(cz))chongGongList.push(g);}});

// 六合宫
const liuheGongs=getLiuHePartnerGongs(gz.dayZhi);

// 组装宫位数据
let palaceData={};
const seasonWX=getSeasonWuxing(solarTerm);
for(let g=1;g<=9;g++){
    let meta=palaceMeta[g];
    let rx=rotatedXing[g]||meta.origXing;
    let xwx=XING_WUXING[rx];
    let fuyin=(rx===meta.origXing);
    let wangxiang=false;
    if(xwx===seasonWX)wangxiang=true;
    if(wuxingSheng[seasonWX]===xwx)wangxiang=true;
    palaceData[g]={
        ...meta,
        xing:rx,
        xingWuxing:xwx,
        xingFull:XING_FULL[rx]||"天"+rx,
        diGan:diPan[g],
        tianGan:tianPan[g],
        men:menArr[g]||meta.origMen,
        shen:shen[g]||"",
        isZhiFu:g===zhiFuGong,
        isZhiShi:g===zhiShiGong,
        isChong:chongGongList.includes(g),
        isKong:kongGongList.includes(g),
        isLiuHe:liuheGongs.includes(g),
        isFuYin:fuyin,
        isWangXiang:wangxiang,
        score:0
    };
}
return{palaceData,gz,hourGan,zhiFuGong,zhiShiGong,ju,yangDun,xunName,solarTerm,yuan,kongGongList,chongGongList};
}

function getDunJuBySolarTerm(st,yuan){const jues=dingJuTable[st];const yd=yangTerms.includes(st);return{yangDun:yd,ju:jues[yuan]};}

function getLiuHePartnerGongs(dayZhi){
const partner=LIUHE_MAP[dayZhi];
if(!partner)return[];
const gongDizhiMapTemp={1:["子"],2:["未","申"],3:["卯"],4:["辰","巳"],5:[],6:["戌","亥"],7:["酉"],8:["丑","寅"],9:["午"]};
let result=[];
for(let g=1;g<=9;g++){if(gongDizhiMapTemp[g]&&gongDizhiMapTemp[g].includes(partner))result.push(g);}
return result;
}

// ========== 生子救母评分 ==========
function calcShengZiScore(palaceData,gz,hourGan,zhiFuGong,baseType,W){
let baseWx;
if(baseType==="riGan")baseWx=ganWuxing[gz.dayGan];
else if(baseType==="shiGan")baseWx=ganWuxing[hourGan];
else baseWx=palaceData[zhiFuGong].wuXing;

for(let g=1;g<=9;g++){
    if(g===5)continue;
    const p=palaceData[g];
    let s=0;
    const gwx=p.wuXing;
    const xwx=p.xingWuxing;
    const rel=wuxingMap[baseWx];

    // 宫五行 vs 参考五行（生克关系）
    if(gwx===rel.shengWo)s+=W.shengWo;
    else if(gwx===rel.woSheng)s+=W.woSheng;
    else if(gwx===rel.keWo)s+=W.keWo;
    else if(gwx===rel.woKe)s+=W.woKe;
    else if(gwx===rel.tong)s+=W.biHe;

    // 星五行 vs 宫五行
    if(xwx===gwx){}// 同五行已在比和中计算
    if(wuxingSheng[xwx]===gwx)s+=W.xingShengGong; // 星生宫
    if(wuxingSheng[gwx]===xwx)s+=0; // 宫生星=我生，已在上面计算
    if(wuxingSheng[xwx]===undefined){} // safety
    // 星克宫
    const xKe=wuxingSheng[xwx]; // 星五行所克
    if(xKe && xKe===gwx) s+=W.xingKeGong;

    // 特殊条件
    if(p.isKong)s+=W.kongWang;
    if(p.isChong)s+=W.chong;
    if(p.isLiuHe)s+=W.liuHe;
    if(p.isFuYin)s+=W.fuYin;
    if(p.isWangXiang)s+=W.wangJia;

    p.score=s;
}
}

// ========== 号码收集 ==========
function collectNumbers(palaceData,useXianTian,kongGongList){
let pool=new Set();
// 强制纳入对冲宫号码
const kongSet=new Set(kongGongList);
for(let g=1;g<=9;g++){
    if(g===5)continue;
    if(kongSet.has(g)){
        const dc=DUI_CHONG[g];
        if(dc){
            const dp=palaceData[dc];
            dp.houTian.forEach(h=>{let n=h;while(n<=33){pool.add(n);n+=10;}});
            if(useXianTian)dp.tianXian.forEach(t=>{let n=t;while(n<=33){pool.add(n);n+=10;}});
        }
    }
}
// 所有宫的后天数+递推
for(let g=1;g<=9;g++){
    if(g===5)continue;
    const p=palaceData[g];
    p.houTian.forEach(h=>{let n=h;while(n<=33){pool.add(n);n+=10;}});
    if(useXianTian)p.tianXian.forEach(t=>{let n=t;while(n<=33){pool.add(n);n+=10;}});
}
return[...pool].sort((a,b)=>a-b);
}

function runBacktest(){
const resultDom=document.getElementById("backTestResult");
resultDom.innerHTML='<div class="loading">100期回测运算中，请稍候...</div>';
setTimeout(function(){
// W已硬编码
const baseType=document.getElementById("baseTarget").value;
const useXT=document.getElementById("useXianTian").checked;
let results=[];
let lastPan=null;

for(let i=0;i<ssqData.length;i++){
    const rec=ssqData[i];
    const pan=qiMenZhuanPan(rec.date,rec.shi);
    calcShengZiScore(pan.palaceData,pan.gz,pan.hourGan,pan.zhiFuGong,baseType,W);
    const pool=collectNumbers(pan.palaceData,useXT,pan.kongGongList);
    const poolSet=new Set(pool);
    let hits=0;
    const hitNums=[];
    const missNums=[];
    rec.nums.forEach(n=>{if(poolSet.has(n)){hits++;hitNums.push(n);}else{missNums.push(n);}});
    results.push({
        idx:i+1,
        period:"2026"+String(26+i-1<100?26+i-1:26+i-1).padStart(3,"0"),
        date:rec.date,
        pool:pool,
        poolSize:pool.length,
        actual:rec.nums,
        blue:rec.blue,
        hits:hits,
        hitNums:hitNums,
        missNums:missNums,
        coverage:hits/6
    });
    lastPan=pan;
}

// 统计
let totalHits=0,hitDist=[0,0,0,0,0,0,0],totalPoolSize=0;
results.forEach(r=>{
    totalHits+=r.hits;
    hitDist[r.hits]++;
    totalPoolSize+=r.poolSize;
});
const avgHit=(totalHits/100).toFixed(2);
const avgCov=(totalHits/(100*6)*100).toFixed(1);
const avgPool=(totalPoolSize/100).toFixed(1);

// 随机基准
const randExp=(16/33*6).toFixed(2);
const randCov=(16/33*100).toFixed(1);
const excessHit=(avgHit-randExp).toFixed(2);
const excessCov=(avgCov-randCov).toFixed(1);


let html=`<strong>===== 100期回测结果 =====</strong><br><br>
<strong>平均命中：</strong>${avgHit} / 6<br>
<strong>平均覆盖率：</strong>${avgCov}%<br>
<strong>平均号码池大小：</strong>${avgPool} 个<br><br>
<strong>命中分布：</strong><br>
中0：${hitDist[0]}期 | 中1：${hitDist[1]}期 | 中2：${hitDist[2]}期 | 中3：${hitDist[3]}期 | 中4：${hitDist[4]}期 | 中5：${hitDist[5]}期 | 中6：${hitDist[6]}期<br><br>
<strong>随机基准对比（16号池）：</strong><br>
随机期望命中：${randExp} | 随机期望覆盖率：${randCov}%<br>
超额命中：${excessHit} | 超额覆盖率：${excessCov}%`;
resultDom.innerHTML=html;

// 渲染最后一期盘面
if(lastPan){
    renderJiuGong(lastPan.palaceData,lastPan);
    const lastPool=results[results.length-1];
    document.getElementById("poolInfo").innerHTML=`<strong>第${lastPool.idx}期 (${lastPool.date})</strong><br>号码池(${lastPool.poolSize}个)：${lastPool.pool.join(", ")}<br>开奖号：${lastPool.actual.join(" ")}+${lastPool.blue}<br>命中：${lastPool.hits}个 [${lastPool.hitNums.join(",")||"无"}] 遗漏：[${lastPool.missNums.join(",")||"无"}]`;
}
},100);
}

function fmtDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function getNextDrawDate(){
const cfg=GAME_CFG[currentGame];
const today=new Date();today.setHours(0,0,0,0);
let d=new Date(today);
for(let i=0;i<7;i++){
    d.setDate(d.getDate()+1);
    if(cfg.drawDays.includes(d.getDay())){
        return fmtDate(d);
    }
}
return fmtDate(today);
}

// ========== 联网获取指定期数的开奖号 ==========
async function fetchDrawByDate(targetDate){
const statusEl=document.getElementById("fetchStatus");
statusEl.textContent="正在联网获取 "+targetDate+" 的开奖号...";

try{
    if(currentGame==="dlt"){
        const resp=await fetch("https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageSize=100&isVerify=1");
        const data=await resp.json();
        const list=data.value.list;
        if(list){
            const item=list.find(x=>{
                const ds=x.lotteryDrawDate;
                const fmt=ds.slice(0,4)+"-"+ds.slice(4,6)+"-"+ds.slice(6,8);
                return fmt===targetDate;
            });
            if(item){
                const frontNums=item.lotteryDrawResult.split(" ").map(Number).sort((a,b)=>a-b);
                const backNums=item.lotteryDrawBackResult?item.lotteryDrawBackResult.split(" ").map(Number).sort((a,b)=>a-b):[];
                let numStr=frontNums.map(n=>String(n).padStart(2,"0")).join(" ");
                if(backNums.length)numStr+=" + "+backNums.map(n=>String(n).padStart(2,"0")).join(" ");
                document.getElementById("awardNum").value=numStr;
                statusEl.textContent="已获取 "+targetDate+" 开奖号";
                return true;
            }
        }
    } else {
        const proxies=[
            "https://corsproxy.io/?"+encodeURIComponent("https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=100"),
            "https://api.allorigins.win/raw?url="+encodeURIComponent("https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=100")
        ];
        for(let proxy of proxies){
            try{
                const ctrl=new AbortController();
                const timer=setTimeout(()=>ctrl.abort(),10000);
                const resp=await fetch(proxy,{signal:ctrl.signal});
                clearTimeout(timer);
                if(resp.ok){
                    const data=await resp.json();
                    if(data.result){
                        const item=data.result.find(x=>x.date===targetDate);
                        if(item){
                            const reds=item.red.split(",").map(Number).sort((a,b)=>a-b);
                            const blue=parseInt(item.blue);
                            document.getElementById("awardNum").value=reds.map(n=>String(n).padStart(2,"0")).join(" ")+" + "+String(blue).padStart(2,"0");
                            statusEl.textContent="已获取 "+targetDate+" 开奖号";
                            return true;
                        }
                    }
                }
            }catch(e){continue;}
        }
    }
    statusEl.textContent=targetDate+" 的开奖号未找到（可能非开奖日或数据未收录）";
    document.getElementById("awardNum").value="";
    return false;
}catch(e){
    statusEl.textContent="联网失败："+e.message;
    return false;
}
}

        currentGame=this.dataset.game;
        document.getElementById("calcDate").value=getNextDrawDate();
        document.getElementById("fetchStatus").textContent="";
        document.getElementById("awardNum").value="";
        document.getElementById("singleResult").style.display="none";
    };
});

// 日期变更自动获取开奖号
document.getElementById("calcDate").addEventListener("change",async function(){
    const dateStr=this.value;if(!dateStr)return;
    document.getElementById("singleResult").style.display="none";
    document.getElementById("awardNum").value="";
    const today=new Date();today.setHours(0,0,0,0);
    const selected=new Date(dateStr);selected.setHours(0,0,0,0);
    if(selected>today){document.getElementById("fetchStatus").textContent="该日期尚未开奖";return;}
    await fetchDrawByDate(dateStr);
});

// 初始化
document.getElementById("calcDate").value=getNextDrawDate();
window.onload=function(){runBacktest();};
</script>

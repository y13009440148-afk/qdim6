<script>
var W={shengWo:12,woSheng:-6,keWo:-10,woKe:-4,biHe:3,kongWang:-8,chong:-7,liuHe:5,xingShengGong:9,xingKeGong:-9,fuYin:10,wangJia:8};
var MAX_F=16,MAX_B=6;
var TG=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var DZ=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var GWX={"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
var CDZ={"子":"午","丑":"未","寅":"申","卯":"酉","辰":"戌","巳":"亥","午":"子","未":"丑","申":"寅","酉":"卯","戌":"辰","亥":"巳"};
var XKT={"甲子旬":["戌","亥"],"甲戌旬":["申","酉"],"甲申旬":["午","未"],"甲午旬":["辰","巳"],"甲辰旬":["寅","卯"],"甲寅旬":["子","丑"]};
var WSS={"水":"金","金":"土","土":"火","火":"木","木":"水"};
var WXM={"水":{shengWo:"金",woSheng:"木",keWo:"土",woKe:"火",tong:"水"},"木":{shengWo:"水",woSheng:"火",keWo:"金",woKe:"土",tong:"木"},"火":{shengWo:"木",woSheng:"土",keWo:"水",woKe:"金",tong:"火"},"土":{shengWo:"火",woSheng:"金",keWo:"木",woKe:"水",tong:"土"},"金":{shengWo:"土",woSheng:"水",keWo:"火",woKe:"木",tong:"金"}};
var XWX_={"蓬":"水","芮":"土","冲":"木","辅":"木","禽":"土","心":"金","柱":"金","任":"土","英":"火"};
var XF_={"蓬":"天蓬","芮":"天芮","冲":"天冲","辅":"天辅","禽":"天禽","心":"天心","柱":"天柱","任":"天任","英":"天英"};
var SL=["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];
var GO=[1,2,3,4,6,7,8,9];
var PM={1:{n:"坎",tx:[1],ht:[6],ox:"蓬",om:"休",wx:"水",dz:["子"],jx:"吉"},2:{n:"坤",tx:[2],ht:[8],ox:"芮",om:"死",wx:"土",dz:["未","申"],jx:"凶"},3:{n:"震",tx:[3],ht:[4],ox:"冲",om:"伤",wx:"木",dz:["卯"],jx:"凶"},4:{n:"巽",tx:[4],ht:[3],ox:"辅",om:"杜",wx:"木",dz:["辰","巳"],jx:"平"},5:{n:"中五",tx:[5],ht:[5],ox:"禽",om:"禽",wx:"土",dz:[],jx:"平"},6:{n:"乾",tx:[6],ht:[1],ox:"心",om:"开",wx:"金",dz:["戌","亥"],jx:"吉"},7:{n:"兑",tx:[7],ht:[2],ox:"柱",om:"惊",wx:"金",dz:["酉"],jx:"凶"},8:{n:"艮",tx:[8],ht:[7],ox:"任",om:"生",wx:"土",dz:["丑","寅"],jx:"吉"},9:{n:"离",tx:[9],ht:[9],ox:"英",om:"景",wx:"火",dz:["午"],jx:"平"}};
var DC={1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4};
var LHM={"子":"丑","丑":"子","寅":"亥","亥":"寅","卯":"戌","戌":"卯","辰":"酉","酉":"辰","巳":"申","申":"巳","午":"未","未":"午"};
var grd=[4,9,2,3,5,7,8,1,6];
var ly=["戊","己","庚","辛","壬","癸","丁","丙","乙"];
var gdm={1:["子"],2:["未","申"],3:["卯"],4:["辰","巳"],5:[],6:["戌","亥"],7:["酉"],8:["丑","寅"],9:["午"]};
var stDef=[{n:"小寒",m:1,d:6},{n:"大寒",m:1,d:20},{n:"立春",m:2,d:4},{n:"雨水",m:2,d:19},{n:"惊蛰",m:3,d:6},{n:"春分",m:3,d:21},{n:"清明",m:4,d:5},{n:"谷雨",m:4,d:20},{n:"立夏",m:5,d:6},{n:"小满",m:5,d:21},{n:"芒种",m:6,d:6},{n:"夏至",m:6,d:21},{n:"小暑",m:7,d:7},{n:"大暑",m:7,d:23},{n:"立秋",m:8,d:7},{n:"处暑",m:8,d:23},{n:"白露",m:9,d:8},{n:"秋分",m:9,d:23},{n:"寒露",m:10,d:8},{n:"霜降",m:10,d:23},{n:"立冬",m:11,d:7},{n:"小雪",m:11,d:22},{n:"大雪",m:12,d:7},{n:"冬至",m:12,d:22}];
var djT={"冬至":[1,4,7],"小寒":[2,5,8],"大寒":[3,6,9],"立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],"春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],"立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9],"夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],"立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],"秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],"立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]};
var yT=["冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种"];
var RECENT_DLT=["2026-10-26 02 14 21 22 24+02 12","2026-10-24 06 08 19 24 25+01 08","2026-10-21 01 06 10 15 32+03 04","2026-10-19 03 06 20 24 32+04 07","2026-10-17 02 09 21 26 32+06 12","2026-10-14 04 13 19 29 31+02 12","2026-10-12 09 18 22 25 35+01 10","2026-10-10 12 20 32 33 35+06 07","2026-10-07 08 12 15 29 30+09 12","2026-10-05 02 04 06 10 11+01 10"];
var RECENT_SSQ=["2026-11-01 04 06 10 15 26 27+11","2026-10-29 03 11 17 22 23 29+09","2026-10-27 04 05 20 21 26 30+12","2026-10-25 01 02 04 17 19 30+09","2026-10-22 02 07 20 24 26 30+02","2026-10-20 13 14 16 18 20 31+03","2026-10-18 12 22 23 25 27 30+04","2026-10-15 05 21 22 23 28 31+14","2026-10-13 04 11 14 22 26 27+04","2026-10-11 10 19 24 27 28 33+12","2026-10-08 04 13 14 18 22 24+03","2026-10-06 07 18 23 24 29 31+10","2026-09-29 03 04 20 24 29 30+11","2026-09-27 01 04 11 12 17 29+11","2026-09-24 06 07 14 22 31 32+05","2026-09-22 02 05 16 19 26 32+14","2026-09-20 09 12 15 26 30 33+06","2026-09-17 06 11 13 14 20 28+16","2026-09-15 01 05 09 17 24 33+04","2026-09-13 06 11 13 14 22 30+14","2026-09-10 02 04 13 14 15 30+08","2026-09-08 11 12 13 19 20 31+03","2026-09-06 04 11 20 27 28 30+15","2026-09-03 03 04 10 13 16 25+09","2026-09-01 05 06 08 09 24 25+12","2026-08-30 03 04 09 13 22 31+04","2026-08-27 01 12 14 18 30 31+02","2026-08-25 08 16 18 22 25 26+07","2026-08-23 05 16 24 26 29 30+02","2026-08-20 01 04 16 22 26 31+04"];

function gST(d){var m=d.getMonth()+1,dd=d.getDate(),b=null,bd=999;for(var i=0;i<stDef.length;i++){var s=stDef[i],df=Math.abs((m-s.m)*31+(dd-s.d));if(df<bd){bd=df;b=s;}}return b.n;}
function gSWX(st){if(["立春","雨水","惊蛰","清明","谷雨"].indexOf(st)>=0)return"木";if(["立夏","小满","芒种","小暑","大暑"].indexOf(st)>=0)return"火";if(["立秋","处暑","白露","秋分","寒露"].indexOf(st)>=0)return"金";if(["立冬","小雪","大雪","冬至","小寒"].indexOf(st)>=0)return"水";return"土";}
function gFTY(gz){var gi=TG.indexOf(gz.dayGan),zi=DZ.indexOf(gz.dayZhi),db=0,g=gi;while(g!==0&&g!==5){g=(g-1+10)%10;db++;}var fz=(zi-db+12)%12,f=DZ[fz];if(["子","午","卯","酉"].indexOf(f)>=0)return 0;if(["寅","申","巳","亥"].indexOf(f)>=0)return 1;return 2;}
function gDGZ(d){var base=new Date("2000-01-01"),diff=Math.floor((d-base)/86400000);return{dayGan:TG[(diff+5)%10],dayZhi:DZ[(diff+11)%12]};}
function gHG(dg,si){var di=TG.indexOf(dg);return TG[((di%5)*2+si)%10];}
function gXK(dz){for(var k in XKT){var sz=k.slice(-1),zi=DZ.indexOf(sz),zl=[];for(var i=0;i<10;i++)zl.push(DZ[(zi+i)%12]);if(zl.indexOf(dz)>=0)return{xunName:k,kongZhi:XKT[k]};}return{xunName:"",kongZhi:[]};}
function aDP(ju,yd){var gs=[1,2,3,4,5,6,7,8,9],pos={},st=gs.indexOf(ju);for(var i=0;i<9;i++){var p=yd?gs[(st+i)%9]:gs[(st-i+9)%9];pos[p]=ly[i];}return pos;}
function gDJ(st,yuan){var j=djT[st],yd=yT.indexOf(st)>=0;return{yangDun:yd,ju:j[yuan]};}
function gLHG(dayZhi){var partner=LHM[dayZhi];if(!partner)return[];var r=[];for(var g=1;g<=9;g++){if(gdm[g]&&gdm[g].indexOf(partner)>=0)r.push(g);}return r;}

function qmzp(dateStr,shiIdx){
  var d=new Date(dateStr),gz=gDGZ(d),hg=gHG(gz.dayGan,shiIdx),xk=gXK(gz.dayZhi),kz=xk.kongZhi;
  var st=gST(d),yuan=gFTY(gz),dj=gDJ(st,yuan),yd=dj.yangDun,ju=dj.ju;
  var dp=aDP(ju,yd),fyG=-1;for(var k in dp){if(dp[k]==="戊"){fyG=Number(k);break;}}
  var hgi=TG.indexOf(hg),sg;
  if(yd)sg=((fyG-1)+hgi)%9+1;else sg=((fyG-1)-hgi+9)%9+1;
  var tp={};for(var g=1;g<=9;g++){var off=(g-sg+9)%9,src=((fyG-1)+off)%9+1;tp[g]=dp[src];}
  var ps=[1,2,3,4,6,7,8,9],fi=ps.indexOf(fyG),zi;
  if(yd)zi=(fi+hgi)%8;else zi=(fi-hgi+8)%8;
  if(ps[zi]===5)zi=ps.indexOf(2);
  var zsg=ps[zi],xs=["蓬","芮","冲","辅","禽","心","柱","任","英"],zpi=GO.indexOf(sg),rx={};
  for(var i=0;i<8;i++){var pi;if(yd)pi=(zpi+i)%8;else pi=(zpi-i+8)%8;rx[GO[pi]]=xs[i];}
  var mb=["休","死","伤","杜","开","惊","生","景"],zsm=PM[fyG].om,msi=mb.indexOf(zsm),ma={};
  for(var i=0;i<8;i++){var pi=yd?(zi+i)%8:(zi-i+8)%8,mi=(msi+i)%8;ma[ps[pi]]=mb[mi];}
  var sh={};for(var i=0;i<8;i++){var g;if(yd)g=(sg-1+i)%9+1;else g=(sg-1-i+9)%9+1;if(g===5)continue;sh[g]=SL[i];}
  var kl=[],cl=[];
  for(var ki=0;ki<kz.length;ki++){var z=kz[ki];for(var g=1;g<=9;g++){if(gdm[g]&&gdm[g].indexOf(z)>=0)kl.push(g);}var cz=CDZ[z];for(var g=1;g<=9;g++){if(gdm[g]&&gdm[g].indexOf(cz)>=0)cl.push(g);}}
  kl=kl.filter(function(v,i,a){return a.indexOf(v)===i;});cl=cl.filter(function(v,i,a){return a.indexOf(v)===i;});
  var lh=gLHG(gz.dayZhi),swx=gSWX(st),pd={};
  for(var g=1;g<=9;g++){var m=PM[g],rc=rx[g]||m.ox,xw=XWX_[rc],fy=(rc===m.ox),wx2=(xw===swx)||(WSS[swx]===xw);
    pd[g]={n:m.n,tx:m.tx,ht:m.ht,wx:m.wx,dz:m.dz,jx:m.jx,xing:rc,xw:xw,xf:XF_[rc]||"天"+rc,dg:dp[g],tg:tp[g],men:ma[g]||m.om,shen:sh[g]||"",zf:g===sg,zs:g===zsg,ic:cl.indexOf(g)>=0,ik:kl.indexOf(g)>=0,il:lh.indexOf(g)>=0,ify:fy,iwx:wx2,score:0};}
  return{pd:pd,gz:gz,hg:hg,zfG:sg,zsG:zsg,ju:ju,yd:yd,xn:xk.xunName,st:st,yuan:yuan,kl:kl,cl:cl};
}

function calcSc(pd,gz,hg,zfG,bt){
  var bw;if(bt==="riGan")bw=GWX[gz.dayGan];else if(bt==="shiGan")bw=GWX[hg];else bw=pd[zfG].wx;
  for(var g=1;g<=9;g++){if(g===5)continue;var p=pd[g],s=0,gw=p.wx,rel=WXM[bw];
    if(gw===rel.shengWo)s+=W.shengWo;else if(gw===rel.woSheng)s+=W.woSheng;else if(gw===rel.keWo)s+=W.keWo;else if(gw===rel.woKe)s+=W.woKe;else if(gw===rel.tong)s+=W.biHe;
    var xw=p.xw;
    if(WSS[xw]===gw)s+=W.xingShengGong;else if(WSS[gw]===xw){}else if(WXM[xw].keWo===gw){}else if(WXM[xw].woKe===gw)s+=W.xingKeGong;
    if(p.ik)s+=W.kongWang;if(p.ic)s+=W.chong;if(p.il)s+=W.liuHe;if(p.ify)s+=W.fuYin;if(p.iwx)s+=W.wangJia;
    p.score=s;}
}

function buildPd(pd,kl,lt){
  var isS=lt==="ssq",fm=isS?33:35,fp=isS?6:5,bm=isS?16:12,bp=isS?1:2;
  var ns={},np={};
  for(var g=1;g<=9;g++){if(g===5)continue;var p=pd[g];
    p.ht.forEach(function(h){var n=h;while(n<=fm){if(!ns[n])ns[n]=0;ns[n]+=p.score;if(!np[n])np[n]=[];if(np[n].indexOf(g)<0)np[n].push(g);n+=10;}});
    p.tx.forEach(function(t){var n=t;while(n<=fm){if(!ns[n])ns[n]=0;ns[n]+=p.score;if(!np[n])np[n]=[];if(np[n].indexOf(g)<0)np[n].push(g);n+=10;}});}
  var ks={};kl.forEach(function(g){ks[g]=true;});
  for(var ki=0;ki<kl.length;ki++){var g=kl[ki],dc=DC[g];if(dc&&pd[dc]){var dp2=pd[dc];dp2.ht.forEach(function(h){var n=h;while(n<=fm){if(!ns[n])ns[n]=0;ns[n]+=dp2.score;if(!np[n])np[n]=[];if(np[n].indexOf(dc)<0)np[n].push(dc);n+=10;}});}}
  var an=[];for(var n in ns)if(ns.hasOwnProperty(n))an.push(Number(n));
  an.sort(function(a,b){return ns[b]-ns[a];});
  var fPool=an.slice(0,MAX_F).sort(function(a,b){return a-b;});
  var bs={};for(var n=1;n<=bm;n++){var g=n;if(g>8)g-=8;if(g===5)g=2;bs[n]=pd[g]?pd[g].score:0;}
  var bn=[];for(var n in bs)bn.push(Number(n));bn.sort(function(a,b){return bs[b]-bs[a];});
  var bPool=bn.slice(0,MAX_B).sort(function(a,b){return a-b;});
  return{fP:fPool,bP:bPool,ns:ns,np:np,fm:fm,bm:bm,fp:fp,bp:bp};
}

function genBets(pool){
  var fP=pool.fP,bP=pool.bP,ns=pool.ns,fp=pool.fp,bp=pool.bp,bets=[];
  var sf=fP.slice().sort(function(a,b){return(ns[b]||0)-(ns[a]||0);});
  var b1f=sf.slice(0,fp).sort(function(a,b){return a-b;}),b1b=bP.slice(0,bp);
  bets.push({f:b1f,b:b1b,s:"高分优选"});
  var b2f=[],st2=Math.max(1,Math.floor(fP.length/fp));
  for(var i=0;i<fp&&i*st2<fP.length;i++)b2f.push(fP[i*st2]);
  while(b2f.length<fp)b2f.push(fP[b2f.length]);b2f.sort(function(a,b){return a-b;});
  var b2b=bp>=2&&bP.length>=2?[bP[0],bP[1]]:[bP[0]];
  bets.push({f:b2f,b:b2b,s:"均匀分布"});
  var t10=sf.slice(0,Math.min(10,fP.length)),b3f=pkR(t10,fp);
  var b3b=bp>=2&&bP.length>=3?[bP[1],bP[2]]:[bP[Math.min(1,bP.length-1)]];
  bets.push({f:b3f,b:b3b,s:"高分随机"});
  var b4f=sf.slice(0,fp).sort(function(a,b){return a-b;});
  if(fP.length>fp){b4f[fp-1]=sf[fp];b4f.sort(function(a,b){return a-b;});}
  var b4b=bp>=2&&bP.length>=4?[bP[2],bP[3]]:[bP[Math.min(2,bP.length-1)]];
  bets.push({f:b4f,b:b4b,s:"宫位补充"});
  var wt=fP.map(function(n){return Math.max(1,(ns[n]||0)+20);}),b5f=wPk(fP,wt,fp);
  var b5b=bp>=2&&bP.length>=5?[bP[3],bP[4]]:[bP[Math.min(3,bP.length-1)]];
  bets.push({f:b5f,b:b5b,s:"加权随机"});
  return bets;
}
function pkR(a,c){var cp=a.slice(),r=[];for(var i=0;i<c&&cp.length>0;i++){var idx=Math.floor(Math.random()*cp.length);r.push(cp[idx]);cp.splice(idx,1);}return r.sort(function(a,b){return a-b;});}
function wPk(ns,wt,c){var cp=ns.slice(),wc=wt.slice(),r=[];for(var i=0;i<c&&cp.length>0;i++){var t=0;for(var j=0;j<wc.length;j++)t+=wc[j];var rr=Math.random()*t,ac=0,pk=0;for(var j=0;j<wc.length;j++){ac+=wc[j];if(rr<=ac){pk=j;break;}}r.push(cp[pk]);cp.splice(pk,1);wc.splice(pk,1);}return r.sort(function(a,b){return a-b;});}

function parseLL(line,isS){
  line=line.trim();if(!line)return null;var pts=line.split(/\s+/);if(pts.length<2)return null;
  var ds=pts[0],ns=pts.slice(1).join(' ').replace("+"," ").split(/\s+/).map(Number).filter(function(n){return !isNaN(n);});
  var fc=isS?6:5,bc=isS?1:2;if(ns.length<fc+bc)return null;
  return{date:ds,front:ns.slice(0,fc),back:ns.slice(fc,fc+bc)};
}

function fetchLatest(){
  var isS=document.getElementById("lotteryType").value==="ssq";
  var fs=document.getElementById("fetchStatus");
  fs.className="fetch-status";fs.textContent="正在联网获取...";

  if(!isS){
    // 大乐透：直接调用sporttery.cn API（支持CORS）
    fetch("https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageSize=1&is498=1")
      .then(function(r){return r.json();})
      .then(function(d){
        var item=d.value.list[0];
        var nums=item.lotteryDrawResult.split(' ');
        var front=nums.slice(0,5).map(function(n){return String(n).padStart(2,'0');}).join(' ');
        var back=nums.slice(5,7).map(function(n){return String(n).padStart(2,'0');}).join(' ');
        var result=item.lotteryDrawTime+' '+front+'+'+back;
        document.getElementById("awardInput").value=front+'+'+back;
        fs.className="fetch-status ok";fs.textContent="已获取 大乐透第"+item.lotteryDrawNum+"期 ("+item.lotteryDrawTime+")："+front+' + '+back;
      })
      .catch(function(e){
        fs.className="fetch-status err";fs.textContent="联网失败("+e.message+")，请手动输入或粘贴到批量自查区";
      });
  } else {
    // 双色球：尝试通过CORS代理获取
    var targets=[
      "https://api.codetabs.com/v1/proxy?quest=https://www.zhcw.com/kjxx/ssq/",
      "https://corsproxy.io/?"+encodeURIComponent("https://www.zhcw.com/kjxx/ssq/")
    ];
    var done=false;
    function tryNext(idx){
      if(done||idx>=targets.length){
        if(!done){fs.className="fetch-status err";fs.textContent="双色球联网获取失败(CORS限制)，已加载内嵌最新数据，也可手动输入";}
        return;
      }
      fs.textContent="尝试数据源"+(idx+1)+"...";
      fetch(targets[idx])
        .then(function(r){return r.text();})
        .then(function(html){
          if(done)return;
          // 从HTML中解析开奖号码
          var m=html.match(/(\d{7})\s*<\/td>\s*<td[^>]*>\s*(\d{2})\s*<\/td>\s*<td[^>]*>\s*(\d{2})\s*<\/td>\s*<td[^>]*>\s*(\d{2})\s*<\/td>\s*<td[^>]*>\s*(\d{2})\s*<\/td>\s*<td[^>]*>\s*(\d{2})\s*<\/td>\s*<td[^>]*>\s*(\d{2})\s*<\/td>\s*<td[^>]*>\s*(\d{2})\s*<\/td>\s*<td[^>]*>\s*(\d{4}-\d{2}-\d{2})/);
          if(m){
            done=true;
            var result=m[2]+' '+m[3]+' '+m[4]+' '+m[5]+' '+m[6]+' '+m[7]+'+'+m[8];
            document.getElementById("awardInput").value=result;
            fs.className="fetch-status ok";fs.textContent="已获取 双色球第"+m[1]+"期 ("+m[9]+")："+result;
          } else {
            // 尝试另一种解析
            var m2=html.match(/2\d{6}[^0-9]*(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})/);
            if(m2){
              done=true;
              var result=m2[1]+' '+m2[2]+' '+m2[3]+' '+m2[4]+' '+m2[5]+' '+m2[6]+'+'+m2[7];
              document.getElementById("awardInput").value=result;
              fs.className="fetch-status ok";fs.textContent="已获取双色球最新开奖："+result;
            } else {
              tryNext(idx+1);
            }
          }
        })
        .catch(function(){tryNext(idx+1);});
    }
    // 如果代理都失败，使用内嵌的最新一期
    setTimeout(function(){
      if(!done){
        done=true;
        var latest=RECENT_SSQ[0];
        var pts=latest.split(' ');
        var date=pts[0],nums=pts.slice(1).join(' ');
        document.getElementById("awardInput").value=nums;
        fs.className="fetch-status err";fs.textContent="联网获取受限(CORS)，已填入内嵌最新数据("+date+")，可手动更新";
      }
    },8000);
    tryNext(0);
  }
}

function runCalc(){

}

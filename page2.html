<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QDIM拆补转盘奇门</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei",sans-serif}
body{background:#0d1117;color:#e6edf3;padding:10px;font-size:14px}
.wrap{max-width:520px;margin:0 auto}
h1{text-align:center;color:#f0c674;font-size:17px;margin-bottom:6px}
.sub{text-align:center;color:#8b949e;font-size:12px;margin-bottom:10px}
.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{display:block;margin-bottom:3px;color:#8b949e;font-size:13px}
input,select{width:100%;padding:8px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
button{padding:9px 10px;border-radius:6px;border:none;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer;margin:3px 2px;font-size:14px}
button:active{background:#1d4ed8}
.group{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.game-tabs{display:flex;gap:6px;margin-bottom:8px}
.game-tabs button{flex:1;background:#21262d}
.game-tabs button.active{background:#238636}
.palace-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.palace{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px;text-align:center;display:flex;flex-direction:column;justify-content:center;aspect-ratio:1/1}
.palace.center{border-color:#f0c674;box-shadow:0 0 6px rgba(240,198,116,.4)}
.p-gong{color:#8b949e;font-size:11px}
.p-shen{color:#58a6ff;font-size:12px}
.p-star{color:#f85149;font-size:13px}
.p-men{color:#3fb950;font-size:13px;font-weight:bold}
.p-tian{color:#f0c674;font-size:12px}
.p-di{color:#ff9b72;font-size:11px}
.p-tags{font-size:9px;line-height:1.3;color:#8b949e}
.p-score{color:#ff7b72;font-size:11px;font-weight:bold}
.info{white-space:pre-wrap;padding:10px;background:#0d1117;border-radius:8px;font-size:12px;color:#8b949e;line-height:1.5}
.result{white-space:pre-wrap;padding:10px;background:#161b22;border-radius:8px;font-size:12px;color:#f0c674;line-height:1.5;margin-top:8px;max-height:460px;overflow:auto}
.log{white-space:pre-wrap;padding:10px;background:#0d1117;border-radius:8px;max-height:180px;overflow:auto;font-size:11px;color:#8b949e}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
th,td{border:1px solid #30363d;padding:4px;text-align:center}
th{color:#f0c674}
.hit{color:#3fb950;font-weight:bold}
.miss{color:#8b949e}
.bet{font-family:monospace;font-size:13px;line-height:1.7}
.next-tip{color:#f0c674;font-size:12px;margin:6px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal{background:#161b22;width:100%;max-width:400px;border-radius:12px;padding:14px;max-height:80vh;overflow:auto}
.modal h3{text-align:center;color:#f0c674;margin-bottom:10px;font-size:14px}
.modal-item{padding:11px 6px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.modal-item:last-child{border-bottom:none}
.modal-item.clickable:active{background:#21262d}
.modal-item.disabled{color:#8b949e}
.modal-close{text-align:center;margin-top:12px;color:#f85149;font-weight:bold;padding:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>QDIM拆补转盘奇门</h1>
<div class="sub">真太阳时 · 拆补无润 · 历史开奖号对比</div>

<div class="panel">
<div class="game-tabs">
<button id="tabSsq" class="active" onclick="setGame('ssq')">双色球</button>
<button id="tabDlt" onclick="setGame('dlt')">大乐透</button>
</div>
<div class="row">
<div><label>起盘日期</label><input type="date" id="inpDate"></div>
<div><label>起盘时间</label><input type="time" id="inpTime" step="60"></div>
</div>
<div class="next-tip" id="nextTip"></div>
<button style="width:100%;background:#1f6feb" onclick="openDrawModal()">选择期次 · 自动抓真实开奖号</button>
<div class="row" style="margin-top:10px">
<div><label>历史开奖号码</label><input type="text" id="inpLast" placeholder="选中期次后自动抓取" readonly></div>
<div><label>经度</label><input type="number" id="inpLng" value="122.98" step="0.001"></div>
</div>
<div class="row">
<div><label>取宫模式</label>
<select id="inpTop">
<option value="all" selected>全部9宫</option>
<option value="auto" selected>自动(90%覆盖)</option>
</select></div>
<div><label>强制局数</label><input type="number" id="inpManualJu" value="0"></div>
</div>
<div class="group">
<button onclick="runCalc()" style="flex:1">起局排盘</button>
<button onclick="checkBet()" style="flex:1">对比校验</button>
<button onclick="saveRecord()" style="flex:1">保存</button>
<button onclick="clearLog()" style="flex:1">清日志</button>
</div>
</div>

<div class="palace-wrap" id="palaceBox"></div>
<div class="info" id="infoBox"></div>
<div class="result" id="resultBox"></div>

<div class="panel">
<h3 style="font-size:14px;color:#f0c674">历史记录</h3>
<table id="hisTable"><thead><tr><th>起盘时间</th><th>玩法</th><th>命中</th><th>备注</th></tr></thead><tbody></tbody></table>
</div>

<div class="panel">
<h3 style="font-size:14px;color:#f0c674">运行日志</h3>
<div class="log" id="logBox"></div>
</div>

<div class="modal-bg" id="drawModal">
<div class="modal">
<h3>已开奖期次 · 点击自动抓取</h3>
<div id="drawList"></div>
<div class="modal-close" onclick="closeDrawModal()">关闭</div>
</div>
</div>
</div>

<div class="ctrlBox">

20261101 03 07 12 16 22 29 + 09
20261102 01 05 14 18 25 30 + 11"></textarea>

<div class="wrap">

<div class="resultBlock">

    <div id="poolOut"></div>

</div>

<div class="resultBlock">
    <div class="poolTitle">🔹 精选5注（总池内再按和值/跨度/奇偶/大小过滤）</div>

    <div class="note">提示：本工具仅为奇门数据推演研究，不构成购彩建议</div>
</div>

<script>
// ========== 基础常量【拆补奇门标准定义】 ==========
const ganArr    = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const zhiFuShen = ["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];
const jiuXing   = ["蓬","芮","冲","辅","禽","心","柱","任","英"];
const baMen     = ["休","死","伤","杜","中","开","惊","生","景"];
const xunShouList = ["戊","己","庚","辛","壬","癸"];
const gongIndex = [1,2,3,4,5,6,7,8,9];
const gongWuxing = {1:"水",2:"土",3:"木",4:"木",5:"土",6:"金",7:"金",8:"土",9:"火"};
const ganWuxing  = {"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
const xingWuxing = {"蓬":"水","芮":"土","冲":"木","辅":"木","禽":"土","心":"金","柱":"金","任":"土","英":"火"};
const menWuxing  = {"休":"水","死":"土","伤":"木","杜":"木","开":"金","惊":"金","生":"土","景":"火"};

// 五行对应号码库
const wxBallMap = {
    "土":[5,15,25,8,20,33],
    "木":[4,14,24,3,13,23,31],
    "火":[9,19,29,2,12,22,30],
    "金":[1,11,21,7,17,27],
    "水":[6,16,26,10,18,28,32]
};
const wxBlueMap = {
    "土":[5,8,15],
    "木":[3,4,13],
    "火":[2,9,12],
    "金":[1,7,11],
    "水":[6,10,16]
};

function getFuYuanGong(diPan){
    let fuYuanGong = null;
    for(let k in diPan){
        if(xunShouList.includes(diPan[k])){
            fuYuanGong = Number(k);
            break;
        }
    }
    return fuYuanGong;
}

function getHourGan(dayGan, si){
    let dayGanIdx = ganArr.indexOf(dayGan);
    if(si === 0){
        dayGanIdx = (dayGanIdx + 1) % 10;
    }
    const hourGanIdx = (dayGanIdx * 2 + si) % 10;
    return ganArr[hourGanIdx];
}

// ========== 真太阳时校正模块 ==========
function trueSolarTime(y,m,d,hh,mm,lng){
    const tz = 8;
    let JD = gregorianToJD(y,m,d);
    let T = (JD - 2451545.0)/36525;
    let L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;
    L0 = L0 % 360;
    let g = 357.52911 + 35999.05029*T - 0.0001537*T*T;
    g = g % 360;
    let e = 23 + (26 + (21.448 - 46.8150*T - 0.00059*T*T + 0.001813*T*T*T)/60)/60;
    let obliq = e;
    let sunLon = L0 + 1.914602*Math.sin(g*Math.PI/180)+0.019993*Math.sin(2*g*Math.PI/180)+0.000289*Math.sin(3*g*Math.PI/180);
    sunLon %= 360;
    let eqTime = 4*(-Math.atan2(Math.cos(obliq*Math.PI/180)*Math.sin(sunLon*Math.PI/180), Math.cos(sunLon*Math.PI/180))*180/Math.PI + sunLon);
    let lonOffset = (lng - tz*15)/15 * 60;
    let bjdMin = hh*60 + mm;
    let tsMin = bjdMin + eqTime + lonOffset;
    if(tsMin<0) tsMin += 1440;
    if(tsMin>=1440) tsMin -=1440;
    let tsh = Math.floor(tsMin/60);
    let tsm = Math.round(tsMin % 60);
    let si = Math.floor((tsh + 1)/2) %12;
    return {tsHour:tsh, tsMin:tsm, si:si, eq:eqTime, lonOff:lonOffset};
}
function gregorianToJD(y,m,d){
    if(m<=2){y--;m+=12;}
    let A = Math.floor(y/100);
    let B = 2 - A + Math.floor(A/4);
    let JD = Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524.5;
    return JD;
}

// ========== 拆补地盘生成 ==========
function calcDiPan(y,m,d){
    const baseDay = 10957;
    const date = new Date(y,m-1,d);
    let dayNum = Math.floor(date.getTime() / 86400000) - baseDay;
    dayNum = dayNum < 0 ? dayNum + 6000 : dayNum;
    let dayGanIdx = dayNum % 10;
    let dayGan = ganArr[dayGanIdx];
    let xunShouIdx = (dayGanIdx - dayGanIdx%10 +10)%10;
    let xunShou = ganArr[xunShouIdx];
    const diGanRule = {
        "戊":[1,2,3,4,5,6,7,8,9],
        "己":[2,3,4,5,6,7,8,9,1],
        "庚":[3,4,5,6,7,8,9,1,2],
        "辛":[4,5,6,7,8,9,1,2,3],
        "壬":[5,6,7,8,9,1,2,3,4],
        "癸":[6,7,8,9,1,2,3,4,5]
    };
    let baseList = diGanRule[xunShou];
    let diPan = {};
    for(let i=0;i<9;i++){
        let g = gongIndex[i];
        diPan[g] = ganArr[baseList[i]];
    }
    return {diPan, dayGan, xunShou};
}

// ========== 天盘九星八门八神转动 ==========
function rotatePlate(diPan, fuYuanGong, si){
    let tianPan = {};
    let jiuXingMap = {};
    let baMenMap  = {};
    let baShenMap = {};
    let step = si;
    const gongList = [1,8,3,4,5,6,7,2,9];
    for(let g of gongList){
        let fromIdx = gongList.indexOf(g);
        let srcGong = gongList[(fromIdx - step +9)%9];
        tianPan[g] = diPan[srcGong];
    }
    for(let i=0;i<9;i++){
        let g = gongList[i];
        let srcIdx = (i - step +9)%9;
        jiuXingMap[g] = jiuXing[srcIdx];
        baMenMap[g]  = baMen[srcIdx];
        baShenMap[g] = zhiFuShen[srcIdx];
    }
    return {tianPan,jiuXingMap,baMenMap,baShenMap};
}

// ========== 宫位生克打分 ==========
function calcScore(gongNo, tianGan, xing, men){
    let score = 50;
    let gWx = gongWuxing[gongNo];
    let tWx = ganWuxing[tianGan];
    let xWx = xingWuxing[xing];
    let mWx = menWuxing[men];
    function getDelta(src, target){
        if(src === target) return +3;
        if( (src=="木"&&target=="火") || (src=="火"&&target=="土") || (src=="土"&&target=="金") || (src=="金"&&target=="水") || (src=="水"&&target=="木") ) return +6;
        if( (src=="木"&&target=="土") || (src=="土"&&target=="水") || (src=="水"&&target=="火") || (src=="火"&&target=="金") || (src=="金"&&target=="木") ) return -6;
        return 0;
    }
    score += getDelta(gWx, tWx);
    score += getDelta(gWx, xWx);
    score += getDelta(gWx, mWx);
    score += getDelta(xWx, gWx);
    score += getDelta(mWx, gWx);
    return Math.max(0, Math.min(100, score));
}

// ========== 【奇门总池生成】按宫得分权重取球：16红，6蓝 ==========
function buildQiMenPool(plateData){
    let gongScoreList = [];
    for(let g=1;g<=9;g++){
        gongScoreList.push({gong:g, score:plateData[g].score, wx:gongWuxing[g]});
    }
    gongScoreList.sort((a,b)=>b.score - a.score);
    let redSet = new Set();
    let blueSet = new Set();
    for(let item of gongScoreList){
        let wx = item.wx;
        let redArr = wxBallMap[wx];
        for(let r of redArr){
            if(redSet.size <16) redSet.add(r);
        }
        let blueArr = wxBlueMap[wx];
        for(let b of blueArr){
            if(blueSet.size <6) blueSet.add(b);
        }
    }
    let redPool = Array.from(redSet).sort((a,b)=>a-b);
    let bluePool = Array.from(blueSet).sort((a,b)=>a-b);
    return {redPool, bluePool};
}

// ========== 【精选过滤：和值、跨度、奇偶、大小、连号】 ==========
function filterFinal5(redPool, bluePool){
    let allComb = [];
    function comb(arr, k){
        let res = [];
        function dfs(start, path){
            if(path.length === k){res.push([...path]);return;}
            for(let i=start;i<arr.length;i++){
                path.push(arr[i]);
                dfs(i+1,path);
                path.pop();
            }
        }
        dfs(0,[]);
        return res;
    }
    let red6List = comb(redPool,6);
    for(let r6 of red6List){
        for(let b of bluePool){
            allComb.push({red:r6, blue:b});
        }
    }
    function checkRule(red){
        let sum = red.reduce((a,b)=>a+b,0);
        let span = red[5] - red[0];
        let ji = red.filter(x=>x%2===1).length;
        let big = red.filter(x=>x>16).length;
        if(sum <60 || sum>130) return false;
        if(span <18 || span>30) return false;
        if(ji<2 || ji>4) return false;
        if(big<2 || big>4) return false;
        let lian = 0;
        let maxLian =0;
        for(let i=1;i<6;i++){
            if(red[i]-red[i-1]===1){lian++;maxLian=Math.max(maxLian,lian);}else lian=0;
        }
        if(maxLian >=2) return false;
        return true;
    }
    let pass = allComb.filter(x=>checkRule(x.red));
    shuffle(pass);
    let out5 = pass.slice(0,5);
    return out5;
}
function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        let j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
    }
}

// ========== 渲染球 ==========
function renderBalls(arr, isRed, hitSet){
    let html = "";
    for(let n of arr){
        let hitClass = hitSet.has(n) ? "ballHit" : "";
        html += `<span class="${isRed?'ballRed':'ballBlue'} ${hitClass}">${n}</span>`;
    }
    return html;
}

// ========== 渲染九宫 ==========
function renderPlate(plateData){
    const box = document.getElementById("plateBox");
    box.innerHTML = "";
    const order = [4,9,2,3,5,7,8,1,6];
    for(let g of order){
        let item = plateData[g];
        let div = document.createElement("div");
        div.className = "gong";
        div.innerHTML = `
            <strong>${g}宫(${gongWuxing[g]})</strong>
            <div>地:${item.diGan}｜天:${item.tianGan}</div>
            <div>⭐${item.xing}｜🚪${item.men}</div>
            <div>👻${item.shen}</div>
            <div class="score">得分：${item.score}</div>
        `;
        box.appendChild(div);
    }
}

// ========== 单期主入口 ==========
function runQiMen(){
    const dateStr = document.getElementById("dateInput").value;
    const timeStr = document.getElementById("timeInput").value;
    const lng = Number(document.getElementById("lng").value);
    const hitRedStr = document.getElementById("hitRedInput").value.trim();
    const hitBlueStr = document.getElementById("hitBlueInput").value.trim();
    if(!dateStr){alert("请选择日期");return;}

    let hitRedArr = hitRedStr.split(/\s+/).filter(x=>x!="").map(Number);
    let hitBlue = hitBlueStr ? Number(hitBlueStr) : null;
    let hitRedSet = new Set(hitRedArr);

    let [y,m,d] = dateStr.split("-").map(Number);
    let [hh,mm] = timeStr.split(":").map(Number);

    let tsObj = trueSolarTime(y,m,d,hh,mm,lng);
    let si = tsObj.si;

    let resDi = calcDiPan(y,m,d);
    let diPan = resDi.diPan;
    let dayGan = resDi.dayGan;
    let xunShou = resDi.xunShou;
    let fuYuanGong = getFuYuanGong(diPan);
    let hourGan = getHourGan(dayGan, si);
    let rot = rotatePlate(diPan, fuYuanGong, si);

    let plateData = {};
    for(let g of gongIndex){
        let dg = diPan[g];
        let tg = rot.tianPan[g];
        let xing = rot.jiuXingMap[g];
        let men = rot.baMenMap[g];
        let shen = rot.baShenMap[g];
        let sc = calcScore(g, tg, xing, men);
        plateData[g] = {diGan:dg, tianGan:tg, xing, men, shen, score:sc};
    }
    renderPlate(plateData);

    let pool = buildQiMenPool(plateData);
    let five = filterFinal5(pool.redPool, pool.bluePool);

    let poolHitRed = pool.redPool.filter(r=>hitRedSet.has(r));
    let poolHitBlue = hitBlue && pool.bluePool.includes(hitBlue);
    let hitCount = poolHitRed.length;
    let totalOpenRed = hitRedArr.length;
    let coverRate = totalOpenRed>0 ? (hitCount / totalOpenRed *100).toFixed(1) : 0;

    let log = "";
    log += "==== 拆补奇门真盘｜真太阳时校正 ====\n";
    log += `北京时间：${y}-${m}-${d} ${hh}:${mm}\n`;
    log += `真太阳时：${tsObj.tsHour}:${tsObj.tsMin} 时辰序号si=${si}\n`;
    log += `日干：${dayGan} ｜ 旬首：${xunShou}\n`;
    log += `时干：${hourGan}\n`;
    log += `值符原点宫：${fuYuanGong}\n`;
    log += "\n【宫得分清单】\n";
    for(let g of [1,2,3,4,5,6,7,8,9]){
        let o = plateData[g];
        log += `${g}宫(${gongWuxing[g]}) 九星${o.xing}，八门${o.men}，得分：${o.score}\n`;
    }
    document.getElementById("logBox").innerText = log;

    document.getElementById("poolOut").innerHTML = `
        红球总池：${renderBalls(pool.redPool,true,hitRedSet)}<br>
        蓝球总池：${renderBalls(pool.bluePool,false,new Set(hitBlue?[hitBlue]:[]))}
    `;
    document.getElementById("poolStat").innerText = `
【总池比对统计】
开奖红球：${hitRedArr.join(",")||"未填写"}
开奖蓝球：${hitBlue??"未填写"}
总池命中红球：${poolHitRed.join(",")||"无"}  命中数量：${hitCount}
总池蓝球命中：${poolHitBlue?"✅命中":"❌未命中"}
红球覆盖率：${coverRate}%（命中数/开奖红球总数）
    `;

    let fiveHtml = "";
    if(five.length ===0){
        fiveHtml = "<span style='color:#f88'>没有满足过滤条件的组合，请放宽过滤条件</span>";
    }else{
        for(let i=0;i<five.length;i++){
            let item = five[i];
            let zhRedHit = item.red.filter(x=>hitRedSet.has(x));
            let zhBlueHit = hitBlue===item.blue;
            fiveHtml += `第${i+1}注：${renderBalls(item.red,true,hitRedSet)} + ${renderBalls([item.blue],false,new Set(hitBlue?[hitBlue]:[]))}
            <span style="color:#adf">｜本注命中红球：${zhRedHit.join(",")||"无"}，蓝球：${zhBlueHit?"✅中":"❌不中"}</span><br><br>`;
        }
    }
    document.getElementById("final5").innerHTML = fiveHtml;
}

// ========== 批量回测 ==========
function runBatchTest(){
    const lng = Number(document.getElementById("lng").value);
    const lines = document.getElementById("batchInput").value.trim().split("\n").filter(x=>x.trim()!="");
    let tableHtml = `<table><tr><th>期号</th><th>开奖</th><th>命中红</th><th>个数</th><th>覆盖率</th><th>蓝</th></tr>`;
    let sumRate = 0;
    let validCnt = 0;
    for(let line of lines){
        let arr = line.trim().split(/\s+/);
        if(arr.length <8) continue;
        let qh = arr[0];
        let redOpen = arr.slice(1,7).map(Number);
        let blueOpen = Number(arr[8]);
        let hitRedSet = new Set(redOpen);
        let y = parseInt(qh.substr(0,4));
        let m = parseInt(qh.substr(4,2));
        let d = parseInt(qh.substr(6,2));
        let hh = 0, mm =0;
        let tsObj = trueSolarTime(y,m,d,hh,mm,lng);
        let si = tsObj.si;
        let resDi = calcDiPan(y,m,d);
        let diPan = resDi.diPan;
        let fuYuanGong = getFuYuanGong(diPan);
        let rot = rotatePlate(diPan, fuYuanGong, si);
        let plateData = {};
        for(let g of gongIndex){
            let dg = diPan[g];
            let tg = rot.tianPan[g];
            let xing = rot.jiuXingMap[g];
            let men = rot.baMenMap[g];
            let shen = rot.baShenMap[g];
            let sc = calcScore(g, tg, xing, men);
            plateData[g] = {diGan:dg, tianGan:tg, xing, men, shen, score:sc};
        }
        let pool = buildQiMenPool(plateData);
        let hitRed = pool.redPool.filter(r=>hitRedSet.has(r));
        let hitBlue = pool.bluePool.includes(blueOpen);
        let rate = (hitRed.length / 6 *100).toFixed(1);
        sumRate += Number(rate);
        validCnt +=1;
        tableHtml += `<tr>
            <td>${qh}</td>
            <td>${redOpen.join(" ")}+${blueOpen}</td>
            <td>${hitRed.join(",")||"-"}</td>
            <td>${hitRed.length}</td>
            <td>${rate}%</td>
            <td>${hitBlue?"✅":"❌"}</td>
        </tr>`;
    }
    let avgRate = validCnt>0 ? (sumRate / validCnt).toFixed(1):0;
    tableHtml += `</table><div style="margin-top:8px;color:#fd9">一共${validCnt}期，平均红球覆盖率：${avgRate}%</div>`;
    document.getElementById("batchResult").innerHTML = tableHtml;
}

document.getElementById("dateInput").valueAsDate = new Date();
</script>
</body>
</html>

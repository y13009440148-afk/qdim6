<script>
// ===================== 基础常量、洛书、五行、拆补排盘基础（两套模型共用） =====================
const luoshu = {kan:1,kun:2,zhen:3,xun:4,zhong:5,qian:6,dui:7,gen:8,li:9};
const wxMap = {1:"shui",2:"tu",3:"mu",4:"mu",5:"tu",6:"jin",7:"jin",8:"tu",9:"huo"};
const wxName = {shui:"水",mu:"木",jin:"金",tu:"土",huo:"火"};
// 九星
const starList = ["天蓬","天芮","天冲","天辅","天禽","天心","天柱","天任","天英"];
const starWx = {
    "天蓬":"shui","天芮":"tu","天冲":"mu","天辅":"mu","天禽":"tu",
    "天心":"jin","天柱":"jin","天任":"tu","天英":"huo"
};
// 八门
const gateList = ["休","死","伤","杜","中","开","惊","生","景"];
// 对冲宫映射
const duiChongMap = {kan:"li",li:"kan",kun:"gen",gen:"kun",zhen:"dui",dui:"zhen",xun:"qian",qian:"xun",zhong:"zhong"};
// 彩种号码上限
const lotRule = {
    ssq:{frontMax:33,backMax:16,frontCnt:6,backCnt:1},
    dlt:{frontMax:35,backMax:12,frontCnt:5,backCnt:2},
    p3:{frontMax:9,backMax:0,frontCnt:3,backCnt:0},
    3d:{frontMax:9,backMax:0,frontCnt:3,backCnt:0}
};
// 梁周：洛书本数 +10 生成同宫号码
function lyBuildPool(baseNum,maxNum){
    let arr = [];
    let n = baseNum;
    while(n <= maxNum){
        arr.push(n);
        n += 10;
    }
    return arr;
}
// 梁周专属五行流转规则：木旺生火救水克土，金旺生水救土克木，水旺生木救金克火，土旺生金救火克水，火旺生土救木克金
function lyFlowCalc(hostWx){
    let flow = {add:[],sub:[],rescue:[]};
    switch(hostWx){
        case "mu":
            flow.add.push("huo"); flow.sub.push("tu"); flow.rescue.push("shui");
            break;
        case "jin":
            flow.add.push("shui"); flow.sub.push("mu"); flow.rescue.push("tu");
            break;
        case "shui":
            flow.add.push("mu"); flow.sub.push("huo"); flow.rescue.push("jin");
            break;
        case "tu":
            flow.add.push("jin"); flow.sub.push("shui"); flow.rescue.push("huo");
            break;
        case "huo":
            flow.add.push("tu"); flow.sub.push("jin"); flow.rescue.push("mu");
            break;
    }
    return flow;
}
// 九星宫能量计算（梁周专用）
function lyStarEnergy(starWx,gongWx,isFuYin,wStarSheng,wStarKe,wFuYin){
    let score = 0;
    if(starWx === gongWx){
        score = wStarSheng * wFuYin; //伏吟加倍
    }else if( isSheng(starWx,gongWx) ){
        score += wStarSheng;
    }else if( isKe(starWx,gongWx) ){
        score += wStarKe;
    }
    // 宫克星、宫生星：无作用，不加不减
    return score;
}
function isSheng(a,b){
    const s = {mu:"huo",huo:"tu",tu:"jin",jin:"shui",shui:"mu"};
    return s[a]===b;
}
function isKe(a,b){
    const k = {mu:"tu",tu:"shui",shui:"huo",huo:"jin",jin:"mu"};
    return k[a]===b;
}
// ===================== QDIM原有全部逻辑（保留，不改动） =====================
function qdimCalcScore(zhiFuWx,gongWx,ws,woS,wk,woK,sh,sx){
    let sc=0;
    if(isSheng(gongWx,zhiFuWx)) sc+=ws;
    if(isSheng(zhiFuWx,gongWx)) sc+=woS;
    if(isKe(gongWx,zhiFuWx)) sc+=wk;
    if(isKe(zhiFuWx,gongWx)) sc+=woK;
    return sc;
}
// 拆补起局函数（共用，这里是占位，完整排盘逻辑在下一段）
function chaiBuQipan(dateStr,chen){
    // 拆补排盘内核，下一段补齐
    let pan = {};
    pan.gong = {};
    // 这里后续填充九星、八门、八神、天盘地盘干、空亡
    return pan;
}
// 渲染九宫
function render9gong(pan){
    let box = document.getElementById("jiuGongBox");
    box.innerHTML = "";
    const gongOrder = ["kan","zhen","xun","kun","zhong","qian","gen","dui","li"];
    gongOrder.forEach(g=>{
        let d = document.createElement("div");
        let gInfo = pan.gong[g]||{};
        d.innerHTML = `
            <div>${g}【${wxName[gInfo.wx]||"-"}】</div>
            <div>星:${gInfo.star||"-"}</div>

            <div>八神:${gInfo.shen||"-"}</div>
            <div>天干:天${gInfo.tianGan||"-"} 地${gInfo.diGan||"-"}</div>
            <div>${gInfo.kongWang?"【空亡】":""}${gInfo.fuYin?"【伏吟】":""}</div>
        `;
        box.appendChild(d);
    })
}

}

// 自动填充开奖日期
document.getElementById("btnAutoDate").onclick = function(){
    // 自动推算下一期开奖日逻辑，补齐在后段
}
// ===================== 第二段：核心推演、双模型打分、梁周专属池、QDIM池、过滤逻辑 =====================

// 全局缓存
let lastRunResult = null;
let batchResultList = [];

// 获取当前UI参数
function getUIParams() {
    return {
        model: document.getElementById("modelSelect").value,
        lot: document.getElementById("lotType").value,
        date: document.getElementById("qDate").value,
        shiChen: document.getElementById("shiChen").value,
        baseTarget: document.getElementById("baseTarget").value,

        // 通用开关（双模型共用生效）
        useKongWang: document.getElementById("chkKongWang").checked,
        useDuiChong: document.getElementById("chkDuiChong").checked,
        useGeGong: document.getElementById("chkGeGong").checked,

        // QDIM权重
        wShengWo: Number(document.getElementById("wShengWo").value),
        wWoSheng: Number(document.getElementById("wWoSheng").value),
        wKeWo: Number(document.getElementById("wKeWo").value),
        wWoKe: Number(document.getElementById("wWoKe").value),

        // 梁周1987权重
        wStarSheng: Number(document.getElementById("wStarSheng").value),
        wStarKe: Number(document.getElementById("wStarKe").value),
        wFuYinRate: Number(document.getElementById("wFuYin").value),
        wFlow: Number(document.getElementById("wWuXingFlow").value)
    };
}

// ===================== 【核心】梁周1987 洛书+10 专属号码映射表 =====================
function getLyAllGongNum(lotType) {
    let maxFront = lotRule[lotType].frontMax;
    return {
        1: lyBuildPool(1, maxFront),
        2: lyBuildPool(2, maxFront),
        3: lyBuildPool(3, maxFront),
        4: lyBuildPool(4, maxFront),
        // 中五宫专属规则：5、10、15、20、25、30、35
        5: [5,10,15,20,25,30,35].filter(x=>x<=maxFront),
        6: lyBuildPool(6, maxFront),
        7: lyBuildPool(7, maxFront),
        8: lyBuildPool(8, maxFront),
        9: lyBuildPool(9, maxFront)
    };
}

// ===================== 【核心】梁周1987 完整宫位打分体系 =====================
function calcLy1987Score(pan, cfg) {
    const gongList = [1,2,3,4,5,6,7,8,9];
    let gongScore = {};

    // 第一步：九星生克定基础能量（不取月令旺衰）
    for(let g of gongList) {
        let gongWx = wxMap[g];
        let starName = pan.gongStar[g] || "";
        let starWx = starWx[starName] || "";
        let isFuYin = pan.fuYinGong.includes(g);

        let s = 0;
        if(starWx) {
            s = lyStarEnergy(starWx, gongWx, isFuYin, cfg.wStarSheng, cfg.wStarKe, cfg.wFuYinRate);
        }
        gongScore[g] = s;
    }

    // 第二步：全局旺五行判定（取盘面能量最高宫五行 = 全局旺气）
    let maxS = -999;
    let wangGong = 1;
    for(let g of gongList) {
        if(gongScore[g] > maxS) {
            maxS = gongScore[g];
            wangGong = g;
        }
    }
    let wangWx = wxMap[wangGong];

    // 第三步：梁周专属【五行六字流转生克】加成
    let flowRule = lyFlowCalc(wangWx);
    for(let g of gongList) {
        let gWx = wxMap[g];
        // 被生 = 加分
        if(flowRule.add.includes(gWx)) gongScore[g] += cfg.wFlow;
        // 被克 = 减分
        if(flowRule.sub.includes(gWx)) gongScore[g] -= cfg.wFlow;
        // 被救 = 大幅加分（核心精髓）
        if(flowRule.rescue.includes(gWx)) gongScore[g] += cfg.wFlow * 1.5;
    }

    // 第四步：空亡惩罚（开关可控）
    if(cfg.useKongWang) {
        pan.kongWangGong.forEach(g=>{
            gongScore[g] -= 15;
        });
    }

    // 第五步：对冲宫加成（开关可控）
    if(cfg.useDuiChong) {
        let duiMap = {1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4,5:5};
        pan.chongGong.forEach(g=>{
            let dg = duiMap[g];
            gongScore[dg] += 8;
        });
    }

    return {gongScore, wangWx};
}

// ===================== 双模型统一号码池生成 =====================
function buildPoolByModel(pan, cfg) {
    const lot = cfg.lot;
    const maxF = lotRule[lot].frontMax;
    let numScoreMap = {};

    if(cfg.model === "ly1987") {
        // ========== 梁周1987模型：宫数合一 +10递推 ==========
        const lyGongNum = getLyAllGongNum(lot);
        const {gongScore} = calcLy1987Score(pan, cfg);

        for(let g=1;g<=9;g++){
            let nums = lyGongNum[g];
            let sc = gongScore[g];
            nums.forEach(n=>{
                if(!numScoreMap[n]) numScoreMap[n] = 0;
                numScoreMap[n] += sc;
            });
        }
    }else{
        // ========== 原生QDIM模型（完全保留旧逻辑） ==========
        // 原有+9递推、值符生克打分全部不动
        const zhiFuWx = pan.zhiFuWx;
        for(let g=1;g<=9;g++){
            let base = g;
            let list = [];
            let n=base;
            while(n<=maxF){ list.push(n);n+=9; }

            let gWx = wxMap[g];
            let sc = qdimCalcScore(zhiFuWx,gWx,
                cfg.wShengWo,cfg.wWoSheng,cfg.wKeWo,cfg.wWoKe,7,-6);

            // QDIM原有空亡对冲
            if(cfg.useKongWang && pan.kongWangGong.includes(g)) sc -= 12;
            if(cfg.useDuiChong && pan.chongGong.includes(g)) sc += 6;

            list.forEach(x=>{
                if(!numScoreMap[x]) numScoreMap[x]=0;
                numScoreMap[x] += sc;
            });
        }
    }

    // 排序、过滤、输出Top池
    let arr = Object.entries(numScoreMap)
        .map(([num,sc])=>({n:Number(num),s:sc}))
        .sort((a,b)=>b.s-a.s);

    let pool = arr.map(x=>x.n);
    return pool;
}

// ===================== 2010041 专属逻辑：输出【3/5/9】核心出球宫 =====================
function get2010041CorePool(pan, cfg) {
    if(cfg.model !== "ly1987") return [];
    const lyGongNum = getLyAllGongNum("ssq");
    // 梁周原文唯一出球三宫：震3、中5、离9
    return [...lyGongNum[3],...lyGongNum[5],...lyGongNum[9]]
        .sort((a,b)=>a-b);
}

// ===================== 通用旋转矩阵缩水 =====================
function createMatrix(pool, needCnt, genCnt=5) {
    let res = [];
    let src = [...new Set(pool)].sort((a,b)=>a-b);
    if(src.length < needCnt) return res;

    let tryTime = 0;
    while(res.length < genCnt && tryTime < 2000) {
        tryTime++;
        let shuf = [...src].sort(()=>Math.random()-0.5);
        let group = shuf.slice(0,needCnt).sort((a,b)=>a-b);
        let key = group.join(",");
        if(!res.some(x=>x.join(",")===key)){
            res.push(group);
        }
    }
    return res;
}

// ===================== 单期主运行入口 =====================
async function runSingle() {
    let cfg = getUIParams();
    let logDom = document.getElementById("retLog");
    let poolDom = document.getElementById("mainPool");
    let matDom = document.getElementById("matrixResult");

    if(!cfg.date) { logDom.value = "请选择推演日期！"; return; }

    // 1.拆补法起局（双模型共用同一局）
    let pan = chaiBuQipan(cfg.date, cfg.shiChen);

    // 2.生成候选池
    let fullPool = buildPoolByModel(pan, cfg);
    let corePool2010 = get2010041CorePool(pan, cfg);

    // 3.矩阵缩水
    let need = lotRule[cfg.lot].frontCnt;
    let matrixList = createMatrix(fullPool, need, 5);

    // 4.渲染主池
    poolDom.innerText = `全量候选池：${fullPool.join(" ")}\n`
                      +`【梁周2010041核心三宫精选】：${corePool2010.join(" ")}`;

    // 5.渲染矩阵结果
    let matHtml = "";
    matrixList.forEach((g,idx)=>{
        matHtml += `第${idx+1}注：${g.join(" ")}\n`;
    });
    matDom.innerText = matHtml;

    // 6.日志记录
    let logStr = `【推演完成｜模型：${cfg.model==="ly1987"?"梁周1987洛书宫数模型":"QDIM奇门模型"}】
日期：${cfg.date}｜时辰：${cfg.shiChen}
总池数量：${fullPool.length}
${cfg.model==="ly1987"?"✅ 已启用九星能量+五行救母流转打分体系":"✅ 已启用传统值符生克体系"}
${cfg.model==="ly1987"?"💡 2010041验证核心出球三宫【3/5/9】已锁定"}`;

    logDom.value = logStr;
    lastRunResult = {cfg,pan,fullPool,matrixList};
}

// ===================== 第三段：拆补奇门排盘核心、辅助工具、开奖日期自动推算、号码着色渲染、收尾绑定 =====================

/**
 * 拆补法奇门排盘（共用内核，QDIM / 梁周模型共用此局）
 * @param {string} dateStr yyyy-MM-dd
 * @param {string} shiChen 地支：zi chou yin mao chen si wu wei shen you xu hai
 */
function chaiBuQipan(dateStr, shiChen) {
    // 地支序号
    const diZhiIdx = {zi:0,chou:1,yin:2,mao:3,chen:4,si:5,wu:6,wei:7,shen:8,you:9,xu:10,hai:11};
    // 洛书宫编号 1坎 2坤 3震 4巽 5中 6乾 7兑 8艮 9离
    const gongId = [1,2,3,4,5,6,7,8,9];
    const gongNameMap = {1:"坎",2:"坤",3:"震",4:"巽",5:"中",6:"乾",7:"兑",8:"艮",9:"离"};
    const duiChongGong = {1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4,5:5};

    // 九星顺序（拆补转盘奇门）
    const starOrder = ["天蓬","天芮","天冲","天辅","天禽","天心","天柱","天任","天英"];
    // 八门顺序
    const gateOrder = ["休","死","伤","杜","中","开","惊","生","景"];
    // 八神顺序
    const shenOrder = ["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];

    // 简易日干支、时支映射（演示内核，后续可升级真太阳时）
    const date = new Date(dateStr + " 12:00:00");
    const daySeed = date.getFullYear() + date.getMonth()*30 + date.getDate();
    const shiIdx = diZhiIdx[shiChen] ?? 0;

    // 随机起局种子，保证同一日期时辰输出固定盘面（方便回测2010041）
    const seed = (daySeed + shiIdx) % 9;

    // 九星落宫
    const gongStar = {};
    const gongGate = {};
    const gongShen = {};
    const gongTianGan = {};
    const gongDiGan = {};
    const gongFuYin = {};
    const kongWangGong = [];
    const fuYinGong = [];
    let zhiFuGong = 0;
    let zhiShiGong = 0;

    for(let i=0;i<9;i++){
        const g = gongId[i];
        const starPos = (seed + i) % 9;
        const gatePos = (seed + 2 + i) % 9;
        const shenPos = (seed + i) % 8;
        gongStar[g] = starOrder[starPos];
        gongGate[g] = gateOrder[gatePos];
        gongShen[g] = shenOrder[shenPos];
        gongTianGan[g] = "";
        gongDiGan[g] = "";
        gongFuYin[g] = false;
        // 伏吟判定：星原位不动
        if(starPos === i){
            gongFuYin[g] = true;
            fuYinGong.push(g);
        }
    }
    zhiFuGong = gongId[seed];
    zhiShiGong = gongId[(seed+2)%9];

    // 空亡简易规则（占位，后续可替换标准空亡）
    if(seed % 3 === 0) kongWangGong.push(2,8);
    if(seed % 3 === 1) kongWangGong.push(3,7);
    if(seed % 3 === 2) kongWangGong.push(4,6);

    // 盘面对象
    const pan = {
        gong:{},
        gongStar,
        gongGate,
        gongShen,
        gongTianGan,
        gongDiGan,
        fuYinGong,
        kongWangGong,
        chongGong:[],
        zhiFuGong,
        zhiShiGong,
        zhiFuWx: wxMap[zhiFuGong]
    };
    // 填充对冲宫列表
    for(let g=1;g<=9;g++){
        pan.chongGong.push(duiChongGong[g]);
        pan.gong[g] = {
            name:gongNameMap[g],
            wx:wxMap[g],
            star:gongStar[g],
            gate:gongGate[g],
            shen:gongShen[g],
            tianGan:gongTianGan[g],
            diGan:gongDiGan[g],
            kongWang:kongWangGong.includes(g),
            fuYin:gongFuYin[g]
        }
    }
    return pan;
}

/**
 * 自动推算下一期开奖日期
 * SSQ：周二、周四、周六；大乐透：周一、周三、周五
 */
document.getElementById("btnAutoDate").onclick = function(){
    const lotType = document.getElementById("lotType").value;
    let now = new Date();
    let targetDate = new Date(now);
    let found = false;
    const targetWeek = {
        ssq: [2,4,6],
        dlt: [1,3,5],
        p3: [0,1,2,3,4,5,6],
        "3d": [0,1,2,3,4,5,6]
    }[lotType];
    for(let i=1;i<=14;i++){
        targetDate.setDate(now.getDate()+i);
        let w = targetDate.getDay(); // 0周日,1周一...6周六
        if(targetWeek.includes(w)){
            found = true;
            break;
        }
    }
    if(found){
        const y = targetDate.getFullYear();
        const m = String(targetDate.getMonth()+1).padStart(2,'0');
        const d = String(targetDate.getDate()).padStart(2,'0');
        document.getElementById("qDate").value = `${y}-${m}-${d}`;
    }else{
        alert("推算开奖日期失败");
    }
}

/**
 * 号码权重着色渲染函数（按分数高/中/低三色）
 * 可接入主池渲染，替换原来纯文本展示
 */
function renderPoolColor(numScoreList,domId){
    const dom = document.getElementById(domId);
    dom.innerHTML = "";
    numScoreList.forEach(item=>{
        const span = document.createElement("span");
        span.className = "pool-item";
        if(item.s >= 6) span.classList.add("pool-high");
        else if(item.s >= 0) span.classList.add("pool-mid");
        else span.classList.add("pool-low");
        span.innerText = String(item.n).padStart(2,'0');
        dom.appendChild(span);
    })
}
